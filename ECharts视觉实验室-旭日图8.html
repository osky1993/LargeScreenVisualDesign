&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {

  function probe(tag, data) {
    try { if (parent !== window) parent.postMessage(&quot;LABADDONS:&quot; + tag + &quot;:&quot; + JSON.stringify(data || {}), &quot;*&quot;); } catch (_) { /* noop */ }
  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,
      rect: w ? w.getBoundingClientRect().toJSON() : null,
      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight
    });
  });

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }

  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;

  }
  function isChromatic(c) {

  }

  function buildMapper(option, theme) {

        return;

      if (typeof node === &quot;object&quot;) {
        for (var k in node) {

    return function mapColorStr(str) {

      if (!isChromatic(c)) return str;
      var fi = familyOf(c.h);
      var t = targets[fi === -1 ? 0 : fi % targets.length];
      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });
    };
  }

  function mapOption(option, theme) {
    var mapColor = buildMapper(option, theme);
    function walk(node, key) {
      if (node == null || typeof node === &quot;function&quot;) return node;
      if (typeof node === &quot;string&quot;) {
        if (key === &quot;formatter&quot; || key === &quot;text&quot; || key === &quot;subtext&quot;) return node;
        return parseColor(node) ? mapColor(node) : node;
      }
      if (Array.isArray(node)) return node.map(function (v) { return walk(v, key); });
      if (typeof node === &quot;object&quot;) {

  var realInit = echarts.init.bind(echarts);

  &lt;script&gt;
  (function () {

      { name: &quot;科技创新部&quot;, offices: [&quot;研发管理科&quot;, &quot;成果转化科&quot;, &quot;孵化培育科&quot;] },
      { name: &quot;公共服务部&quot;, offices: [&quot;教育事业科&quot;, &quot;医疗卫生科&quot;, &quot;文体惠民科&quot;] },
      { name: &quot;基础设施部&quot;, offices: [&quot;交通建设科&quot;, &quot;市政养护科&quot;, &quot;水务工程科&quot;] },
      { name: &quot;生态环保部&quot;, offices: [&quot;环境监测科&quot;, &quot;综合治理科&quot;] }

    var LEAF_POOL = [&quot;重点项目&quot;, &quot;常规项目&quot;, &quot;储备项目&quot;, &quot;协同项目&quot;];

    function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

      return s;

      return TREE_SPEC.map(function (dept) {
        var children = dept.offices.map(function (office) {

            return { name: leaf, value: randInt(18, 120) };

    /* ---------- 02 渐变径向：每扇区径向渐变 + 层间透明度递减 ---------- */

        { r0: &quot;34%&quot;, r: &quot;66%&quot; },

    /* ---------- 03 高亮扇区：值最大分支高亮描边，其余降饱和 ---------- */

    function buildKpi(tree) {

      var opt = motionConf();
      opt.color = PALETTE;
      opt.tooltip = tipConf(total);
      var s = baseSeries(tree);
      s.radius = [&quot;42%&quot;, &quot;90%&quot;];
      s.label.minAngle = 8;
      s.levels = [
        {},
        { r0: &quot;42%&quot;, r: &quot;62%&quot;, label: { fontSize: 11, fontWeight: 600 } },
        { r0: &quot;62%&quot;, r: &quot;78%&quot;, label: { fontSize: 10 } },
        { r0: &quot;78%&quot;, r: &quot;90%&quot;, label: { show: false }, itemStyle: { opacity: 0.85 } }
      ];
      opt.graphic = [
        {
          type: &quot;text&quot;, left: &quot;center&quot;, top: &quot;42%&quot;,
          style: { text: fmtNum(total), fill: &quot;#3fe1ff&quot;, fontSize: 30, fontWeight: 700, textAlign: &quot;center&quot; },
          silent: true
        },
        {
          type: &quot;text&quot;, left: &quot;center&quot;, top: &quot;54%&quot;,
          style: { text: &quot;投资总量（百万元）&quot;, fill: &quot;#8fa7c8&quot;, fontSize: 12, textAlign: &quot;center&quot; },
          silent: true
        }
      ];
      opt.series = [s];
      return opt;
    }

    /* ---------- 05 标签优化：radial / tangential 混排 + minAngle 隐藏小扇区 ---------- */
    function buildLabel(tree) {
      var opt = motionConf();
      opt.color = PALETTE;
      opt.tooltip = tipConf(sumOf(tree));
      var s = baseSeries(tree);
      s.levels = [
        {},
        { r0: &quot;6%&quot;, r: &quot;36%&quot;, label: { rotate: &quot;tangential&quot;, fontSize: 12, fontWeight: 600, minAngle: 10 } },
        { r0: &quot;36%&quot;, r: &quot;66%&quot;, label: { rotate: &quot;radial&quot;, fontSize: 11, minAngle: 8, align: &quot;left&quot; } },
        { r0: &quot;66%&quot;, r: &quot;90%&quot;, label: { rotate: &quot;radial&quot;, fontSize: 10, minAngle: 12, align: &quot;left&quot; }, itemStyle: { opacity: 0.9 } }
      ];
      opt.series = [s];
      return opt;
    }

    /* ---------- 06 单色深浅：单一青蓝系按层与值深浅 ---------- */
    function paintMono(nodes, depth) {
      var mx = 0;
      nodes.forEach(function (n) { if (n.value &gt; mx) mx = n.value; });
      nodes.forEach(function (n) {
        var t = mx ? n.value / mx : 0;
        var base = [0, 26, 40, 54][Math.min(depth, 3)];
        var light = Math.round(base + t * 16);
        n.itemStyle = { color: &quot;hsl(199, 82%, &quot; + light + &quot;%)&quot; };
        n.label = { color: light &gt; 52 ? &quot;#0a1e3c&quot; : &quot;#eaf7ff&quot; };
        if (n.children) paintMono(n.children, depth + 1);
      });
    }
    function buildMono(tree) {
      paintMono(tree, 1);
      var opt = motionConf();
      opt.tooltip = tipConf(sumOf(tree));
      var s = baseSeries(tree);
      s.itemStyle.borderWidth = 1.6;
      opt.series = [s];
      return opt;
    }

    /* ---------- 07 点击下钻：nodeClick zoomToNode + 中心返回提示 ---------- */
    function buildDrill(tree) {
      var opt = motionConf();
      opt.color = PALETTE;
      opt.tooltip = tipConf(sumOf(tree));
      var s = baseSeries(tree);
      s.nodeClick = &quot;zoomToNode&quot;;
      s.radius = [&quot;10%&quot;, &quot;88%&quot;];
      s.emphasis = { focus: &quot;descendant&quot; };
      opt.graphic = [
        {
          type: &quot;text&quot;, left: &quot;center&quot;, bottom: 2,
          style: { text: &quot;点击扇区下钻放大 · 点击中心圆返回上级&quot;, fill: &quot;#8fa7c8&quot;, fontSize: 11, textAlign: &quot;center&quot; },
          silent: true
        }
      ];
      opt.series = [s];
      return opt;
    }

    /* ---------- 08 双层简化：仅两层大扇区 + 外圈百分比标签 ---------- */
    function buildSimple(tree) {
      var total = sumOf(tree);
      var two = tree.map(function (b) {
        return {
          name: b.name, value: b.value,
          children: b.children.map(function (c) { return { name: c.name, value: c.value }; })
        };
      });
      var opt = motionConf();
      opt.color = PALETTE;
      opt.tooltip = tipConf(total);
      var s = baseSeries(two);
      s.itemStyle.borderWidth = 2;
      s.itemStyle.borderRadius = 4;
      s.levels = [
        {},
        {
          r0: &quot;0%&quot;, r: &quot;52%&quot;,
          label: {
            rotate: &quot;tangential&quot;, fontSize: 12, fontWeight: 600, minAngle: 8,
            formatter: function (p) { return p.name + &quot;\n&quot; + (p.value / total * 100).toFixed(1) + &quot;%&quot;; }
          }
        },
        {
          r0: &quot;52%&quot;, r: &quot;90%&quot;,
          label: {
            rotate: &quot;tangential&quot;, fontSize: 10, minAngle: 7,
            formatter: function (p) { return p.name + &quot; &quot; + (p.value / total * 100).toFixed(1) + &quot;%&quot;; }
          },
          itemStyle: { opacity: 0.88 }
        }
      ];
      opt.series = [s];
      return opt;
    }

    /* ---------- 装配与交互 ---------- */
    var DEFS = [
      { id: &quot;e6sb-standard&quot;, build: buildStandard },
      { id: &quot;e6sb-gradient&quot;, build: buildGradient },
      { id: &quot;e6sb-focus&quot;, build: buildFocus },
      { id: &quot;e6sb-kpi&quot;, build: buildKpi },
      { id: &quot;e6sb-label&quot;, build: buildLabel },
      { id: &quot;e6sb-mono&quot;, build: buildMono },
      { id: &quot;e6sb-drill&quot;, build: buildDrill },
      { id: &quot;e6sb-simple&quot;, build: buildSimple }
    ];
    var insts = DEFS.map(function (def) {
      return { def: def, chart: echarts.init(document.getElementById(def.id)) };
    });
    var trees = [];

    function regen() {
      trees = DEFS.map(function () { return makeTree(); });
    }
    function renderAll() {
      insts.forEach(function (it, i) {
        it.chart.setOption(it.def.build(clone(trees[i])), { notMerge: true });
      });
    }

    regen();
    renderAll();

    document.getElementById(&quot;e6sb-refresh&quot;).addEventListener(&quot;click&quot;, function () {
      regen();
      renderAll();
    });
    var motionBtn = document.getElementById(&quot;e6sb-motion&quot;);
    motionBtn.addEventListener(&quot;click&quot;, function () {
      motionOn = !motionOn;
      motionBtn.setAttribute(&quot;aria-pressed&quot;, String(motionOn));
      motionBtn.textContent = &quot;更新动效：&quot; + (motionOn ? &quot;开&quot; : &quot;关&quot;);
      renderAll();
    });

    var resizeTimer = null;
    window.addEventListener(&quot;resize&quot;, function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        insts.forEach(function (it) { it.chart.resize(); });
      }, 120);
    });
  })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
