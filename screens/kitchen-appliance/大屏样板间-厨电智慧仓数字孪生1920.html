<style>
  :root {
  /* mfgpalette:begin —— 由 tools/sync_mfg_palette.py 注入，勿手改 */
    --mfg-bg: #051416;
    --mfg-stage: #071b1e;
    --mfg-panel: rgba(14,46,50,.55);
    --mfg-line: rgba(64,196,190,.22);
    --mfg-cyan: #35e0d0;
    --mfg-cyan-deep: #1a9e96;
    --mfg-blue: #4fa8e8;
    --mfg-green: #7ee08a;
    --mfg-orange: #ff9d45;
    --mfg-amber: #ffc94d;
    --mfg-red: #ff5f6b;
    --mfg-violet: #a98cf5;
    --mfg-text: #d8f2ef;
    --mfg-text-dim: #7fa6a3;
  /* mfgpalette:end */
    --cl-mono: "Bahnschrift", "DIN Alternate", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--mfg-bg); }
  body { color: var(--mfg-text); font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif; }

  .cl-stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background:
      radial-gradient(circle at 10% 0%, rgba(53, 224, 208, 0.10), transparent 44%),
      radial-gradient(circle at 90% 6%, rgba(255, 157, 69, 0.08), transparent 46%),
      radial-gradient(ellipse at 50% 118%, rgba(16, 62, 66, 0.40), transparent 56%),
      linear-gradient(rgba(64, 196, 190, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64, 196, 190, 0.045) 1px, transparent 1px),
      var(--mfg-stage);
    background-size: auto, auto, auto, 44px 44px, 44px 44px, auto;
    display: grid;
    grid-template-columns: 440px 1fr 440px;
    grid-template-rows: 84px 112px 1fr;
    gap: 14px;
    padding: 12px 18px 16px;
  }

  .cl-error {
    display: none; position: absolute; z-index: 30; left: 50%; top: 96px; transform: translateX(-50%);
    padding: 14px 22px; border-radius: 12px;
    border: 1px solid rgba(255, 122, 122, 0.5); background: rgba(96, 26, 38, 0.85);
    color: #ffd9d9; font-size: 15px;
  }
  .cl-error.is-visible { display: block; }

  /* ===== 顶栏 ===== */
  .cl-header {
    grid-column: 1 / -1; position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 10px;
  }
  .cl-header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 157, 69, 0.55) 16%, rgba(53, 224, 208, 0.9) 50%, rgba(255, 157, 69, 0.55) 84%, transparent);
    box-shadow: 0 0 14px rgba(53, 224, 208, 0.35);
  }
  .cl-head-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .cl-crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0.1em; color: var(--mfg-text-dim); }
  .cl-crumb b { font-weight: 400; color: var(--mfg-cyan); }
  .cl-crumb i { font-style: normal; color: rgba(127, 166, 163, 0.55); }
  .cl-crumb em { font-style: normal; color: #cfeae7; }
  .cl-crumb-up {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 3px; border-radius: 7px;
    color: #a9d9d4; text-decoration: none; letter-spacing: 0.06em;
    border: 1px solid rgba(64, 196, 190, 0.3); background: rgba(14, 52, 56, 0.55);
    transition: color .18s, border-color .18s, box-shadow .18s;
  }
  .cl-crumb-up:hover { color: #eafcfa; border-color: rgba(53, 224, 208, 0.85); box-shadow: 0 0 14px rgba(53, 224, 208, 0.32); }
  .cl-head-title-row { display: flex; align-items: baseline; gap: 16px; white-space: nowrap; }
  .cl-head-title {
    font-size: 30px; font-weight: 700; letter-spacing: 0.08em;
    background: linear-gradient(180deg, #ffffff 26%, #8ff0e6 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(53, 224, 208, 0.35));
  }
  .cl-head-meta { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--mfg-text-dim); letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
  .cl-head-meta b { font-weight: 400; color: #8ff0e6; }
  .cl-head-meta i { font-style: normal; color: rgba(127, 166, 163, 0.4); }

  .cl-head-right { display: flex; align-items: center; gap: 14px; flex: none; }
  .cl-switcher { display: flex; align-items: stretch; gap: 6px; }
  .cl-sw-tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-width: 66px; padding: 5px 9px; border-radius: 9px; cursor: pointer; user-select: none;
    font-family: inherit; color: #a9d9d4;
    border: 1px solid rgba(64, 196, 190, 0.28); background: rgba(12, 44, 48, 0.5);
    transition: color .18s, border-color .18s, box-shadow .18s, background .18s;
  }
  .cl-sw-tab b { font-size: 13.5px; font-weight: 700; letter-spacing: 0.06em; }
  .cl-sw-tab span { font-size: 10px; letter-spacing: 0.06em; color: rgba(127, 166, 163, 0.9); font-variant-numeric: tabular-nums; }
  .cl-sw-tab:hover { color: #eafcfa; border-color: rgba(53, 224, 208, 0.6); }
  .cl-sw-tab.is-active {
    color: #04191a; border-color: transparent;
    background: linear-gradient(160deg, var(--mfg-cyan), var(--mfg-cyan-deep));
    box-shadow: 0 0 16px rgba(53, 224, 208, 0.42);
  }
  .cl-sw-tab.is-active span { color: rgba(4, 25, 26, 0.72); }

  .cl-chips { display: flex; align-items: center; gap: 9px; }
  .cl-chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 104px; padding: 7px 12px; border-radius: 9px;
    border: 1px solid var(--mfg-line); background: var(--mfg-panel);

  .cl-chip span { font-size: 10.5px; letter-spacing: 0.18em; color: #5f8a87; }
  .cl-chip b { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: #cfe9e6; font-variant-numeric: tabular-nums; }
  a.cl-chip { text-decoration: none; cursor: pointer; transition: border-color .18s, box-shadow .18s; }
  a.cl-chip:hover { border-color: rgba(53, 224, 208, 0.7); box-shadow: 0 0 14px rgba(53, 224, 208, 0.3); }

  .cl-clock-date { font-size: 12px; color: var(--mfg-text-dim); letter-spacing: 0.08em; }

  /* ===== KPI 带 ===== */
  .cl-band { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; min-height: 0; }
  .cl-kpi {
    position: relative; overflow: hidden;

    display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px;

  .cl-kpi::before { content: ""; position: absolute; left: 0; top: 0; width: 46px; height: 3px; background: linear-gradient(90deg, var(--mfg-cyan), transparent); }
  .cl-kpi.is-warn::before { background: linear-gradient(90deg, var(--mfg-orange), transparent); }
  .cl-kpi-icon {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    background: linear-gradient(160deg, rgba(53, 224, 208, 0.26), rgba(79, 168, 232, 0.12));
    border: 1px solid rgba(53, 224, 208, 0.35);

  .cl-kpi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .cl-kpi-label { font-size: 11.5px; letter-spacing: 0.08em; color: var(--mfg-text-dim); white-space: nowrap; }
  .cl-kpi-num { display: flex; align-items: baseline; gap: 5px; font-variant-numeric: tabular-nums; }
  .cl-kpi-val { font: 700 25px/1 var(--cl-mono); color: #eafcfa; letter-spacing: 0.02em; }

  .cl-kpi-sub { font-size: 10.5px; color: rgba(127, 166, 163, 0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cl-kpi-sub b { font-weight: 700; }

  /* ===== 三栏主体 ===== */
  .cl-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
  .cl-panel {
    position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0;
    border: 1px solid var(--mfg-line); border-radius: 12px; background: var(--mfg-panel);
    padding: 10px 14px 12px;

  .cl-panel-head h2 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: 0.08em; color: #d6efec; }
  .cl-panel-head h2::before { content: "▎"; color: var(--mfg-cyan); margin-right: 2px; }
  .cl-panel-tag { font-size: 11.5px; letter-spacing: 0.06em; color: rgba(127, 166, 163, 0.85); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cl-panel-tag b { font-weight: 700; color: var(--mfg-amber); }
  .cl-chart { flex: 1; min-height: 0; width: 100%; }

  /* ===== 中央等距仓内舞台 ===== */
  .cl-isowrap { flex: 1; min-height: 0; min-width: 0; position: relative; }

  .cl-iso-wall { fill: none; stroke: rgba(64, 196, 190, 0.22); stroke-width: 1.4; }
  .cl-iso-grid { stroke: rgba(53, 224, 208, 0.06); stroke-width: 1; }
  .cl-iso-edge { fill: none; stroke-linecap: round; }
  .cl-iso-rev { fill: none; stroke: var(--mfg-orange); stroke-linecap: round; opacity: 0.78; }

  .cl-iso-cap-tx { font-size: 11px; font-weight: 600; fill: #0b2b2e; }
  .cl-iso-lead { stroke: rgba(216, 242, 239, 0.35); stroke-width: 1; stroke-dasharray: 2 3; }
  .cl-iso-val { font: 700 10.5px var(--cl-mono); fill: #8ff0e6; }
  .cl-iso-sub { font-size: 9.5px; fill: rgba(127, 166, 163, 0.95); }
  .cl-iso-lg { font-size: 10.5px; fill: var(--mfg-text-dim); }
  .cl-agv { animation: cl-agv 2s ease-in-out infinite; }
  @keyframes cl-agv { 50% { opacity: 0.55; } }

  /* ===== 波次进度行 ===== */
  .cl-waves { flex: 1; min-height: 0; margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .cl-waves li {
    display: flex; flex-direction: column; justify-content: center; gap: 5px; flex: 1; min-height: 0;
    padding: 5px 12px; border-radius: 9px;
    border: 1px solid rgba(64, 196, 190, 0.16); background: rgba(10, 38, 42, 0.5);
  }
  .cl-wave-row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12.5px; color: #d6efec; }
  .cl-wave-row1 b { font-weight: 700; color: #eafcfa; }
  .cl-wave-row1 i { font-style: normal; font: 700 12px var(--cl-mono); color: var(--mfg-cyan); }
  .cl-wave-row1 em { font-style: normal; font-size: 10.5px; color: var(--mfg-text-dim); }
  .cl-wave-bar { position: relative; height: 6px; border-radius: 3px; background: rgba(64, 196, 190, 0.14); overflow: hidden; }
  .cl-wave-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--mfg-cyan-deep), var(--mfg-cyan)); }
  .cl-wave-bar i.is-amber { background: linear-gradient(90deg, rgba(255,201,77,.55), var(--mfg-amber)); }

  /* ===== 异常清单 ===== */
  .cl-alerts { flex: 1; min-height: 0; margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .cl-alerts li {
    display: flex; align-items: center; gap: 10px; min-height: 0; flex: 1;
    padding: 4px 10px; border-radius: 8px;
    border: 1px solid rgba(64, 196, 190, 0.14); background: rgba(10, 38, 42, 0.5);
    font-size: 12px; color: #cbe6e3; line-height: 1.45;
  }
  .cl-alerts li b { font-weight: 700; color: #eafcfa; }
  .cl-badge {
    flex: none; min-width: 40px; text-align: center; padding: 3px 8px; border-radius: 6px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;
  }
  .cl-badge.is-warn { color: #ffd9b0; background: rgba(255, 157, 69, 0.16); border: 1px solid rgba(255, 157, 69, 0.4); }
  .cl-badge.is-crit { color: #ffc9ce; background: rgba(255, 95, 107, 0.16); border: 1px solid rgba(255, 95, 107, 0.45); }
  .cl-badge.is-info { color: #a9f0e8; background: rgba(53, 224, 208, 0.13); border: 1px solid rgba(53, 224, 208, 0.35); }
  /* mockflag:begin —— 由 tools/inject_mock_flag.py 注入，勿手改 */
  .cl-mockflag {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 9000;
    padding: 3px 20px 4px; border-radius: 0 0 10px 10px; pointer-events: none;
    background: linear-gradient(180deg, #f2ab42, #de8524); color: #24130a;
    font-size: 13px; line-height: 1.15; font-weight: 700;
    letter-spacing: 0.3em; text-indent: 0.3em; white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }
  /* mockflag:end */
</style>

<script>
(function () {
  "use strict";

  /* ===== 1. 舞台等比缩放 ===== */
  const stage = document.getElementById("cl-stage");
  function fitStage() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fitStage);
  fitStage();

  const $ = (id) => document.getElementById(id);
  const pad = (n) => (n < 10 ? "0" + n : String(n));
  const fmtDec = (n, dec) => Number(n).toFixed(dec == null ? 1 : dec);
  const fmtQty = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);

  /* ===== 2. 系列公共色板 ===== */
  /* mfgpalette-js:begin —— 由 tools/sync_mfg_palette.py 注入，勿手改 */
  const PAL = {
    bg: "#051416",
    stage: "#071b1e",
    panel: "rgba(14,46,50,.55)",
    line: "rgba(64,196,190,.22)",
    cyan: "#35e0d0",
    "cyan-deep": "#1a9e96",
    blue: "#4fa8e8",
    green: "#7ee08a",
    orange: "#ff9d45",
    amber: "#ffc94d",
    red: "#ff5f6b",
    violet: "#a98cf5",
    text: "#d8f2ef",
    "text-dim": "#7fa6a3",
    series: ["#35e0d0", "#ff9d45", "#4fa8e8", "#7ee08a", "#ffc94d", "#a98cf5"]
  };
  /* mfgpalette-js:end */
  const C = Object.assign({}, PAL, {
    cyanDeep: PAL["cyan-deep"],
    textDim: PAL["text-dim"],
    grid: "rgba(64,196,190,.13)"
  });
  const hexMix = (hex, t, to) => {
    const n = parseInt(hex.slice(1), 16);
    const ch = (v) => Math.round(v + (to - v) * t);
    const r = ch(n >> 16), g = ch((n >> 8) & 255), b = ch(n & 255);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  };
  const lighten = (hex, t) => hexMix(hex, t, 255);
  const darken = (hex, t) => hexMix(hex, t, 0);

  /* ===== 3. 数据层 =====
     跨页勾稽（一律引权威源，不另编）：
       年吞吐 thru = 物流运输页 RDCS.inb 行和（246/160/146/76/48/98/128，Σ=902）；
       库存 inv = 仓储库存页 42 格矩阵行和（31.0/17.5/15.0/10.0/10.0/13.0/21.5，Σ=118.0）；
       库容 cap 与覆盖省区数 = 仓储库存页 WH 表；年配送 dist = 物流运输页 provs 求和（Σ=866）。
     本页新增（仓内运营口径，页内自洽）：巷道数、AGV 车队、分拣准确率、波次进度。
     日入库 = thru/365，日出库 = dist/365；入出差额为仓间调拨与库存净变，属正常运营。 */
  const WHS = [
    { key: "hd", zone: "华东", name: "华东仓", city: "杭州", thru: 246, inv: 31.0, cap: 33.0, dist: 236, provN: 6, hq: true },
    { key: "hb", zone: "华北", name: "华北仓", city: "天津", thru: 160, inv: 17.5, cap: 20.0, dist: 168, provN: 6 },
    { key: "hz", zone: "华中", name: "华中仓", city: "武汉", thru: 146, inv: 15.0, cap: 19.0, dist: 138, provN: 3 },
    { key: "xb", zone: "西北", name: "西北仓", city: "西安", thru: 76, inv: 10.0, cap: 10.5, dist: 66, provN: 5 },
    { key: "db", zone: "东北", name: "东北仓", city: "沈阳", thru: 48, inv: 10.0, cap: 15.0, dist: 44, provN: 3 },
    { key: "xn", zone: "西南", name: "西南仓", city: "成都", thru: 98, inv: 13.0, cap: 17.0, dist: 96, provN: 5 },
    { key: "hn", zone: "华南", name: "华南仓", city: "佛山", thru: 128, inv: 21.5, cap: 27.0, dist: 118, provN: 3 }
  ];
  const REV_TOTAL = 12.4;                     /* 逆向返厂 万单/年（与全链路/售后页同源），按配送量分摊 */
  const DIST_TOTAL = sum(WHS.map((w) => w.dist));
  WHS.forEach((w) => {
    w.util = w.inv / w.cap * 100;
    w.inDay = w.thru * 1e4 / 365;
    w.outDay = w.dist * 1e4 / 365;
    w.aisle = Math.round(w.cap * 0.42) + 4;                  /* 巷道数 ∝ 库容 */
    w.agv = Math.round(w.cap * 2.2);                          /* AGV 车队规模 ∝ 库容 */
    w.agvSt = [Math.round(w.agv * 0.62), Math.round(w.agv * 0.2), Math.round(w.agv * 0.14)];
    w.agvSt.push(w.agv - sum(w.agvSt));                       /* 作业/充电/待命/故障，末项吸收舍入 */
    w.sortAcc = 99.98 - (w.util > 90 ? 0.06 : 0.02);          /* 分拣准确率：高负荷仓略降 */
    w.retDay = REV_TOTAL * w.dist / DIST_TOTAL * 1e4 / 365;   /* 日退货件（逆向分摊） */
  });

  /* ===== 4. 时钟 ===== */
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  function tickClock() {
    const t = new Date();
    $("cl-clock-time").textContent = pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds());
    $("cl-clock-date").textContent = t.getFullYear() + "年" + pad(t.getMonth() + 1) + "月" + pad(t.getDate()) + "日 星期" + WEEK[t.getDay()];

  /* ===== 5. 切换器（7 仓） ===== */
  const switcher = $("cl-switcher");
  switcher.innerHTML = WHS.map((w, i) => (
    '<button class="cl-sw-tab" type="button" data-i="' + i + '" title="切换到' + w.name + '（← → 方向键）">' +
      "<b>" + w.zone + "</b><span>" + fmtDec(w.util, 0) + "%</span>" +
    "</button>"
  )).join("");
  const swTabs = Array.from(switcher.querySelectorAll(".cl-sw-tab[data-i]"));

  /* ===== 6. KPI ===== */
  function countUp(el, target, dec) {
    const t0 = performance.now(), dur = 1200;
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = fmtDec(target * (1 - Math.pow(1 - p, 3)), dec);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = fmtDec(target, dec);
    })(t0);
  }
  function renderKpi(w) {
    const defs = [
      { icon: "📥", label: "日均入库", v: w.inDay, dec: 0, unit: "台/日", sub: "年吞吐 " + w.thru + " 万台 ÷ 365" },
      { icon: "📤", label: "日均出库", v: w.outDay, dec: 0, unit: "台/日", sub: "年配送 " + w.dist + " 万台 · 差额为调拨" },
      { icon: "📦", label: "库存水位", v: w.inv, dec: 1, unit: "万台", sub: "与仓储库存页矩阵同源" },
      { icon: "🏬", label: "库容利用率", v: w.util, dec: 1, unit: "%", warn: w.util > 90, sub: "库容 " + fmtDec(w.cap, 1) + " 万台" + (w.util > 90 ? " · 高位预警" : "") },
      { icon: "🎯", label: "分拣准确率", v: w.sortAcc, dec: 2, unit: "%", sub: "扫码复核双校验" },
      { icon: "🤖", label: "AGV 在线", v: w.agvSt[0] + w.agvSt[2], dec: 0, unit: "台", sub: "车队 " + w.agv + " 台 · 作业 " + w.agvSt[0] + " · 充电 " + w.agvSt[1] }
    ];
    $("cl-band").innerHTML = defs.map((k, i) => (
      '<div class="cl-kpi' + (k.warn ? " is-warn" : "") + '">' +
        '<div class="cl-kpi-icon">' + k.icon + "</div>" +
        '<div class="cl-kpi-main">' +
          '<div class="cl-kpi-label">' + k.label + "</div>" +
          '<div class="cl-kpi-num"><span class="cl-kpi-val" id="cl-kpi-' + i + '">0</span><span class="cl-kpi-unit">' + k.unit + "</span></div>" +
          '<div class="cl-kpi-sub">' + k.sub + "</div>" +
        "</div>" +
      "</div>"
    )).join("");
    defs.forEach((k, i) => countUp($("cl-kpi-" + i), k.v, k.dec));
  }

  /* ===== 7. 等距仓内（纯 SVG，资源守卫之前渲染） ===== */
  /* 等距轴：u = (1, .5)（右下），v = (−1, .5)（左下） */
  function isoBar(x, y, L, W, h, colTop, colL, colR) {
    const p0 = [x, y], p1 = [x + L, y + L * 0.5], p2 = [x + L - W, y + L * 0.5 + W * 0.5], p3 = [x - W, y + W * 0.5];
    const pt = (p) => p[0] + "," + p[1];
    const dn = (p) => p[0] + "," + (p[1] + h);
    return '<polygon points="' + pt(p0) + " " + pt(p1) + " " + pt(p2) + " " + pt(p3) + '" fill="' + colTop + '"/>' +
      '<polygon points="' + pt(p3) + " " + pt(p2) + " " + dn(p2) + " " + dn(p3) + '" fill="' + colL + '"/>' +
      '<polygon points="' + pt(p2) + " " + pt(p1) + " " + dn(p1) + " " + dn(p2) + '" fill="' + colR + '"/>';
  }
  function isoCube(cx, cy, a, b, h, col, extra) {
    const top = lighten(col, 0.16), lf = darken(col, 0.38), rt = darken(col, 0.56);
    return '<polygon points="' + cx + "," + (cy - b) + " " + (cx + a) + "," + cy + " " + cx + "," + (cy + b) + " " + (cx - a) + "," + cy + '" fill="' + top + '"/>' +
      '<polygon points="' + (cx - a) + "," + cy + " " + cx + "," + (cy + b) + " " + cx + "," + (cy + b + h) + " " + (cx - a) + "," + (cy + h) + '" fill="' + lf + '"/>' +
      '<polygon points="' + cx + "," + (cy + b) + " " + (cx + a) + "," + cy + " " + (cx + a) + "," + (cy + h) + " " + cx + "," + (cy + b + h) + '" fill="' + rt + '"/>' + (extra || "");
  }
  function capsule(x, y, glyph, name) {
    const w = 26 + name.length * 11.5 + 14;
    return '<rect class="cl-iso-cap-bg" x="' + (x - w / 2) + '" y="' + (y - 11) + '" width="' + w + '" height="22" rx="11"/>' +
      '<text class="cl-iso-cap-tx" x="' + (x - w / 2 + 8) + '" y="' + (y + 4) + '">' + glyph + '</text>' +
      '<text class="cl-iso-cap-tx" x="' + (x - w / 2 + 25) + '" y="' + (y + 4) + '">' + name + "</text>";
  }
  function edgePath(p1, p2) {
    const dx = (p2[0] - p1[0]) * 0.45;
    return "M" + p1[0] + "," + p1[1] + " C" + (p1[0] + dx) + "," + p1[1] + " " + (p2[0] - dx) + "," + p2[1] + " " + p2[0] + "," + p2[1];
  }
  const NP = {
    dockIn: { x: 108, y: 150, a: 34, b: 17, h: 18 },
    buffer: { x: 262, y: 236, a: 32, b: 16, h: 16 },
    sorter: { x: 618, y: 452, a: 38, b: 19, h: 20 },
    pack:   { x: 762, y: 520, a: 30, b: 15, h: 18 },
    dockOut:{ x: 858, y: 600, a: 30, b: 15, h: 16 },
    charge: { x: 210, y: 610, a: 28, b: 14, h: 14 },
    ret:    { x: 108, y: 500, a: 26, b: 13, h: 14 }
  };

  function buildIso(w) {
    const S = [];
    /* 仓体外轮廓（等距平行四边形墙线） */
    S.push('<polygon class="cl-iso-wall" points="420,20 906,263 486,688 20,445"/>');
    [[60, 300, 480, 90], [110, 430, 640, 165], [230, 610, 800, 325]].forEach((l) =>
      S.push('<line class="cl-iso-grid" x1="' + l[0] + '" y1="' + l[1] + '" x2="' + l[2] + '" y2="' + l[3] + '"/>'));

    /* —— 立体库巷道群：行数 = 巷道数的一半（一巷两排），亮格比例 = 利用率 —— */
    const rows = Math.max(4, Math.round(w.aisle / 2));
    const L = 240, W = 11, H = 16, gap = 26;
    const ox = 430, oy = 128;
    const rackFilled = lighten(C.cyan, 0.05), rackDim = "rgba(53,224,208,0.14)";
    for (let r = 0; r < rows; r += 1) {
      const rx = ox - r * gap, ry = oy + r * gap * 0.5;
      S.push(isoBar(rx, ry, L, W, H, "rgba(26,158,150,0.5)", darken(C.cyanDeep, 0.35), darken(C.cyanDeep, 0.55)));
      /* 亮格：沿巷道方向铺格子，前 util% 亮 */
      const cells = 10;
      const lit = Math.round(cells * Math.min(1, w.util / 100));
      for (let c = 0; c < cells; c += 1) {
        const t0 = c / cells * L, t1 = (c + 0.82) / cells * L;
        const fill = c < lit ? rackFilled : rackDim;
        S.push('<polygon points="' +
          (rx + t0) + "," + (ry + t0 * 0.5) + " " +
          (rx + t1) + "," + (ry + t1 * 0.5) + " " +
          (rx + t1 - W * 0.7) + "," + (ry + t1 * 0.5 + W * 0.35) + " " +
          (rx + t0 - W * 0.7) + "," + (ry + t0 * 0.5 + W * 0.35) +
          '" fill="' + fill + '"' + (c < lit ? "" : ' opacity="0.8"') + "/>");
      }
    }
    /* 巷道区标注 */
    const rackCx = ox - (rows - 1) * gap * 0.5 + L * 0.5 - 60;
    const rackCy = oy + (rows - 1) * gap * 0.25 + L * 0.25 - 68;
    S.push('<line class="cl-iso-lead" x1="' + rackCx + '" y1="' + (rackCy + 12) + '" x2="' + rackCx + '" y2="' + (rackCy + 42) + '"/>');
    S.push(capsule(rackCx, rackCy, "🏬", "立体库巷道 × " + w.aisle));
    S.push('<text class="cl-iso-val" x="' + rackCx + '" y="' + (rackCy + 58) + '" text-anchor="middle">存量 ' + fmtDec(w.inv, 1) + " 万台 · " + fmtDec(w.util, 1) + "%</text>");

    /* —— 流线 —— */
    const particles = [];
    function flow(p1, p2, wd, cls, dur, col) {
      const d = edgePath(p1, p2);
      S.push('<path class="' + (cls || "cl-iso-edge") + '" d="' + d + '" stroke="' + (col || C.cyan) + '" stroke-width="' + fmtDec(wd, 2) + '" opacity="0.55"' + (cls ? ' stroke-dasharray="6 5"' : "") + "/>");
      particles.push('<circle r="2.5" fill="' + (cls ? C.orange : "#5ff0e0") + '"><animateMotion dur="' + fmtDec(dur, 2) + 's" repeatCount="indefinite" path="' + d + '"/></circle>');
    }
    const rackIn = [340, 300], rackOut = [470, 388];
    flow([NP.dockIn.x + NP.dockIn.a + 3, NP.dockIn.y + 16], [NP.buffer.x - NP.buffer.a - 3, NP.buffer.y + 14], 1.4 + Math.min(2.4, w.inDay / 3200), null, 1.9);
    flow([NP.buffer.x + NP.buffer.a + 3, NP.buffer.y + 14], rackIn, 1.4 + Math.min(2.4, w.inDay / 3200), null, 1.7);
    flow(rackOut, [NP.sorter.x - NP.sorter.a - 3, NP.sorter.y + 16], 1.4 + Math.min(2.6, w.outDay / 3200), null, 2.1);
    flow([NP.sorter.x + NP.sorter.a + 3, NP.sorter.y + 16], [NP.pack.x - NP.pack.a - 3, NP.pack.y + 14], 1.6, null, 1.8);
    flow([NP.pack.x + NP.pack.a + 3, NP.pack.y + 14], [NP.dockOut.x - NP.dockOut.a - 3, NP.dockOut.y + 12], 1.6, null, 1.7);
    /* AGV 循环：巷道 ↔ 分拣（双向粒子） */
    const agvGo = edgePath([420, 360], [NP.sorter.x - 10, NP.sorter.y - NP.sorter.b - 6]);
    const agvBack = edgePath([NP.sorter.x - 30, NP.sorter.y - NP.sorter.b - 2], [396, 380]);
    S.push('<path class="cl-iso-edge" d="' + agvGo + '" stroke="' + C.blue + '" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 5"/>');
    S.push('<path class="cl-iso-edge" d="' + agvBack + '" stroke="' + C.blue + '" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 5"/>');
    for (let k = 0; k < 3; k += 1) {
      particles.push('<rect class="cl-agv" width="7" height="5" rx="1.4" fill="' + C.blue + '"><animateMotion dur="' + fmtDec(2.4 + k * 0.5, 1) + 's" begin="-' + k * 0.8 + 's" repeatCount="indefinite" path="' + agvGo + '"/></rect>');
      particles.push('<rect class="cl-agv" width="7" height="5" rx="1.4" fill="' + darken(C.blue, 0.25) + '"><animateMotion dur="' + fmtDec(2.6 + k * 0.4, 1) + 's" begin="-' + k * 0.9 + 's" repeatCount="indefinite" path="' + agvBack + '"/></rect>');
    }
    /* 出厂发运箭头 + 逆向退货（退货暂存 → 巷道区，橙色虚线） */
    S.push('<path class="cl-iso-edge" d="M' + (NP.dockOut.x + NP.dockOut.a + 3) + "," + (NP.dockOut.y + 10) + " L" + (NP.dockOut.x + NP.dockOut.a + 52) + "," + (NP.dockOut.y + 20) + '" stroke="' + C.cyanDeep + '" stroke-width="2.4" opacity="0.8" marker-end="url(#cl-arr)"/>');
    S.push('<text class="cl-iso-sub" x="' + (NP.dockOut.x + NP.dockOut.a + 6) + '" y="' + (NP.dockOut.y - 2) + '">省区配送</text>');
    flow([NP.ret.x + NP.ret.a + 3, NP.ret.y + 10], [330, 420], 1.4, "cl-iso-rev", 3.4);

    /* —— 功能节点 —— */
    function node(key, col, glyph, name, val, sub) {
      const n = NP[key];
      let g = '<g class="cl-iso-node">';
      g += isoCube(n.x, n.y, n.a, n.b, n.h, col);
      const capY = n.y - n.b - 30;
      g += '<line class="cl-iso-lead" x1="' + n.x + '" y1="' + (capY + 12) + '" x2="' + n.x + '" y2="' + (n.y - n.b - 3) + '"/>';
      g += capsule(n.x, capY, glyph, name);
      const vy = n.y + n.b + n.h + 14;
      if (val) g += '<text class="cl-iso-val" x="' + n.x + '" y="' + vy + '" text-anchor="middle">' + val + "</text>";
      if (sub) g += '<text class="cl-iso-sub" x="' + n.x + '" y="' + (vy + 13) + '" text-anchor="middle">' + sub + "</text>";
      return g + "</g>";
    }
    S.push(node("dockIn", C.cyanDeep, "📥", "收货月台", fmtQty(w.inDay) + " 台/日", "干线整车到货"));
    S.push(node("buffer", C.blue, "🗃", "暂存缓冲区", null, "扫码上架 · 二次质检"));
    S.push(node("sorter", C.cyan, "🔀", "分拣线", fmtQty(w.outDay) + " 台/日", "准确率 " + fmtDec(w.sortAcc, 2) + "%"));
    S.push(node("pack", C.blue, "📦", "复核包装", null, "防损加固"));
    S.push(node("dockOut", C.cyanDeep, "🚚", "出货月台", fmtQty(w.outDay) + " 台/日", "覆盖 " + w.provN + " 省区"));
    S.push(node("charge", C.violet, "🔋", "AGV 充电区", w.agvSt[1] + " 台在充", "车队 " + w.agv + " 台"));
    S.push(node("ret", C.orange, "↩", "退货暂存区", fmtQty(w.retDay) + " 件/日", "质检后翻新或返厂"));

    S.push(particles.join(""));
    S.push('<g transform="translate(14,690)">' +
      '<line x1="0" y1="0" x2="28" y2="0" stroke="' + C.cyan + '" stroke-width="2.4" opacity="0.7"/>' +
      '<text class="cl-iso-lg" x="35" y="4">入出库流 · 线宽∝台/日</text>' +
      '<rect x="184" y="-4" width="9" height="7" rx="1.5" fill="' + C.blue + '"/>' +
      '<text class="cl-iso-lg" x="200" y="4">AGV 往返巷道与分拣</text>' +
      '<line x1="340" y1="0" x2="368" y2="0" stroke="' + C.orange + '" stroke-width="1.5" stroke-dasharray="6 5"/>' +
      '<text class="cl-iso-lg" x="375" y="4">退货逆向</text>' +
      '<rect x="452" y="-5" width="10" height="8" fill="' + lighten(C.cyan, 0.05) + '"/>' +
      '<text class="cl-iso-lg" x="469" y="4">货架亮格比例 = 库容利用率</text>' +
      "</g>");
    const defs = '<defs><marker id="cl-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9Z" fill="' + C.cyanDeep + '"/></marker></defs>';
    $("cl-iso").innerHTML = defs + S.join("");
  }

  /* ===== 8. 波次与异常（不依赖 echarts） ===== */

  const EVT = {

         ["is-warn", "退货", "退货件占比环比 <b>+0.4pp</b>，以换新单为主"],
         ["is-info", "波次", "三波工程直送今日无单"]],
    xn: [["is-warn", "地形", "山区县配送尾程时长高于均值 <b>3.1h</b>"],
         ["is-info", "波次", "电商件一波 <b>09:12</b> 全部发运"],
         ["is-info", "设备", "新增 AGV <b>6 台</b>到货调试"]],
    hn: [["is-warn", "雨季", "台风预警：明日出港干线可能停发，已预提发运"],
         ["is-info", "出口", "出口拼柜 <b>2 柜</b>完成装箱，今夜离仓"],
         ["is-info", "利用", "利用率 <b>79.6%</b>，运行平稳"]]
  };
  function renderEvents(w) {
    $("cl-alerts").innerHTML = EVT[w.key].map((e) => (
      '<li><span class="cl-badge ' + e[0] + '">' + e[1] + "</span><span>" + e[2] + "</span></li>"
    )).join("");
    $("cl-tag-evt").innerHTML = "<b>" + EVT[w.key].length + "</b> 条 · 今日";
  }

  /* ===== 9. 资源守卫 ===== */
  const errorNode = $("cl-error");
  const hasEcharts = !!window.echarts;
  if (!hasEcharts) errorNode.classList.add("is-visible");
  let ioChart = null, cmpChart = null, agvChart = null;
  if (hasEcharts) {
    ioChart = echarts.init($("cl-chart-io"));
    cmpChart = echarts.init($("cl-chart-cmp"));
    agvChart = echarts.init($("cl-chart-agv"));
  }
  const axisLabel = { color: C.textDim, fontSize: 10.5 };

  /* 24h 入出库节奏：上午入库波峰、下午出库波峰 */
  function ioOption(w) {
    const HOURS = Array.from({ length: 24 }, (_, i) => i + ":00");
    const inShape = [0, 0, 0, 0, 0.1, 0.3, 0.7, 1, 1, 0.9, 0.7, 0.5, 0.3, 0.4, 0.5, 0.4, 0.3, 0.2, 0.1, 0.1, 0, 0, 0, 0];
    const outShape = [0.05, 0, 0, 0, 0, 0.1, 0.3, 0.5, 0.7, 0.9, 1, 0.9, 0.5, 0.8, 1, 1, 0.9, 0.8, 0.6, 0.5, 0.3, 0.2, 0.1, 0.05];
    const inData = inShape.map((v) => Math.round(v * w.inDay / sum(inShape)));
    const outData = outShape.map((v) => Math.round(v * w.outDay / sum(outShape)));
    return {
      grid: { left: 8, right: 12, top: 24, bottom: 4, containLabel: true },
      legend: { top: 0, right: 0, itemWidth: 12, itemHeight: 8, textStyle: { color: C.textDim, fontSize: 10.5 }, data: ["入库", "出库"] },
      xAxis: { type: "category", data: HOURS, axisLabel: Object.assign({ interval: 3 }, axisLabel), axisLine: { lineStyle: { color: C.grid } }, axisTick: { show: false } },
      yAxis: { type: "value", name: "台/时", nameTextStyle: { color: C.textDim, fontSize: 10 }, axisLabel: axisLabel, splitLine: { lineStyle: { color: C.grid } } },
      series: [
        { name: "入库", type: "line", data: inData, smooth: true, symbol: "none",
          lineStyle: { color: C.blue, width: 2 }, areaStyle: { color: "rgba(79,168,232,0.22)" } },
        { name: "出库", type: "line", data: outData, smooth: true, symbol: "none",
          lineStyle: { color: C.cyan, width: 2 }, areaStyle: { color: "rgba(53,224,208,0.22)" } }
      ]
    };
  }
  /* 七仓对比：利用率柱（当前仓橙色高亮）+ 年吞吐折线 */
  function cmpOption(cur) {
    return {
      grid: { left: 40, right: 42, top: 26, bottom: 24 },
      legend: { top: 0, right: 0, itemWidth: 12, itemHeight: 8, textStyle: { color: C.textDim, fontSize: 10.5 }, data: ["利用率", "年吞吐"] },
      xAxis: { type: "category", data: WHS.map((w) => w.zone), axisLabel: axisLabel, axisLine: { lineStyle: { color: C.grid } }, axisTick: { show: false } },
      yAxis: [
        { type: "value", name: "%", max: 100, nameTextStyle: { color: C.textDim, fontSize: 10 }, axisLabel: axisLabel, splitLine: { lineStyle: { color: C.grid } } },
        { type: "value", name: "万台", nameTextStyle: { color: C.textDim, fontSize: 10 }, axisLabel: axisLabel, splitLine: { show: false } }
      ],
      series: [
        { name: "利用率", type: "bar", barWidth: 16,
          data: WHS.map((w, i) => ({ value: +w.util.toFixed(1), itemStyle: { color: i === cur ? C.orange : C.cyanDeep, borderRadius: [4, 4, 0, 0] } })),
          markLine: { symbol: "none", silent: true, lineStyle: { color: C.red, type: "dashed", opacity: 0.6 },
            label: { color: C.red, fontSize: 9.5, formatter: "90% 高位线" }, data: [{ yAxis: 90 }] } },
        { name: "年吞吐", type: "line", yAxisIndex: 1, data: WHS.map((w) => w.thru), smooth: true,
          symbol: "circle", symbolSize: 5, lineStyle: { color: C.blue, width: 2 }, itemStyle: { color: C.blue } }
      ]
    };
  }
  /* AGV 车队状态环形 */
  function agvOption(w) {
    const names = ["作业中", "充电中", "待命", "故障"];
    return {
      legend: {
        orient: "vertical", right: 4, top: "middle", itemWidth: 12, itemHeight: 8,
        textStyle: { color: C.textDim, fontSize: 11 },
        formatter: (name) => name + "  " + w.agvSt[names.indexOf(name)] + " 台"
      },
      series: [{
        type: "pie", radius: ["56%", "80%"], center: ["34%", "50%"],
        avoidLabelOverlap: false, padAngle: 2,
        itemStyle: { borderRadius: 6, borderColor: PAL.stage, borderWidth: 2 },
        label: { show: false },
        data: names.map((n, i) => ({ name: n, value: w.agvSt[i], itemStyle: { color: [C.cyan, C.amber, C.blue, C.red][i] } }))
      }],
      graphic: [
        { type: "text", left: "27%", top: "42%", style: { text: String(w.agv), fill: "#eafcfa", fontSize: 22, fontWeight: 700, fontFamily: "Bahnschrift, DIN Alternate, sans-serif" } },
        { type: "text", left: "26%", top: "56%", style: { text: "台车队", fill: C.textDim, fontSize: 10.5 } }
      ]
    };
  }

  /* ===== 10. 切换 + hash + kiosk ===== */
  const PARENT = "大屏样板间-厨电仓储库存1920.html";
  let idx = 0;
  function applyWh(i) {
    const n = WHS.length;
    idx = ((i % n) + n) % n;
    const w = WHS[idx];
    $("cl-title").textContent = w.name + " 数字孪生";
    $("cl-crumb-obj").textContent = w.name + " · " + w.city + (w.hq ? " · 总部同址" : "");
    $("cl-meta-cap").textContent = fmtDec(w.cap, 1);
    $("cl-meta-aisle").textContent = w.aisle;
    $("cl-meta-prov").textContent = w.provN;
    $("cl-iso-title").textContent = "仓内数字孪生 · " + w.name;
    $("cl-tag-iso").innerHTML = "存量 <b>" + fmtDec(w.inv, 1) + "</b> 万台 · 利用率 <b>" + fmtDec(w.util, 1) + "%</b>";
    $("cl-tag-io").innerHTML = "入 <b>" + fmtQty(w.inDay) + "</b> · 出 <b>" + fmtQty(w.outDay) + "</b> 台/日";
    $("cl-tag-agv").innerHTML = "在线 <b>" + (w.agvSt[0] + w.agvSt[2]) + "</b> / " + w.agv + " 台";
    $("cl-chip-sis").href = "大屏样板间-厨电库存库龄台账1920.html#" + encodeURIComponent(w.zone + "-" + w.city);
    swTabs.forEach((t, k) => t.classList.toggle("is-active", k === idx));

    renderKpi(w);
    buildIso(w);
    renderWaves(w);
    renderEvents(w);
    if (hasEcharts) {
      ioChart.setOption(ioOption(w));
      cmpChart.setOption(cmpOption(idx));
      agvChart.setOption(agvOption(w));
    }
    history.replaceState(null, "", "#" + encodeURIComponent(w.name));
  }

  swTabs.forEach((t) => t.addEventListener("click", () => { applyWh(Number(t.dataset.i)); restart(); }));
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { applyWh(idx - 1); restart(); }
    else if (e.key === "ArrowRight") { applyWh(idx + 1); restart(); }
    else if (e.key === "Escape") { location.href = PARENT; }
  });
  function hashIdx() {
    const h = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
    if (!h) return -1;
    return WHS.findIndex((w) => w.name === h || w.zone === h || w.city === h || w.key === h || w.name.indexOf(h) >= 0);
  }
  const hit = hashIdx();
  applyWh(hit >= 0 ? hit : 0);
  window.addEventListener("hashchange", () => {
    const k = hashIdx();
    if (k >= 0 && k !== idx) { applyWh(k); restart(); }
  });
  let timer = null;
  function restart() { clearInterval(timer); timer = setInterval(() => applyWh(idx + 1), 16000); }
  restart();
  switcher.addEventListener("mouseenter", () => clearInterval(timer));
  switcher.addEventListener("mouseleave", restart);
})();
</script>
</body>
</html>
