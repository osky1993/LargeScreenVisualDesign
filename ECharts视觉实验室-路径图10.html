      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));

  function rgbToHsla(r, g, b, a) {

    const PALETTE = [&quot;#3fe1ff&quot;, &quot;#4b7dff&quot;, &quot;#38e6b0&quot;, &quot;#ffc857&quot;, &quot;#9870ff&quot;, &quot;#ff9360&quot;, &quot;#e96bb5&quot;, &quot;#6f8fb5&quot;, &quot;#7fc8e8&quot;, &quot;#a4e07f&quot;, &quot;#ff9db8&quot;, &quot;#d2a8ff&quot;];

    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
    let motionEnabled = !reducedMotion.matches;

    function rnd(min, max) { return Math.round(min + Math.random() * (max - min)); }
    function rndf(min, max, digits) {
      const p = Math.pow(10, digits == null ? 1 : digits);
      return Math.round((min + Math.random() * (max - min)) * p) / p;
    }
    function setNote(id, text) {
      const node = document.getElementById(id);
      if (node) node.textContent = text || &quot;&quot;;
    }

    /* ================= 公共：路径图基座 ================= */
    function baseLinesOption() {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 800 : 0,
        xAxis: { type: &quot;value&quot;, show: false, min: 0, max: 100, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
        yAxis: { type: &quot;value&quot;, show: false, min: 0, max: 100, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
        grid: { left: 8, right: 8, top: 8, bottom: 8 },
        tooltip: {
          trigger: &quot;item&quot;,
          backgroundColor: &quot;rgba(10,30,60,0.92)&quot;,
          borderColor: &quot;rgba(63,225,255,0.35)&quot;,
          textStyle: { color: &quot;#e6f1ff&quot;, fontSize: 12 }
        }
      };
    }

    function nodeScatter(nodes, extra) {
      extra = extra || {};
      return {
        type: &quot;scatter&quot;,
        coordinateSystem: &quot;cartesian2d&quot;,
        symbolSize: extra.symbolSize || 14,
        data: nodes.map((n) =&gt; ({ name: n.name, value: [n.x, n.y], itemStyle: n.itemStyle || { color: extra.color || C.cyan } })),
        label: Object.assign({ show: true, position: &quot;right&quot;, color: C.text, fontSize: 12, distance: 6, formatter: function(p) { return p.name; } }, extra.label || {}),
        emphasis: { scale: 1.5, label: { fontSize: 14, fontWeight: &quot;bold&quot; } },
        z: 10
      };
    }

    function linesSeries(links, opts) {
      opts = opts || {};
      const data = links.map((l) =&gt; ({
        coords: l.coords,
        name: l.name || (l.source + &quot; → &quot; + l.target),
        lineStyle: Object.assign({ color: opts.lineColor || C.cyan, width: Math.max(1, (l.value || 1) * (opts.widthScale || 0.3)), opacity: opts.opacity != null ? opts.opacity : 0.8, curveness: opts.curveness != null ? opts.curveness : 0.3, type: opts.lineType || &quot;solid&quot; }, l.lineStyle || {}),
        value: l.value
      }));
      const series = {
        type: &quot;lines&quot;,
        coordinateSystem: &quot;cartesian2d&quot;,
        polyline: !!opts.polyline,
        data: data,
        lineStyle: { color: opts.lineColor || C.cyan, width: 2, curveness: opts.curveness != null ? opts.curveness : 0.3, opacity: 0.8 },
        z: 5
      };
      if (opts.effect) {
        series.effect = Object.assign({ show: true, period: 6, trailLength: 0.4, symbol: &quot;arrow&quot;, symbolSize: 8, color: opts.effectColor || C.cyan }, opts.effect);
      }
      if (opts.label) {
        series.label = Object.assign({ show: true, position: &quot;middle&quot;, color: C.muted, fontSize: 10, formatter: function(p) { return p.data.value; } }, opts.label);
      }
      return series;
    }

        { source: &quot;广州&quot;, target: &quot;上海&quot;, value: 22 },
        { source: &quot;北京&quot;, target: &quot;成都&quot;, value: 18 },

    /* ================= 04 资金流向网络 ================= */
    let c04ShowAll = false;
    const c04Data = (() =&gt; {
      const names = [&quot;对公户A&quot;, &quot;对公户B&quot;, &quot;同业户C&quot;, &quot;零售归集&quot;, &quot;理财专户&quot;, &quot;托管户D&quot;, &quot;外汇户E&quot;, &quot;备付金户&quot;];
      const nodes = names.map((n, i) =&gt; ({ name: n, x: 15 + (i % 4) * 25, y: 85 - Math.floor(i / 4) * 40 }));
      const lookup = {};
      nodes.forEach((n) =&gt; { lookup[n.name] = n; });
      const links = [];
      for (let i = 0; i &lt; names.length; i++) {
        for (let j = 0; j &lt; names.length; j++) {
          if (i === j) continue;
          const val = rndf(100, 2000, 0);
          links.push({
            coords: [[lookup[names[i]].x, lookup[names[i]].y], [lookup[names[j]].x, lookup[names[j]].y]],
            source: names[i], target: names[j], value: val,
            lineStyle: { color: PALETTE[i % PALETTE.length] }
          });
        }
      }
      return { nodes, links };
    })();

    function buildC04() {
      const threshold = c04ShowAll ? 0 : 500;
      const filtered = c04Data.links.filter((l) =&gt; l.value &gt;= threshold);
      setNote(&quot;e6ln-note-c04&quot;, &quot;显示 &quot; + filtered.length + &quot; 条路径（阈值≥&quot; + threshold + &quot;万），总计 &quot; + c04Data.links.length + &quot; 条关系&quot;);
      return Object.assign(baseLinesOption(), {
        series: [
          linesSeries(filtered, { curveness: 0.2, widthScale: 0.03, opacity: 0.65 }),

        { name: &quot;机构丙&quot;, x: 80, y: 50 },

      ];
      const pairs = [
        { a: &quot;机构甲&quot;, b: &quot;机构乙&quot;, fwd: 35, rev: 22 },
        { a: &quot;机构乙&quot;, b: &quot;机构丙&quot;, fwd: 48, rev: 31 },
        { a: &quot;机构丙&quot;, b: &quot;机构丁&quot;, fwd: 27, rev: 19 },
        { a: &quot;机构甲&quot;, b: &quot;机构丁&quot;, fwd: 18, rev: 25 }
      ];
      const lookup = {};
      nodes.forEach((n) =&gt; { lookup[n.name] = n; });
      const fwdLinks = pairs.map((p) =&gt; ({
        coords: [[lookup[p.a].x, lookup[p.a].y], [lookup[p.b].x, lookup[p.b].y]],
        source: p.a, target: p.b, value: p.fwd,
        lineStyle: { color: C.cyan, width: Math.max(1, p.fwd * 0.15) }
      }));
      const revLinks = pairs.map((p) =&gt; ({
        coords: [[lookup[p.b].x, lookup[p.b].y], [lookup[p.a].x, lookup[p.a].y]],
        source: p.b, target: p.a, value: p.rev,
        lineStyle: { color: C.orange, width: Math.max(1, p.rev * 0.15) }
      }));
      return Object.assign(baseLinesOption(), {
        tooltip: {
          trigger: &quot;item&quot;,
          backgroundColor: &quot;rgba(10,30,60,0.92)&quot;,
          borderColor: &quot;rgba(63,225,255,0.35)&quot;,
          textStyle: { color: &quot;#e6f1ff&quot;, fontSize: 12 },
          formatter: function(p) {
            if (p.seriesType === &quot;lines&quot;) {
              const pair = pairs.find((pr) =&gt; (pr.a === p.data.source &amp;&amp; pr.b === p.data.target) || (pr.b === p.data.source &amp;&amp; pr.a === p.data.target));
              if (pair) return p.data.source + &quot; → &quot; + p.data.target + &quot;&lt;br/&gt;&quot; + p.data.value + &quot; 亿元&lt;br/&gt;净额：&quot; + (pair.fwd - pair.rev) + &quot; 亿元&quot;;
              return p.data.source + &quot; → &quot; + p.data.target + &quot;：&quot; + p.data.value;
            }
            return p.name;
          }
        },
        series: [
          linesSeries(fwdLinks, { curveness: 0.3 }),
          linesSeries(revLinks, { curveness: -0.3 }),
          nodeScatter(nodes, { color: C.cyan })
        ]
      });
    }

    /* ================= 06 供应链链路图 ================= */

      ];

        { name: &quot;零售3&quot;, x: 95, y: 35 }
      ];
      const allNodes = [].concat(suppliers, makers, distributors, retailers);

      function makeLinks(froms, tos, clr) {

        froms.forEach((f) =&gt; {

            links.push({

      const s3 = makeLinks(distributors, retailers, C.cyan);
      return Object.assign(baseLinesOption(), {

              color: C.cyan,
              width: Math.max(0.5, val * 0.06),
              opacity: Math.min(1, Math.max(0.1, val / 100))
            }
          });
        }
      }
      return Object.assign(baseLinesOption(), {
        series: [
          linesSeries(links, { curveness: 0.15, widthScale: 0.06, opacity: 0.6 }),
          nodeScatter(nodes, { color: C.cyan, label: { position: &quot;right&quot;, distance: 6, fontSize: 10 } })
        ]
      });
    }

    /* ================= 页面自检 ================= */
    function runSelfCheck() {
      const results = [];
      function check(name, fn) {
        try { results.push({ name, pass: fn() === true }); }
        catch (err) { results.push({ name, pass: false }); }
      }
      check(&quot;lines 系列类型可用&quot;, () =&gt; {
        const opt = buildC01();
        return opt.series &amp;&amp; opt.series.length &gt;= 2 &amp;&amp; opt.series[0].type === &quot;lines&quot;;
      });
      check(&quot;polyline 模式可用&quot;, () =&gt; {
        const opt = buildC07();
        return opt.series &amp;&amp; opt.series[0].polyline === true;
      });
      check(&quot;effect 流光配置正确&quot;, () =&gt; {
        const opt = buildC02();
        const s = opt.series.find((s) =&gt; s.effect);
        return s &amp;&amp; s.effect.show === true;
      });
      check(&quot;双向曲率相反&quot;, () =&gt; {
        const opt = buildC05();
        const lines = opt.series.filter((s) =&gt; s.type === &quot;lines&quot;);
        return lines.length === 2;
      });
      check(&quot;节点坐标稳定&quot;, () =&gt; {
        const opt = buildC01();
        const sc = opt.series.find((s) =&gt; s.type === &quot;scatter&quot;);
        return sc &amp;&amp; sc.data &amp;&amp; sc.data.length === 6;
      });
      const passCount = results.filter((r) =&gt; r.pass).length;
      const chip = document.getElementById(&quot;e6ln-selfcheck&quot;);
      chip.innerHTML = &quot;&quot;;
      chip.append(&quot;自检 &quot;);
      const strong = document.createElement(&quot;strong&quot;);
      strong.textContent = passCount + &quot;/&quot; + results.length + (passCount === results.length ? &quot; 通过&quot; : &quot; 未通过&quot;);
      chip.appendChild(strong);
      chip.classList.add(passCount === results.length ? &quot;is-pass&quot; : &quot;is-fail&quot;);
      if (passCount !== results.length) {
        errorNode.textContent = &quot;页面自检未通过：&quot; + results.filter((r) =&gt; !r.pass).map((r) =&gt; r.name).join(&quot;、&quot;);
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }

    /* ================= 渲染调度 ================= */
    const builders = [
      { id: &quot;e6ln-c01&quot;, build: buildC01 },
      { id: &quot;e6ln-c02&quot;, build: buildC02 },
      { id: &quot;e6ln-c03&quot;, build: buildC03 },
      { id: &quot;e6ln-c04&quot;, build: buildC04 },
      { id: &quot;e6ln-c05&quot;, build: buildC05 },
      { id: &quot;e6ln-c06&quot;, build: buildC06 },
      { id: &quot;e6ln-c07&quot;, build: buildC07 },
      { id: &quot;e6ln-c08&quot;, build: buildC08 },
      { id: &quot;e6ln-c09&quot;, build: buildC09 },
      { id: &quot;e6ln-c10&quot;, build: buildC10 }
    ];
    const builderById = {};
    builders.forEach((b) =&gt; { builderById[b.id] = b; });

    const charts = {};
    function renderOne(id) {
      const item = builderById[id];
      const node = document.getElementById(id);
      if (!item || !node) return;
      if (!charts[id]) charts[id] = echarts.init(node, null, { renderer: &quot;canvas&quot; });
      try {
        charts[id].setOption(item.build(), { notMerge: true });
      } catch (err) {
        errorNode.textContent = &quot;方案「&quot; + id + &quot;」渲染异常：&quot; + err.message;
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }
    function renderInitialized() {
      Object.keys(charts).forEach(renderOne);
    }

    let io = null;
    if (&quot;IntersectionObserver&quot; in window) {
      io = new IntersectionObserver((entries) =&gt; {
        entries.forEach((entry) =&gt; {
          if (!entry.isIntersecting) return;
          renderOne(entry.target.id);
          io.unobserve(entry.target);
        });
      }, { rootMargin: &quot;320px 0px&quot; });
      builders.forEach((b) =&gt; {
        const node = document.getElementById(b.id);
        if (node) io.observe(node);
      });
    } else {
      builders.forEach((b) =&gt; renderOne(b.id));
    }

    let ro = null;
    function resizeCharts() {
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) charts[id].resize(); });
    }
    if (&quot;ResizeObserver&quot; in window) {
      ro = new ResizeObserver(resizeCharts);
      ro.observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    document.getElementById(&quot;e6ln-refresh&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      c04ShowAll = false;
      document.getElementById(&quot;e6ln-c04-toggle&quot;).setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
      document.getElementById(&quot;e6ln-c04-toggle&quot;).textContent = &quot;显示全部&quot;;
      renderInitialized();
    });

    document.getElementById(&quot;e6ln-c04-toggle&quot;).addEventListener(&quot;click&quot;, function() {
      c04ShowAll = !c04ShowAll;
      this.setAttribute(&quot;aria-pressed&quot;, String(c04ShowAll));
      this.textContent = c04ShowAll ? &quot;仅大额&quot; : &quot;显示全部&quot;;
      if (charts[&quot;e6ln-c04&quot;]) renderOne(&quot;e6ln-c04&quot;);
    });

    document.getElementById(&quot;e6ln-c09-hub&quot;).addEventListener(&quot;click&quot;, function() {
      c09HubIdx = (c09HubIdx + 1) % c09HubData.nodes.length;
      if (charts[&quot;e6ln-c09&quot;]) renderOne(&quot;e6ln-c09&quot;);
    });

    window.addEventListener(&quot;pagehide&quot;, () =&gt; {
      if (io) io.disconnect();
      if (ro) ro.disconnect();
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) { charts[id].dispose(); charts[id] = null; } });
    });

    runSelfCheck();
  })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
