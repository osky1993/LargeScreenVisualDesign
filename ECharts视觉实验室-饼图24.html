    .e6p-header h1 { margin: 0; font-size: clamp(23px, 1.9vw, 33px); line-height: 1.1; font-weight: 500; letter-spacing: -0.035em; }

    .e6p-chip, .e6p-button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0 11px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: rgba(18, 52, 88, 0.58); font-size: 11px; font-weight: 500; }
    .e6p-chip strong { color: var(--cyan); font-weight: 500; }

    .e6p-button:hover { border-color: var(--line-hot); background: rgba(26, 72, 113, 0.72); transform: translateY(-1px); }

    .e6p-button[aria-pressed=&quot;true&quot;] { border-color: rgba(58, 239, 180, 0.42); color: #c9ffed; background: rgba(22, 104, 84, 0.3); }

    .e6p-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    .e6p-panel { position: relative; min-width: 0; min-height: 306px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(145deg, rgba(57, 196, 255, 0.04), transparent 38%), var(--panel); box-shadow: inset 0 1px 0 rgba(143, 230, 255, 0.04); }

  /* ---------- 复制配置 ---------- */
  function serializeJS(value, indent) {

    if (value === undefined) return &quot;undefined&quot;;

    if (t === &quot;string&quot;) return JSON.stringify(value);
    if (t === &quot;function&quot;) {
      return String(value).split(&quot;\n&quot;).map(function (line, i) { return i === 0 ? line : padIn + line.trim(); }).join(&quot;\n&quot;);
    }
    if (Array.isArray(value)) {
      if (!value.length) return &quot;[]&quot;;
      var flat = value.every(function (v) { return v === null || [&quot;number&quot;, &quot;string&quot;, &quot;boolean&quot;].indexOf(typeof v) !== -1; });

      if (flat &amp;&amp; items.join(&quot;, &quot;).length &lt; 100) return &quot;[&quot; + items.join(&quot;, &quot;) + &quot;]&quot;;
      return &quot;[\n&quot; + items.map(function (s) { return padIn + s; }).join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;]&quot;;
