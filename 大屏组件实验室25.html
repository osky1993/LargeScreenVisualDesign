&lt;script&gt;
&quot;use strict&quot;;

/* ============ 组件模板库：id -&gt; { html, css, js } ============
 * 页面卡片直接注入这些模板渲染（所见即所得）；
 * 「复制代码」按钮把同一份模板拼成自包含片段写入剪贴板。
 * 片段内配色统一走 CSS 变量（--cp-accent 等），便于取用后换色。
 */
const COMPONENTS = {

  /* ---------- 01 数字翻牌器 ---------- */
  flip: {
    code: &quot;01 · FLIP&quot;, title: &quot;数字翻牌器&quot;, tag: &quot;KPI 数字动效&quot;, key: true,
    fit: &quot;核心指标实时跳变&quot;, note: &quot;CSS 3D 逐位翻动&quot;,
    html: `&lt;div class=&quot;cp-flip&quot; data-value=&quot;98476&quot; data-demo aria-label=&quot;数字翻牌器&quot;&gt;&lt;/div&gt;`,
    css: `.cp-flip{--cp-flip-ink:var(--cp-text);display:inline-flex;align-items:center;gap:5px;}
.cp-flip-digit{perspective:300px;width:34px;height:48px;display:inline-block;}
.cp-flip-card{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;font:700 28px/1 &quot;Bahnschrift&quot;,&quot;DIN Alternate&quot;,&quot;PingFang SC&quot;,sans-serif;color:var(--cp-flip-ink);background:linear-gradient(180deg,#1b4478 0%,#123564 48%,#0c2547 52%,#123765 100%);border:1px solid rgba(94,168,255,.35);border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 12px color-mix(in srgb, var(--cp-accent) 8%, transparent);transition:transform .18s ease-out;transform-style:preserve-3d;}
.cp-flip-card::after{content:&quot;&quot;;position:absolute;left:2px;right:2px;top:50%;height:1px;background:rgba(4,14,30,.85);}
.cp-flip-digit.is-turn .cp-flip-card{transform:rotateX(-88deg);transition:transform .15s ease-in;}
.cp-flip-sep{align-self:flex-end;padding-bottom:5px;font:700 22px/1 sans-serif;color:var(--cp-accent);text-shadow:0 0 8px color-mix(in srgb, var(--cp-accent) 80%, transparent);}`,
    js: `(function(){
  function fmt(n){var s=String(n),out=&quot;&quot;;while(s.length&gt;3){out=&quot;,&quot;+s.slice(-3)+out;s=s.slice(0,-3);}return s+out;}
  function render(box,text){
    box.innerHTML=&quot;&quot;;
    for(var i=0;i&lt;text.length;i++){
      var ch=text.charAt(i);
      if(ch===&quot;,&quot;){
        var sep=document.createElement(&quot;span&quot;);sep.className=&quot;cp-flip-sep&quot;;sep.textContent=&quot;,&quot;;box.appendChild(sep);
      }else{
        var d=document.createElement(&quot;span&quot;);d.className=&quot;cp-flip-digit&quot;;
        d.innerHTML=&#x27;&lt;span class=&quot;cp-flip-card&quot;&gt;&#x27;+ch+&quot;&lt;/span&gt;&quot;;
        box.appendChild(d);
      }
    }
  }
  function setValue(box,n){
    var next=fmt(n),cur=box.getAttribute(&quot;data-cur&quot;)||&quot;&quot;;
    if(next.length!==cur.length){render(box,next);box.setAttribute(&quot;data-cur&quot;,next);return;}
    for(var i=0;i&lt;next.length;i++){
      if(next.charAt(i)===cur.charAt(i))continue;
      var cell=box.children[i];
      if(!cell||cell.className.indexOf(&quot;cp-flip-digit&quot;)&lt;0)continue;
      (function(cell,ch,delay){
        setTimeout(function(){
          cell.classList.add(&quot;is-turn&quot;);
          setTimeout(function(){
            cell.querySelector(&quot;.cp-flip-card&quot;).textContent=ch;
            cell.classList.remove(&quot;is-turn&quot;);
          },150);
        },delay);
      })(cell,next.charAt(i),i*45);
    }
    box.setAttribute(&quot;data-cur&quot;,next);
  }
  Array.prototype.forEach.call(document.querySelectorAll(&quot;.cp-flip&quot;),function(box){
    var val=parseInt(box.getAttribute(&quot;data-value&quot;),10)||0;
    render(box,fmt(val));box.setAttribute(&quot;data-cur&quot;,fmt(val));
    if(box.hasAttribute(&quot;data-demo&quot;)){ /* 演示：随机增减；实际接数据时移除 data-demo，调用 window.cpFlipSet(el, 新值) */
      setInterval(function(){
        val+=Math.floor(Math.random()*180)-40;if(val&lt;0)val=0;
        setValue(box,val);
      },2600);
    }
  });
  window.cpFlipSet=function(el,n){setValue(el,n);};
})();`

  /* ---------- 02 滚动累加数字 ---------- */
  count: {
    code: &quot;02 · COUNTUP&quot;, title: &quot;滚动累加数字&quot;, tag: &quot;KPI 数字动效&quot;, key: false,

  &lt;div&gt;&lt;span class=&quot;cp-count-num&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;cp-count-unit&quot;&gt;件&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;cp-count-label&quot;&gt;年度累计办件量&lt;/div&gt;
&lt;/div&gt;`,
    css: `.cp-count{text-align:center;font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;}
.cp-count-num{font-size:44px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#ffffff 15%,var(--cp-accent) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px color-mix(in srgb, var(--cp-accent) 35%, transparent));}
.cp-count-unit{margin-left:6px;font-size:14px;color:var(--cp-accent);}
.cp-count-label{margin-top:6px;font-size:13px;letter-spacing:.2em;color:var(--cp-muted);}`,
    js: `(function(){
  function fmt(n){var s=String(n),out=&quot;&quot;;while(s.length&gt;3){out=&quot;,&quot;+s.slice(-3)+out;s=s.slice(0,-3);}return s+out;}
  function run(el){
    var num=el.querySelector(&quot;.cp-count-num&quot;);
    var target=parseFloat(el.getAttribute(&quot;data-target&quot;))||0;
    var dur=parseInt(el.getAttribute(&quot;data-duration&quot;),10)||2000;
    var t0=null;
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min((ts-t0)/dur,1);
      var e=1-Math.pow(1-p,3); /* easeOutCubic */
      num.textContent=fmt(Math.round(target*e));
      if(p&lt;1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  Array.prototype.forEach.call(document.querySelectorAll(&quot;.cp-count&quot;),function(el){
    run(el);
    var loop=parseInt(el.getAttribute(&quot;data-loop&quot;),10); /* 演示循环；嵌入时去掉 data-loop 则只播一次 */
    if(loop&gt;0)setInterval(function(){run(el);},loop);
  });
})();`

      &lt;li&gt;&lt;i class=&quot;cp-rank-no is-g3&quot;&gt;3&lt;/i&gt;&lt;span class=&quot;cp-rank-name&quot;&gt;玉泉区&lt;/span&gt;&lt;b class=&quot;cp-rank-val&quot;&gt;3,610&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;&lt;i class=&quot;cp-rank-no&quot;&gt;4&lt;/i&gt;&lt;span class=&quot;cp-rank-name&quot;&gt;城北区&lt;/span&gt;&lt;b class=&quot;cp-rank-val&quot;&gt;3,128&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;&lt;i class=&quot;cp-rank-no&quot;&gt;5&lt;/i&gt;&lt;span class=&quot;cp-rank-name&quot;&gt;东湖区&lt;/span&gt;&lt;b class=&quot;cp-rank-val&quot;&gt;2,845&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;&lt;i class=&quot;cp-rank-no&quot;&gt;6&lt;/i&gt;&lt;span class=&quot;cp-rank-name&quot;&gt;临港区&lt;/span&gt;&lt;b class=&quot;cp-rank-val&quot;&gt;2,433&lt;/b&gt;&lt;/li&gt;

    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;`,
    css: `.cp-rank{width:100%;max-width:360px;font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;font-size:13px;color:var(--cp-text);}

    js: `(function(){
  Array.prototype.forEach.call(document.querySelectorAll(&quot;.cp-ring&quot;),function(box){
    var total=(parseInt(box.getAttribute(&quot;data-seconds&quot;),10)||60)*1000;
    var num=box.querySelector(&quot;.cp-ring-num&quot;);
    var start=null;
    function tick(ts){
      if(start===null)start=ts;
      var remain=total-((ts-start)%total); /* 归零后自动循环 */
      box.style.setProperty(&quot;--cp-ring-p&quot;,(remain/total*100).toFixed(2));
      num.textContent=Math.ceil(remain/1000);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
})();`

.cp-rd-dial{position:relative;width:164px;height:164px;border-radius:50%;overflow:hidden;border:1px solid color-mix(in srgb, var(--cp-accent) 45%, transparent);box-shadow:0 0 18px color-mix(in srgb, var(--cp-accent) 20%, transparent),inset 0 0 20px rgba(4,14,30,.6);background:radial-gradient(circle,transparent 0 24%,color-mix(in srgb, var(--cp-accent) 22%, transparent) 25%,transparent 26% 49%,color-mix(in srgb, var(--cp-accent) 22%, transparent) 50%,transparent 51% 74%,color-mix(in srgb, var(--cp-accent) 22%, transparent) 75%,transparent 76%),linear-gradient(90deg,transparent calc(50% - .5px),color-mix(in srgb, var(--cp-accent) 22%, transparent) 50%,transparent calc(50% + .5px)),linear-gradient(transparent calc(50% - .5px),color-mix(in srgb, var(--cp-accent) 22%, transparent) 50%,transparent calc(50% + .5px)),radial-gradient(circle,rgba(18,52,96,.92),rgba(9,24,48,.96));}
.cp-rd-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg 250deg,color-mix(in srgb, var(--cp-accent) 10%, transparent) 292deg,color-mix(in srgb, var(--cp-accent) 42%, transparent) 340deg,var(--cp-accent) 357deg,transparent 360deg);animation:cpRdSpin 4s linear infinite;}
.cp-rd-tgt{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--cp-text);opacity:.12;animation:cpRdBlip 4s linear infinite;}
.cp-rd-cap{font-size:12px;letter-spacing:.14em;color:var(--cp-muted);}
@keyframes cpRdSpin{to{transform:rotate(360deg);}}
@keyframes cpRdBlip{0%{opacity:1;box-shadow:0 0 12px var(--cp-accent),0 0 0 6px color-mix(in srgb, var(--cp-accent) 25%, transparent);}16%{opacity:1;box-shadow:0 0 10px var(--cp-accent),0 0 0 3px color-mix(in srgb, var(--cp-accent) 15%, transparent);}72%{opacity:.12;box-shadow:0 0 3px color-mix(in srgb, var(--cp-accent) 35%, transparent);}100%{opacity:.12;box-shadow:none;}}`,
    js: ``
  }
};

const ORDER = [&quot;flip&quot;,&quot;count&quot;,&quot;rank&quot;,&quot;marquee&quot;,&quot;corner&quot;,&quot;scan&quot;,&quot;titlebar&quot;,&quot;wings&quot;,&quot;status&quot;,&quot;ring&quot;,&quot;clock&quot;,&quot;loading&quot;,&quot;progress&quot;,&quot;kpiring&quot;,&quot;steps&quot;,&quot;tabs&quot;,&quot;skeleton&quot;,&quot;toast&quot;,&quot;ringframe&quot;,&quot;flowborder&quot;,&quot;svgframe&quot;,&quot;headerbar&quot;,&quot;ripplepoint&quot;,&quot;lightpillar&quot;,&quot;radarsweep&quot;];

/* ============ 主题适配器（读取 LAB_THEMES -&gt; --cp-* 根变量，纯 CSS 级联换色） ============ */
const CP_DEFAULTS = { bg: &quot;#0a1e3c&quot;, accent: &quot;#3fe1ff&quot;, blue: &quot;#4b7dff&quot;, deep: &quot;#2b6fd4&quot;, text: &quot;#e6f1ff&quot;, muted: &quot;#8fa7c8&quot; };
const CP_THEMES = (typeof LAB_THEMES !== &quot;undefined&quot; &amp;&amp; LAB_THEMES) || [];
let cpActiveThemeId = &quot;&quot;;
function cpThemeVars(theme) {
  if (!theme) return Object.assign({}, CP_DEFAULTS);
  const blueBase = (theme.colors &amp;&amp; theme.colors[1]) || theme.accent || CP_DEFAULTS.blue;
  return {
    bg: theme.bg || CP_DEFAULTS.bg,
    accent: (theme.colors &amp;&amp; theme.colors[0]) || CP_DEFAULTS.accent,
    blue: theme.accent || (theme.colors &amp;&amp; theme.colors[1]) || CP_DEFAULTS.blue,
    deep: &quot;color-mix(in srgb, &quot; + blueBase + &quot; 72%, #041226)&quot;,
    text: theme.text || CP_DEFAULTS.text,
    muted: theme.muted || CP_DEFAULTS.muted
  };
}
function cpApplyTheme(id) {
  cpActiveThemeId = id;
  const theme = CP_THEMES.find((t) =&gt; t.id === id) || null;
  const v = cpThemeVars(theme);
  const root = document.documentElement;
  root.style.setProperty(&quot;--cp-bg&quot;, v.bg);
  root.style.setProperty(&quot;--cp-accent&quot;, v.accent);
  root.style.setProperty(&quot;--cp-cyan&quot;, v.accent);
  root.style.setProperty(&quot;--cp-blue&quot;, v.blue);
  root.style.setProperty(&quot;--cp-accent-deep&quot;, v.deep);
  root.style.setProperty(&quot;--cp-text&quot;, v.text);
  root.style.setProperty(&quot;--cp-muted&quot;, v.muted);
}
function cpCurrentVarsBlock() {
  const theme = CP_THEMES.find((t) =&gt; t.id === cpActiveThemeId) || null;
  const v = cpThemeVars(theme);
  return &quot;:root {\n  --cp-bg: &quot; + v.bg + &quot;;\n  --cp-accent: &quot; + v.accent +
    &quot;;\n  --cp-accent-deep: &quot; + v.deep + &quot;;\n  --cp-text: &quot; + v.text +
    &quot;;\n  --cp-muted: &quot; + v.muted +
    &quot;;\n  --cp-ok: #38e6b0;\n  --cp-warn: #ffc857;\n  --cp-crit: #ff6680;\n  --cp-alarm: #ff5f6e;\n  --cp-target: #ffd79a;\n}&quot;;
}
function cpInitThemeWidget() {
  const sel = document.getElementById(&quot;e6cp-theme&quot;);
  if (!sel) return;
  const def = document.createElement(&quot;option&quot;);
  def.value = &quot;&quot;; def.textContent = &quot;默认（原始配色）&quot;;
  sel.appendChild(def);
  const groups = {};
  CP_THEMES.forEach((t) =&gt; {
    if (!groups[t.group]) {
      groups[t.group] = document.createElement(&quot;optgroup&quot;);
      groups[t.group].label = t.group === &quot;行业&quot; ? &quot;行业主题（12 套）&quot; : &quot;风格皮肤（21 套）&quot;;
      sel.appendChild(groups[t.group]);
    }
    const opt = document.createElement(&quot;option&quot;);
    opt.value = t.id;
    opt.textContent = t.id + &quot; · &quot; + t.name + &quot; · &quot; + t.use;
    groups[t.group].appendChild(opt);
  });
  sel.addEventListener(&quot;change&quot;, () =&gt; cpApplyTheme(sel.value));
  document.getElementById(&quot;e6cp-theme-reset&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    sel.value = &quot;&quot;;
    cpApplyTheme(&quot;&quot;);
  });
}

/* ============ 复制片段拼装 ============ */
function buildSnippet(item){
  var so = &quot;&lt;scr&quot; + &quot;ipt&gt;&quot;, sc = &quot;&lt;/scr&quot; + &quot;ipt&gt;&quot;;
  var parts = [&quot;&lt;!-- &quot; + item.title + &quot;（大屏组件实验室 &quot; + item.code + &quot; · 自包含片段） --&gt;&quot;];
  parts.push(&quot;&lt;style&gt;\n&quot; + cpCurrentVarsBlock() + &quot;\n&quot; + item.css + &quot;\n&lt;/style&gt;&quot;);
  parts.push(item.html);
  if (item.js) parts.push(so + &quot;\n&quot; + item.js + &quot;\n&quot; + sc);
  return parts.join(&quot;\n&quot;);
}

/* ============ 剪贴板三级降级：clipboard API -&gt; execCommand -&gt; 弹窗 ============ */
function legacyCopy(text){
  var ta = document.createElement(&quot;textarea&quot;);
  ta.value = text;
  ta.setAttribute(&quot;readonly&quot;, &quot;&quot;);
  ta.style.position = &quot;fixed&quot;;
  ta.style.left = &quot;-9999px&quot;;
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try { ok = document.execCommand(&quot;copy&quot;); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function copyText(text, done, fail){
  function viaLegacy(){
    if (legacyCopy(text)) { done(); }
    else {
      window.prompt(&quot;自动复制失败，请手动全选后复制（Ctrl/Cmd+C）：&quot;, text);
      fail();
    }
  }
  if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, viaLegacy);
  } else {
    viaLegacy();
  }
}

/* ============ 卡片渲染：模板直接注入页面，保证所见即所得 ============ */
function renderAll(){
  var grid = document.getElementById(&quot;e6cp-grid&quot;);
  ORDER.forEach(function(id){
    var c = COMPONENTS[id];

    var style = document.createElement(&quot;style&quot;);
    style.setAttribute(&quot;data-cp&quot;, id);
    style.textContent = c.css;
    document.head.appendChild(style);

    var panel = document.createElement(&quot;section&quot;);
    panel.className = &quot;e6cp-panel&quot;;

    var header = document.createElement(&quot;header&quot;);
    header.className = &quot;e6cp-panel-header&quot;;
    header.innerHTML =
      &#x27;&lt;div class=&quot;e6cp-panel-heading&quot;&gt;&lt;span class=&quot;e6cp-panel-index&quot;&gt;&#x27; + c.code +
      &#x27;&lt;/span&gt;&lt;h2&gt;&#x27; + c.title + &#x27;&lt;/h2&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;span class=&quot;e6cp-level&#x27; + (c.key ? &quot; is-key&quot; : &quot;&quot;) + &#x27;&quot;&gt;&#x27; + c.tag + &#x27;&lt;/span&gt;&#x27;;

    var demo = document.createElement(&quot;div&quot;);
    demo.className = &quot;e6cp-demo&quot;;
    demo.innerHTML = c.html;

    var footer = document.createElement(&quot;footer&quot;);
    footer.className = &quot;e6cp-panel-footer&quot;;
    footer.innerHTML =
      &#x27;&lt;span class=&quot;e6cp-fit&quot;&gt;&lt;strong&gt;适合：&lt;/strong&gt;&#x27; + c.fit + &#x27;&lt;/span&gt;&#x27; +
      &#x27;&lt;span class=&quot;e6cp-foot-right&quot;&gt;&lt;span class=&quot;e6cp-note&quot;&gt;&#x27; + c.note + &#x27;&lt;/span&gt;&lt;/span&gt;&#x27;;

    var btn = document.createElement(&quot;button&quot;);
    btn.type = &quot;button&quot;;
    btn.className = &quot;e6cp-copy&quot;;
    btn.textContent = &quot;复制代码&quot;;
    btn.addEventListener(&quot;click&quot;, function(){
      copyText(buildSnippet(c), function(){
        btn.textContent = &quot;已复制&quot;;
        btn.classList.add(&quot;is-done&quot;);
        setTimeout(function(){
          btn.textContent = &quot;复制代码&quot;;
          btn.classList.remove(&quot;is-done&quot;);
        }, 1800);
      }, function(){});
    });
    footer.querySelector(&quot;.e6cp-foot-right&quot;).appendChild(btn);

    panel.appendChild(header);
    panel.appendChild(demo);
    panel.appendChild(footer);
    grid.appendChild(panel);
  });

  /* 结构全部就位后再执行各组件脚本（与复制片段中的脚本完全同源） */
  ORDER.forEach(function(id){
    var js = COMPONENTS[id].js;
    if (!js) return;
    try { new Function(js)(); }
    catch (e) { if (window.console &amp;&amp; console.error) console.error(&quot;组件脚本执行失败: &quot; + id, e); }
  });
}

if (typeof document !== &quot;undefined&quot;) { renderAll(); cpInitThemeWidget(); }
&lt;/script&gt;
