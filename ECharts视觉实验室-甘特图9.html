&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {
  &quot;use strict&quot;;
  if (!window.echarts || window.LabAddons) return;
  function probe(tag, data) {
    try { if (parent !== window) parent.postMessage(&quot;LABADDONS:&quot; + tag + &quot;:&quot; + JSON.stringify(data || {}), &quot;*&quot;); } catch (_) { /* noop */ }
  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,
      rect: w ? w.getBoundingClientRect().toJSON() : null,
      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight
    });
  });

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l &gt; 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g &lt; b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l, a: a };
  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;
    return c.a &gt;= 1 ? &quot;hsl(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%)&quot; : &quot;hsla(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%, &quot; + Math.round(c.a * 1000) / 1000 + &quot;)&quot;;
  }
  function isChromatic(c) {
    return c &amp;&amp; c.s &gt;= 0.14 &amp;&amp; c.a &gt; 0.04 &amp;&amp; c.l &gt; 0.02 &amp;&amp; c.l &lt; 0.98;
  }

  /* ---------- 主题颜色映射（色相族 → 主题色板槽位；保留原明度/透明度层次） ---------- */
  function buildMapper(option, theme) {
    var families = []; // {hue}
    collect(option);
    function collect(node) {
      if (node == null) return;
      if (typeof node === &quot;string&quot;) {
        var c = parseColor(node);
        if (isChromatic(c) &amp;&amp; familyOf(c.h) === -1) families.push({ hue: c.h });
        return;
      }
      if (Array.isArray(node)) { node.forEach(collect); return; }
      if (typeof node === &quot;object&quot;) {
        for (var k in node) {
          if (k === &quot;formatter&quot; || k === &quot;text&quot; || k === &quot;subtext&quot;) continue;
          collect(node[k]);
        }
      }
    }
    function familyOf(h) {
      for (var i = 0; i &lt; families.length; i++) if (hueDist(families[i].hue, h) &lt;= 26) return i;
      return -1;
    }
    var targets = theme.colors.map(parseColor);
    return function mapColorStr(str) {
      var c = parseColor(str);
      if (!isChromatic(c)) return str;
      var fi = familyOf(c.h);
      var t = targets[fi === -1 ? 0 : fi % targets.length];
      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });

  &lt;script&gt;

    function makeTasks(count, startDay) {
      const names = TASK_POOL.slice(0, count);
      let cursor = startDay + rnd(0, 14);
      return names.map((name) =&gt; {
        const start = Math.max(startDay, cursor + rnd(-5, 3));
        const len = rnd(10, 32);

        },
        yAxis: {
          type: &quot;category&quot;,
          data: rowNames,
          inverse: true,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: C.text, fontSize: extra.yFontSize || 11 },
          splitLine: { show: false }
        }
      };
    }

    function customSeries(items, renderItem, extra) {
      return Object.assign({
        type: &quot;custom&quot;,
        renderItem,
        encode: { x: [1, 2], y: 0 },
        data: items,
        clip: true
      }, extra || {});
    }

    /* ---------- 八方案 ---------- */
    const builders = {
      // 01 规范项目甘特：圆角任务条 + 条尾时长标注 + 起止 tooltip
      &quot;e6gt-standard&quot;: () =&gt; {
        const tasks = makeTasks(9, 0);
        const option = ganttBase(tasks.map((t) =&gt; t.name), timeSpan(tasks));
        option.series = [customSeries(
          toItems(tasks, (t, i) =&gt; ({ color: PALETTE[i % PALETTE.length] })),
          (params, api) =&gt; {
            const rect = barShape(params, api, 0.52);
            if (!rect) return null;
            const days = Math.round((api.value(2) - api.value(1)) / DAY);
            return {
              type: &quot;group&quot;,
              children: [
                { type: &quot;rect&quot;, shape: Object.assign({ r: 4 }, rect), style: api.style({ opacity: 0.92 }) },
                {
                  type: &quot;text&quot;,
                  silent: true,
                  style: {
                    text: `${days}天`, x: rect.x + rect.width + 6, y: rect.y + rect.height / 2,
                    fill: C.muted, fontSize: 10, verticalAlign: &quot;middle&quot;
                  }
                }
              ]
            };
          }
        )];
        return option;
      },

      // 02 进度着色：底层通长浅色 + 上层完成率实色，按完成率绿 / 黄 / 红
      &quot;e6gt-progress&quot;: () =&gt; {
        const tasks = makeTasks(9, 0);
        const option = ganttBase(tasks.map((t) =&gt; t.name), timeSpan(tasks), {
          tooltip: ganttTooltip((v) =&gt; `完成率 &lt;strong&gt;${v[3]}%&lt;/strong&gt;`)
        });
        option.series = [customSeries(
          toItems(tasks),
          (params, api) =&gt; {
            const rect = barShape(params, api, 0.55);
            if (!rect) return null;
            const p = api.value(3) / 100;
            const color = progressColor(api.value(3));
            const fillW = Math.max(rect.width * p, 0);
            const children = [
              { type: &quot;rect&quot;, shape: Object.assign({ r: 4 }, rect), style: { fill: color, opacity: 0.22 } },
              {
                type: &quot;rect&quot;,
                shape: { x: rect.x, y: rect.y, width: fillW, height: rect.height, r: 4 },
                style: { fill: color, opacity: 0.95 }
              },
              {
                type: &quot;text&quot;,
                silent: true,
                style: {
                  text: `${api.value(3)}%`, x: rect.x + rect.width + 6, y: rect.y + rect.height / 2,
                  fill: color, fontSize: 10, fontWeight: 600, verticalAlign: &quot;middle&quot;
                }
              }
            ];
            return { type: &quot;group&quot;, children };
          }
        )];
        return option;
      },

      // 03 里程碑标记：钢青任务条 + 菱形 scatter 关键节点 + 名称标签
      &quot;e6gt-milestone&quot;: () =&gt; {
        const tasks = makeTasks(8, 0);
        const msNames = [&quot;方案冻结&quot;, &quot;评审通过&quot;, &quot;版本发布&quot;];
        const picks = [1, 3, 6];
        const milestones = picks.map((idx, k) =&gt; ({
          name: msNames[k],
          value: [tasks[idx].end, idx]
        }));
        const option = ganttBase(tasks.map((t) =&gt; t.name), timeSpan(tasks));
        option.series = [
          customSeries(
            toItems(tasks, () =&gt; ({ color: C.steel })),
            (params, api) =&gt; {
              const rect = barShape(params, api, 0.5);
              return rect &amp;&amp; { type: &quot;rect&quot;, shape: Object.assign({ r: 4 }, rect), style: api.style({ opacity: 0.85 }) };
            }
          ),
          {
            type: &quot;scatter&quot;,
            symbol: &quot;diamond&quot;,
            symbolSize: 13,
            itemStyle: { color: C.amber, borderColor: &quot;#0a1e3c&quot;, borderWidth: 1, shadowBlur: 8, shadowColor: C.amber },
            label: {
              show: true, position: &quot;top&quot;, distance: 5,
              color: &quot;#ffe3a8&quot;, fontSize: 10, formatter: (p) =&gt; p.name
            },
            tooltip: {
              formatter: (p) =&gt; `&lt;strong&gt;里程碑 · ${p.name}&lt;/strong&gt;&lt;br/&gt;${fmtDate(p.value[0])} · ${tasks[p.value[1]].name}`
            },
            data: milestones,
            z: 12
          }
        ];
        return option;
      },

      // 04 今日线：dataIndex 0 附带绘制今日竖线；已结束任务淡显、进行与未来任务实显
      &quot;e6gt-today&quot;: () =&gt; {
        const tasks = makeTasks(10, 60);
        const option = ganttBase(tasks.map((t) =&gt; t.name), timeSpan(tasks), {
          tooltip: ganttTooltip((v) =&gt; (v[2] &lt; TODAY ? &quot;状态：已过今日基准&quot; : &quot;状态：进行中 / 未开始&quot;))
        });
        option.series = [customSeries(
          toItems(tasks, (t, i) =&gt; ({ color: PALETTE[i % PALETTE.length] })),
          (params, api) =&gt; {
            const rect = barShape(params, api, 0.52);
            if (!rect) return null;
            const past = api.value(2) &lt; TODAY;
            const children = [{
              type: &quot;rect&quot;,
              shape: Object.assign({ r: 4 }, rect),
              style: api.style({ opacity: past ? 0.28 : 0.95 })
            }];
            if (params.dataIndex === 0) {
              const mark = todayMark(params, api, C.amber);
              if (mark) children.push(mark);
            }
            return { type: &quot;group&quot;, children };
          }
        )];
        return option;
      },

      // 05 分组泳道：三个项目各三任务，renderItem 背景色带区分组，任务按组着色
      &quot;e6gt-swimlane&quot;: () =&gt; {
        const groups = [
          { name: &quot;项目A&quot;, color: C.cyan },
          { name: &quot;项目B&quot;, color: C.violet },
          { name: &quot;项目C&quot;, color: C.green }
        ];
        const rows = [];
        const tasks = [];
        groups.forEach((g, gi) =&gt; {
          const sub = makeTasks(3, gi * 25);
          sub.forEach((t, ti) =&gt; {
            rows.push(`${g.name} · ${t.name}`);
            tasks.push(Object.assign({ group: gi, row: gi * 3 + ti }, t));
          });
        });
        const option = ganttBase(rows, timeSpan(tasks), { yFontSize: 10 });
        const bandData = groups.map((g, gi) =&gt; ({ value: [gi * 3, gi * 3 + 2], gi }));
        option.series = [
          // 背景色带
          {
            type: &quot;custom&quot;,
            silent: true,
            z: 1,
            renderItem: (params, api) =&gt; {
              const y1 = api.coord([BASE, api.value(0)])[1];
              const rowH = api.size([0, 1])[1];
              const rowsCount = api.value(1) - api.value(0) + 1;
              return {
                type: &quot;rect&quot;,
                shape: {
                  x: params.coordSys.x, y: y1 - rowH / 2,
                  width: params.coordSys.width, height: rowsCount * rowH
                },
                style: { fill: groups[params.dataIndex].color, opacity: 0.07 }
              };
            },
            encode: { y: [0, 1] },
            data: bandData,
            tooltip: { show: false }
          },
          // 任务条
          customSeries(
            tasks.map((t) =&gt; ({
              name: `${groups[t.group].name} · ${t.name}`,
              value: [t.row, t.start, t.end, t.progress],
              itemStyle: { color: groups[t.group].color }
            })),
            (params, api) =&gt; {
              const rect = barShape(params, api, 0.5);
              return rect &amp;&amp; { type: &quot;rect&quot;, shape: Object.assign({ r: 4 }, rect), style: api.style({ opacity: 0.9 }) };
            },
            { z: 6 }
          )
        ];
        return option;
      },

      // 06 超期预警：计划结束早于今日且未完成 → 红填充红描边 + 「超期」角标；附今日红线
      &quot;e6gt-overdue&quot;: () =&gt; {
        const tasks = makeTasks(9, 90);
        // 保证至少两条超期演示：强制压前并压低完成率
        [1, 4].forEach((i) =&gt; {
          const len = rnd(12, 24);
          const start = rnd(95, 130);
          tasks[i].start = day(start);
          tasks[i].end = day(start + len);
          tasks[i].progress = rnd(20, 70);
        });
        const isOverdue = (t) =&gt; t.end &lt; TODAY &amp;&amp; t.progress &lt; 100;
        const option = ganttBase(tasks.map((t) =&gt; t.name), timeSpan(tasks), {
          tooltip: ganttTooltip((v, p) =&gt; {
            const t = tasks[p.dataIndex];
            return isOverdue(t)
              ? `&lt;span style=&quot;color:${C.red}&quot;&gt;已超期 ${Math.round((TODAY - t.end) / DAY)} 天 · 完成率 ${t.progress}%&lt;/span&gt;`
              : `完成率 ${t.progress}%`;
          })
        });
        option.series = [customSeries(
          toItems(tasks),
          (params, api) =&gt; {
            const rect = barShape(params, api, 0.52);
            if (!rect) return null;
            const t = tasks[params.dataIndex];
            const overdue = isOverdue(t);
            const children = [{
              type: &quot;rect&quot;,
              shape: Object.assign({ r: 4 }, rect),
              style: overdue
                ? { fill: &quot;rgba(255, 102, 128, 0.30)&quot;, stroke: C.red, lineWidth: 1.6 }
                : { fill: C.blue, opacity: 0.82 }
            }];
            if (overdue) {
              children.push({
                type: &quot;text&quot;,
                silent: true,
                style: {
                  text: &quot;超期&quot;, x: rect.x + rect.width + 5, y: rect.y + rect.height / 2 - 8,
                  fill: &quot;#fff&quot;, fontSize: 9, fontWeight: 600,
                  backgroundColor: C.red, padding: [2, 5], borderRadius: 3
                }
              });
            }
            if (params.dataIndex === 0) {
              const mark = todayMark(params, api, C.red);
              if (mark) children.push(mark);
            }
            return { type: &quot;group&quot;, children };
          }
        )];
        return option;
      },

      // 07 依赖箭头：链式任务 + renderItem 额外绘制前驱尾 → 后继头的折线与箭头
      &quot;e6gt-depend&quot;: () =&gt; {
        const tasks = makeChainTasks(7);
        const deps = [[0, 1], [1, 3], [2, 4], [4, 6]]; // [前驱, 后继]
        const option = ganttBase(tasks.map((t) =&gt; t.name), timeSpan(tasks));
        option.series = [customSeries(
          toItems(tasks, (t, i) =&gt; ({ color: PALETTE[i % PALETTE.length] })),
          (params, api) =&gt; {
            const rect = barShape(params, api, 0.48);
            if (!rect) return null;
            const children = [
              { type: &quot;rect&quot;, shape: Object.assign({ r: 4 }, rect), style: api.style({ opacity: 0.9 }) }
            ];
            if (params.dataIndex === 0) {
              deps.forEach(([a, b]) =&gt; {
                const from = api.coord([tasks[a].end, a]);
                const to = api.coord([tasks[b].start, b]);
                const elbowX = from[0] + 12;
                children.push({
                  type: &quot;polyline&quot;,
                  silent: true,
                  shape: { points: [[from[0], from[1]], [elbowX, from[1]], [elbowX, to[1]], [to[0] - 3, to[1]]] },
                  style: { stroke: &quot;rgba(63, 225, 255, 0.75)&quot;, lineWidth: 1.4, fill: &quot;none&quot;, lineDash: [4, 3] }
                });
                children.push({
                  type: &quot;polygon&quot;,
                  silent: true,
                  shape: { points: [[to[0] - 9, to[1] - 4.5], [to[0] - 9, to[1] + 4.5], [to[0] - 1, to[1]]] },
                  style: { fill: C.cyan }
                });
              });
            }
            return { type: &quot;group&quot;, children };
          }
        )];
        return option;
      },

      // 08 紧凑排班：12 台设备、细条密行、无标签，检修类别着色，详情靠 tooltip
      &quot;e6gt-compact&quot;: () =&gt; {
        const devices = Array.from({ length: 12 }, (_, i) =&gt; `${i + 1}号机组`);
        const types = [
          { name: &quot;大修&quot;, color: C.red },
          { name: &quot;小修&quot;, color: C.amber },
          { name: &quot;保养&quot;, color: C.green }
        ];
        const items = [];
        devices.forEach((dev, row) =&gt; {
          const windows = rnd(1, 2);
          let cursor = rnd(0, 60);
          for (let w = 0; w &lt; windows; w++) {
            const ti = rnd(0, 2);
            const len = ti === 0 ? rnd(14, 26) : ti === 1 ? rnd(6, 12) : rnd(3, 6);
            const start = cursor + rnd(4, 30);
            cursor = start + len + rnd(10, 40);
            items.push({
              name: dev,
              value: [row, day(start), day(start + len), ti]
            });
          }
        });
        const span = {
          min: Math.min(...items.map((it) =&gt; it.value[1])) - 4 * DAY,
          max: Math.max(...items.map((it) =&gt; it.value[2])) + 4 * DAY
        };
        const option = ganttBase(devices, span, {
          grid: { left: 64, right: 18, top: 10, bottom: 26 },
          yFontSize: 10,
          tooltip: ganttTooltip((v) =&gt; `检修类别：&lt;strong&gt;${types[v[3]].name}&lt;/strong&gt;`)
        });
        option.series = [customSeries(
          items,
          (params, api) =&gt; {
            const rect = barShape(params, api, 0.34);
            if (!rect) return null;
            const color = types[api.value(3)].color;
            return {
              type: &quot;rect&quot;,
              shape: Object.assign({ r: 2 }, rect),
              style: { fill: color, opacity: 0.88 }
            };
          }
        )];
        return option;
      },

      // 09 泳道流程编排：grid + 自定义系列，节点按环节分泳道、箭头串联（区别于时间轴甘特泳道）
      &quot;e6gt-flow&quot;: () =&gt; {
        const lanes = [&quot;受理登记&quot;, &quot;业务审核&quot;, &quot;领导复核&quot;, &quot;办结归档&quot;];
        const nodes = [
          { n: &quot;接件受理&quot;, x: 0, lane: 0 },
          { n: &quot;合规审查&quot;, x: 1, lane: 1 },
          { n: &quot;风险评估&quot;, x: 2, lane: 1 },
          { n: &quot;领导复核&quot;, x: 3, lane: 2 },
          { n: &quot;办结签发&quot;, x: 4, lane: 3 }
        ];
        const links = [[0, 1], [1, 2], [2, 3], [3, 4]];
        const nodeColor = (i) =&gt; PALETTE[i % PALETTE.length];
        function nodeAt(d) { return [d.x, d.lane]; }
        return {
          animation: false,
          grid: { left: 82, right: 22, top: 14, bottom: 14 },
          tooltip: {
            trigger: &quot;item&quot;, confine: true, backgroundColor: &quot;rgba(4,18,39,.96)&quot;,
            borderColor: &quot;rgba(72,215,255,.34)&quot;, borderWidth: 1, padding: [7, 9],
            textStyle: { color: C.text, fontSize: 11 },
            formatter: (p) =&gt; p.seriesIndex === 1 &amp;&amp; nodes[p.dataIndex] ? `${lanes[nodes[p.dataIndex].lane]}&lt;br&gt;&lt;strong&gt;${nodes[p.dataIndex].n}&lt;/strong&gt;` : &quot;&quot;
          },
          xAxis: { type: &quot;value&quot;, min: -0.6, max: 4.6, show: false },
          yAxis: {
            type: &quot;category&quot;, data: lanes, inverse: true,
            axisLine: { show: false }, axisTick: { show: false },
            axisLabel: { color: C.muted, fontSize: 11 },
            splitLine: { show: false },
            splitArea: { show: true, areaStyle: { color: [&quot;rgba(86,150,224,.05)&quot;, &quot;rgba(86,150,224,.11)&quot;] } }
          },
          series: [
            {
              type: &quot;custom&quot;, coordinateSystem: &quot;cartesian2d&quot;, silent: true, data: links,
              renderItem: (params, api) =&gt; {
                const link = links[params.dataIndex];
                const a = nodes[link[0]], b = nodes[link[1]];
                const pa = api.coord(nodeAt(a)), pb = api.coord(nodeAt(b));
                const w = api.size([1, 0])[0] * 0.82;
                const x1 = pa[0] + w / 2, y1 = pa[1], x2 = pb[0] - w / 2, y2 = pb[1];
                const mx = (x1 + x2) / 2;
                return {
                  type: &quot;group&quot;, children: [
                    { type: &quot;polyline&quot;, shape: { points: [[x1, y1], [mx, y1], [mx, y2], [x2, y2]] }, style: { stroke: &quot;rgba(111,204,236,.5)&quot;, lineWidth: 1.4, fill: &quot;none&quot; } },
                    { type: &quot;polygon&quot;, shape: { points: [[x2 - 8, y2 - 4.5], [x2, y2], [x2 - 8, y2 + 4.5]] }, style: { fill: &quot;rgba(111,204,236,.72)&quot; } }
                  ]
                };
              }
            },
            {
              type: &quot;custom&quot;, coordinateSystem: &quot;cartesian2d&quot;,
              data: nodes.map((d) =&gt; [d.x, d.lane]),
              renderItem: (params, api) =&gt; {
                const d = nodes[params.dataIndex];
                const c = api.coord([api.value(0), api.value(1)]);
                const w = api.size([1, 0])[0] * 0.82, h = api.size([0, 1])[1] * 0.46;
                const col = nodeColor(params.dataIndex);
                return {
                  type: &quot;group&quot;, children: [
                    { type: &quot;rect&quot;, shape: { x: c[0] - w / 2, y: c[1] - h / 2, width: w, height: h, r: 7 }, style: { fill: &quot;rgba(19,50,94,.92)&quot;, stroke: col, lineWidth: 1.4, shadowColor: col + &quot;66&quot;, shadowBlur: 9 } },
                    { type: &quot;text&quot;, silent: true, style: { text: d.n, x: c[0], y: c[1], fill: &quot;#eaf6ff&quot;, fontSize: 11, align: &quot;center&quot;, verticalAlign: &quot;middle&quot; } }
                  ]
                };
              }
            }
          ]
        };
      }
    };

    /* ---------- 渲染与控制 ---------- */
    const charts = {};
    function renderAll() {
      Object.entries(builders).forEach(([id, build]) =&gt; {
        const element = document.getElementById(id);
        if (!element) return;
        if (!charts[id]) charts[id] = echarts.init(element, null, { renderer: &quot;canvas&quot; });
        charts[id].setOption(build(), { notMerge: true, lazyUpdate: false });
      });
    }

    const refreshButton = document.getElementById(&quot;e6gt-refresh&quot;);
    const motionButton = document.getElementById(&quot;e6gt-motion&quot;);

    refreshButton.addEventListener(&quot;click&quot;, () =&gt; {
      renderAll();
    });

    function syncMotionButton() {
      motionButton.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionButton.textContent = motionEnabled ? &quot;更新动效：开&quot; : &quot;更新动效：关&quot;;
    }

    motionButton.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      syncMotionButton();
      renderAll();
    });

    reducedMotion.addEventListener?.(&quot;change&quot;, (event) =&gt; {
      if (event.matches) {
        motionEnabled = false;
        syncMotionButton();
        renderAll();
      }
    });

    let resizeFrame = 0;
    const resizeCharts = () =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() =&gt; Object.values(charts).forEach((chart) =&gt; chart.resize()));
    };
    if (&quot;ResizeObserver&quot; in window) {
      new ResizeObserver(resizeCharts).observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    syncMotionButton();
    renderAll();
  })();
  &lt;/script&gt;
