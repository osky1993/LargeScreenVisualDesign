&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {

  }

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l &gt; 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g &lt; b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l, a: a };
  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;
    return c.a &gt;= 1 ? &quot;hsl(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%)&quot; : &quot;hsla(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%, &quot; + Math.round(c.a * 1000) / 1000 + &quot;)&quot;;
  }
  function isChromatic(c) {
    return c &amp;&amp; c.s &gt;= 0.14 &amp;&amp; c.a &gt; 0.04 &amp;&amp; c.l &gt; 0.02 &amp;&amp; c.l &lt; 0.98;
  }

  /* ---------- 主题颜色映射（色相族 → 主题色板槽位；保留原明度/透明度层次） ---------- */
  function buildMapper(option, theme) {
    var families = []; // {hue}
    collect(option);
    function collect(node) {
      if (node == null) return;
      if (typeof node === &quot;string&quot;) {
        var c = parseColor(node);
        if (isChromatic(c) &amp;&amp; familyOf(c.h) === -1) families.push({ hue: c.h });
        return;
      }
      if (Array.isArray(node)) { node.forEach(collect); return; }
      if (typeof node === &quot;object&quot;) {
        for (var k in node) {
          if (k === &quot;formatter&quot; || k === &quot;text&quot; || k === &quot;subtext&quot;) continue;
          collect(node[k]);
        }
      }
    }
    function familyOf(h) {
      for (var i = 0; i &lt; families.length; i++) if (hueDist(families[i].hue, h) &lt;= 26) return i;
      return -1;
    }
    var targets = theme.colors.map(parseColor);
    return function mapColorStr(str) {
      var c = parseColor(str);
      if (!isChromatic(c)) return str;
      var fi = familyOf(c.h);
      var t = targets[fi === -1 ? 0 : fi % targets.length];
      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });
    };
  }

  function mapOption(option, theme) {
    var mapColor = buildMapper(option, theme);
    function walk(node, key) {
      if (node == null || typeof node === &quot;function&quot;) return node;
      if (typeof node === &quot;object&quot; &amp;&amp; (node.nodeType || node.getContext)) return node; // DOM/canvas 纹理等原样保留
      if (typeof node === &quot;string&quot;) {
        if (key === &quot;formatter&quot; || key === &quot;text&quot; || key === &quot;subtext&quot;) return node;
        return parseColor(node) ? mapColor(node) : node;
      }
      if (Array.isArray(node)) return node.map(function (v) { return walk(v, key); });
      if (typeof node === &quot;object&quot;) {
        var out = {};
        for (var k in node) out[k] = walk(node[k], k);

      }
      return node;
    }
    return walk(option, null);

  /* ---------- echarts.init / setOption 拦截 ---------- */
  var realInit = echarts.init.bind(echarts);
  echarts.init = function (dom, theme, opts) {
    var chart = realInit(dom, theme, opts);
    if (!dom || !chart) return chart;
    chart.__vizDom = dom;
    registry.add(chart);
    var realSet = chart.setOption.bind(chart);
    chart.__vizRealSetOption = realSet;
    chart.setOption = function (opt) {
      var rest = Array.prototype.slice.call(arguments, 1);
      if (opt &amp;&amp; opt.series) dom.__vizRaw = opt;
      var shown = activeTheme &amp;&amp; opt ? mapOption(opt, activeTheme) : opt;
      if (opt &amp;&amp; opt.series) dom.__vizShown = shown;
      return realSet.apply(null, [shown].concat(rest));
    };
    return chart;
  };

  /* ---------- 主题应用 ---------- */
  var stageEls = null;
  function findStageEls() {
    // 全屏级不透明底色容器（各实验室的&quot;舞台&quot;div），换主题时一并换底
    var out = [];
    var vw = window.innerWidth, vh = window.innerHeight;
    var candidates = document.body.querySelectorAll(&quot;:scope &gt; *, :scope &gt; * &gt; *&quot;);
    candidates.forEach(function (el) {
      if (el.id === &quot;lab-theme-widget&quot; || el.id === &quot;lab-copy-modal&quot;) return;
      if (el.offsetWidth &lt; vw * 0.9 || el.offsetHeight &lt; vh * 0.6) return;
      var c = parseColor(getComputedStyle(el).backgroundColor);
      if (c &amp;&amp; c.a &gt; 0.5) out.push({ el: el, orig: el.style.getPropertyValue(&quot;background-color&quot;) });
    });
    return out;
  }

  function applyTheme(theme) {
    activeTheme = theme;
    var root = document.documentElement;
    if (!stageEls) stageEls = findStageEls();
    stageEls.forEach(function (s) {
      if (theme &amp;&amp; theme.bg) s.el.style.setProperty(&quot;background-color&quot;, theme.bg, &quot;important&quot;);
      else if (s.orig) s.el.style.setProperty(&quot;background-color&quot;, s.orig);
      else s.el.style.removeProperty(&quot;background-color&quot;);
    });
    for (var i = 1; i &lt;= 6; i++) {
      if (theme &amp;&amp; theme.colors[i - 1]) root.style.setProperty(&quot;--viz-series-&quot; + i, theme.colors[i - 1]);
      else root.style.removeProperty(&quot;--viz-series-&quot; + i);
    }
    if (theme &amp;&amp; theme.colors[0]) root.style.setProperty(&quot;--primary&quot;, theme.colors[0]);
    else root.style.removeProperty(&quot;--primary&quot;);
    if (theme &amp;&amp; theme.bg) {
      root.style.setProperty(&quot;--background&quot;, theme.bg);
      root.style.setProperty(&quot;--lab-bg&quot;, theme.bg);
      root.classList.add(&quot;lab-themed&quot;);
    } else {
      root.style.removeProperty(&quot;--background&quot;);
      root.style.removeProperty(&quot;--lab-bg&quot;);
      root.classList.remove(&quot;lab-themed&quot;);
    }
    registry.forEach(function (chart) {
      if (chart.isDisposed &amp;&amp; chart.isDisposed()) { registry.delete(chart); return; }
      var raw = chart.__vizDom &amp;&amp; chart.__vizDom.__vizRaw;
      if (raw) chart.setOption(raw, { notMerge: true });
    });
  }

  /* ---------- 复制配置 ---------- */
  function serializeJS(value, indent) {
    var pad = &quot;  &quot;.repeat(indent), padIn = &quot;  &quot;.repeat(indent + 1);
    if (value === null) return &quot;null&quot;;
    if (value === undefined) return &quot;undefined&quot;;
    var t = typeof value;
    if (t === &quot;number&quot; || t === &quot;boolean&quot;) return String(value);
    if (t === &quot;string&quot;) return JSON.stringify(value);
    if (t === &quot;function&quot;) {
      return String(value).split(&quot;\n&quot;).map(function (line, i) { return i === 0 ? line : padIn + line.trim(); }).join(&quot;\n&quot;);
    }
    if (Array.isArray(value)) {
      if (!value.length) return &quot;[]&quot;;
      var flat = value.every(function (v) { return v === null || [&quot;number&quot;, &quot;string&quot;, &quot;boolean&quot;].indexOf(typeof v) !== -1; });
      var items = value.map(function (v) { return serializeJS(v, indent + 1); });
      if (flat &amp;&amp; items.join(&quot;, &quot;).length &lt; 100) return &quot;[&quot; + items.join(&quot;, &quot;) + &quot;]&quot;;
      return &quot;[\n&quot; + items.map(function (s) { return padIn + s; }).join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;]&quot;;
    }
    if (t === &quot;object&quot;) {
      var keys = Object.keys(value).filter(function (k) { return value[k] !== undefined; });
      if (!keys.length) return &quot;{}&quot;;
      var body = keys.map(function (k) {
        var key = /^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k);
        return padIn + key + &quot;: &quot; + serializeJS(value[k], indent + 1);
      });
      return &quot;{\n&quot; + body.join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;}&quot;;
    }
    return &quot;null&quot;;
  }

  function copyText(text, done) {
    if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {

    } else legacyCopy(text, done);
  }
  function legacyCopy(text, done) {
    try {
      var ta = document.createElement(&quot;textarea&quot;);
      ta.value = text;
      ta.style.cssText = &quot;position:fixed;left:-9999px;top:0&quot;;
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand(&quot;copy&quot;);
      ta.remove();
      if (ok) return done(true);
    } catch (e) { /* fall through */ }
    showModal(text);
    done(false);
  }
  function showModal(text) {
    var old = document.getElementById(&quot;lab-copy-modal&quot;);
    if (old) old.remove();
    var wrap = document.createElement(&quot;div&quot;);
    wrap.id = &quot;lab-copy-modal&quot;;
    wrap.innerHTML =
      &#x27;&lt;div class=&quot;lab-copy-mask&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lab-copy-box&quot;&gt;&lt;p&gt;自动复制受限，请手动全选复制：&lt;/p&gt;&#x27; +
      &#x27;&lt;textarea readonly&gt;&lt;/textarea&gt;&lt;button type=&quot;button&quot;&gt;关闭&lt;/button&gt;&lt;/div&gt;&#x27;;
    wrap.querySelector(&quot;textarea&quot;).value = text;
    wrap.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    wrap.querySelector(&quot;.lab-copy-mask&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    document.body.appendChild(wrap);
    wrap.querySelector(&quot;textarea&quot;).select();
  }

  function schemeTitle(head) {
    var el = head.querySelector(&quot;h1,h2,h3,h4&quot;);
    return el ? el.textContent.trim() : &quot;方案&quot;;
  }

  function onCopyClick(btn, head) {
    var card = head.parentElement;
    var chartNode = card ? card.querySelector(config.chartSelector) : null;
    var opt = chartNode &amp;&amp; (chartNode.__vizShown || chartNode.__vizRaw);
    if (!opt) { flash(btn, &quot;图表未渲染&quot;); return; }
    var text = &quot;/* 方案：&quot; + schemeTitle(head) + &quot; · ECharts 6.1.0&quot; +
      (activeTheme ? &quot; · 主题：&quot; + activeTheme.name : &quot;&quot;) +
      &quot; · 用法：echarts.init(dom).setOption(option) */\n&quot; +
      &quot;const option = &quot; + serializeJS(opt, 0) + &quot;;\n&quot;;
    copyText(text, function (ok) { flash(btn, ok ? &quot;已复制&quot; : &quot;见弹窗&quot;); });
  }
  function flash(btn, msg) {

    btn.disabled = true;
    setTimeout(function () { btn.textContent = origin; btn.disabled = false; }, 1200);
  }

  var injectQueued = false;
  function injectButtons() {
    if (!config.headSelector) return;

      if (!card || !card.querySelector(config.chartSelector)) return;

      btn.type = &quot;button&quot;;
      btn.className = &quot;lab-copy-btn&quot;;
      btn.textContent = &quot;复制配置&quot;;
      btn.dataset.label = &quot;复制配置&quot;;
      btn.addEventListener(&quot;click&quot;, function () { onCopyClick(btn, head); });
      head.appendChild(btn);

  }
  function queueInject() {
    if (injectQueued) return;
    injectQueued = true;
    setTimeout(function () { injectQueued = false; injectButtons(); }, 120);
  }

  /* ---------- 主题切换悬浮组件 ---------- */
  function buildWidget() {
    var wrap = document.createElement(&quot;div&quot;);
    wrap.id = &quot;lab-theme-widget&quot;;
    var groups = { &quot;行业&quot;: [], &quot;风格&quot;: [] };
    allThemes().forEach(function (t) { (groups[t.group] = groups[t.group] || []).push(t); });
    var optionsHtml = Object.keys(groups).map(function (g) {
      return &#x27;&lt;optgroup label=&quot;&#x27; + (g === &quot;行业&quot; ? &quot;行业主题&quot; : &quot;风格皮肤&quot;) + &#x27;&quot;&gt;&#x27; +
        groups[g].map(function (t) { return &#x27;&lt;option value=&quot;&#x27; + t.id + &#x27;&quot;&gt;&#x27; + t.name + &quot; · &quot; + t.use + &quot;&lt;/option&gt;&quot;; }).join(&quot;&quot;) +
        &quot;&lt;/optgroup&gt;&quot;;
    }).join(&quot;&quot;);
    wrap.innerHTML =
      &#x27;&lt;span class=&quot;lab-theme-label&quot;&gt;配色主题&lt;/span&gt;&#x27; +
      &#x27;&lt;select aria-label=&quot;切换配色主题&quot;&gt;&lt;option value=&quot;&quot;&gt;默认（原始配色）&lt;/option&gt;&#x27; + optionsHtml + &quot;&lt;/select&gt;&quot; +
      &#x27;&lt;button type=&quot;button&quot;&gt;还原&lt;/button&gt;&#x27;;
    var select = wrap.querySelector(&quot;select&quot;);
    select.addEventListener(&quot;change&quot;, function () {
      var theme = allThemes().find(function (t) { return t.id === select.value; }) || null;
      applyTheme(theme);
    });
    wrap.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, function () {
      select.value = &quot;&quot;;
      applyTheme(null);
    });
    // 沙箱 srcdoc iframe 对悬浮定位层绘制不可靠，工具栏内嵌又易被局部布局裁剪，
    // 统一采用顶部独立横条（文档流内、全宽，绘制稳定）。
    document.body.insertBefore(wrap, document.body.firstChild);
  }

  function injectStyles() {
    var css =
      &quot;html.lab-themed{background:var(--lab-bg) !important;background-color:var(--lab-bg) !important}&quot; +
      &quot;html.lab-themed body{background:var(--lab-bg) !important}&quot; +
      &quot;html.lab-themed body::before,html.lab-themed body::after{opacity:.22}&quot; +
      &quot;.lab-copy-btn{margin-left:8px;flex:none;font:inherit;font-size:11px;line-height:1;padding:5px 9px;border-radius:999px;&quot; +
      &quot;border:1px solid rgba(140,190,255,.4);background:rgba(40,90,160,.28);color:#cfe6ff;cursor:pointer;white-space:nowrap}&quot; +
      &quot;.lab-copy-btn:hover{background:rgba(70,130,210,.45)}.lab-copy-btn:disabled{opacity:.85;cursor:default}&quot; +
      &quot;#lab-theme-widget{display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:8px 24px;&quot; +
      &quot;border-bottom:1px solid rgba(140,190,255,.18);background:rgba(8,22,45,.6);font-size:12px;color:#cfe6ff;white-space:nowrap}&quot; +
      &quot;#lab-theme-widget select{max-width:170px;font:inherit;padding:4px 6px;border-radius:8px;border:1px solid rgba(140,190,255,.4);&quot; +
      &quot;background:rgba(15,35,70,.9);color:#e6f2ff}&quot; +
      &quot;#lab-theme-widget button{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid rgba(140,190,255,.4);&quot; +
      &quot;background:rgba(40,90,160,.3);color:#cfe6ff;cursor:pointer}&quot; +

        var w = document.getElementById(&quot;lab-theme-widget&quot;);

      if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, boot);

  &lt;script&gt;
  (() =&gt; {
    &quot;use strict&quot;;
    const errorNode = document.getElementById(&quot;e6mx-error&quot;);
    if (!window.echarts) {
      errorNode.classList.add(&quot;is-visible&quot;);
      return;
    }

    const C = {
      text: &quot;#e6f1ff&quot;, muted: &quot;#8fa7c8&quot;,
      cyan: &quot;#3fe1ff&quot;, blue: &quot;#4b7dff&quot;, violet: &quot;#9870ff&quot;, green: &quot;#38e6b0&quot;,
      amber: &quot;#ffc857&quot;, red: &quot;#ff6680&quot;, orange: &quot;#ff9360&quot;, steel: &quot;#6f8fb5&quot;, pink: &quot;#e96bb5&quot;
    };
    const SERIES6 = [&quot;#3fe1ff&quot;, &quot;#4b7dff&quot;, &quot;#38e6b0&quot;, &quot;#ffc857&quot;, &quot;#9870ff&quot;, &quot;#ff9360&quot;, &quot;#e96bb5&quot;, &quot;#6f8fb5&quot;];
    const AXIS_LINE = &quot;rgba(86, 150, 224, 0.35)&quot;;
    const SPLIT_LINE = &quot;rgba(86, 150, 224, 0.14)&quot;;

    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
    let motionEnabled = !reducedMotion.matches;

    function rnd(min, max) { return Math.round(min + Math.random() * (max - min)); }
    function rndf(min, max, digits) {
      const p = Math.pow(10, digits == null ? 1 : digits);
      return Math.round((min + Math.random() * (max - min)) * p) / p;
    }
    function relativeDiff(actual, base) {
      if (typeof base !== &quot;number&quot; || !isFinite(base) || base === 0) return null;
      return (actual - base) / Math.abs(base);
    }
    function setNote(id, text) {
      const node = document.getElementById(id);
      if (node) node.textContent = text || &quot;&quot;;
    }

    function baseOption(trigger) {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 600 : 0,
        animationDurationUpdate: motionEnabled ? 400 : 0,
        animationEasing: &quot;cubicOut&quot;,
        tooltip: {
          trigger: trigger || &quot;item&quot;,
          confine: true,
          backgroundColor: &quot;rgba(9, 24, 48, 0.92)&quot;,
          borderColor: &quot;rgba(102, 178, 255, 0.4)&quot;,
          textStyle: { color: &quot;#dcedff&quot;, fontSize: 12 }
        }
      };
    }

    // 多 grid 布局：把 n 个面板排进 cols 列，返回每格的百分比矩形
    function gridRects(n, cols, opts) {
      opts = opts || {};
      const rows = Math.ceil(n / cols);
      const padL = opts.padL != null ? opts.padL : 5;
      const padR = opts.padR != null ? opts.padR : 2.5;
      const padT = opts.padT != null ? opts.padT : 9;
      const padB = opts.padB != null ? opts.padB : 9;
      const gapX = opts.gapX != null ? opts.gapX : 4.5;
      const gapY = opts.gapY != null ? opts.gapY : 12;
      const w = (100 - padL - padR - (cols - 1) * gapX) / cols;
      const h = (100 - padT - padB - (rows - 1) * gapY) / rows;
      const rects = [];
      for (let i = 0; i &lt; n; i++) {
        const r = Math.floor(i / cols), c = i % cols;
        rects.push({
          left: padL + c * (w + gapX),
          top: padT + r * (h + gapY),
          width: w,
          height: h
        });
      }
      return rects;
    }
    function pct(v) { return Math.round(v * 100) / 100 + &quot;%&quot;; }
    function panelTitle(text, rect, extra) {
      return Object.assign({
        text,
        left: pct(rect.left),
        top: pct(Math.max(rect.top - 6.5, 0)),
        textStyle: { color: &quot;#bfe0ff&quot;, fontSize: 11, fontWeight: 600 }
      }, extra || {});
    }
    function miniCatAxis(gridIndex, data, extra) {
      return Object.assign({
        type: &quot;category&quot;, gridIndex, data,
        axisLine: { lineStyle: { color: AXIS_LINE } },
        axisTick: { show: false },
        axisLabel: { color: C.muted, fontSize: 9 }
      }, extra || {});
    }
    function miniValAxis(gridIndex, extra) {
      return Object.assign({
        type: &quot;value&quot;, gridIndex,
        axisLine: { show: false },
        axisLabel: { color: C.muted, fontSize: 9 },
        splitLine: { lineStyle: { color: SPLIT_LINE } }
      }, extra || {});
    }

    /* ---------- M01 KPI 趋势矩阵 ---------- */
    const M01_ORGS = [&quot;苏南分部&quot;, &quot;苏中分部&quot;, &quot;苏北分部&quot;, &quot;沿江分部&quot;, &quot;沿海分部&quot;, &quot;环湖分部&quot;,
      &quot;山北分部&quot;, &quot;山南分部&quot;, &quot;河东分部&quot;, &quot;河西分部&quot;, &quot;江左分部&quot;, &quot;江右分部&quot;,
      &quot;临港分部&quot;, &quot;空港分部&quot;, &quot;陆港分部&quot;, &quot;云谷分部&quot;, &quot;光谷分部&quot;, &quot;声谷分部&quot;,
      &quot;数港分部&quot;, &quot;智港分部&quot;, &quot;药谷分部&quot;, &quot;车谷分部&quot;, &quot;纺城分部&quot;, &quot;钢城分部&quot;,
      &quot;煤城分部&quot;, &quot;油城分部&quot;, &quot;盐城分部&quot;, &quot;渔港分部&quot;, &quot;林区分部&quot;, &quot;牧区分部&quot;,
      &quot;矿区分部&quot;, &quot;库区分部&quot;, &quot;湖区分部&quot;, &quot;山区分部&quot;, &quot;岛区分部&quot;, &quot;湾区分部&quot;];
    const M01_MONTHS = [&quot;1月&quot;, &quot;2月&quot;, &quot;3月&quot;, &quot;4月&quot;, &quot;5月&quot;, &quot;6月&quot;, &quot;7月&quot;, &quot;8月&quot;, &quot;9月&quot;, &quot;10月&quot;, &quot;11月&quot;, &quot;12月&quot;];
    let m01Count = 12, m01Page = 0, m01Shared = true, m01Data = null;
    function makeM01Data() {
      m01Data = M01_ORGS.map((name, idx) =&gt; {
        const base = rnd(400, 1300);
        return {
          name,
          values: M01_MONTHS.map((m, i) =&gt; {
            if (idx === 2 &amp;&amp; (i === 5 || i === 6)) return null; // 缺失样例：断开不补 0
            return Math.max(60, Math.round(base + i * rnd(-14, 34) + rnd(-90, 90)));
          })
        };
      });
    }
    function buildM01() {
      if (!m01Data) makeM01Data();
      const pageSize = 24;
      const totalPages = Math.ceil(m01Count / pageSize);
      if (m01Page &gt;= totalPages) m01Page = 0;
      const slice = m01Data.slice(0, m01Count).slice(m01Page * pageSize, m01Page * pageSize + pageSize);
      const n = slice.length;
      const cols = n &lt;= 1 ? 1 : n &lt;= 4 ? 2 : n &lt;= 12 ? 4 : 6;
      const rects = gridRects(n, cols, { gapY: n &gt; 12 ? 14 : 12 });
      let lo = Infinity, hi = -Infinity;
      slice.forEach((o) =&gt; o.values.forEach((v) =&gt; { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
      const pad = (hi - lo) * 0.08;
      const opt = Object.assign(baseOption(&quot;axis&quot;), {
        axisPointer: { link: [{ xAxisIndex: &quot;all&quot; }], label: { backgroundColor: &quot;rgba(33, 76, 133, 0.9)&quot; } },
        title: slice.map((o, i) =&gt; panelTitle(o.name, rects[i])),
        grid: rects.map((r) =&gt; ({ left: pct(r.left), top: pct(r.top), width: pct(r.width), height: pct(r.height) })),
        xAxis: slice.map((o, i) =&gt; miniCatAxis(i, M01_MONTHS, { axisLabel: { color: C.muted, fontSize: 8, interval: n &gt; 12 ? 5 : 2 } })),
        yAxis: slice.map((o, i) =&gt; miniValAxis(i, m01Shared ? { min: Math.floor(lo - pad), max: Math.ceil(hi + pad) } : { scale: true })),
        tooltip: Object.assign(baseOption(&quot;axis&quot;).tooltip, {
          trigger: &quot;axis&quot;,
          formatter: function (list) {
            var arr = Array.isArray(list) ? list : [list];
            if (!arr.length) return &quot;&quot;;
            var lines = [arr[0].name];
            arr.forEach(function (p) {
              lines.push(p.seriesName + &quot;：&quot; + (p.value == null ? &quot;缺失&quot; : p.value + &quot; 万元&quot;));
            });
            return lines.join(&quot;&lt;br/&gt;&quot;);
          }
        }),
        series: slice.map((o, i) =&gt; ({
          name: o.name, type: &quot;line&quot;, xAxisIndex: i, yAxisIndex: i,
          data: o.values, connectNulls: false, symbol: &quot;circle&quot;, symbolSize: 3,
          lineStyle: { width: 1.6, color: &quot;#3fe1ff&quot; }, itemStyle: { color: &quot;#3fe1ff&quot; }
        }))
      });
      document.getElementById(&quot;e6mx-m01-page&quot;).hidden = totalPages &lt;= 1;
      setNote(&quot;e6mx-m01-note&quot;,
        (m01Shared ? &quot;&quot; : &quot;注意：当前为独立尺度，各卡 Y 轴范围不同，不可直接跨卡比较绝对高度。&quot;) +
        (totalPages &gt; 1 ? &quot; 第 &quot; + (m01Page + 1) + &quot;/&quot; + totalPages + &quot; 页（每页最多 24 面板）。&quot; : &quot;&quot;));
      return opt;
    }

    /* ---------- M02 机构柱图矩阵 ---------- */
    function buildM02() {
      const cats = [&quot;存款&quot;, &quot;贷款&quot;, &quot;中间业务&quot;, &quot;投资&quot;, &quot;调整项&quot;];
      const orgs = [&quot;城东支行&quot;, &quot;城西支行&quot;, &quot;城南支行&quot;, &quot;城北支行&quot;, &quot;高新支行&quot;, &quot;临港支行&quot;, &quot;科教支行&quot;, &quot;湖滨支行&quot;].map((name) =&gt; {
        const vals = [rnd(300, 900), rnd(260, 800), rnd(80, 300), rnd(60, 260), rnd(-120, 60)];
        return { name, vals, total: vals.reduce((a, b) =&gt; a + b, 0) };
      });
      orgs.sort((a, b) =&gt; b.total - a.total);
      const n = orgs.length;
      const rects = gridRects(n, 4, { gapY: 16 });
      let lo = 0, hi = -Infinity;
      orgs.forEach((o) =&gt; o.vals.forEach((v) =&gt; { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
      return Object.assign(baseOption(&quot;item&quot;), {
        legend: { top: 0, data: cats, icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, textStyle: { color: C.muted, fontSize: 10 } },
        title: orgs.map((o, i) =&gt; panelTitle(o.name + &quot; · 合计 &quot; + o.total, rects[i], { textStyle: { color: &quot;#bfe0ff&quot;, fontSize: 10, fontWeight: 600 } })),
        grid: rects.map((r) =&gt; ({ left: pct(r.left), top: pct(r.top + 3), width: pct(r.width), height: pct(r.height - 3) })),
        xAxis: orgs.map((o, i) =&gt; miniCatAxis(i, cats, { axisLabel: { show: false } })),
        yAxis: orgs.map((o, i) =&gt; miniValAxis(i, { min: Math.floor(lo * 1.1), max: Math.ceil(hi * 1.08) })),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) { return p.seriesName + &quot;&lt;br/&gt;&quot; + p.name + &quot;：&quot; + p.value + &quot; 万元&quot;; }
        }),
        series: orgs.map((o, i) =&gt; ({
          name: o.name, type: &quot;bar&quot;, xAxisIndex: i, yAxisIndex: i, barWidth: &quot;62%&quot;,
          data: o.vals.map((v, k) =&gt; ({ value: v, name: cats[k], itemStyle: { color: SERIES6[k], opacity: v &lt; 0 ? 0.65 : 0.9 } })),
          tooltip: { formatter: function (p) { return p.seriesName + &quot;&lt;br/&gt;&quot; + p.name + &quot;：&quot; + p.value + &quot; 万元&quot;; } }
        })).concat([{
          // 仅用于图例的分类占位系列（不渲染数据）
          name: cats[0], type: &quot;bar&quot;, data: [], itemStyle: { color: SERIES6[0] }
        }, { name: cats[1], type: &quot;bar&quot;, data: [], itemStyle: { color: SERIES6[1] } },
        { name: cats[2], type: &quot;bar&quot;, data: [], itemStyle: { color: SERIES6[2] } },
        { name: cats[3], type: &quot;bar&quot;, data: [], itemStyle: { color: SERIES6[3] } },
        { name: cats[4], type: &quot;bar&quot;, data: [], itemStyle: { color: SERIES6[4] } }])
      });
    }

    /* ---------- M03 实际—目标子弹矩阵（复用 T3 子弹原子实现，多 grid 化） ---------- */
    function buildM03() {
      const units = [&quot;一分公司&quot;, &quot;二分公司&quot;, &quot;三分公司&quot;, &quot;四分公司&quot;, &quot;五分公司&quot;, &quot;六分公司&quot;, &quot;七分公司&quot;, &quot;八分公司&quot;, &quot;九分公司&quot;];
      const rows = units.map((name) =&gt; {
        const target = rnd(500, 980);
        const actual = Math.round(target * rndf(0.6, 1.2, 2));
        return { name, actual, target, zones: [Math.round(target * 0.6), Math.round(target * 0.85), Math.round(target * 1.05)] };
      });
      const n = rows.length;
      const rects = gridRects(n, 3, { gapY: 15 });
      const maxVal = Math.max.apply(null, rows.map((r) =&gt; Math.max(r.zones[2], r.actual, r.target))) * 1.06;
      const series = [];
      rows.forEach((r, i) =&gt; {
        const diff = r.actual - r.target;
        const rate = relativeDiff(r.actual, r.target);
        const meta = [r.name, r.actual, r.target, diff, rate == null ? null : Math.round((r.actual / r.target) * 1000) / 10, diff &gt;= 0 ? &quot;已达标&quot; : &quot;未达标&quot;];
        series.push(
          { type: &quot;bar&quot;, xAxisIndex: i, yAxisIndex: i, stack: &quot;z&quot; + i, silent: true, barWidth: 14, data: [r.zones[0]], itemStyle: { color: &quot;rgba(111, 143, 181, 0.34)&quot; }, tooltip: { show: false } },
          { type: &quot;bar&quot;, xAxisIndex: i, yAxisIndex: i, stack: &quot;z&quot; + i, silent: true, barWidth: 14, data: [r.zones[1] - r.zones[0]], itemStyle: { color: &quot;rgba(111, 143, 181, 0.22)&quot; }, tooltip: { show: false } },
          { type: &quot;bar&quot;, xAxisIndex: i, yAxisIndex: i, stack: &quot;z&quot; + i, silent: true, barWidth: 14, data: [r.zones[2] - r.zones[1]], itemStyle: { color: &quot;rgba(111, 143, 181, 0.12)&quot; }, tooltip: { show: false } },
          {
            type: &quot;bar&quot;, xAxisIndex: i, yAxisIndex: i, barWidth: 6, barGap: &quot;-71%&quot;, z: 5,
            data: [{ value: r.actual, mxMeta: meta }],
            itemStyle: { color: diff &gt;= 0 ? &quot;#38e6b0&quot; : &quot;#3fe1ff&quot;, borderRadius: [0, 3, 3, 0] },
            tooltip: {
              formatter: function (p) {
                var m = p.data.mxMeta;
                return m[0] + &quot;&lt;br/&gt;实际：&quot; + m[1] + &quot;&lt;br/&gt;目标：&quot; + m[2] + &quot;&lt;br/&gt;差额：&quot; + (m[3] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + m[3] +
                  &quot;&lt;br/&gt;完成率：&quot; + (m[4] == null ? &quot;不可计算&quot; : m[4] + &quot;%&quot;) + &quot;&lt;br/&gt;状态：&quot; + m[5];
              }
            }
          },
          {
            type: &quot;scatter&quot;, xAxisIndex: i, yAxisIndex: i, symbol: &quot;rect&quot;, symbolSize: [3, 20], z: 6,
            data: [{ value: [r.target, 0], mxMeta: meta }],
            itemStyle: { color: &quot;#ffc857&quot; },
            tooltip: { formatter: function (p) { return p.data.mxMeta[0] + &quot;&lt;br/&gt;目标：&quot; + p.data.mxMeta[2]; } }
          }
        );
      });
      return Object.assign(baseOption(&quot;item&quot;), {
        title: rows.map((r, i) =&gt; panelTitle(r.name + (r.actual &gt;= r.target ? &quot; ✓&quot; : &quot;&quot;), rects[i])),
        grid: rects.map((r) =&gt; ({ left: pct(r.left), top: pct(r.top), width: pct(r.width), height: pct(r.height) })),
        xAxis: rows.map((r, i) =&gt; miniValAxis(i, { min: 0, max: Math.round(maxVal), axisLabel: { show: false }, splitLine: { show: false } })),
        yAxis: rows.map((r, i) =&gt; miniCatAxis(i, [&quot;&quot;], { axisLine: { show: false } })),
        series
      });
    }

    /* ---------- M04 同期坡度矩阵 ---------- */
    function buildM04() {
      const objs = [&quot;财政收入&quot;, &quot;税收收入&quot;, &quot;土地出让&quot;, &quot;专项债&quot;, &quot;非税收入&quot;, &quot;转移支付&quot;, &quot;新增项目&quot;, &quot;结转资金&quot;];
      const notes = [];
      const rows = objs.map((name, idx) =&gt; {
        const start = idx === 6 ? 0 : rnd(120, 900);  // 新增项目年初为 0：变化率不可计算
        const end = idx === 6 ? rnd(40, 160) : Math.round(start * rndf(0.7, 1.35, 2));
        const rel = relativeDiff(end, start);
        if (rel == null) notes.push(&quot;「&quot; + name + &quot;」基期为 0，变化率不可计算&quot;);
        return { name, start, end, rel };
      });
      const n = rows.length;
      const rects = gridRects(n, 4, { gapY: 16 });
      setNote(&quot;e6mx-m04-note&quot;, notes.join(&quot;；&quot;));
      return Object.assign(baseOption(&quot;item&quot;), {
        title: rows.map((r, i) =&gt; panelTitle(r.name, rects[i])),
        grid: rects.map((r) =&gt; ({ left: pct(r.left), top: pct(r.top + 2), width: pct(r.width), height: pct(r.height - 4) })),
        xAxis: rows.map((r, i) =&gt; miniCatAxis(i, [&quot;年初&quot;, &quot;年末&quot;], { boundaryGap: true })),
        yAxis: rows.map((r, i) =&gt; miniValAxis(i, { scale: true, splitLine: { show: false }, axisLabel: { show: false } })),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            var d = p.data &amp;&amp; p.data.mxMeta;
            if (!d) return &quot;&quot;;
            return d[0] + &quot;&lt;br/&gt;年初：&quot; + d[1] + &quot; 万元&lt;br/&gt;年末：&quot; + d[2] + &quot; 万元&lt;br/&gt;变化率：&quot; +
              (d[3] == null ? &quot;不可计算（基期为 0）&quot; : ((d[3] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + Math.round(d[3] * 1000) / 10 + &quot;%&quot;));
          }
        }),
        series: rows.map((r, i) =&gt; ({
          type: &quot;line&quot;, xAxisIndex: i, yAxisIndex: i,
          data: [
            { value: r.start, mxMeta: [r.name, r.start, r.end, r.rel] },
            { value: r.end, mxMeta: [r.name, r.start, r.end, r.rel] }
          ],
          symbol: &quot;circle&quot;, symbolSize: 6,
          lineStyle: { width: 2, color: r.end &gt;= r.start ? &quot;#38e6b0&quot; : &quot;#ff6680&quot; },
          itemStyle: { color: r.end &gt;= r.start ? &quot;#38e6b0&quot; : &quot;#ff6680&quot; },
          label: {
            show: true, color: C.muted, fontSize: 9,
            formatter: function (p) {

    /* ---------- M09 分位带趋势矩阵（复用带状原子实现，多 grid 化） ---------- */
    function bandSeriesAt(name, data, color, opacity, xIdx, yIdx) {
      return {
        name, type: &quot;custom&quot;, data,
        xAxisIndex: xIdx, yAxisIndex: yIdx,
        encode: { x: 0, y: [1, 2] },
        z: 2, silent: true, color,
        renderItem: function (params, api) {
          if (params.dataIndex !== 0) return null;
          var n = params.dataInsideLength;
          var segs = [];
          var cur = null;
          for (var i = 0; i &lt; n; i++) {
            var lo = api.value(1, i);
            var hi = api.value(2, i);
            if (isFinite(lo) &amp;&amp; isFinite(hi)) {
              if (!cur) { cur = { up: [], down: [] }; segs.push(cur); }
              cur.up.push(api.coord([api.value(0, i), hi]));
              cur.down.unshift(api.coord([api.value(0, i), lo]));
            } else {
              cur = null;
            }
          }
          var children = [];
          for (var s = 0; s &lt; segs.length; s++) {
            if (segs[s].up.length &lt; 2) continue;
            children.push({
              type: &quot;polygon&quot;,
              shape: { points: segs[s].up.concat(segs[s].down) },
              style: { fill: api.visual(&quot;color&quot;), opacity: params.itemStyle &amp;&amp; params.itemStyle.opacity != null ? params.itemStyle.opacity : 0.24 },
              silent: true
            });
          }
          return { type: &quot;group&quot;, children: children };
        },
        itemStyle: { opacity: opacity == null ? 0.24 : opacity }
      };
    }
    function buildM09() {
      const orgs = [&quot;华东节点&quot;, &quot;华南节点&quot;, &quot;华北节点&quot;, &quot;西部节点&quot;];
      const days = Array.from({ length: 30 }, (_, i) =&gt; &quot;D&quot; + (i + 1));
      const rows = orgs.map((name, idx) =&gt; {
        const base = 300 + idx * 120;
        const band = [];
        const act = [];
        for (let i = 0; i &lt; 30; i++) {
          const center = base + Math.sin(i / 5) * 40;
          let lo = Math.round(center - 55), hi = Math.round(center + 55);
          if (lo &gt; hi) { const t = lo; lo = hi; hi = t; }  // 构建期校验 lower ≤ upper
          band.push([i, lo, hi]);
          let v = Math.round(center + rnd(-45, 45));
          if (idx === 1 &amp;&amp; i &gt; 22) v = Math.round(hi + rnd(10, 45)); // 演示越带
          act.push(v);
        }
        return { name, band, act };
      });
      const n = rows.length;
      const rects = gridRects(n, 2, { gapY: 14 });
      const series = [];
      rows.forEach((r, i) =&gt; {
        series.push(bandSeriesAt(&quot;P10–P90&quot;, r.band, &quot;#4b7dff&quot;, 0.22, i, i));
        series.push({
          name: r.name, type: &quot;line&quot;, xAxisIndex: i, yAxisIndex: i,
          data: r.act, symbol: &quot;none&quot;, lineStyle: { width: 1.8, color: &quot;#3fe1ff&quot; }, itemStyle: { color: &quot;#3fe1ff&quot; }, z: 3,
          tooltip: { show: true }
        });
      });
      return Object.assign(baseOption(&quot;axis&quot;), {
        axisPointer: { link: [{ xAxisIndex: &quot;all&quot; }] },
        legend: { top: 0, data: [&quot;P10–P90&quot;], icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, textStyle: { color: C.muted, fontSize: 10 } },
        title: rows.map((r, i) =&gt; panelTitle(r.name, rects[i])),
        grid: rects.map((r) =&gt; ({ left: pct(r.left), top: pct(r.top + 2), width: pct(r.width), height: pct(r.height - 2) })),
        xAxis: rows.map((r, i) =&gt; miniCatAxis(i, days, { axisLabel: { color: C.muted, fontSize: 8, interval: 9 } })),
        yAxis: rows.map((r, i) =&gt; miniValAxis(i, { scale: true })),
        tooltip: Object.assign(baseOption(&quot;axis&quot;).tooltip, {
          trigger: &quot;axis&quot;,
          formatter: function (list) {
            var arr = Array.isArray(list) ? list : [list];
            var lineItem = null, bandItem = null;
            for (var i = 0; i &lt; arr.length; i++) {
              if (arr[i].seriesType === &quot;line&quot;) lineItem = arr[i];
              if (arr[i].seriesType === &quot;custom&quot;) bandItem = arr[i];
            }
            var lines = [arr.length ? arr[0].name : &quot;&quot;];
            if (lineItem) lines.push(lineItem.seriesName + &quot; 实际：&quot; + lineItem.value);
            if (bandItem &amp;&amp; bandItem.data) lines.push(&quot;P10：&quot; + bandItem.data[1] + &quot; · P90：&quot; + bandItem.data[2]);
            if (lineItem &amp;&amp; bandItem &amp;&amp; bandItem.data &amp;&amp; (lineItem.value &gt; bandItem.data[2] || lineItem.value &lt; bandItem.data[1])) lines.push(&quot;状态：偏离历史正常区间&quot;);
            return lines.join(&quot;&lt;br/&gt;&quot;);
          }
        }),

    }

    /* ---------- M10 告警时间窗矩阵 ---------- */

          }
        }),
        series: [
          {
            name: &quot;高等级持续告警&quot;, type: &quot;custom&quot;, color: &quot;#ff6680&quot;,
            data: fSpans.filter((d) =&gt; d[3] === 2),

            renderItem: function (params, api) {

              var e = api.coord([api.value(2), api.value(0)]);
              var h = Math.min(api.size([0, 1])[1] * 0.26, 10);
              return { type: &quot;rect&quot;, shape: { x: s[0], y: s[1] + 2, width: Math.max(e[0] - s[0], 2), height: h, r: 2 }, style: { fill: &quot;#ffc857&quot;, opacity: 0.8 } };
            }
          },
          {
            name: &quot;瞬时事件&quot;, type: &quot;scatter&quot;,
            data: fEvents.map((d) =&gt; ({ value: [d[0], d[1]], mxRaw: d })),
            symbol: &quot;diamond&quot;, symbolSize: 8,
            itemStyle: { color: function (p) { return p.data.mxRaw[2] === 2 ? &quot;#ff6680&quot; : &quot;#3fe1ff&quot;; }, opacity: 0.9 },
            tooltip: { formatter: function (p) { var d = p.data.mxRaw; return d[3] + &quot;&lt;br/&gt;瞬时事件（&quot; + (d[2] === 2 ? &quot;高&quot; : &quot;中&quot;) + &quot;）· &quot; + d[0] + &quot;:00&quot;; } }
          }
        ]
      });
    }

    /* ---------- M11 排名变化矩阵 ---------- */
    function buildM11() {
      const regions = [&quot;东城区&quot;, &quot;西城区&quot;, &quot;新区&quot;, &quot;湖区&quot;, &quot;山区&quot;, &quot;港区&quot;, &quot;矿区&quot;, &quot;郊区&quot;];
      const periods = [&quot;一季度&quot;, &quot;二季度&quot;, &quot;三季度&quot;, &quot;四季度&quot;, &quot;本年中评&quot;, &quot;本年终评&quot;];
      // 生成每期排名（1..8 的排列）
      let order = regions.map((_, i) =&gt; i);
      const ranks = regions.map(() =&gt; []);
      periods.forEach(() =&gt; {
        // 轻度洗牌保持连续性
        for (let s = 0; s &lt; 3; s++) {
          const a = rnd(0, order.length - 1), b = Math.min(order.length - 1, a + 1);
          if (Math.random() &lt; 0.55) { const t = order[a]; order[a] = order[b]; order[b] = t; }
        }
        order.forEach((regionIdx, pos) =&gt; ranks[regionIdx].push(pos + 1));
      });
      return Object.assign(baseOption(&quot;item&quot;), {
        legend: { type: &quot;scroll&quot;, top: 0, textStyle: { color: C.muted, fontSize: 10 }, itemWidth: 10, itemHeight: 10 },
        grid: { left: 8, right: 60, top: 30, bottom: 8, containLabel: true },
        xAxis: { type: &quot;category&quot;, data: periods, boundaryGap: true, axisLine: { lineStyle: { color: AXIS_LINE } }, axisTick: { show: false }, axisLabel: { color: C.muted, fontSize: 10 } },
        yAxis: { type: &quot;value&quot;, inverse: true, min: 1, max: regions.length, interval: 1, name: &quot;名次（越小越优）&quot;, nameTextStyle: { color: C.muted, fontSize: 10 }, axisLabel: { color: C.muted, fontSize: 10 }, splitLine: { lineStyle: { color: SPLIT_LINE } } },
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) { return p.seriesName + &quot;&lt;br/&gt;&quot; + p.name + &quot;：第 &quot; + p.value + &quot; 名&quot;; }
        }),
        series: regions.map((name, i) =&gt; ({
          name, type: &quot;line&quot;,
          data: ranks[i],
          symbol: &quot;circle&quot;, symbolSize: 7,
          lineStyle: { width: 2, color: SERIES6[i % SERIES6.length] },
          itemStyle: { color: SERIES6[i % SERIES6.length] },
          emphasis: { focus: &quot;series&quot;, lineStyle: { width: 3 } },
          blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } },
          endLabel: { show: true, formatter: name, color: SERIES6[i % SERIES6.length], fontSize: 10, distance: 6 },
          labelLayout: { moveOverlap: &quot;shiftY&quot; }
        }))
      });
    }

    /* ---------- M12 KPI＋Sparkline 卡阵 ---------- */
    let m12OnlyAbnormal = false;
    function makeM12Data() {
      const defs = [
        { name: &quot;营业收入&quot;, unit: &quot;亿元&quot;, status: &quot;normal&quot; },
        { name: &quot;净利润&quot;, unit: &quot;亿元&quot;, status: &quot;normal&quot; },
        { name: &quot;不良率&quot;, unit: &quot;%&quot;, status: &quot;warn&quot; },
        { name: &quot;客户数&quot;, unit: &quot;万户&quot;, status: &quot;normal&quot; },
        { name: &quot;投诉量&quot;, unit: &quot;件&quot;, status: &quot;crit&quot; },
        { name: &quot;系统可用率&quot;, unit: &quot;%&quot;, status: &quot;normal&quot; }
      ];
      return defs.map((d) =&gt; {
        const cur = rndf(40, 980, 1);
        const yoy = rndf(-0.2, 0.3, 3);
        const mom = rndf(-0.12, 0.15, 3);
        return Object.assign({}, d, {
          value: cur, yoy, mom,
          trend: Array.from({ length: 12 }, () =&gt; rndf(cur * 0.8, cur * 1.15, 1)),
          updatedAt: &quot;2026-07-19 09:30&quot;
        });
      });
    }
    let m12Data = null;
    function buildM12(containerWidth) {
      if (!m12Data) m12Data = makeM12Data();
      const shown = m12Data.filter((d) =&gt; !m12OnlyAbnormal || d.status !== &quot;normal&quot;);
      const n = Math.max(shown.length, 1);
      const cols = containerWidth &gt;= 1100 ? 3 : containerWidth &gt;= 640 ? 2 : 1;
      const rects = gridRects(n, Math.min(cols, n), { padT: 4, padB: 4, gapY: 8 });
      const graphics = [];
      const grids = [];
      const xAxes = [];
      const yAxes = [];
      const series = [];
      const STATUS = { normal: [&quot;#38e6b0&quot;, &quot;正常&quot;], warn: [&quot;#ffc857&quot;, &quot;关注&quot;], crit: [&quot;#ff6680&quot;, &quot;异常&quot;] };
      shown.forEach((d, i) =&gt; {
        const r = rects[i];
        const st = STATUS[d.status] || STATUS.normal;
        graphics.push(
          { type: &quot;text&quot;, left: pct(r.left), top: pct(r.top), style: { text: d.name, fill: &quot;#bfe0ff&quot;, fontSize: 12, fontWeight: 600 } },
          { type: &quot;text&quot;, left: pct(r.left), top: pct(r.top + 7), style: { text: String(d.value) + &quot; &quot; + d.unit, fill: &quot;#f0f7ff&quot;, fontSize: 20, fontWeight: 700 } },
          {
            type: &quot;text&quot;, left: pct(r.left), top: pct(r.top + 17),
            style: {
              text: &quot;同比 &quot; + (d.yoy &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + Math.round(d.yoy * 1000) / 10 + &quot;%  环比 &quot; + (d.mom &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + Math.round(d.mom * 1000) / 10 + &quot;%&quot;,
              fill: d.yoy &gt;= 0 ? &quot;#6ef0c2&quot; : &quot;#ff9db8&quot;, fontSize: 11
            }
          },
          { type: &quot;text&quot;, left: pct(r.left), top: pct(r.top + 23), style: { text: &quot;状态 &quot; + st[1] + &quot; · 更新 &quot; + d.updatedAt, fill: &quot;#8fa7c8&quot;, fontSize: 10 } },
          { type: &quot;circle&quot;, left: pct(r.left + r.width - 4), top: pct(r.top + 1), shape: { r: 5 }, style: { fill: st[0] } }
        );
        const gi = grids.length;
        grids.push({ left: pct(r.left), top: pct(r.top + 29), width: pct(r.width), height: pct(Math.max(r.height - 30, 8)) });
        xAxes.push({ type: &quot;category&quot;, gridIndex: gi, data: d.trend.map((_, k) =&gt; k + 1), show: false });
        yAxes.push({ type: &quot;value&quot;, gridIndex: gi, show: false, scale: true });
        series.push({
          name: d.name, type: &quot;line&quot;, xAxisIndex: gi, yAxisIndex: gi,
          data: d.trend, symbol: &quot;none&quot;, smooth: 0.3,
          lineStyle: { width: 1.6, color: st[0] },
          itemStyle: { color: st[0] },
          areaStyle: { opacity: 0.14, color: st[0] },
          tooltip: { formatter: function (p) { return p.seriesName + &quot; 近12期第&quot; + p.name + &quot;期：&quot; + p.value; } }
        });
      });
      return Object.assign(baseOption(&quot;item&quot;), {
        graphic: graphics, grid: grids, xAxis: xAxes, yAxis: yAxes, series
      });
    }

    /* ================= 渲染调度 ================= */

    const builders = [
      { id: &quot;e6mx-m01&quot;, build: buildM01 },
      { id: &quot;e6mx-m02&quot;, build: buildM02 },
      { id: &quot;e6mx-m03&quot;, build: buildM03 },
      { id: &quot;e6mx-m04&quot;, build: buildM04 },
      { id: &quot;e6mx-m05&quot;, build: buildM05 },
      { id: &quot;e6mx-m06&quot;, build: buildM06 },
      { id: &quot;e6mx-m07&quot;, build: buildM07 },
      { id: &quot;e6mx-m08&quot;, build: buildM08 },
      { id: &quot;e6mx-m09&quot;, build: buildM09 },
      { id: &quot;e6mx-m10&quot;, build: buildM10 },
      { id: &quot;e6mx-m11&quot;, build: buildM11 },
      { id: &quot;e6mx-m12&quot;, build: null }  // 特殊：依赖容器宽度
    ];
    const builderById = {};
    builders.forEach((b) =&gt; { builderById[b.id] = b; });

    const charts = {};
    function renderOne(id) {
      const node = document.getElementById(id);
      if (!node) return;
      if (!charts[id]) charts[id] = echarts.init(node, null, { renderer: &quot;canvas&quot; });
      try {
        const opt = id === &quot;e6mx-m12&quot; ? buildM12(node.clientWidth) : builderById[id].build();
        charts[id].setOption(opt, { notMerge: true });
      } catch (err) {
        errorNode.textContent = &quot;方案「&quot; + id + &quot;」渲染异常：&quot; + err.message;
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }
    function renderInitialized() {
      Object.keys(charts).forEach(renderOne);
    }

    let io = null;
    if (&quot;IntersectionObserver&quot; in window) {
      io = new IntersectionObserver((entries) =&gt; {
        entries.forEach((entry) =&gt; {
          if (!entry.isIntersecting) return;
          renderOne(entry.target.id);
          io.unobserve(entry.target);
        });
      }, { rootMargin: &quot;320px 0px&quot; });
      builders.forEach((b) =&gt; {
        const node = document.getElementById(b.id);
        if (node) io.observe(node);
      });
    } else {
      builders.forEach((b) =&gt; renderOne(b.id));
    }

    let ro = null;
    let resizeTimer = null;
    function onResize() {
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) charts[id].resize(); });
      // M12 的列数依赖容器宽度，尺寸变化后重建布局
      if (charts[&quot;e6mx-m12&quot;]) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() =&gt; renderOne(&quot;e6mx-m12&quot;), 200);
      }
    }
    if (&quot;ResizeObserver&quot; in window) {
      ro = new ResizeObserver(onResize);
      ro.observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, onResize);
    }

    /* M08 单一定时器（页面隐藏 / 手动暂停 / 未初始化时不推送） */
    let m08Timer = setInterval(() =&gt; {
      if (m08Paused || document.hidden || !charts[&quot;e6mx-m08&quot;]) return;
      m08Step();
      renderOne(&quot;e6mx-m08&quot;);
    }, 1000);

    document.addEventListener(&quot;visibilitychange&quot;, () =&gt; {
      // 隐藏时定时器条件短路即暂停；恢复可见时立即补一帧
      if (!document.hidden &amp;&amp; charts[&quot;e6mx-m08&quot;] &amp;&amp; !m08Paused) renderOne(&quot;e6mx-m08&quot;);
    });

    /* 控件 */
    document.getElementById(&quot;e6mx-refresh&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      makeM01Data(); m10Data = null; m12Data = null; makeM08Buffers();
      renderInitialized();
    });
    const motionBtn = document.getElementById(&quot;e6mx-motion&quot;);
    motionBtn.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      motionBtn.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionBtn.textContent = &quot;更新动效：&quot; + (motionEnabled ? &quot;开&quot; : &quot;关&quot;);
      renderInitialized();
    });
    reducedMotion.addEventListener &amp;&amp; reducedMotion.addEventListener(&quot;change&quot;, (e) =&gt; {
      if (e.matches) {
        motionEnabled = false;
        motionBtn.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        motionBtn.textContent = &quot;更新动效：关&quot;;
        renderInitialized();
      }
    });

    const m01CountBtn = document.getElementById(&quot;e6mx-m01-count&quot;);
    const M01_STEPS = [1, 4, 12, 24, 36];
    m01CountBtn.addEventListener(&quot;click&quot;, () =&gt; {
      const idx = M01_STEPS.indexOf(m01Count);
      m01Count = M01_STEPS[(idx + 1) % M01_STEPS.length];
      m01Page = 0;
      m01CountBtn.textContent = &quot;面板数：&quot; + m01Count;
      if (charts[&quot;e6mx-m01&quot;]) renderOne(&quot;e6mx-m01&quot;);
    });
    const m01ScaleBtn = document.getElementById(&quot;e6mx-m01-scale&quot;);
    m01ScaleBtn.addEventListener(&quot;click&quot;, () =&gt; {
      m01Shared = !m01Shared;
      m01ScaleBtn.textContent = &quot;尺度：&quot; + (m01Shared ? &quot;共享&quot; : &quot;独立&quot;);
      m01ScaleBtn.classList.toggle(&quot;is-warn&quot;, !m01Shared);
      if (charts[&quot;e6mx-m01&quot;]) renderOne(&quot;e6mx-m01&quot;);
    });
    document.getElementById(&quot;e6mx-m01-page&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      m01Page += 1;
      if (charts[&quot;e6mx-m01&quot;]) renderOne(&quot;e6mx-m01&quot;);
    });

    const m08PauseBtn = document.getElementById(&quot;e6mx-m08-pause&quot;);
    m08PauseBtn.addEventListener(&quot;click&quot;, () =&gt; {
      m08Paused = !m08Paused;
      m08PauseBtn.setAttribute(&quot;aria-pressed&quot;, String(m08Paused));
      m08PauseBtn.textContent = m08Paused ? &quot;恢复推送&quot; : &quot;暂停推送&quot;;
    });

    const m10FilterBtn = document.getElementById(&quot;e6mx-m10-filter&quot;);
    m10FilterBtn.addEventListener(&quot;click&quot;, () =&gt; {
      m10Filter = m10Filter === &quot;all&quot; ? &quot;high&quot; : m10Filter === &quot;high&quot; ? &quot;mid&quot; : &quot;all&quot;;
      m10FilterBtn.textContent = &quot;等级：&quot; + (m10Filter === &quot;all&quot; ? &quot;全部&quot; : m10Filter === &quot;high&quot; ? &quot;仅高&quot; : &quot;仅中&quot;);
      if (charts[&quot;e6mx-m10&quot;]) renderOne(&quot;e6mx-m10&quot;);
    });

    const m12FilterBtn = document.getElementById(&quot;e6mx-m12-filter&quot;);
    m12FilterBtn.addEventListener(&quot;click&quot;, () =&gt; {
      m12OnlyAbnormal = !m12OnlyAbnormal;
      m12FilterBtn.setAttribute(&quot;aria-pressed&quot;, String(m12OnlyAbnormal));
      if (charts[&quot;e6mx-m12&quot;]) renderOne(&quot;e6mx-m12&quot;);
    });

    window.addEventListener(&quot;pagehide&quot;, () =&gt; {
      clearInterval(m08Timer);
      if (io) io.disconnect();
      if (ro) ro.disconnect();
      clearTimeout(resizeTimer);
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) { charts[id].dispose(); charts[id] = null; } });
    });
  })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
