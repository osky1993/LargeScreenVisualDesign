&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {

  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,
      rect: w ? w.getBoundingClientRect().toJSON() : null,
      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight
    });
  });

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {

      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {

    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {

    }

  }
  function rgbToHsla(r, g, b, a) {

      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });

  }

  function mapOption(option, theme) {
    var mapColor = buildMapper(option, theme);
    function walk(node, key) {
      if (node == null || typeof node === &quot;function&quot;) return node;
      if (typeof node === &quot;string&quot;) {
        if (key === &quot;formatter&quot; || key === &quot;text&quot; || key === &quot;subtext&quot;) return node;

  &lt;script&gt;

      amber: &quot;#ffc857&quot;, red: &quot;#ff6680&quot;, orange: &quot;#ff9360&quot;, pink: &quot;#ff5cc8&quot;, steel: &quot;#6f8fb5&quot;

    let motionEnabled = !reducedMotion.matches;

    function rnd(min, max) {
      return Math.round(min + Math.random() * (max - min));
    }

    /* ---------- 瀑布计算：汇总列恒等于各分项运算结果 ---------- */
    function makeSteps(items) {
      let cum = 0;
      return items.map((it) =&gt; {
        if (it.kind === &quot;start&quot;) {
          cum = it.value;
          return { name: it.name, kind: &quot;start&quot;, delta: it.value, start: 0, end: cum };
        }
        if (it.kind === &quot;delta&quot;) {
          const start = cum;
          cum += it.value;
          return { name: it.name, kind: &quot;delta&quot;, delta: it.value, start, end: cum };
        }
        return { name: it.name, kind: it.kind, delta: cum, start: 0, end: cum }; // total / subtotal
      });
    }

    function splitSteps(steps) {
      const cats = [], base = [], inc = [], dec = [], tot = [], sub = [];
      steps.forEach((s) =&gt; {
        cats.push(s.name);
        if (s.kind === &quot;delta&quot;) {
          if (s.delta &gt;= 0) { base.push(s.start); inc.push(s.delta); dec.push(null); tot.push(null); sub.push(null); }
          else { base.push(s.end); inc.push(null); dec.push(-s.delta); tot.push(null); sub.push(null); }
        } else if (s.kind === &quot;subtotal&quot;) {
          base.push(0); inc.push(null); dec.push(null); tot.push(null); sub.push(s.end);
        } else {
          base.push(0); inc.push(null); dec.push(null); tot.push(s.end); sub.push(null);
        }
      });
      return { cats, base, inc, dec, tot, sub };
    }

    /* ---------- 公共构件 ---------- */
    function baseOption(steps, unit) {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 800 : 0,
        animationDurationUpdate: motionEnabled ? 600 : 0,
        animationEasing: &quot;cubicOut&quot;,
        tooltip: {
          trigger: &quot;axis&quot;,
          axisPointer: { type: &quot;shadow&quot;, shadowStyle: { color: &quot;rgba(86, 150, 224, 0.08)&quot; } },
          confine: true,
          backgroundColor: &quot;rgba(9, 24, 48, 0.92)&quot;,
          borderColor: &quot;rgba(102, 178, 255, 0.4)&quot;,

    /* 层间虚线连接线：custom series，从上一柱推进位延伸到下一柱边缘 */

    const builders = {

      &quot;e6wf-bridge&quot;: () =&gt; {

          { name: &quot;原料采购&quot;, kind: &quot;delta&quot;, value: -rnd(50, 120) },
          { name: &quot;人员支出&quot;, kind: &quot;delta&quot;, value: -rnd(40, 90) },
          { name: &quot;税费缴纳&quot;, kind: &quot;delta&quot;, value: -rnd(20, 60) },
          { name: &quot;资产处置&quot;, kind: &quot;delta&quot;, value: rnd(10, 70) },
          { name: &quot;期末结余&quot;, kind: &quot;total&quot; }
        ];
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const option = baseOption(steps, &quot;万元&quot;);
        option.legend = smallLegend([&quot;增加&quot;, &quot;减少&quot;]);
        option.xAxis = catAxis(d.cats);
        option.yAxis = valAxis();
        option.series = [
          padSeries(d.base),
          barSeries(&quot;增加&quot;, d.inc, { color: C.green, borderRadius: [2, 2, 0, 0] }),
          barSeries(&quot;减少&quot;, d.dec, { color: C.red, borderRadius: [2, 2, 0, 0] }),
          barSeries(&quot;结余&quot;, d.tot, { color: C.steel, borderRadius: [2, 2, 0, 0] }, {
            label: { show: true, position: &quot;top&quot;, color: &quot;#dff1ff&quot;, fontSize: 10 }
          }),
          connectorSeries(steps)
        ];
        return option;
      },

      /* 02 利润构成：营收实柱 → 各项成本递减悬浮 → 净利润汇总列独立色 */
      &quot;e6wf-profit&quot;: () =&gt; {
        const revenue = rnd(900, 1200);
        const items = [
          { name: &quot;营业收入&quot;, kind: &quot;start&quot;, value: revenue },
          { name: &quot;营业成本&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.40 + Math.random() * 0.08)) },
          { name: &quot;销售费用&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.06 + Math.random() * 0.04)) },
          { name: &quot;管理费用&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.05 + Math.random() * 0.03)) },
          { name: &quot;研发费用&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.04 + Math.random() * 0.03)) },
          { name: &quot;税金附加&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.04 + Math.random() * 0.02)) },
          { name: &quot;净利润&quot;, kind: &quot;total&quot; }
        ];
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const option = baseOption(steps, &quot;万元&quot;);
        option.xAxis = catAxis(d.cats);
        option.yAxis = valAxis();
        option.series = [
          padSeries(d.base),
          barSeries(&quot;扣减&quot;, d.dec, { color: C.orange, borderRadius: [2, 2, 0, 0] }, {
            label: { show: true, position: &quot;top&quot;, color: &quot;#ffd2b3&quot;, fontSize: 10, formatter: (p) =&gt; `-${p.value}` }
          }),
          barSeries(&quot;汇总&quot;, d.tot, {
            color: (p) =&gt; (p.dataIndex === 0 ? C.cyan : C.amber),
            borderRadius: [3, 3, 0, 0]
          }, {
            label: { show: true, position: &quot;top&quot;, color: &quot;#f4e8cf&quot;, fontSize: 11, fontWeight: 600 }
          })
        ];
        return option;
      },

      /* 03 成本分解：总成本自上而下分解为六项，悬浮柱标注数值与占比 */
      &quot;e6wf-cost&quot;: () =&gt; {
        const total = rnd(640, 920);
        const weights = [
          [&quot;原材料&quot;, 0.30 + Math.random() * 0.08],
          [&quot;直接人工&quot;, 0.18 + Math.random() * 0.06],
          [&quot;制造费用&quot;, 0.13 + Math.random() * 0.05],
          [&quot;物流仓储&quot;, 0.09 + Math.random() * 0.04],
          [&quot;能耗动力&quot;, 0.07 + Math.random() * 0.03]
        ];
        const parts = weights.map(([name, w]) =&gt; ({ name, value: Math.round(total * w) }));
        parts.push({ name: &quot;其他成本&quot;, value: total - parts.reduce((sum, p) =&gt; sum + p.value, 0) });
        const items = [{ name: &quot;总成本&quot;, kind: &quot;start&quot;, value: total }]
          .concat(parts.map((p) =&gt; ({ name: p.name, kind: &quot;delta&quot;, value: -p.value })));
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const partColors = [C.cyan, C.blue, C.violet, C.green, C.amber, C.orange];
        const option = baseOption(steps, &quot;万元&quot;);
        option.xAxis = catAxis(d.cats);
        option.yAxis = valAxis();
        option.series = [
          padSeries(d.base),
          barSeries(&quot;分项&quot;, d.dec, {
            color: (p) =&gt; partColors[(p.dataIndex - 1 + partColors.length) % partColors.length],
            borderRadius: [2, 2, 0, 0]
          }, {
            label: {
              show: true, position: &quot;top&quot;, color: &quot;#dff1ff&quot;, fontSize: 9, lineHeight: 12,
              formatter: (p) =&gt; `${p.value}\n${(p.value / total * 100).toFixed(1)}%`
            }
          }),
          barSeries(&quot;总成本&quot;, d.tot, { color: C.steel, borderRadius: [3, 3, 0, 0] }, {
            label: { show: true, position: &quot;top&quot;, color: &quot;#dff1ff&quot;, fontSize: 11, fontWeight: 600 }
          })
        ];
        return option;
      },

      /* 04 同比增减：上年基数 → 各因素正负双色 → 本年值 */
      &quot;e6wf-yoy&quot;: () =&gt; {
        const lastYear = rnd(760, 880);
        const items = [
          { name: &quot;上年营收&quot;, kind: &quot;start&quot;, value: lastYear },
          { name: &quot;销量增长&quot;, kind: &quot;delta&quot;, value: rnd(40, 110) },
          { name: &quot;价格调整&quot;, kind: &quot;delta&quot;, value: rnd(-50, 50) },
          { name: &quot;汇率影响&quot;, kind: &quot;delta&quot;, value: rnd(-45, 25) },
          { name: &quot;成本传导&quot;, kind: &quot;delta&quot;, value: -rnd(20, 70) },
          { name: &quot;政策补贴&quot;, kind: &quot;delta&quot;, value: rnd(10, 50) },
          { name: &quot;本年营收&quot;, kind: &quot;total&quot; }
        ];
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const final = steps[steps.length - 1].end;
        const yoyRate = ((final - lastYear) / lastYear * 100).toFixed(1);
        const option = baseOption(steps, &quot;万元&quot;);
        option.legend = smallLegend([&quot;正向因素&quot;, &quot;负向因素&quot;]);
        option.xAxis = catAxis(d.cats);
        option.yAxis = valAxis();
        option.series = [
          padSeries(d.base),
          barSeries(&quot;正向因素&quot;, d.inc, { color: C.green, borderRadius: [2, 2, 0, 0] }),
          barSeries(&quot;负向因素&quot;, d.dec, { color: C.red, borderRadius: [2, 2, 0, 0] }),
          barSeries(&quot;年度值&quot;, d.tot, {
            color: (p) =&gt; (p.dataIndex === 0 ? C.steel : C.cyan),
            borderRadius: [3, 3, 0, 0]
          }, {
            label: {
              show: true, position: &quot;top&quot;, color: &quot;#dff1ff&quot;, fontSize: 10,
              formatter: (p) =&gt; (p.dataIndex === 0 ? String(p.value) : `${p.value}\n同比${yoyRate &gt;= 0 ? &quot;+&quot; : &quot;&quot;}${yoyRate}%`)
            }
          })
        ];
        return option;
      },

      /* 05 分段小计：毛利小计与营业利润小计以实柱落地，末柱净利润 */
      &quot;e6wf-subtotal&quot;: () =&gt; {
        const revenue = rnd(950, 1150);
        const items = [
          { name: &quot;营业收入&quot;, kind: &quot;start&quot;, value: revenue },
          { name: &quot;营业成本&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.42 + Math.random() * 0.08)) },
          { name: &quot;毛利小计&quot;, kind: &quot;subtotal&quot; },
          { name: &quot;销售费用&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.07 + Math.random() * 0.03)) },
          { name: &quot;管理费用&quot;, kind: &quot;delta&quot;, value: -Math.round(revenue * (0.05 + Math.random() * 0.03)) },
          { name: &quot;营业利润小计&quot;, kind: &quot;subtotal&quot; }
        ];
        const steps0 = makeSteps(items);
        const operating = steps0[steps0.length - 1].end;
        items.push({ name: &quot;所得税&quot;, kind: &quot;delta&quot;, value: -Math.round(operating * 0.25) });
        items.push({ name: &quot;净利润&quot;, kind: &quot;total&quot; });
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const option = baseOption(steps, &quot;万元&quot;);
        option.xAxis = catAxis(d.cats);
        option.yAxis = valAxis();
        option.series = [
          padSeries(d.base),
          barSeries(&quot;扣减&quot;, d.dec, { color: C.red, borderRadius: [2, 2, 0, 0] }),
          barSeries(&quot;小计&quot;, d.sub, { color: C.amber, borderRadius: [3, 3, 0, 0] }, {
            label: { show: true, position: &quot;top&quot;, color: &quot;#f4e8cf&quot;, fontSize: 10, fontWeight: 600 }
          }),
          barSeries(&quot;收入与利润&quot;, d.tot, {
            color: (p) =&gt; (p.dataIndex === 0 ? C.cyan : C.green),
            borderRadius: [3, 3, 0, 0]
          }, {
            label: { show: true, position: &quot;top&quot;, color: &quot;#dff1ff&quot;, fontSize: 10, fontWeight: 600 }
          })
        ];
        return option;
      },

      /* 06 霓虹光效：亮青描边发光悬浮柱 + 深色垫底柱 */
      &quot;e6wf-neon&quot;: () =&gt; {
        const start = rnd(500, 620);
        const items = [
          { name: &quot;期初池量&quot;, kind: &quot;start&quot;, value: start },
          { name: &quot;新增注资&quot;, kind: &quot;delta&quot;, value: rnd(60, 150) },
          { name: &quot;项目拨付&quot;, kind: &quot;delta&quot;, value: -rnd(80, 170) },
          { name: &quot;收益回流&quot;, kind: &quot;delta&quot;, value: rnd(30, 90) },
          { name: &quot;费用扣减&quot;, kind: &quot;delta&quot;, value: -rnd(20, 60) },
          { name: &quot;结转回收&quot;, kind: &quot;delta&quot;, value: rnd(20, 80) },
          { name: &quot;期末池量&quot;, kind: &quot;total&quot; }
        ];
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const option = baseOption(steps, &quot;万元&quot;);
        option.xAxis = catAxis(d.cats);
        option.yAxis = valAxis();
        option.series = [
          padSeries(d.base, {
            color: &quot;rgba(12, 34, 66, 0.9)&quot;,
            borderColor: &quot;rgba(63, 225, 255, 0.16)&quot;,
            borderWidth: 1
          }),
          barSeries(&quot;流入&quot;, d.inc, {
            color: &quot;rgba(63, 225, 255, 0.26)&quot;,
            borderColor: C.cyan, borderWidth: 1.5,
            shadowBlur: 14, shadowColor: &quot;rgba(63, 225, 255, 0.75)&quot;,
            borderRadius: [3, 3, 0, 0]
          }),
          barSeries(&quot;流出&quot;, d.dec, {
            color: &quot;rgba(255, 92, 200, 0.22)&quot;,
            borderColor: C.pink, borderWidth: 1.5,
            shadowBlur: 14, shadowColor: &quot;rgba(255, 92, 200, 0.7)&quot;,
            borderRadius: [3, 3, 0, 0]
          }),
          barSeries(&quot;池量&quot;, d.tot, {
            color: &quot;rgba(56, 230, 176, 0.24)&quot;,
            borderColor: C.green, borderWidth: 1.5,
            shadowBlur: 16, shadowColor: &quot;rgba(56, 230, 176, 0.75)&quot;,
            borderRadius: [3, 3, 0, 0]
          }, {
            label: {
              show: true, position: &quot;top&quot;, color: &quot;#c8ffe9&quot;, fontSize: 10,
              textShadowBlur: 8, textShadowColor: &quot;rgba(56, 230, 176, 0.8)&quot;
            }
          })
        ];
        return option;
      },

      /* 07 横向瀑布：xAxis value / yAxis category，预算执行语义 */
      &quot;e6wf-hbar&quot;: () =&gt; {
        const budget = rnd(900, 1100);
        const quarters = [&quot;一季度执行&quot;, &quot;二季度执行&quot;, &quot;三季度执行&quot;, &quot;四季度执行&quot;]
          .map((name) =&gt; ({ name, value: -rnd(120, 220) }));
        const items = [{ name: &quot;年度预算&quot;, kind: &quot;start&quot;, value: budget }]
          .concat(quarters.map((q) =&gt; ({ name: q.name, kind: &quot;delta&quot;, value: q.value })))
          .concat([{ name: &quot;年末结余&quot;, kind: &quot;total&quot; }]);
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const option = baseOption(steps, &quot;万元&quot;);
        option.grid = { left: 10, right: 48, top: 12, bottom: 6, containLabel: true };
        option.xAxis = valAxis();
        option.yAxis = catAxis(d.cats, { inverse: true, axisLabel: { color: C.muted, fontSize: 10, interval: 0 } });
        option.series = [
          padSeries(d.base),
          barSeries(&quot;季度执行&quot;, d.dec, { color: C.blue, borderRadius: [0, 2, 2, 0] }, {
            label: { show: true, position: &quot;right&quot;, color: &quot;#bcd4ff&quot;, fontSize: 10, formatter: (p) =&gt; `-${p.value}` }
          }),
          barSeries(&quot;预算与结余&quot;, d.tot, {
            color: (p) =&gt; (p.dataIndex === 0 ? C.amber : C.green),
            borderRadius: [0, 3, 3, 0]
          }, {
            label: { show: true, position: &quot;right&quot;, color: &quot;#dff1ff&quot;, fontSize: 10, fontWeight: 600 }
          })
        ];
        return option;
      },

      /* 08 数值标签推进：双色 + 每柱顶 +/- 标签 + markLine 桥接线，末柱标总计 */
      &quot;e6wf-labelrun&quot;: () =&gt; {
        const start = rnd(420, 520);
        let fx = rnd(-30, 30);
        if (fx === 0) fx = 12;
        const items = [
          { name: &quot;年初净资产&quot;, kind: &quot;start&quot;, value: start },
          { name: &quot;经营利润&quot;, kind: &quot;delta&quot;, value: rnd(60, 120) },
          { name: &quot;资产减值&quot;, kind: &quot;delta&quot;, value: -rnd(20, 60) },
          { name: &quot;股东分红&quot;, kind: &quot;delta&quot;, value: -rnd(30, 70) },
          { name: &quot;增资扩股&quot;, kind: &quot;delta&quot;, value: rnd(20, 80) },
          { name: &quot;汇兑损益&quot;, kind: &quot;delta&quot;, value: fx },
          { name: &quot;年末净资产&quot;, kind: &quot;total&quot; }
        ];
        const steps = makeSteps(items);
        const d = splitSteps(steps);
        const option = baseOption(steps, &quot;万元&quot;);
        option.legend = smallLegend([&quot;增加&quot;, &quot;减少&quot;]);
        option.xAxis = catAxis(d.cats);
        option.yAxis = valAxis();
        option.series = [
          padSeries(d.base),
          barSeries(&quot;增加&quot;, d.inc, { color: C.green, borderRadius: [2, 2, 0, 0] }, {
            label: {
              show: true, position: &quot;top&quot;, color: &quot;#9ff0cf&quot;, fontSize: 10, fontWeight: 600,
              formatter: (p) =&gt; `+${p.value}`
            },
            markLine: connectorMarkLine(steps)
          }),
          barSeries(&quot;减少&quot;, d.dec, { color: C.red, borderRadius: [2, 2, 0, 0] }, {
            label: {
              show: true, position: &quot;top&quot;, color: &quot;#ffb3c1&quot;, fontSize: 10, fontWeight: 600,
              formatter: (p) =&gt; `-${p.value}`
            }
          }),
          barSeries(&quot;净资产&quot;, d.tot, {
            color: (p) =&gt; (p.dataIndex === 0 ? C.steel : C.cyan),
            borderRadius: [3, 3, 0, 0]
          }, {
            label: {
              show: true, position: &quot;top&quot;, color: &quot;#dff1ff&quot;, fontSize: 10, fontWeight: 600,
              formatter: (p) =&gt; (p.dataIndex === 0 ? String(p.value) : `总计 ${p.value}`)
            }
          })
        ];
        return option;
      }
    };

    /* ---------- 渲染与控制 ---------- */
    const charts = {};
    function renderAll() {
      Object.entries(builders).forEach(([id, build]) =&gt; {
        const element = document.getElementById(id);
        if (!element) return;
        if (!charts[id]) charts[id] = echarts.init(element, null, { renderer: &quot;canvas&quot; });
        charts[id].setOption(build(), { notMerge: true, lazyUpdate: false });
      });
    }

    const refreshButton = document.getElementById(&quot;e6wf-refresh&quot;);
    const motionButton = document.getElementById(&quot;e6wf-motion&quot;);

    refreshButton.addEventListener(&quot;click&quot;, () =&gt; {
      renderAll();
    });

    function syncMotionButton() {
      motionButton.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionButton.textContent = motionEnabled ? &quot;更新动效：开&quot; : &quot;更新动效：关&quot;;
    }

    motionButton.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      syncMotionButton();
      renderAll();
    });

    reducedMotion.addEventListener?.(&quot;change&quot;, (event) =&gt; {
      if (event.matches) {
        motionEnabled = false;
        syncMotionButton();
        renderAll();
      }
    });

    let resizeFrame = 0;
    const resizeCharts = () =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() =&gt; Object.values(charts).forEach((chart) =&gt; chart.resize()));
    };
    if (&quot;ResizeObserver&quot; in window) {
      new ResizeObserver(resizeCharts).observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    syncMotionButton();
    renderAll();
  })();
  &lt;/script&gt;
