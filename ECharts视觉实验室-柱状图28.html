&lt;div id=&quot;echarts6-bar-combination-gallery&quot;&gt;
  &lt;style&gt;
    #echarts6-bar-combination-gallery {
      --bg: rgb(10, 30, 60);
      --panel: rgba(5, 23, 50, 0.82);
      --line: rgba(77, 203, 255, 0.17);
      --line-hot: rgba(87, 222, 255, 0.5);
      --text: #e9f8ff;
      --muted: rgba(204, 233, 248, 0.66);
      --faint: rgba(183, 220, 239, 0.43);
      --cyan: #36ddff;
      --blue: #397cff;
      --violet: #956dff;
      --green: #3af0b5;
      --amber: #ffc45c;
      --red: #ff647d;
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -4%, rgba(54, 221, 255, 0.11), transparent 27%),
        radial-gradient(circle at 88% 0%, rgba(149, 109, 255, 0.1), transparent 26%),
        linear-gradient(rgba(73, 179, 229, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(73, 179, 229, 0.032) 1px, transparent 1px),
        var(--bg);
      background-size: auto, auto, 44px 44px, 44px 44px, auto;
      font-family: Inter, &quot;SF Pro Display&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    #echarts6-bar-combination-gallery::after {
      content: &quot;&quot;;
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(150, 229, 255, 0.05) 4px);
      mix-blend-mode: screen;
    }

    #echarts6-bar-combination-gallery * { box-sizing: border-box; }
    #echarts6-bar-combination-gallery button { font: inherit; }

    .e6c-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1900px;
      margin: 0 auto;
    }

    .e6c-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 14px;
      padding: 0 2px 14px;
      border-bottom: 1px solid rgba(90, 218, 255, 0.16);
    }

    .e6c-heading-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .e6c-beacon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 5px rgba(54, 221, 255, 0.1), 0 0 16px rgba(54, 221, 255, 0.7);
    }

    .e6c-header h1 {
      margin: 0;
      font-size: clamp(23px, 1.9vw, 33px);
      line-height: 1.1;
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .e6c-header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .e6c-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .e6c-chip,
    .e6c-button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--muted);
      background: rgba(18, 52, 88, 0.58);
      font-size: 11px;
      font-weight: 500;
    }

    .e6c-chip strong { color: var(--cyan); font-weight: 500; }

    .e6c-button {
      color: var(--text);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .e6c-button:hover {
      border-color: var(--line-hot);
      background: rgba(26, 72, 113, 0.72);
      transform: translateY(-1px);
    }

    .e6c-button:active { transform: none; }

    .e6c-button[aria-pressed=&quot;true&quot;] {
      border-color: rgba(58, 240, 181, 0.42);
      color: #c9ffed;
      background: rgba(22, 104, 84, 0.3);
    }

    .e6c-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .e6c-panel {
      position: relative;
      min-width: 0;
      min-height: 316px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(54, 192, 255, 0.042), transparent 38%), var(--panel);
      box-shadow: inset 0 1px 0 rgba(142, 229, 255, 0.04);
    }

    .e6c-panel::before,
    .e6c-panel::after {
      content: &quot;&quot;;
      position: absolute;
      z-index: 3;
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .e6c-panel::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid rgba(83, 224, 255, 0.72);
      border-left: 2px solid rgba(83, 224, 255, 0.72);
    }

    .e6c-panel::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid rgba(113, 127, 255, 0.45);
      border-bottom: 2px solid rgba(113, 127, 255, 0.45);
    }

    .e6c-panel-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 11px 7px;
    }

    .e6c-title-wrap { min-width: 0; }

    .e6c-code {
      display: block;
      margin-bottom: 3px;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .e6c-panel h2 {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      line-height: 1.25;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .e6c-tag {
      flex: 0 0 auto;
      max-width: 118px;
      overflow: hidden;
      padding: 4px 6px;
      border: 1px solid rgba(54, 221, 255, 0.18);
      border-radius: 3px;
      color: rgba(191, 238, 255, 0.72);
      background: rgba(39, 144, 194, 0.09);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .e6c-chart {
      width: 100%;
      height: 215px;
    }

    .e6c-panel-foot {
      min-height: 41px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 11px 9px;
      border-top: 1px solid rgba(88, 215, 255, 0.075);
      color: var(--faint);
      font-size: 11px;
      line-height: 1.4;
    }

    .e6c-panel-foot strong { color: var(--muted); font-weight: 500; }

    .e6c-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      padding: 11px 2px 0;
      border-top: 1px solid rgba(89, 218, 255, 0.12);
      color: var(--faint);
      font-size: 11px;
      line-height: 1.5;
    }

    .e6c-notes { display: flex; flex-wrap: wrap; gap: 12px; }
    .e6c-notes span::before {
      content: &quot;&quot;;
      width: 5px;
      height: 5px;
      display: inline-block;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 7px rgba(54, 221, 255, 0.62);
      vertical-align: 1px;
    }

    .e6c-error {
      display: none;
      margin-bottom: 12px;
      padding: 11px;
      border: 1px solid rgba(255, 100, 125, 0.34);
      color: #ffdce2;
      background: rgba(112, 28, 50, 0.32);
      font-size: 12px;
    }

    .e6c-error.is-visible { display: block; }

    @media (max-width: 920px) {
      .e6c-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .e6c-header { align-items: flex-start; flex-direction: column; }
      .e6c-tools { justify-content: flex-start; }
    }
    @media (max-width: 620px) {
      #echarts6-bar-combination-gallery { padding: 12px; }
      .e6c-grid { grid-template-columns: 1fr; }
      .e6c-chart { height: 225px; }
      .e6c-footer { align-items: flex-start; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { .e6c-button { transition: none; } }

 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;

    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);

      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }

  /* ---------- 主题应用 ---------- */
  var stageEls = null;
  function findStageEls() {
    // 全屏级不透明底色容器（各实验室的&quot;舞台&quot;div），换主题时一并换底
    var out = [];
    var vw = window.innerWidth, vh = window.innerHeight;
    var candidates = document.body.querySelectorAll(&quot;:scope &gt; *, :scope &gt; * &gt; *&quot;);
    candidates.forEach(function (el) {
      if (el.id === &quot;lab-theme-widget&quot; || el.id === &quot;lab-copy-modal&quot;) return;
      if (el.offsetWidth &lt; vw * 0.9 || el.offsetHeight &lt; vh * 0.6) return;
      var c = parseColor(getComputedStyle(el).backgroundColor);
      if (c &amp;&amp; c.a &gt; 0.5) out.push({ el: el, orig: el.style.getPropertyValue(&quot;background-color&quot;) });
    });
    return out;
  }

  function applyTheme(theme) {
    activeTheme = theme;
    var root = document.documentElement;
    if (!stageEls) stageEls = findStageEls();
    stageEls.forEach(function (s) {
      if (theme &amp;&amp; theme.bg) s.el.style.setProperty(&quot;background-color&quot;, theme.bg, &quot;important&quot;);
      else if (s.orig) s.el.style.setProperty(&quot;background-color&quot;, s.orig);
      else s.el.style.removeProperty(&quot;background-color&quot;);

    else root.style.removeProperty(&quot;--primary&quot;);

      root.style.setProperty(&quot;--lab-bg&quot;, theme.bg);

    } else {
      root.style.removeProperty(&quot;--background&quot;);
      root.style.removeProperty(&quot;--lab-bg&quot;);
      root.classList.remove(&quot;lab-themed&quot;);

  /* ---------- 复制配置 ---------- */
  function serializeJS(value, indent) {
    var pad = &quot;  &quot;.repeat(indent), padIn = &quot;  &quot;.repeat(indent + 1);

    if (value === undefined) return &quot;undefined&quot;;

    if (t === &quot;string&quot;) return JSON.stringify(value);
    if (t === &quot;function&quot;) {

    }
    if (Array.isArray(value)) {

            {id:&quot;pf&quot;,name:&quot;女&quot;,type:&quot;bar&quot;,stack:&quot;pyr&quot;,data:female,barWidth:15,itemStyle:{color:hgrad(&quot;#5f42ac&quot;,&quot;#b28cff&quot;),borderRadius:[0,3,3,0],shadowColor:&quot;rgba(149,109,255,.3)&quot;,shadowBlur:8},label:{show:true,position:&quot;right&quot;,color:C.muted,fontSize:11}}
          ] };

      function tornado(initial) {
        const names=[&quot;原材料价格&quot;,&quot;汇率波动&quot;,&quot;市场销量&quot;,&quot;人工成本&quot;,&quot;税率&quot;,&quot;物流费用&quot;];

          grid:{left:82,right:26,top:31,bottom:22},

          series:[
            {id:&quot;tlo&quot;,name:&quot;下限影响&quot;,type:&quot;bar&quot;,stack:&quot;tor&quot;,data:rows.map(r=&gt;r.lo),barWidth:14,itemStyle:{color:hgrad(&quot;#81213f&quot;,C.red),borderRadius:[3,0,0,3],shadowColor:&quot;rgba(255,100,125,.24)&quot;,shadowBlur:8},label:{show:true,position:&quot;left&quot;,color:C.muted,fontSize:11}},
            {id:&quot;thi&quot;,name:&quot;上限影响&quot;,type:&quot;bar&quot;,stack:&quot;tor&quot;,data:rows.map(r=&gt;r.hi),barWidth:14,itemStyle:{color:hgrad(C.green,&quot;#237793&quot;),borderRadius:[0,3,3,0],shadowColor:&quot;rgba(58,240,181,.26)&quot;,shadowBlur:8},label:{show:true,position:&quot;right&quot;,color:C.muted,fontSize:11,formatter:p=&gt;`+${p.value}`}},
            {id:&quot;tbase&quot;,type:&quot;bar&quot;,data:rows.map(()=&gt;0),silent:true,markLine:{silent:true,symbol:[&quot;none&quot;,&quot;none&quot;],data:[{xAxis:0,lineStyle:{color:C.amber,type:&quot;dashed&quot;},label:{formatter:&quot;基准&quot;,color:C.amber,fontSize:11}}]}}

      function pctStack(initial) {
        const a=vary([32,45,28,38,30],5,10,60),b=vary([40,30,44,34,42],5,10,60),c=vary([28,25,28,28,28],5,10,60);
        const tot=a.map((_,i)=&gt;a[i]+b[i]+c[i]);
        const pct=arr=&gt;arr.map((v,i)=&gt;+(v/tot[i]*100).toFixed(1));
        const pa=pct(a),pb=pct(b),pc=pct(c);
        const s=(id,name,data,c1,c2,top=false)=&gt;({id,name,type:&quot;bar&quot;,stack:&quot;pct&quot;,data,barWidth:26,itemStyle:{color:grad(c1,c2),borderColor:&quot;rgba(10,30,60,.4)&quot;,borderWidth:1,...(top?{borderRadius:[6,6,0,0]}:{})},label:{show:true,position:&quot;inside&quot;,color:C.text,fontSize:10,formatter:p=&gt;p.value&gt;=8?p.value+&quot;%&quot;:&quot;&quot;}});

      function polarStack(initial) {

      const builders = [aurora,ghost,crystal,outline,neonTarget,segments,dots,heat,cuboid,cylinderMirror,trapezoid,prism,stack,grouped,waterfall,diverging,ranking,capsule,bullet,halo,polar,scan,tower,alarm,pyramid,tornado,pctStack,polarStack];

      function renderAll(initial) {
        builders.forEach((builder,index) =&gt; {
          const node=document.getElementById(`e6c-chart-${index+1}`);
          if(!node)return;
          if(!charts[index])charts[index]=echarts.init(node,null,{renderer:&quot;canvas&quot;});

      const refresh=document.getElementById(&quot;e6c-refresh&quot;),motion=document.getElementById(&quot;e6c-motion&quot;),time=document.getElementById(&quot;e6c-time&quot;);
      const syncMotion=()=&gt;{motion.setAttribute(&quot;aria-pressed&quot;,String(motionEnabled));motion.textContent=motionEnabled?&quot;更新动效：开&quot;:&quot;更新动效：关&quot;;};
      refresh.addEventListener(&quot;click&quot;,()=&gt;{wave+=1;renderAll(false);time.textContent=`最近刷新 ${new Date().toLocaleTimeString(&quot;zh-CN&quot;,{hour12:false})}`;});
      motion.addEventListener(&quot;click&quot;,()=&gt;{motionEnabled=!motionEnabled;syncMotion();renderAll(false);});
      reducedMotion.addEventListener?.(&quot;change&quot;,event=&gt;{if(event.matches){motionEnabled=false;syncMotion();renderAll(false);}});

      let frame=0;
      const resize=()=&gt;{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=&gt;charts.forEach(chart=&gt;chart&amp;&amp;chart.resize()));};
      if(&quot;ResizeObserver&quot; in window){const observer=new ResizeObserver(resize);observer.observe(root);}else{addEventListener(&quot;resize&quot;,resize);}

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
