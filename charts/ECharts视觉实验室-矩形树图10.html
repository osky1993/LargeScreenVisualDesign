&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {
  &quot;use strict&quot;;
  if (!window.echarts || window.LabAddons) return;
  function probe(tag, data) {
    try { if (parent !== window) parent.postMessage(&quot;LABADDONS:&quot; + tag + &quot;:&quot; + JSON.stringify(data || {}), &quot;*&quot;); } catch (_) { /* noop */ }
  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,
      rect: w ? w.getBoundingClientRect().toJSON() : null,
      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight
    });
  });

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l &gt; 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g &lt; b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l, a: a };
  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;

        group(&quot;原材料&quot;, [leaf(&quot;金属材料&quot;, 60, 160), leaf(&quot;电子元件&quot;, 50, 140), leaf(&quot;包装物料&quot;, 20, 70)]),
        group(&quot;在制品&quot;, [leaf(&quot;装配产线&quot;, 40, 110), leaf(&quot;机加产线&quot;, 30, 90)]),
        group(&quot;产成品&quot;, [leaf(&quot;A 系列整机&quot;, 80, 200), leaf(&quot;B 系列整机&quot;, 60, 150), leaf(&quot;C 系列配件&quot;, 30, 90)]),
        group(&quot;备件周转&quot;, [leaf(&quot;维修备件&quot;, 20, 70), leaf(&quot;周转物料&quot;, 20, 60)])
      ];
    }

    function treeTotal(data) {
      return data.reduce((s, node) =&gt; s + node.value, 0);
    }
    function eachLeaf(data, fn) {
      data.forEach((node) =&gt; {
        if (node.children) eachLeaf(node.children, fn);
        else fn(node);
      });
    }

    /* ---------- 公共构件 ---------- */
    function baseOption() {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 800 : 0,
        animationDurationUpdate: motionEnabled ? 600 : 0,
        animationEasing: &quot;cubicOut&quot;,
        tooltip: {
          trigger: &quot;item&quot;,
          confine: true,
          backgroundColor: &quot;rgba(9, 24, 48, 0.92)&quot;,
          borderColor: &quot;rgba(102, 178, 255, 0.4)&quot;,
          textStyle: { color: &quot;#dcedff&quot;, fontSize: 12 },
          valueFormatter: (value) =&gt; `${value} 万元`
        }
      };
    }

    function treemapSeries(data, extra) {
      return Object.assign({
        type: &quot;treemap&quot;,
        data,
        left: 6, right: 6, top: 8, bottom: 8,
        roam: false,
        nodeClick: false,
        breadcrumb: { show: false },
        label: { color: &quot;#f0f7ff&quot;, fontSize: 11, overflow: &quot;truncate&quot; },
        itemStyle: { borderColor: DARK_BORDER, borderWidth: 1, gapWidth: 2 }
      }, extra || {});
    }

    /* 常用层级：组按调色板取色，叶子做饱和度深浅 */
    function classicLevels() {
      return [
        {},
        { itemStyle: { borderColor: DARK_BORDER, borderWidth: 2, gapWidth: 3 } },
        { colorSaturation: [0.32, 0.62], itemStyle: { gapWidth: 1, borderColorSaturation: 0.45 } }
      ];
    }

    /* ---------- 十方案 ---------- */
    const builders = {
      &quot;e6tm-standard&quot;: () =&gt; {
        const option = baseOption();
        option.series = [treemapSeries(budgetTree(), {
          color: PALETTE,
          levels: classicLevels(),
          label: {
            fontSize: 11, lineHeight: 15, color: &quot;#f0f7ff&quot;, overflow: &quot;truncate&quot;,
            formatter: (p) =&gt; `${p.name}\n${p.value} 万元`
          }
        })];
        return option;
      },
      &quot;e6tm-gradient&quot;: () =&gt; {
        const data = budgetTree();
        data.forEach((g, i) =&gt; {
          const base = PALETTE[i % PALETTE.length];
          g.itemStyle = { color: base };
          g.children.forEach((c, j) =&gt; {
            c.itemStyle = { color: vGrad(shade(base, 0.3 - j * 0.06), shade(base, -0.28 - j * 0.05)) };
          });
        });
        const option = baseOption();
        option.series = [treemapSeries(data, {
          levels: [
            {},
            { itemStyle: { borderColor: DARK_BORDER, borderWidth: 2, gapWidth: 4 } },
            { itemStyle: { gapWidth: 2, borderWidth: 0 } }
          ],
          label: { fontSize: 11, color: &quot;#f0f7ff&quot;, fontWeight: 600, formatter: (p) =&gt; `${p.name}\n${p.value} 万元`, lineHeight: 15 },
          itemStyle: { borderWidth: 0, gapWidth: 2 }
        })];
        return option;
      },
      &quot;e6tm-drill&quot;: () =&gt; {
        const option = baseOption();
        option.series = [treemapSeries(industryTree(), {
          color: PALETTE,
          leafDepth: 1,
          nodeClick: &quot;zoomToNode&quot;,
          bottom: 30,
          breadcrumb: {
            show: true, left: &quot;center&quot;, bottom: 2, height: 20,
            itemStyle: {
              color: &quot;rgba(20, 50, 95, 0.9)&quot;,
              borderColor: &quot;rgba(102, 178, 255, 0.45)&quot;, borderWidth: 1,
              textStyle: { color: &quot;#cfe6ff&quot;, fontSize: 11 }
            },
            emphasis: { itemStyle: { color: &quot;rgba(48, 104, 180, 0.9)&quot; } }
          },
          levels: [
            {},
            { itemStyle: { borderColor: DARK_BORDER, borderWidth: 2, gapWidth: 3 } },
            { colorSaturation: [0.3, 0.6], itemStyle: { gapWidth: 1 } }
          ],
          label: { fontSize: 12, formatter: (p) =&gt; `${p.name}\n${p.value} 亿元` }
        })];
        option.tooltip.valueFormatter = (value) =&gt; `${value} 亿元`;
        return option;
      },
      &quot;e6tm-richlabel&quot;: () =&gt; {
        const data = budgetTree();
        const total = treeTotal(data);
        eachLeaf(data, (c) =&gt; { c.pct = (c.value / total * 100).toFixed(1); });
        const option = baseOption();
        option.series = [treemapSeries(data, {
          color: PALETTE,
          upperLabel: {
            show: true, height: 24, color: &quot;#dcecff&quot;, fontSize: 12, fontWeight: 600,
            formatter: (p) =&gt; `${p.name} · ${p.value} 万元`
          },
          levels: [
            {},
            { itemStyle: { borderColor: DARK_BORDER, borderWidth: 4, gapWidth: 4 }, upperLabel: { show: true } },
            { colorSaturation: [0.3, 0.58], itemStyle: { gapWidth: 1, borderColorSaturation: 0.4 } }
          ],
          label: {
            formatter: (p) =&gt; `{nm|${p.name}}\n{amt|${p.value} 万元}\n{pct|占 ${p.data.pct}%}`,
            rich: {
              nm: { color: &quot;#f0f7ff&quot;, fontSize: 12, lineHeight: 16 },
              amt: { color: &quot;#8fd8ff&quot;, fontSize: 10, lineHeight: 14 },
              pct: { color: &quot;#ffd79a&quot;, fontSize: 10, lineHeight: 14 }
            }
          }
        })];
        return option;
      },
      &quot;e6tm-mono&quot;: () =&gt; {
        const flat = [];
        inventoryTree().forEach((g) =&gt; g.children.forEach((c) =&gt; flat.push({ name: c.name, value: c.value })));
        const values = flat.map((n) =&gt; n.value);
        const option = baseOption();
        option.series = [treemapSeries(flat, {
          visualMin: Math.min(...values) * 0.8,
          visualMax: Math.max(...values),
          color: [&quot;#123a6e&quot;, &quot;#1b4f90&quot;, &quot;#2767b4&quot;, &quot;#3b83d4&quot;, &quot;#5ba2ea&quot;, &quot;#86c2fa&quot;],
          colorMappingBy: &quot;value&quot;,
          label: { fontSize: 11, lineHeight: 15, color: &quot;#eaf4ff&quot;, formatter: (p) =&gt; `${p.name}\n${p.value} 件` },
          itemStyle: { borderColor: &quot;rgba(8, 22, 44, 0.95)&quot;, borderWidth: 2, gapWidth: 2 }
        })];
        option.tooltip.valueFormatter = (value) =&gt; `${value} 件`;
        return option;
      },
      &quot;e6tm-card&quot;: () =&gt; {
        const option = baseOption();
        option.series = [treemapSeries(inventoryTree(), {
          color: PALETTE,
          upperLabel: { show: true, height: 26, color: &quot;#eaf4ff&quot;, fontSize: 12, fontWeight: 600 },
          itemStyle: { borderRadius: 8, borderColor: &quot;#0a1e3c&quot;, borderWidth: 3, gapWidth: 8 },
          levels: [
            {},
            { itemStyle: { borderRadius: 12, borderColor: &quot;#0a1e3c&quot;, borderWidth: 4, gapWidth: 10 }, upperLabel: { show: true } },
            { colorSaturation: [0.34, 0.6], itemStyle: { borderRadius: 8, borderColor: &quot;#0a1e3c&quot;, borderWidth: 3, gapWidth: 6 } }
          ],
          label: { fontSize: 11, lineHeight: 15, formatter: (p) =&gt; `${p.name}\n${p.value} 件` }
        })];
        option.tooltip.valueFormatter = (value) =&gt; `${value} 件`;
        return option;
      },
      &quot;e6tm-yoy&quot;: () =&gt; {
        const data = inventoryTree();
        const total = treeTotal(data);
        eachLeaf(data, (c) =&gt; {
          c.pct = (c.value / total * 100).toFixed(1);
          c.yoy = ((Math.random() * 24 - 12)).toFixed(1);
        });
        const option = baseOption();
        option.series = [treemapSeries(data, {
          color: PALETTE,
          levels: classicLevels(),
          label: {
            formatter: (p) =&gt; {
              const up = Number(p.data.yoy) &gt;= 0;
              const tag = up ? &quot;up&quot; : &quot;dn&quot;;
              const arrow = up ? &quot;↑&quot; : &quot;↓&quot;;
              return `{nm|${p.name}}\n{pct|${p.data.pct}%}\n{${tag}|同比 ${arrow} ${Math.abs(Number(p.data.yoy))}%}`;
            },
            rich: {
              nm: { color: &quot;#f0f7ff&quot;, fontSize: 11, lineHeight: 15 },
              pct: { color: &quot;#9fd8ff&quot;, fontSize: 10, lineHeight: 13 },
              up: { color: &quot;#38e6b0&quot;, fontSize: 10, lineHeight: 13, fontWeight: 600 },
              dn: { color: &quot;#ff6680&quot;, fontSize: 10, lineHeight: 13, fontWeight: 600 }
            }
          }
        })];
        option.tooltip.formatter = (p) =&gt;
          `${p.name}：${p.value} 件` + (p.data &amp;&amp; p.data.yoy != null ? `&lt;br/&gt;占比 ${p.data.pct}% · 同比 ${p.data.yoy}%` : &quot;&quot;);
        return option;
      },
      &quot;e6tm-breadcrumb&quot;: () =&gt; {
        const option = baseOption();
        option.series = [treemapSeries(industryTree(), {
          color: PALETTE,
          nodeClick: &quot;zoomToNode&quot;,
          top: 34,
          breadcrumb: {
            show: true, left: 4, top: 2, height: 22, emptyItemWidth: 34,
            itemStyle: {
              color: &quot;rgba(12, 32, 64, 0.94)&quot;,
              borderColor: &quot;rgba(63, 225, 255, 0.5)&quot;, borderWidth: 1,
              shadowBlur: 0,
              textStyle: { color: &quot;#3fe1ff&quot;, fontSize: 11, fontWeight: 600 }
            },
            emphasis: {
              itemStyle: {
                color: &quot;rgba(24, 70, 130, 0.95)&quot;,
                borderColor: &quot;rgba(63, 225, 255, 0.9)&quot;,
                textStyle: { color: &quot;#eafaff&quot; }
              }
            }
          },
          upperLabel: { show: true, height: 20, color: &quot;#dcecff&quot;, fontSize: 11 },
          levels: [
            {},
            { itemStyle: { borderColor: DARK_BORDER, borderWidth: 3, gapWidth: 3 }, upperLabel: { show: true } },
            { colorSaturation: [0.32, 0.58], itemStyle: { gapWidth: 2, borderColorSaturation: 0.5 } },
            { colorSaturation: [0.3, 0.55], itemStyle: { gapWidth: 1 } }
          ],
          label: { fontSize: 10, formatter: (p) =&gt; p.name }
        })];
        option.tooltip.valueFormatter = (value) =&gt; `${value} 亿元`;
        return option;
      },
      &quot;e6tm-focus&quot;: () =&gt; {
        const option = baseOption();
        option.series = [treemapSeries(industryTree(), {
          color: PALETTE,
          upperLabel: { show: true, height: 20, color: &quot;#dcecff&quot;, fontSize: 11 },
          levels: [
            {},
            { itemStyle: { borderColor: DARK_BORDER, borderWidth: 3, gapWidth: 3 }, upperLabel: { show: true } },
            { colorSaturation: [0.32, 0.58], itemStyle: { gapWidth: 2 } },
            { colorSaturation: [0.3, 0.55], itemStyle: { gapWidth: 1 } }
          ],
          label: { fontSize: 10, formatter: (p) =&gt; p.name },
          emphasis: {
            focus: &quot;descendant&quot;,
            itemStyle: { shadowBlur: 14, shadowColor: &quot;rgba(63, 225, 255, 0.45)&quot; },
            label: { fontWeight: 600 }
          },
          blur: {
            itemStyle: { opacity: 0.28 },
            label: { opacity: 0.25 },
            upperLabel: { opacity: 0.25 }
          }
        })];
        option.tooltip.valueFormatter = (value) =&gt; `${value} 亿元`;
        return option;
      },
      &quot;e6tm-compare-a&quot;: () =&gt; compareOption(&quot;本期结构&quot;, 1),
      &quot;e6tm-compare-b&quot;: () =&gt; compareOption(&quot;上期结构&quot;, 0.86)
    };

    function compareOption(title, scale) {
      const data = budgetTree();
      eachLeaf(data, (c) =&gt; { c.value = Math.max(8, Math.round(c.value * scale)); });
      data.forEach((g) =&gt; { g.value = g.children.reduce((s, c) =&gt; s + c.value, 0); });
      const option = baseOption();
      option.title = {
        text: title, left: &quot;center&quot;, top: 0,
        textStyle: { color: &quot;#bfe0ff&quot;, fontSize: 12, fontWeight: 600 }
      };
      option.series = [treemapSeries(data, {
        color: PALETTE,
        top: 24,
        levels: classicLevels(),
        label: { fontSize: 10, formatter: (p) =&gt; p.name }
      })];
      return option;
    }

    /* ---------- 渲染与控制 ---------- */
    const charts = {};
    function renderAll() {
      Object.entries(builders).forEach(([id, build]) =&gt; {
        const element = document.getElementById(id);
        if (!element) return;
        if (!charts[id]) charts[id] = echarts.init(element, null, { renderer: &quot;canvas&quot; });
        charts[id].setOption(build(), { notMerge: true, lazyUpdate: false });
      });
    }

    const refreshButton = document.getElementById(&quot;e6tm-refresh&quot;);
    const motionButton = document.getElementById(&quot;e6tm-motion&quot;);

    refreshButton.addEventListener(&quot;click&quot;, () =&gt; {
      renderAll();
    });

    function syncMotionButton() {
      motionButton.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionButton.textContent = motionEnabled ? &quot;更新动效：开&quot; : &quot;更新动效：关&quot;;
    }

    motionButton.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      syncMotionButton();
      renderAll();
    });

    reducedMotion.addEventListener?.(&quot;change&quot;, (event) =&gt; {
      if (event.matches) {
        motionEnabled = false;
        syncMotionButton();
        renderAll();
      }
    });

    let resizeFrame = 0;
    const resizeCharts = () =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() =&gt; Object.values(charts).forEach((chart) =&gt; chart.resize()));
    };
    if (&quot;ResizeObserver&quot; in window) {
      new ResizeObserver(resizeCharts).observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    syncMotionButton();
    renderAll();
  })();
  &lt;/script&gt;
