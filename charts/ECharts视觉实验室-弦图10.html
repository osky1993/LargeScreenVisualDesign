&lt;head&gt;

&lt;title&gt;ECharts 6 弦图视觉效果库&lt;/title&gt;
&lt;style&gt;
  :root {
    --cd-bg: #0a1e3c;
    --cd-panel: rgba(13, 34, 64, 0.72);
    --cd-border: rgba(86, 150, 224, 0.28);
    --cd-text: #e6f1ff;
    --cd-muted: #8fa7c8;
    --cd-cyan: #3fe1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--cd-text);
    font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, &quot;Segoe UI&quot;, sans-serif;
    background:
      radial-gradient(circle at 12% 0%, rgba(63, 225, 255, 0.10), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(75, 125, 255, 0.12), transparent 46%),
      linear-gradient(rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      var(--cd-bg);
    background-size: auto, auto, 44px 44px, 44px 44px, auto;
  }
  .e6cd-shell { max-width: 1560px; margin: 0 auto; padding: 26px 24px 48px; }
  .e6cd-header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between;
    padding-bottom: 18px; border-bottom: 1px solid rgba(86, 150, 224, 0.22); margin-bottom: 22px;
  }
  .e6cd-header h1 {
    margin: 0 0 6px; font-size: clamp(24px, 2vw, 32px); letter-spacing: 0.02em;
    background: linear-gradient(100deg, #e8f6ff 20%, #7cc7ff 75%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .e6cd-header p { margin: 0; color: var(--cd-muted); font-size: 13px; }
  .e6cd-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .e6cd-chip {
    font-size: 12px; color: var(--cd-muted); padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--cd-border); background: rgba(16, 42, 78, 0.6);
  }
  .e6cd-chip strong { color: #bfe0ff; font-weight: 600; }
  .e6cd-chip.is-pass strong { color: #6ef0c2; }
  .e6cd-chip.is-fail { border-color: rgba(255, 122, 122, 0.55); }
  .e6cd-chip.is-fail strong { color: #ff9d9d; }
  .e6cd-button {
    font: inherit; font-size: 13px; color: #d7ecff; padding: 9px 16px; border-radius: 10px;
    border: 1px solid rgba(102, 178, 255, 0.45); background: rgba(33, 76, 133, 0.55); cursor: pointer;
    transition: background 0.2s ease;
  }
  .e6cd-button:hover, .e6cd-button:focus-visible { background: rgba(52, 106, 174, 0.7); }
  .e6cd-button:focus-visible { outline: 2px solid #7cc7ff; outline-offset: 2px; }
  .e6cd-minibtn {
    font: inherit; font-size: 11px; color: #9fd8ff; padding: 4px 10px; border-radius: 999px;
    border: 1px solid rgba(111, 185, 232, 0.4); background: rgba(26, 60, 104, 0.55); cursor: pointer;
    white-space: nowrap;
  }
  .e6cd-minibtn:hover, .e6cd-minibtn:focus-visible { background: rgba(40, 86, 142, 0.7); }
  .e6cd-minibtn:focus-visible { outline: 2px solid #7cc7ff; outline-offset: 2px; }
  .e6cd-minibtn[aria-pressed=&quot;true&quot;] { border-color: rgba(76, 226, 180, 0.6); color: #6ef0c2; }
  .e6cd-error {
    display: none; margin: 0 0 18px; padding: 14px 18px; border-radius: 12px;
    border: 1px solid rgba(255, 122, 122, 0.5); background: rgba(96, 26, 38, 0.5); color: #ffd9d9; font-size: 13px;
  }
  .e6cd-error.is-visible { display: block; }
  .e6cd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(470px, 1fr)); gap: 18px; }
  @media (max-width: 520px) { .e6cd-grid { grid-template-columns: 1fr; } }
  .e6cd-panel {
    position: relative; border-radius: 14px; border: 1px solid var(--cd-border);
    background: var(--cd-panel); padding: 16px 18px 12px; overflow: hidden;
  }
  .e6cd-panel::before {
    content: &quot;&quot;; position: absolute; left: 0; top: 0; width: 42px; height: 3px;
    background: linear-gradient(90deg, var(--cd-cyan), transparent);
  }
  .e6cd-panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .e6cd-panel-heading { min-width: 0; }
  .e6cd-panel-index { font-size: 11px; letter-spacing: 0.14em; color: #6fb9e8; }
  .e6cd-panel-heading h2 { margin: 4px 0 0; font-size: 17px; font-weight: 600; color: #f0f7ff; }
  .e6cd-panel-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; max-width: 55%; }
  .e6cd-level {
    flex: none; font-size: 11px; color: #9fd8ff; padding: 5px 10px; border-radius: 999px;
    border: 1px solid rgba(111, 185, 232, 0.4); background: rgba(26, 60, 104, 0.55); white-space: nowrap;
  }
  .e6cd-level.is-key { color: #ffd79a; border-color: rgba(255, 200, 87, 0.45); background: rgba(84, 62, 22, 0.4); }
  .e6cd-chart { position: relative; width: 100%; height: 340px; margin-top: 8px; }
  .e6cd-panel-footer {
    display: flex; flex-direction: column; gap: 4px; padding: 10px 2px 4px;
    border-top: 1px dashed rgba(86, 150, 224, 0.25); margin-top: 6px;
    font-size: 12px; color: var(--cd-muted);
  }
  .e6cd-panel-footer strong { color: #bfe0ff; font-weight: 600; }
  .e6cd-note { color: #ffb4a8; }
  .e6cd-note:empty { display: none; }

&lt;body&gt;
  &lt;div class=&quot;e6cd-shell&quot;&gt;
    &lt;header class=&quot;e6cd-header&quot;&gt;
      &lt;div&gt;
        &lt;h1&gt;ECharts 6 弦图视觉效果库&lt;/h1&gt;
        &lt;p&gt;闭环、多对多与双向关系的十种弦图表达 · 原生 chord 系列 · 输入校验与数值守恒&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;e6cd-meta&quot; aria-label=&quot;演示控制&quot;&gt;
        &lt;span class=&quot;e6cd-chip&quot;&gt;背景 &lt;strong&gt;RGB 10 · 30 · 60&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;e6cd-chip&quot;&gt;引擎 &lt;strong&gt;ECharts 6.1 原生 chord&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;e6cd-chip&quot; id=&quot;e6cd-selfcheck&quot;&gt;自检 &lt;strong&gt;运行中…&lt;/strong&gt;&lt;/span&gt;
        &lt;button class=&quot;e6cd-button&quot; id=&quot;e6cd-refresh&quot; type=&quot;button&quot;&gt;刷新数据&lt;/button&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;div class=&quot;e6cd-error&quot; id=&quot;e6cd-error&quot; role=&quot;alert&quot;&gt;ECharts 资源加载失败，请联网后重新打开此文件。&lt;/div&gt;

    &lt;main class=&quot;e6cd-grid&quot; aria-label=&quot;弦图视觉效果对照&quot;&gt;
      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;01 · CHORD&lt;/span&gt;&lt;h2&gt;标准无向弦图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;&lt;span class=&quot;e6cd-level&quot;&gt;联系强度&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c01&quot; role=&quot;img&quot; aria-label=&quot;八个主体之间联系强度的无向弦图，悬停聚焦相邻弦&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;业务往来次数 · 无向聚合去重（A–B 与 B–A 合并） · 节点顺序按 order 稳定排列 · 悬停聚焦相邻弦&lt;/span&gt;
          &lt;span class=&quot;e6cd-note&quot; id=&quot;e6cd-note-c01&quot;&gt;&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;02 · FUND FLOW&lt;/span&gt;&lt;h2&gt;定向资金流&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;&lt;span class=&quot;e6cd-level is-key&quot;&gt;资金监测&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c02&quot; role=&quot;img&quot; aria-label=&quot;资金来源到去向的定向弦图，弦色随来源方并以提示明示方向&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;资金流出方 → 流入方（亿元）· 弦色继承来源方 · Tooltip 明示「来源 → 去向」双要素表达方向 · 不适合弦图的严格流程数据应改用桑基图&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;03 · BILATERAL&lt;/span&gt;&lt;h2&gt;双边交易对照&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;&lt;span class=&quot;e6cd-level&quot;&gt;买卖对照&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c03&quot; role=&quot;img&quot; aria-label=&quot;机构间买入卖出双向交易额弦图，提示含双向值与净额&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;双向交易额（亿元）分别保留 · Tooltip 列出 A→B、B→A 与净额 · 净额仅为派生指标，不替代原始双向值&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;04 · COLLAB&lt;/span&gt;&lt;h2&gt;部门协作关系&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;
            &lt;button class=&quot;e6cd-minibtn&quot; id=&quot;e6cd-c04-filter&quot; type=&quot;button&quot;&gt;范围：全部&lt;/button&gt;
            &lt;span class=&quot;e6cd-level&quot;&gt;组织诊断&lt;/span&gt;
          &lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c04&quot; role=&quot;img&quot; aria-label=&quot;按前台中台后台分组的部门协作弦图，可筛选组内或跨组关系&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;弦宽=协作工单数（单一量纲，不混用工时）· 节点按组稳定排列 · 可筛选组内 / 跨组关系识别组织孤岛&lt;/span&gt;
          &lt;span class=&quot;e6cd-note&quot; id=&quot;e6cd-note-c04&quot;&gt;&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;05 · CONTAGION&lt;/span&gt;&lt;h2&gt;风险传染路径&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;
            &lt;button class=&quot;e6cd-minibtn&quot; id=&quot;e6cd-c05-focus&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;聚焦高风险&lt;/button&gt;
            &lt;span class=&quot;e6cd-level is-key&quot;&gt;风险敞口&lt;/span&gt;
          &lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c05&quot; role=&quot;img&quot; aria-label=&quot;机构间风险暴露弦图，节点色表风险等级弦宽表暴露金额&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;节点色=风险等级（输入给出）· 弦宽=暴露金额（亿元）两者分开编码 · 仅表达已提供的暴露关系，不由弦宽推断因果&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;06 · SUPPLY&lt;/span&gt;&lt;h2&gt;产业供需关系&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;
            &lt;button class=&quot;e6cd-minibtn&quot; id=&quot;e6cd-c06-fold&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;折叠为行业组&lt;/button&gt;
            &lt;span class=&quot;e6cd-level&quot;&gt;链路分析&lt;/span&gt;
          &lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c06&quot; role=&quot;img&quot; aria-label=&quot;产业间供给需求弦图，提示含金额与占来源占目标比，支持行业组折叠&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;供给方 → 需求方 采购额（亿元）· Tooltip 同时显示金额、占来源方比、占目标方比 · 可折叠为行业组观察依赖集中度&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;07 · TRANSFER&lt;/span&gt;&lt;h2&gt;区域调拨关系&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;&lt;span class=&quot;e6cd-level&quot;&gt;资源调度&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c07&quot; role=&quot;img&quot; aria-label=&quot;区域间物资调拨弦图，同大区与跨大区关系分色，区域顺序固定&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;物资调拨量（吨）· 区域顺序固定（按大区分组排列）· 同大区调拨弦为绿色系、跨大区为蓝色系 · 地理位置表达仍由地图承担&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;08 · GRADIENT&lt;/span&gt;&lt;h2&gt;分组渐变弦图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;&lt;span class=&quot;e6cd-level is-key&quot;&gt;群组结构&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c08&quot; role=&quot;img&quot; aria-label=&quot;弦两端按源目标组色渐变的分组弦图，组归属另以标签文字表达&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;跨群组数据交换量（TB）· 弦色由源/目标组色渐变生成（原生 gradient 弦色，主题切换自动重算）· 组归属同时用节点标签前缀表达，颜色非唯一手段&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;09 · TWO PERIODS&lt;/span&gt;&lt;h2&gt;双期对照弦图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;&lt;span class=&quot;e6cd-level&quot;&gt;结构演化&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6cd-chart&quot; id=&quot;e6cd-c09&quot; role=&quot;img&quot; aria-label=&quot;上期与本期并列的双弦图，节点顺序一致，新增与消失关系分色标记&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6cd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;合作金额（亿元）· 单实例双 series 并列，两期节点顺序与尺度一致 · 绿色=本期新增、红色=本期消失、蓝色=两期延续 · 并排静置对比，无动画切换&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6cd-panel&quot;&gt;
        &lt;header class=&quot;e6cd-panel-header&quot;&gt;
          &lt;div class=&quot;e6cd-panel-heading&quot;&gt;&lt;span class=&quot;e6cd-panel-index&quot;&gt;10 · TOP N&lt;/span&gt;&lt;h2&gt;TopN 与其他归并&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6cd-panel-tools&quot;&gt;
            &lt;button class=&quot;e6cd-minibtn&quot; id=&quot;e6cd-c10-mode&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;压力原始视图&lt;/button&gt;
            &lt;span class=&quot;e6cd-level is-key&quot;&gt;拥挤治理&lt;/span&gt;
          &lt;/div&gt;
        &lt;/header&gt;

  function hueDist(a, b) {

      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));

  function rgbToHsla(r, g, b, a) {

      amber: &quot;#ffc857&quot;, red: &quot;#ff6680&quot;, orange: &quot;#ff9360&quot;, steel: &quot;#6f8fb5&quot;, pink: &quot;#e96bb5&quot;
    };
    const PALETTE = [&quot;#3fe1ff&quot;, &quot;#4b7dff&quot;, &quot;#38e6b0&quot;, &quot;#ffc857&quot;, &quot;#9870ff&quot;, &quot;#ff9360&quot;, &quot;#e96bb5&quot;, &quot;#6f8fb5&quot;, &quot;#7fc8e8&quot;, &quot;#a4e07f&quot;, &quot;#ff9db8&quot;, &quot;#d2a8ff&quot;];

    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
    let motionEnabled = !reducedMotion.matches;

    function rnd(min, max) { return Math.round(min + Math.random() * (max - min)); }
    function rndf(min, max, digits) {
      const p = Math.pow(10, digits == null ? 1 : digits);
      return Math.round((min + Math.random() * (max - min)) * p) / p;
    }
    function setNote(id, text) {
      const node = document.getElementById(id);
      if (node) node.textContent = text || &quot;&quot;;
    }

    /* ================= 关系数据校验（T0 延后，本页内联实现） ================= */

    // 校验节点引用、重复边、自环、零值 / 负值。重复边按方向聚合求和；
    // 自环与非正值默认剔除（allowSelfLoop 可放开）。返回 { links, issues }。
    function validateLinks(nodes, links, opts) {
      opts = opts || {};
      const ids = {};
      nodes.forEach((n) =&gt; { ids[n.name] = true; });
      const merged = {};
      const issues = [];
      let dupCount = 0;
      links.forEach((l) =&gt; {
        if (!ids[l.source] || !ids[l.target]) { issues.push(&quot;无效引用 &quot; + l.source + &quot;→&quot; + l.target); return; }
        if (l.source === l.target &amp;&amp; !opts.allowSelfLoop) { issues.push(&quot;自环 &quot; + l.source + &quot; 已剔除&quot;); return; }
        if (typeof l.value !== &quot;number&quot; || !isFinite(l.value) || l.value &lt;= 0) { issues.push(&quot;非正值 &quot; + l.source + &quot;→&quot; + l.target); return; }
        const key = l.source + &quot;→&quot; + l.target;
        if (merged[key]) { merged[key].value += l.value; dupCount++; }
        else merged[key] = Object.assign({}, l);
      });
      if (dupCount) issues.push(&quot;聚合重复边 &quot; + dupCount + &quot; 条&quot;);
      return { links: Object.keys(merged).map((k) =&gt; merged[k]), issues };
    }

    // 无向聚合：A→B 与 B→A 合并为一条（按名称排序后的键）。
    function toUndirected(links) {
      const merged = {};
      links.forEach((l) =&gt; {
        const key = l.source &lt; l.target ? l.source + &quot;|&quot; + l.target : l.target + &quot;|&quot; + l.source;
        if (merged[key]) merged[key].value += l.value;
        else merged[key] = { source: l.source &lt; l.target ? l.source : l.target, target: l.source &lt; l.target ? l.target : l.source, value: l.value };
      });
      return Object.keys(merged).map((k) =&gt; merged[k]);
    }

    function totalValue(links) {
      return Math.round(links.reduce((a, l) =&gt; a + l.value, 0) * 100) / 100;
    }

    // TopN 归并：保留吞吐量前 N 的节点，其余并入「其他」，跨归并关系聚合并保留合计。
    function topNMerge(nodes, links, n) {
      const throughput = {};
      nodes.forEach((nd) =&gt; { throughput[nd.name] = 0; });
      links.forEach((l) =&gt; { throughput[l.source] += l.value; throughput[l.target] += l.value; });
      const kept = nodes.slice().sort((a, b) =&gt; throughput[b.name] - throughput[a.name]).slice(0, n).map((nd) =&gt; nd.name);
      const keptSet = {};
      kept.forEach((k) =&gt; { keptSet[k] = true; });
      const mapName = (x) =&gt; keptSet[x] ? x : &quot;其他&quot;;
      const merged = {};
      let hiddenCount = 0, hiddenValue = 0;
      links.forEach((l) =&gt; {
        const s = mapName(l.source), t = mapName(l.target);
        if (s === &quot;其他&quot; || t === &quot;其他&quot;) { hiddenCount++; hiddenValue += l.value; }
        if (s === t &amp;&amp; s === &quot;其他&quot;) {
          // 其他内部关系并入其他节点自身规模：以「其他↔其他」聚合保留合计
          const key = &quot;其他|其他&quot;;
          if (merged[key]) merged[key].value += l.value;
          else merged[key] = { source: &quot;其他&quot;, target: &quot;其他&quot;, value: l.value, cdSelf: true };
          return;
        }
        const key = s + &quot;|&quot; + t;
        if (merged[key]) merged[key].value += l.value;
        else merged[key] = { source: s, target: t, value: l.value };
      });
      return {
        nodes: kept.map((name) =&gt; ({ name })).concat([{ name: &quot;其他&quot;, itemStyle: { color: &quot;rgba(143, 167, 200, 0.6)&quot; } }]),
        links: Object.keys(merged).map((k) =&gt; merged[k]),
        hiddenCount, hiddenValue: Math.round(hiddenValue * 10) / 10
      };
    }

    /* ================= 页面自检（固定样本） ================= */

    function runSelfCheck() {
      const results = [];
      function check(name, fn) {
        try { results.push({ name, pass: fn() === true }); }
        catch (err) { results.push({ name, pass: false }); }
      }
      const nodes = [{ name: &quot;A&quot; }, { name: &quot;B&quot; }, { name: &quot;C&quot; }];
      check(&quot;无效引用被剔除&quot;, () =&gt; {
        const r = validateLinks(nodes, [{ source: &quot;A&quot;, target: &quot;X&quot;, value: 5 }, { source: &quot;A&quot;, target: &quot;B&quot;, value: 3 }]);
        return r.links.length === 1 &amp;&amp; r.issues.length === 1;
      });
      check(&quot;重复边聚合求和&quot;, () =&gt; {
        const r = validateLinks(nodes, [{ source: &quot;A&quot;, target: &quot;B&quot;, value: 3 }, { source: &quot;A&quot;, target: &quot;B&quot;, value: 2 }]);
        return r.links.length === 1 &amp;&amp; r.links[0].value === 5;
      });
      check(&quot;自环与非正值被剔除&quot;, () =&gt; {
        const r = validateLinks(nodes, [{ source: &quot;A&quot;, target: &quot;A&quot;, value: 3 }, { source: &quot;B&quot;, target: &quot;C&quot;, value: 0 }, { source: &quot;A&quot;, target: &quot;B&quot;, value: -2 }]);
        return r.links.length === 0 &amp;&amp; r.issues.length === 3;
      });
      check(&quot;无向聚合双向合并&quot;, () =&gt; {
        const u = toUndirected([{ source: &quot;A&quot;, target: &quot;B&quot;, value: 3 }, { source: &quot;B&quot;, target: &quot;A&quot;, value: 4 }]);
        return u.length === 1 &amp;&amp; u[0].value === 7;
      });
      check(&quot;TopN 归并数值守恒&quot;, () =&gt; {
        const ns = [{ name: &quot;A&quot; }, { name: &quot;B&quot; }, { name: &quot;C&quot; }, { name: &quot;D&quot; }];
        const ls = [
          { source: &quot;A&quot;, target: &quot;B&quot;, value: 10 }, { source: &quot;A&quot;, target: &quot;C&quot;, value: 6 },
          { source: &quot;C&quot;, target: &quot;D&quot;, value: 2 }, { source: &quot;B&quot;, target: &quot;D&quot;, value: 3 }
        ];
        const m = topNMerge(ns, ls, 2);
        return totalValue(m.links) === totalValue(ls);
      });
      const passCount = results.filter((r) =&gt; r.pass).length;
      const chip = document.getElementById(&quot;e6cd-selfcheck&quot;);
      chip.innerHTML = &quot;&quot;;
      chip.append(&quot;自检 &quot;);
      const strong = document.createElement(&quot;strong&quot;);
      strong.textContent = passCount + &quot;/&quot; + results.length + (passCount === results.length ? &quot; 通过&quot; : &quot; 未通过&quot;);
      chip.appendChild(strong);
      chip.classList.add(passCount === results.length ? &quot;is-pass&quot; : &quot;is-fail&quot;);
      if (passCount !== results.length) {
        errorNode.textContent = &quot;页面自检未通过：&quot; + results.filter((r) =&gt; !r.pass).map((r) =&gt; r.name).join(&quot;、&quot;);
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }

    /* ================= 公共构件 ================= */

    function baseOption() {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 600 : 0,
        animationDurationUpdate: motionEnabled ? 400 : 0,
        tooltip: {
          confine: true,
          backgroundColor: &quot;rgba(9, 24, 48, 0.92)&quot;,
          borderColor: &quot;rgba(102, 178, 255, 0.4)&quot;,
          textStyle: { color: &quot;#dcedff&quot;, fontSize: 12 }
        }
      };
    }
    function chordSeries(extra) {
      return Object.assign({
        type: &quot;chord&quot;,
        radius: [&quot;58%&quot;, &quot;68%&quot;],
        label: { show: true, color: &quot;#bfe0ff&quot;, fontSize: 10 },
        itemStyle: { borderWidth: 1, borderColor: &quot;rgba(10, 30, 60, 0.9)&quot; },
        lineStyle: { color: &quot;source&quot;, opacity: 0.5 },
        emphasis: { focus: &quot;adjacency&quot;, lineStyle: { opacity: 0.85 } }
      }, extra || {});
    }

    /* ================= 方案构建器 ================= */

    /* ---------- C01 标准无向弦图 ---------- */
    function buildC01() {
      const nodes = [
        { name: &quot;财政局&quot;, order: 1 }, { name: &quot;税务局&quot;, order: 2 }, { name: &quot;发改委&quot;, order: 3 },
        { name: &quot;住建局&quot;, order: 4 }, { name: &quot;交通局&quot;, order: 5 }, { name: &quot;水利局&quot;, order: 6 },
        { name: &quot;农业局&quot;, order: 7 }, { name: &quot;文旅局&quot;, order: 8 }
      ].sort((a, b) =&gt; a.order - b.order);
      const raw = [];
      for (let i = 0; i &lt; nodes.length; i++) {
        for (let j = 0; j &lt; nodes.length; j++) {
          if (i !== j &amp;&amp; Math.random() &lt; 0.32) raw.push({ source: nodes[i].name, target: nodes[j].name, value: rnd(4, 60) });
        }
      }
      raw.push({ source: &quot;财政局&quot;, target: &quot;财政局&quot;, value: 10 });        // 自环样例：剔除
      raw.push({ source: &quot;财政局&quot;, target: &quot;编外单位&quot;, value: 8 });       // 无效引用样例：剔除
      const v = validateLinks(nodes, raw);
      const und = toUndirected(v.links);
      setNote(&quot;e6cd-note-c01&quot;, v.issues.length ? &quot;输入校验：&quot; + v.issues.slice(0, 3).join(&quot;；&quot;) + (v.issues.length &gt; 3 ? &quot; 等&quot; : &quot;&quot;) : &quot;&quot;);
      return Object.assign(baseOption(), {
        color: PALETTE,
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) return p.data.source + &quot; ↔ &quot; + p.data.target + &quot;&lt;br/&gt;联系强度：&quot; + p.data.value + &quot; 次&quot;;
            return p.name;
          }
        }),
        series: [chordSeries({ data: nodes.map((n) =&gt; ({ name: n.name })), links: und })]
      });
    }

    /* ---------- C02 定向资金流 ---------- */
    function buildC02() {
      const nodes = [
        { name: &quot;市本级财政&quot; }, { name: &quot;区县财政&quot; }, { name: &quot;城投平台&quot; },
        { name: &quot;产业基金&quot; }, { name: &quot;重点项目&quot; }, { name: &quot;偿债专户&quot; }
      ];
      const raw = [
        { source: &quot;市本级财政&quot;, target: &quot;区县财政&quot;, value: rndf(20, 60, 1) },
        { source: &quot;市本级财政&quot;, target: &quot;产业基金&quot;, value: rndf(10, 30, 1) },
        { source: &quot;区县财政&quot;, target: &quot;重点项目&quot;, value: rndf(15, 45, 1) },
        { source: &quot;城投平台&quot;, target: &quot;重点项目&quot;, value: rndf(12, 36, 1) },
        { source: &quot;产业基金&quot;, target: &quot;城投平台&quot;, value: rndf(6, 20, 1) },
        { source: &quot;城投平台&quot;, target: &quot;偿债专户&quot;, value: rndf(8, 24, 1) },
        { source: &quot;重点项目&quot;, target: &quot;偿债专户&quot;, value: rndf(4, 12, 1) }
      ];
      const v = validateLinks(nodes, raw);
      return Object.assign(baseOption(), {
        color: PALETTE,
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) return &quot;资金方向：&quot; + p.data.source + &quot; → &quot; + p.data.target + &quot;&lt;br/&gt;金额：&quot; + p.data.value + &quot; 亿元&lt;br/&gt;（弦色随来源方）&quot;;
            return p.name;
          }
        }),
        series: [chordSeries({ data: nodes, links: v.links, lineStyle: { color: &quot;source&quot;, opacity: 0.55 } })]
      });
    }

    /* ---------- C03 双边交易对照 ---------- */
    function buildC03() {
      const nodes = [{ name: &quot;甲银行&quot; }, { name: &quot;乙银行&quot; }, { name: &quot;丙券商&quot; }, { name: &quot;丁保险&quot; }, { name: &quot;戊基金&quot; }];
      const raw = [];
      for (let i = 0; i &lt; nodes.length; i++) {
        for (let j = 0; j &lt; nodes.length; j++) {
          if (i !== j &amp;&amp; Math.random() &lt; 0.6) raw.push({ source: nodes[i].name, target: nodes[j].name, value: rndf(2, 40, 1) });
        }
      }
      const v = validateLinks(nodes, raw);
      // 预计算双向值与净额，写入每条 link 的自定义字段（图形层仅展示）
      const byKey = {};
      v.links.forEach((l) =&gt; { byKey[l.source + &quot;→&quot; + l.target] = l.value; });
      v.links.forEach((l) =&gt; {
        l.cdBack = byKey[l.target + &quot;→&quot; + l.source] || 0;
        l.cdNet = Math.round((l.value - l.cdBack) * 10) / 10;
      });
      return Object.assign(baseOption(), {
        color: PALETTE,
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) {
              var d = p.data;
              return d.source + &quot; ⇄ &quot; + d.target +
                &quot;&lt;br/&gt;&quot; + d.source + &quot; → &quot; + d.target + &quot;：&quot; + d.value + &quot; 亿元&quot; +
                &quot;&lt;br/&gt;&quot; + d.target + &quot; → &quot; + d.source + &quot;：&quot; + d.cdBack + &quot; 亿元&quot; +
                &quot;&lt;br/&gt;净额（派生）：&quot; + (d.cdNet &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + d.cdNet + &quot; 亿元&quot;;
            }
            return p.name;
          }
        }),
        series: [chordSeries({ data: nodes, links: v.links, lineStyle: { color: &quot;source&quot;, opacity: 0.45 } })]
      });
    }

    /* ---------- C04 部门协作关系 ---------- */
    let c04Filter = &quot;all&quot;; // all | intra | inter
    const C04_GROUPS = { &quot;客户部&quot;: &quot;前台&quot;, &quot;营销部&quot;: &quot;前台&quot;, &quot;渠道部&quot;: &quot;前台&quot;, &quot;产品部&quot;: &quot;中台&quot;, &quot;数据部&quot;: &quot;中台&quot;, &quot;风控部&quot;: &quot;中台&quot;, &quot;财务部&quot;: &quot;后台&quot;, &quot;人事部&quot;: &quot;后台&quot;, &quot;科技部&quot;: &quot;后台&quot; };
    const C04_GROUP_COLOR = { &quot;前台&quot;: &quot;#3fe1ff&quot;, &quot;中台&quot;: &quot;#ffc857&quot;, &quot;后台&quot;: &quot;#9870ff&quot; };
    let c04Data = null;
    function makeC04() {
      const names = Object.keys(C04_GROUPS);
      const links = [];
      for (let i = 0; i &lt; names.length; i++) {
        for (let j = i + 1; j &lt; names.length; j++) {
          if (Math.random() &lt; 0.5) links.push({ source: names[i], target: names[j], value: rnd(5, 90) });
        }
      }
      c04Data = { names, links };
    }
    function buildC04() {
      if (!c04Data) makeC04();
      const nodes = c04Data.names.map((name) =&gt; ({
        name,
        itemStyle: { color: C04_GROUP_COLOR[C04_GROUPS[name]] }
      }));
      const v = validateLinks(nodes, c04Data.links);
      const links = v.links.filter((l) =&gt; {
        const same = C04_GROUPS[l.source] === C04_GROUPS[l.target];
        return c04Filter === &quot;all&quot; || (c04Filter === &quot;intra&quot; ? same : !same);
      });
      setNote(&quot;e6cd-note-c04&quot;, &quot;当前范围：&quot; + (c04Filter === &quot;all&quot; ? &quot;全部关系&quot; : c04Filter === &quot;intra&quot; ? &quot;仅组内协作&quot; : &quot;仅跨组协作&quot;) + &quot; · 显示 &quot; + links.length + &quot;/&quot; + v.links.length + &quot; 条&quot;);
      return Object.assign(baseOption(), {
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) {
              var same = p.data.cdSame ? &quot;组内&quot; : &quot;跨组&quot;;
              return p.data.source + &quot; ↔ &quot; + p.data.target + &quot;&lt;br/&gt;协作工单：&quot; + p.data.value + &quot; 单&lt;br/&gt;类型：&quot; + same;
            }
            return p.name;
          }
        }),
        series: [chordSeries({
          data: nodes,
          links: links.map((l) =&gt; Object.assign({}, l, { cdSame: C04_GROUPS[l.source] === C04_GROUPS[l.target] })),
          lineStyle: { color: &quot;source&quot;, opacity: 0.5 }
        })]
      });
    }

    /* ---------- C05 风险传染路径 ---------- */
    let c05FocusHigh = false;
    const C05_LEVEL_COLOR = { &quot;高&quot;: &quot;#ff6680&quot;, &quot;中&quot;: &quot;#ffc857&quot;, &quot;低&quot;: &quot;#38e6b0&quot; };
    function buildC05() {

        { name: &quot;凯盛制造&quot;, level: &quot;低&quot; }, { name: &quot;蓝海物流&quot;, level: &quot;低&quot; }, { name: &quot;绿洲农业&quot;, level: &quot;低&quot; }
      ];
      const raw = [
        { source: &quot;华信集团&quot;, target: &quot;天元地产&quot;, value: rndf(8, 30, 1) },
        { source: &quot;华信集团&quot;, target: &quot;润达贸易&quot;, value: rndf(4, 16, 1) },
        { source: &quot;泰和控股&quot;, target: &quot;华信集团&quot;, value: rndf(10, 26, 1) },
        { source: &quot;泰和控股&quot;, target: &quot;凯盛制造&quot;, value: rndf(3, 12, 1) },
        { source: &quot;天元地产&quot;, target: &quot;蓝海物流&quot;, value: rndf(2, 9, 1) },
        { source: &quot;润达贸易&quot;, target: &quot;绿洲农业&quot;, value: rndf(1, 6, 1) },
        { source: &quot;凯盛制造&quot;, target: &quot;蓝海物流&quot;, value: rndf(2, 8, 1) }
      ];
      const nodes = defs.map((d) =&gt; ({ name: d.name, itemStyle: { color: C05_LEVEL_COLOR[d.level] }, cdLevel: d.level }));
      const v = validateLinks(nodes, raw);
      const highSet = {};
      defs.forEach((d) =&gt; { if (d.level === &quot;高&quot;) highSet[d.name] = true; });
      const links = c05FocusHigh ? v.links.filter((l) =&gt; highSet[l.source] || highSet[l.target]) : v.links;
      const levelByName = {};
      defs.forEach((d) =&gt; { levelByName[d.name] = d.level; });
      return Object.assign(baseOption(), {
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) return p.data.source + &quot; → &quot; + p.data.target + &quot;&lt;br/&gt;风险暴露：&quot; + p.data.value + &quot; 亿元&lt;br/&gt;（仅表达已登记暴露关系）&quot;;
            return p.name + &quot;&lt;br/&gt;风险等级：&quot; + (p.data.cdLevel || &quot;未知&quot;) + &quot;（由输入数据给出）&quot;;

        series: [chordSeries({ data: nodes, links, lineStyle: { color: &quot;source&quot;, opacity: 0.5 } })]
      });
    }

    /* ---------- C06 产业供需关系 ---------- */
    let c06Folded = false;
    const C06_IND_GROUP = { &quot;整车制造&quot;: &quot;制造&quot;, &quot;零部件&quot;: &quot;制造&quot;, &quot;电子元件&quot;: &quot;制造&quot;, &quot;钢铁材料&quot;: &quot;原料&quot;, &quot;化工材料&quot;: &quot;原料&quot;, &quot;能源供应&quot;: &quot;原料&quot;, &quot;批发流通&quot;: &quot;服务&quot;, &quot;物流运输&quot;: &quot;服务&quot; };
    let c06Data = null;
    function makeC06() {
      const names = Object.keys(C06_IND_GROUP);
      const links = [];
      const pairs = [
        [&quot;钢铁材料&quot;, &quot;整车制造&quot;], [&quot;钢铁材料&quot;, &quot;零部件&quot;], [&quot;化工材料&quot;, &quot;零部件&quot;], [&quot;化工材料&quot;, &quot;电子元件&quot;],
        [&quot;能源供应&quot;, &quot;整车制造&quot;], [&quot;能源供应&quot;, &quot;钢铁材料&quot;], [&quot;零部件&quot;, &quot;整车制造&quot;], [&quot;电子元件&quot;, &quot;整车制造&quot;],
        [&quot;整车制造&quot;, &quot;批发流通&quot;], [&quot;批发流通&quot;, &quot;物流运输&quot;], [&quot;零部件&quot;, &quot;批发流通&quot;]
      ];
      pairs.forEach((p) =&gt; links.push({ source: p[0], target: p[1], value: rndf(5, 80, 1) }));
      c06Data = { names, links };
    }
    function buildC06() {
      if (!c06Data) makeC06();
      let nodes, links;
      if (c06Folded) {
        const map = (x) =&gt; C06_IND_GROUP[x];
        const merged = {};
        c06Data.links.forEach((l) =&gt; {
          const s = map(l.source), t = map(l.target);
          if (s === t) return;   // 组内交易在组折叠视图不展示（避免自环），口径注明
          const key = s + &quot;|&quot; + t;
          if (merged[key]) merged[key].value += l.value;
          else merged[key] = { source: s, target: t, value: Math.round(l.value * 10) / 10 };
        });
        nodes = [&quot;制造&quot;, &quot;原料&quot;, &quot;服务&quot;].map((name, i) =&gt; ({ name, itemStyle: { color: PALETTE[i] } }));
        links = Object.keys(merged).map((k) =&gt; merged[k]);
      } else {
        nodes = c06Data.names.map((name, i) =&gt; ({ name, itemStyle: { color: PALETTE[i % PALETTE.length] } }));
        links = validateLinks(nodes, c06Data.links).links;
      }
      const outSum = {}, inSum = {};
      nodes.forEach((n) =&gt; { outSum[n.name] = 0; inSum[n.name] = 0; });
      links.forEach((l) =&gt; { outSum[l.source] += l.value; inSum[l.target] += l.value; });
      links.forEach((l) =&gt; {
        l.cdOutPct = outSum[l.source] ? Math.round(l.value / outSum[l.source] * 1000) / 10 : null;
        l.cdInPct = inSum[l.target] ? Math.round(l.value / inSum[l.target] * 1000) / 10 : null;
      });
      return Object.assign(baseOption(), {
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) {
              var d = p.data;
              return d.source + &quot; → &quot; + d.target + &quot;&lt;br/&gt;采购额：&quot; + Math.round(d.value * 10) / 10 + &quot; 亿元&quot; +
                &quot;&lt;br/&gt;占来源方供给：&quot; + (d.cdOutPct == null ? &quot;—&quot; : d.cdOutPct + &quot;%&quot;) +
                &quot;&lt;br/&gt;占目标方需求：&quot; + (d.cdInPct == null ? &quot;—&quot; : d.cdInPct + &quot;%&quot;);
            }
            return p.name;
          }
        }),
        series: [chordSeries({ data: nodes, links, lineStyle: { color: &quot;source&quot;, opacity: 0.5 } })]
      });
    }

    /* ---------- C07 区域调拨关系 ---------- */
    function buildC07() {
      const REGION_GROUP = { &quot;江北仓&quot;: &quot;北大区&quot;, &quot;淮东仓&quot;: &quot;北大区&quot;, &quot;山南仓&quot;: &quot;北大区&quot;, &quot;湖西仓&quot;: &quot;南大区&quot;, &quot;岭南仓&quot;: &quot;南大区&quot;, &quot;滨海仓&quot;: &quot;南大区&quot; };
      const names = Object.keys(REGION_GROUP); // 固定顺序：按大区分组排列
      const raw = [];
      for (let i = 0; i &lt; names.length; i++) {
        for (let j = 0; j &lt; names.length; j++) {
          if (i !== j &amp;&amp; Math.random() &lt; 0.4) raw.push({ source: names[i], target: names[j], value: rnd(20, 300) });
        }
      }
      const nodes = names.map((name) =&gt; ({ name, itemStyle: { color: REGION_GROUP[name] === &quot;北大区&quot; ? &quot;#4b7dff&quot; : &quot;#38e6b0&quot; } }));
      const v = validateLinks(nodes, raw);
      const links = v.links.map((l) =&gt; {
        const same = REGION_GROUP[l.source] === REGION_GROUP[l.target];
        return Object.assign({}, l, {
          cdSame: same,
          lineStyle: { color: same ? &quot;rgba(56, 230, 176, 0.55)&quot; : &quot;rgba(75, 125, 255, 0.4)&quot; }
        });
      });
      return Object.assign(baseOption(), {
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) return p.data.source + &quot; → &quot; + p.data.target + &quot;&lt;br/&gt;调拨量：&quot; + p.data.value + &quot; 吨&lt;br/&gt;类型：&quot; + (p.data.cdSame ? &quot;同大区&quot; : &quot;跨大区&quot;);
            return p.name;
          }
        }),
        series: [chordSeries({ data: nodes, links })]
      });
    }

    /* ---------- C08 分组渐变弦图 ---------- */
    function buildC08() {
      const GROUPS = { &quot;核心库&quot;: &quot;生产&quot;, &quot;备份库&quot;: &quot;生产&quot;, &quot;分析库&quot;: &quot;数仓&quot;, &quot;集市库&quot;: &quot;数仓&quot;, &quot;报表台&quot;: &quot;应用&quot;, &quot;大屏台&quot;: &quot;应用&quot; };
      const GROUP_COLOR = { &quot;生产&quot;: &quot;#3fe1ff&quot;, &quot;数仓&quot;: &quot;#ffc857&quot;, &quot;应用&quot;: &quot;#9870ff&quot; };
      const names = Object.keys(GROUPS);
      const raw = [];
      for (let i = 0; i &lt; names.length; i++) {
        for (let j = 0; j &lt; names.length; j++) {
          if (i !== j &amp;&amp; Math.random() &lt; 0.42) raw.push({ source: names[i], target: names[j], value: rndf(0.5, 20, 1) });
        }
      }
      const nodes = names.map((name) =&gt; ({
        name: &quot;[&quot; + GROUPS[name] + &quot;] &quot; + name,   // 组归属进标签文字，颜色非唯一手段
        itemStyle: { color: GROUP_COLOR[GROUPS[name]] }
      }));
      const renamed = raw.map((l) =&gt; ({ source: &quot;[&quot; + GROUPS[l.source] + &quot;] &quot; + l.source, target: &quot;[&quot; + GROUPS[l.target] + &quot;] &quot; + l.target, value: l.value }));
      const v = validateLinks(nodes, renamed);
      return Object.assign(baseOption(), {
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) return p.data.source + &quot; → &quot; + p.data.target + &quot;&lt;br/&gt;交换量：&quot; + Math.round(p.data.value * 10) / 10 + &quot; TB&quot;;
            return p.name;
          }
        }),
        series: [chordSeries({ data: nodes, links: v.links, lineStyle: { color: &quot;gradient&quot;, opacity: 0.55 } })]
      });
    }

    /* ---------- C09 双期对照弦图 ---------- */
    function buildC09() {
      const names = [&quot;东部片区&quot;, &quot;西部片区&quot;, &quot;南部片区&quot;, &quot;北部片区&quot;, &quot;中心片区&quot;];
      const nodes = names.map((name, i) =&gt; ({ name, itemStyle: { color: PALETTE[i] } }));
      const mk = (pairs) =&gt; pairs.map((p) =&gt; ({ source: p[0], target: p[1], value: p[2] }));
      const prev = mk([
        [&quot;东部片区&quot;, &quot;西部片区&quot;, 24], [&quot;东部片区&quot;, &quot;中心片区&quot;, 18], [&quot;南部片区&quot;, &quot;中心片区&quot;, 12],
        [&quot;北部片区&quot;, &quot;西部片区&quot;, 9], [&quot;南部片区&quot;, &quot;北部片区&quot;, 6]
      ]);
      const cur = mk([
        [&quot;东部片区&quot;, &quot;西部片区&quot;, 30], [&quot;东部片区&quot;, &quot;中心片区&quot;, 10], [&quot;南部片区&quot;, &quot;中心片区&quot;, 14],
        [&quot;中心片区&quot;, &quot;北部片区&quot;, 8], [&quot;西部片区&quot;, &quot;南部片区&quot;, 7]
      ]);
      const keyOf = (l) =&gt; [l.source, l.target].sort().join(&quot;|&quot;);
      const prevKeys = {}, curKeys = {};
      prev.forEach((l) =&gt; { prevKeys[keyOf(l)] = true; });
      cur.forEach((l) =&gt; { curKeys[keyOf(l)] = true; });
      const CONT = &quot;rgba(75, 125, 255, 0.45)&quot;, GONE = &quot;rgba(255, 102, 128, 0.55)&quot;, NEW = &quot;rgba(56, 230, 176, 0.55)&quot;;
      const prevLinks = prev.map((l) =&gt; Object.assign({}, l, {
        cdState: curKeys[keyOf(l)] ? &quot;两期延续&quot; : &quot;本期消失&quot;,
        lineStyle: { color: curKeys[keyOf(l)] ? CONT : GONE }
      }));
      const curLinks = cur.map((l) =&gt; Object.assign({}, l, {
        cdState: prevKeys[keyOf(l)] ? &quot;两期延续&quot; : &quot;本期新增&quot;,
        lineStyle: { color: prevKeys[keyOf(l)] ? CONT : NEW }
      }));
      const common = { radius: [&quot;50%&quot;, &quot;62%&quot;], label: { show: true, color: &quot;#bfe0ff&quot;, fontSize: 9 } };
      return Object.assign(baseOption(), {
        title: [
          { text: &quot;上期&quot;, left: &quot;25%&quot;, top: 4, textAlign: &quot;center&quot;, textStyle: { color: &quot;#bfe0ff&quot;, fontSize: 12, fontWeight: 600 } },
          { text: &quot;本期&quot;, left: &quot;75%&quot;, top: 4, textAlign: &quot;center&quot;, textStyle: { color: &quot;#bfe0ff&quot;, fontSize: 12, fontWeight: 600 } }
        ],
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) return p.data.source + &quot; ↔ &quot; + p.data.target + &quot;&lt;br/&gt;金额：&quot; + p.data.value + &quot; 亿元&lt;br/&gt;状态：&quot; + p.data.cdState;
            return p.name;
          }
        }),
        series: [
          chordSeries(Object.assign({}, common, { center: [&quot;25%&quot;, &quot;54%&quot;], data: nodes, links: prevLinks })),
          chordSeries(Object.assign({}, common, { center: [&quot;75%&quot;, &quot;54%&quot;], data: nodes, links: curLinks }))
        ]
      });
    }

    /* ---------- C10 TopN＋其他归并（40 节点 / 500 关系压力数据） ---------- */
    let c10Raw = null, c10Mode = &quot;topn&quot;; // topn | full
    function makeC10() {
      const nodes = [];
      for (let i = 1; i &lt;= 40; i++) nodes.push({ name: &quot;节点&quot; + String(i).padStart(2, &quot;0&quot;) });
      const links = [];
      for (let k = 0; k &lt; 500; k++) {
        const a = rnd(1, 40), b = rnd(1, 40);
        if (a === b) continue;
        links.push({ source: &quot;节点&quot; + String(a).padStart(2, &quot;0&quot;), target: &quot;节点&quot; + String(b).padStart(2, &quot;0&quot;), value: rndf(0.5, 30, 1) });
      }
      c10Raw = { nodes, links: validateLinks(nodes, links).links };
    }
    function buildC10() {
      if (!c10Raw) makeC10();
      if (c10Mode === &quot;full&quot;) {
        setNote(&quot;e6cd-note-c10&quot;, &quot;压力原始视图：&quot; + c10Raw.nodes.length + &quot; 节点 / &quot; + c10Raw.links.length + &quot; 关系（仅验证稳定性，可读性以 TopN 视图为准）&quot;);
        return Object.assign(baseOption(), {
          animation: false,
          color: PALETTE,
          tooltip: Object.assign(baseOption().tooltip, {
            formatter: function (p) {
              if (p.dataType === &quot;edge&quot;) return p.data.source + &quot; → &quot; + p.data.target + &quot;：&quot; + p.data.value;
              return p.name;
            }
          }),
          series: [chordSeries({ data: c10Raw.nodes, links: c10Raw.links, label: { show: false }, lineStyle: { color: &quot;source&quot;, opacity: 0.18 } })]
        });
      }
      const m = topNMerge(c10Raw.nodes, c10Raw.links, 12);
      const conserved = totalValue(m.links) === totalValue(c10Raw.links);
      setNote(&quot;e6cd-note-c10&quot;, &quot;TopN 视图：保留 12 节点 + 其他 · 归并 &quot; + m.hiddenCount + &quot; 条关系、合计 &quot; + m.hiddenValue + &quot;（含其他相关流量）· 守恒校验：&quot; + (conserved ? &quot;通过&quot; : &quot;不通过&quot;));
      return Object.assign(baseOption(), {
        color: PALETTE,
        tooltip: Object.assign(baseOption().tooltip, {
          formatter: function (p) {
            if (p.dataType === &quot;edge&quot;) {
              if (p.data.cdSelf) return &quot;「其他」内部关系合计：&quot; + Math.round(p.data.value * 10) / 10 + &quot;（保留合计，可切换压力原始视图展开）&quot;;
              return p.data.source + &quot; → &quot; + p.data.target + &quot;&lt;br/&gt;吞吐量：&quot; + Math.round(p.data.value * 10) / 10;
            }
            return p.name;
          }
        }),
        series: [chordSeries({ data: m.nodes, links: m.links, lineStyle: { color: &quot;source&quot;, opacity: 0.5 } })]
      });
    }

    /* ================= 渲染调度 ================= */

    const builders = [
      { id: &quot;e6cd-c01&quot;, build: buildC01 },
      { id: &quot;e6cd-c02&quot;, build: buildC02 },
      { id: &quot;e6cd-c03&quot;, build: buildC03 },
      { id: &quot;e6cd-c04&quot;, build: buildC04 },
      { id: &quot;e6cd-c05&quot;, build: buildC05 },
      { id: &quot;e6cd-c06&quot;, build: buildC06 },
      { id: &quot;e6cd-c07&quot;, build: buildC07 },
      { id: &quot;e6cd-c08&quot;, build: buildC08 },
      { id: &quot;e6cd-c09&quot;, build: buildC09 },
      { id: &quot;e6cd-c10&quot;, build: buildC10 }
    ];
    const builderById = {};
    builders.forEach((b) =&gt; { builderById[b.id] = b; });

    const charts = {};
    function renderOne(id) {
      const item = builderById[id];
      const node = document.getElementById(id);
      if (!item || !node) return;
      if (!charts[id]) charts[id] = echarts.init(node, null, { renderer: &quot;canvas&quot; });
      try {
        charts[id].setOption(item.build(), { notMerge: true });
      } catch (err) {
        errorNode.textContent = &quot;方案「&quot; + id + &quot;」渲染异常：&quot; + err.message;
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }
    function renderInitialized() {
      Object.keys(charts).forEach(renderOne);
    }

    let io = null;
    if (&quot;IntersectionObserver&quot; in window) {
      io = new IntersectionObserver((entries) =&gt; {
        entries.forEach((entry) =&gt; {
          if (!entry.isIntersecting) return;
          renderOne(entry.target.id);
          io.unobserve(entry.target);
        });
      }, { rootMargin: &quot;320px 0px&quot; });
      builders.forEach((b) =&gt; {
        const node = document.getElementById(b.id);
        if (node) io.observe(node);
      });
    } else {
      builders.forEach((b) =&gt; renderOne(b.id));
    }

    let ro = null;
    function resizeCharts() {
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) charts[id].resize(); });
    }
    if (&quot;ResizeObserver&quot; in window) {
      ro = new ResizeObserver(resizeCharts);
      ro.observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    document.getElementById(&quot;e6cd-refresh&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      c04Data = null; c06Data = null; c10Raw = null;
      renderInitialized();
    });

    const c04Btn = document.getElementById(&quot;e6cd-c04-filter&quot;);
    c04Btn.addEventListener(&quot;click&quot;, () =&gt; {
      c04Filter = c04Filter === &quot;all&quot; ? &quot;intra&quot; : c04Filter === &quot;intra&quot; ? &quot;inter&quot; : &quot;all&quot;;
      c04Btn.textContent = &quot;范围：&quot; + (c04Filter === &quot;all&quot; ? &quot;全部&quot; : c04Filter === &quot;intra&quot; ? &quot;组内&quot; : &quot;跨组&quot;);
      if (charts[&quot;e6cd-c04&quot;]) renderOne(&quot;e6cd-c04&quot;);
    });

    const c05Btn = document.getElementById(&quot;e6cd-c05-focus&quot;);
    c05Btn.addEventListener(&quot;click&quot;, () =&gt; {
      c05FocusHigh = !c05FocusHigh;
      c05Btn.setAttribute(&quot;aria-pressed&quot;, String(c05FocusHigh));
      if (charts[&quot;e6cd-c05&quot;]) renderOne(&quot;e6cd-c05&quot;);
    });

    const c06Btn = document.getElementById(&quot;e6cd-c06-fold&quot;);
    c06Btn.addEventListener(&quot;click&quot;, () =&gt; {
      c06Folded = !c06Folded;
      c06Btn.setAttribute(&quot;aria-pressed&quot;, String(c06Folded));
      c06Btn.textContent = c06Folded ? &quot;展开为产业明细&quot; : &quot;折叠为行业组&quot;;
      if (charts[&quot;e6cd-c06&quot;]) renderOne(&quot;e6cd-c06&quot;);
    });

    const c10Btn = document.getElementById(&quot;e6cd-c10-mode&quot;);
    c10Btn.addEventListener(&quot;click&quot;, () =&gt; {
      c10Mode = c10Mode === &quot;topn&quot; ? &quot;full&quot; : &quot;topn&quot;;
      c10Btn.setAttribute(&quot;aria-pressed&quot;, String(c10Mode === &quot;full&quot;));
      c10Btn.textContent = c10Mode === &quot;full&quot; ? &quot;返回 TopN 视图&quot; : &quot;压力原始视图&quot;;
      if (charts[&quot;e6cd-c10&quot;]) renderOne(&quot;e6cd-c10&quot;);
    });

    window.addEventListener(&quot;pagehide&quot;, () =&gt; {
      if (io) io.disconnect();
      if (ro) ro.disconnect();
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) { charts[id].dispose(); charts[id] = null; } });
    });

    runSelfCheck();
  })();
  &lt;/script&gt;
