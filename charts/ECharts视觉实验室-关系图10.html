&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {
  &quot;use strict&quot;;
  if (!window.echarts || window.LabAddons) return;
  function probe(tag, data) {
    try { if (parent !== window) parent.postMessage(&quot;LABADDONS:&quot; + tag + &quot;:&quot; + JSON.stringify(data || {}), &quot;*&quot;); } catch (_) { /* noop */ }
  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,
      rect: w ? w.getBoundingClientRect().toJSON() : null,
      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight
    });
  });

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l &gt; 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g &lt; b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l, a: a };
  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;
    return c.a &gt;= 1 ? &quot;hsl(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%)&quot; : &quot;hsla(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%, &quot; + Math.round(c.a * 1000) / 1000 + &quot;)&quot;;
  }
  function isChromatic(c) {
    return c &amp;&amp; c.s &gt;= 0.14 &amp;&amp; c.a &gt; 0.04 &amp;&amp; c.l &gt; 0.02 &amp;&amp; c.l &lt; 0.98;

  /* ---------- 主题颜色映射（色相族 → 主题色板槽位；保留原明度/透明度层次） ---------- */

      const links = GOV_EDGES.map(([s, t]) =&gt; ({ source: s, target: t, value: rnd(10, 200) }));

    /* ---------- 十方案 ---------- */
    const builders = {

      },
      &quot;e6gr-equity&quot;: () =&gt; {

      &quot;e6gr-risk&quot;: () =&gt; {

      &quot;e6gr-circular&quot;: () =&gt; {

          &quot;基金公司&quot;, &quot;信托公司&quot;, &quot;期货公司&quot;, &quot;金融租赁&quot;, &quot;消费金融&quot;, &quot;村镇银行&quot;];
        const pairs = [];
        orgs.forEach((_, i) =&gt; {
          pairs.push([i, (i + 1) % orgs.length]);

          if (i % 3 === 0) pairs.push([i, (i + 4) % orgs.length]);
        });
        const nodes = orgs.map((name, i) =&gt; ({
          name, value: rnd(50, 900), symbolSize: 16 + (i % 4) * 4,

          lineStyle: { color: &quot;rgba(63, 225, 255, 0.28)&quot;, width: 1.4, curveness: 0.3 },

      },
      &quot;e6gr-weight&quot;: () =&gt; {
        const orgs = [&quot;清算中心&quot;, &quot;甲银行&quot;, &quot;乙银行&quot;, &quot;丙证券&quot;, &quot;丁保险&quot;, &quot;戊信托&quot;, &quot;己基金&quot;, &quot;庚租赁&quot;, &quot;辛财务司&quot;, &quot;壬支付司&quot;];

        }));

          circular: { rotateLabel: false },

          links,
          label: { show: true, position: &quot;right&quot;, color: C.text, fontSize: 10.5 },

      },
      &quot;e6gr-focus&quot;: () =&gt; {
        const data = govData();
        data.nodes.forEach((node) =&gt; {
          node.itemStyle = { color: node.degree &gt;= 8 ? C.cyan : C.blue };
        });
        const option = baseOption();
        option.tooltip.formatter = (p) =&gt;
          p.dataType === &quot;edge&quot; ? `协同事项 ${p.value} 件` : `${p.name} · 协同 ${p.data.degree} 家`;
        option.series = [graphSeries({
          data: data.nodes,
          links: data.links,
          label: { show: true, position: &quot;right&quot;, color: C.text, fontSize: 10 },
          lineStyle: { color: &quot;rgba(111, 143, 181, 0.3)&quot;, width: 1.2 },
          force: { repulsion: 190, edgeLength: [40, 90], gravity: 0.16, layoutAnimation: motionEnabled },
          emphasis: {
            focus: &quot;adjacency&quot;,
            itemStyle: { shadowBlur: 12, shadowColor: &quot;rgba(63, 225, 255, 0.8)&quot; },
            lineStyle: { opacity: 0.9, color: C.cyan, width: 2 },
            label: { fontWeight: 600 }
          },
          blur: {
            itemStyle: { opacity: 0.16 },
            lineStyle: { opacity: 0.04 },
            label: { opacity: 0.12 }
          }
        })];
        return option;
      },
      &quot;e6gr-star&quot;: () =&gt; {
        const branches = [&quot;华东分部&quot;, &quot;华南分部&quot;, &quot;华北分部&quot;, &quot;华中分部&quot;, &quot;西南分部&quot;, &quot;西北分部&quot;,
          &quot;东北分部&quot;, &quot;省会中支&quot;, &quot;口岸中支&quot;, &quot;自贸区支部&quot;, &quot;科创园支部&quot;, &quot;乡村振兴站&quot;];
        const nodes = [{
          name: &quot;集团总部&quot;, x: 0, y: 0, symbolSize: 48, value: 100,
          itemStyle: { color: C.cyan, shadowBlur: 18, shadowColor: &quot;rgba(63, 225, 255, 0.7)&quot; },

        }];
        branches.forEach((name, i) =&gt; {
          const a = -Math.PI / 2 + i * (Math.PI * 2 / branches.length);
          const x = Math.cos(a) * 95;
          const y = Math.sin(a) * 62;
          const v = rnd(55, 100);
          nodes.push({
            name, x, y, value: v, symbolSize: 12 + v * 0.14,
            itemStyle: { color: v &gt;= 85 ? C.green : v &gt;= 70 ? C.blue : C.steel },

        const option = baseOption();
        option.tooltip.formatter = (p) =&gt;
          p.dataType === &quot;edge&quot; ? `管理强度 ${p.value}` : `${p.name} · 综合评分 ${p.value}`;
        option.series = [graphSeries({
          layout: &quot;none&quot;,
          data: nodes,
          links,
          label: { show: true, color: C.text, fontSize: 10.5 },

        })];

      },
      &quot;e6gr-panorama&quot;: () =&gt; {
        const extras = [&quot;园区管委会&quot;, &quot;口岸办&quot;, &quot;金融办&quot;, &quot;国资委&quot;];
        const names = GOV_DEPTS.concat(extras);
        const edges = GOV_EDGES.concat([[1, 24], [3, 26], [21, 25], [13, 25], [2, 27], [3, 27]]);
        const nodes = names.map((name) =&gt; ({
          name, value: rnd(1, 60), symbolSize: 7,
          itemStyle: { color: &quot;rgba(63, 225, 255, 0.85)&quot; }

        const links = edges.map(([s, t]) =&gt; ({ source: s, target: t }));
        const option = baseOption();
        option.tooltip.formatter = (p) =&gt;
          p.dataType === &quot;edge&quot; ? &quot;联络关系&quot; : `${p.name} · 联络人 ${p.value} 名`;
        option.series = [graphSeries({
          data: nodes,
          links,
          label: { show: true, position: &quot;right&quot;, distance: 3, color: C.muted, fontSize: 9.5 },
          lineStyle: { color: &quot;rgba(111, 143, 181, 0.28)&quot;, width: 1 },
          force: { repulsion: 300, edgeLength: 42, gravity: 0.22, layoutAnimation: motionEnabled },
          emphasis: { focus: &quot;adjacency&quot;, label: { color: C.text } }
        })];
        return option;
      },
      &quot;e6gr-kpi&quot;: () =&gt; {
        const blocks = [&quot;综合金融&quot;, &quot;产业投资&quot;, &quot;城市运营&quot;, &quot;科技创新&quot;, &quot;民生服务&quot;, &quot;国际业务&quot;];
        const nodes = [{
          name: &quot;集团经营&quot;, value: rnd(90, 112), x: 0, y: 0, symbolSize: 88,
          itemStyle: { color: &quot;rgba(63, 225, 255, 0.16)&quot;, borderColor: C.cyan, borderWidth: 2, shadowBlur: 18, shadowColor: &quot;rgba(63, 225, 255, 0.5)&quot; }
        }];
        blocks.forEach((name, i) =&gt; {
          const a = -Math.PI / 2 + i * (Math.PI / 3);

            name, value: v,
            x: Math.cos(a) * 100, y: Math.sin(a) * 64,

            itemStyle: {
              color: &quot;rgba(13, 34, 64, 0.85)&quot;,

          });

        const links = blocks.map((_, i) =&gt; ({
          source: 0, target: 1 + i,

        }));
        const option = baseOption();
        option.tooltip.formatter = (p) =&gt;
          p.dataType === &quot;edge&quot; ? &quot;板块归属&quot; : `${p.name} 年度完成率 ${p.value}%`;
        option.series = [graphSeries({
          layout: &quot;none&quot;,
          data: nodes,
          links,
          label: {
            show: true, position: &quot;inside&quot;,
            formatter: (p) =&gt; `{name|${p.name}}\n{val|${p.value}%}`,
            rich: {
              name: { color: &quot;#bfe0ff&quot;, fontSize: 11, lineHeight: 16 },
              val: { color: &quot;#ffffff&quot;, fontSize: 15, fontWeight: 700, lineHeight: 20 }
            }
          },
          emphasis: { focus: &quot;adjacency&quot;, itemStyle: { shadowBlur: 22 } }
        })];
        return option;
      }
    };

    /* ---------- 渲染与控制 ---------- */
    const charts = {};
    function renderAll() {
      Object.entries(builders).forEach(([id, build]) =&gt; {
        const element = document.getElementById(id);
        if (!element) return;
        if (!charts[id]) charts[id] = echarts.init(element, null, { renderer: &quot;canvas&quot; });
        charts[id].setOption(build(), { notMerge: true, lazyUpdate: false });
      });
    }

    const refreshButton = document.getElementById(&quot;e6gr-refresh&quot;);
    const motionButton = document.getElementById(&quot;e6gr-motion&quot;);

    refreshButton.addEventListener(&quot;click&quot;, () =&gt; {
      renderAll();
    });

    function syncMotionButton() {
      motionButton.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionButton.textContent = motionEnabled ? &quot;更新动效：开&quot; : &quot;更新动效：关&quot;;
    }

    motionButton.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      syncMotionButton();
      renderAll();
    });

    reducedMotion.addEventListener?.(&quot;change&quot;, (event) =&gt; {
      if (event.matches) {
        motionEnabled = false;
        syncMotionButton();
        renderAll();
      }
    });

    let resizeFrame = 0;
    const resizeCharts = () =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() =&gt; Object.values(charts).forEach((chart) =&gt; chart.resize()));
    };
    if (&quot;ResizeObserver&quot; in window) {
      new ResizeObserver(resizeCharts).observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    syncMotionButton();
    renderAll();
  })();
  &lt;/script&gt;
