&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {
  &quot;use strict&quot;;
  if (!window.echarts || window.LabAddons) return;
  function probe(tag, data) {
    try { if (parent !== window) parent.postMessage(&quot;LABADDONS:&quot; + tag + &quot;:&quot; + JSON.stringify(data || {}), &quot;*&quot;); } catch (_) { /* noop */ }
  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,
      rect: w ? w.getBoundingClientRect().toJSON() : null,
      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight
    });
  });

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;

    }

  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;
    return c.a &gt;= 1 ? &quot;hsl(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%)&quot; : &quot;hsla(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%, &quot; + Math.round(c.a * 1000) / 1000 + &quot;)&quot;;
  }
  function isChromatic(c) {
    return c &amp;&amp; c.s &gt;= 0.14 &amp;&amp; c.a &gt; 0.04 &amp;&amp; c.l &gt; 0.02 &amp;&amp; c.l &lt; 0.98;
  }

  /* ---------- 主题颜色映射（色相族 → 主题色板槽位；保留原明度/透明度层次） ---------- */
  function buildMapper(option, theme) {
    var families = []; // {hue}
    collect(option);
    function collect(node) {
      if (node == null) return;
      if (typeof node === &quot;string&quot;) {
        var c = parseColor(node);
        if (isChromatic(c) &amp;&amp; familyOf(c.h) === -1) families.push({ hue: c.h });
        return;
      }
      if (Array.isArray(node)) { node.forEach(collect); return; }
      if (typeof node === &quot;object&quot;) {
        for (var k in node) {
          if (k === &quot;formatter&quot; || k === &quot;text&quot; || k === &quot;subtext&quot;) continue;
          collect(node[k]);
        }
      }
    }
    function familyOf(h) {
      for (var i = 0; i &lt; families.length; i++) if (hueDist(families[i].hue, h) &lt;= 26) return i;
      return -1;

    return function mapColorStr(str) {
      var c = parseColor(str);
      if (!isChromatic(c)) return str;
      var fi = familyOf(c.h);
      var t = targets[fi === -1 ? 0 : fi % targets.length];
      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });
    };
  }

  function mapOption(option, theme) {
    var mapColor = buildMapper(option, theme);
    function walk(node, key) {
      if (node == null || typeof node === &quot;function&quot;) return node;
      if (typeof node === &quot;string&quot;) {
        if (key === &quot;formatter&quot; || key === &quot;text&quot; || key === &quot;subtext&quot;) return node;
        return parseColor(node) ? mapColor(node) : node;
      }
      if (Array.isArray(node)) return node.map(function (v) { return walk(v, key); });
      if (typeof node === &quot;object&quot;) {
        var out = {};
        for (var k in node) out[k] = walk(node[k], k);

      }

  /* ---------- echarts.init / setOption 拦截 ---------- */
  var realInit = echarts.init.bind(echarts);

  &lt;script&gt;

    function tradingDays(count) {
      const days = [];
      const cursor = new Date(2025, 0, 2);
      while (days.length &lt; count) {
        const wd = cursor.getDay();
        if (wd !== 0 &amp;&amp; wd !== 6) {
          const mm = String(cursor.getMonth() + 1).padStart(2, &quot;0&quot;);
          const dd = String(cursor.getDate()).padStart(2, &quot;0&quot;);

    /* ---------- 随机游走 OHLC 生成 ---------- */
    function genWalk(count, start) {
      const ohlc = [];   // [open, close, low, high]
      const closes = [];
      const volumes = [];
      let base = start * (0.92 + Math.random() * 0.16);
      let bias = (Math.random() - 0.5) * 0.5;
      for (let i = 0; i &lt; count; i++) {
        if (i % 12 === 0) bias = (Math.random() - 0.5) * 0.6;
        const open = +(base + (Math.random() - 0.5) * 0.6).toFixed(2);
        const close = +(open + bias + (Math.random() - 0.5) * 3.2).toFixed(2);

        const low = +(Math.min(open, close) - Math.random() * 1.4).toFixed(2);

            xAxisIndex: 1,
            yAxisIndex: 1,
            barWidth: &quot;58%&quot;,
            data: w.volumes.map((v, i) =&gt; ({
              value: v,
              itemStyle: { color: w.ohlc[i][1] &gt;= w.ohlc[i][0] ? &quot;rgba(255, 90, 90, 0.75)&quot; : &quot;rgba(43, 214, 164, 0.75)&quot; }
            }))
          }
        ];
        return option;
      },
      &quot;e6kl-ma&quot;: () =&gt; {
        const w = genWalk(60, 95);
        const maLine = (name, data, color) =&gt; ({
          name, type: &quot;line&quot;, data,
          smooth: true, symbol: &quot;none&quot;,
          lineStyle: { width: 1.6, color },
          emphasis: { disabled: true }
        });
        const option = baseOption();
        option.legend = {
          top: 0, right: 4, itemWidth: 14, itemHeight: 2, icon: &quot;rect&quot;,
          textStyle: { color: C.muted, fontSize: 11 },
          data: [&quot;MA5&quot;, &quot;MA10&quot;, &quot;MA20&quot;]
        };
        option.grid = { left: 46, right: 14, top: 26, bottom: 26 };
        option.xAxis = timeAxis(DATES_60);
        option.yAxis = priceAxis();
        option.series = [
          candleSeries(w.ohlc, A_STYLE, { name: &quot;日K&quot; }),
          maLine(&quot;MA5&quot;, ma(w.closes, 5), C.cyan),
          maLine(&quot;MA10&quot;, ma(w.closes, 10), C.amber),
          maLine(&quot;MA20&quot;, ma(w.closes, 20), C.violet)
        ];
        return option;
      },
      &quot;e6kl-glow&quot;: () =&gt; {
        const w = genWalk(60, 72);
        const option = baseOption();
        option.grid = { left: 46, right: 14, top: 18, bottom: 26 };
        option.xAxis = timeAxis(DATES_60, { axisLine: { lineStyle: { color: &quot;rgba(143, 167, 200, 0.25)&quot; } } });
        option.yAxis = priceAxis({ splitLine: { lineStyle: { color: &quot;rgba(86, 150, 224, 0.08)&quot; } } });
        option.series = [candleSeries(w.ohlc, {
          color: C.cyan,
          color0: C.magenta,
          borderColor: C.cyan,
          borderColor0: C.magenta,
          shadowBlur: 10,
          shadowColor: &quot;rgba(63, 225, 255, 0.45)&quot;
        }, { name: &quot;日K&quot;, barWidth: &quot;55%&quot; })];
        return option;
      },
      &quot;e6kl-band&quot;: () =&gt; {
        const w = genWalk(60, 108);
        const bands = risingBands(w.closes, DATES_60, 3);
        const option = baseOption();
        option.grid = { left: 46, right: 14, top: 18, bottom: 26 };
        option.xAxis = timeAxis(DATES_60);
        option.yAxis = priceAxis();
        option.series = [candleSeries(w.ohlc, A_STYLE, {
          name: &quot;日K&quot;,
          markArea: {
            silent: true,
            itemStyle: {
              color: &quot;rgba(56, 230, 176, 0.10)&quot;,
              borderColor: &quot;rgba(56, 230, 176, 0.35)&quot;,
              borderWidth: 1,
              borderType: &quot;dashed&quot;
            },
            label: { show: true, position: &quot;top&quot;, color: &quot;#a9f3d4&quot;, fontSize: 10, formatter: &quot;连涨段&quot; },
            data: bands.map((b) =&gt; [Object.assign({ name: &quot;&quot; }, b[0]), b[1]])
          }
        })];
        return option;
      },
      &quot;e6kl-extreme&quot;: () =&gt; {
        const w = genWalk(60, 90);
        const option = baseOption();
        option.grid = { left: 46, right: 14, top: 34, bottom: 30 };
        option.xAxis = timeAxis(DATES_60);
        option.yAxis = priceAxis();
        option.series = [candleSeries(w.ohlc, A_STYLE, {
          name: &quot;日K&quot;,
          markPoint: {
            symbol: &quot;pin&quot;,
            symbolSize: 44,
            label: { color: &quot;#0a1e3c&quot;, fontSize: 10, fontWeight: 600, formatter: (p) =&gt; p.value.toFixed(1) },
            data: [
              { type: &quot;max&quot;, name: &quot;区间最高&quot;, valueDim: &quot;highest&quot;, itemStyle: { color: C.amber, shadowBlur: 8, shadowColor: &quot;rgba(255, 200, 87, 0.5)&quot; } },
              { type: &quot;min&quot;, name: &quot;区间最低&quot;, valueDim: &quot;lowest&quot;, symbolRotate: 180, label: { offset: [0, 8], color: &quot;#0a1e3c&quot;, fontSize: 10, fontWeight: 600, formatter: (p) =&gt; p.value.toFixed(1) }, itemStyle: { color: C.green, shadowBlur: 8, shadowColor: &quot;rgba(56, 230, 176, 0.5)&quot; } }
            ]
          },
          markLine: {
            silent: true,
            symbol: &quot;none&quot;,
            lineStyle: { color: &quot;rgba(143, 167, 200, 0.45)&quot;, type: &quot;dashed&quot;, width: 1 },
            label: { color: C.muted, fontSize: 10, position: &quot;insideEndTop&quot;, formatter: (p) =&gt; &quot;均值 &quot; + p.value.toFixed(1) },
            data: [{ type: &quot;average&quot;, valueDim: &quot;close&quot; }]
          }
        })];
        return option;
      }
    };

    /* ---------- 渲染与控制 ---------- */
    const charts = {};
    function renderAll() {
      Object.entries(builders).forEach(([id, build]) =&gt; {
        const element = document.getElementById(id);
        if (!element) return;
        if (!charts[id]) charts[id] = echarts.init(element, null, { renderer: &quot;canvas&quot; });
        charts[id].setOption(build(), { notMerge: true, lazyUpdate: false });
      });
    }

    const refreshButton = document.getElementById(&quot;e6kl-refresh&quot;);
    const motionButton = document.getElementById(&quot;e6kl-motion&quot;);

    refreshButton.addEventListener(&quot;click&quot;, () =&gt; {
      renderAll();
    });

    function syncMotionButton() {
      motionButton.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionButton.textContent = motionEnabled ? &quot;更新动效：开&quot; : &quot;更新动效：关&quot;;
    }

    motionButton.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      syncMotionButton();
      renderAll();
    });

    reducedMotion.addEventListener?.(&quot;change&quot;, (event) =&gt; {
      if (event.matches) {
        motionEnabled = false;
        syncMotionButton();
        renderAll();
      }
    });

    let resizeFrame = 0;
    const resizeCharts = () =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() =&gt; Object.values(charts).forEach((chart) =&gt; chart.resize()));
    };
    if (&quot;ResizeObserver&quot; in window) {
      new ResizeObserver(resizeCharts).observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    syncMotionButton();
    renderAll();
  })();
  &lt;/script&gt;
&lt;/body&gt;
