&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;ECharts 6 统计分布视觉效果库&lt;/title&gt;
&lt;style&gt;
  :root {
    --sd-bg: #0a1e3c;
    --sd-panel: rgba(13, 34, 64, 0.72);
    --sd-border: rgba(86, 150, 224, 0.28);
    --sd-text: #e6f1ff;
    --sd-muted: #8fa7c8;
    --sd-cyan: #3fe1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--sd-text);
    font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, &quot;Segoe UI&quot;, sans-serif;
    background:
      radial-gradient(circle at 12% 0%, rgba(63, 225, 255, 0.10), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(75, 125, 255, 0.12), transparent 46%),
      linear-gradient(rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      var(--sd-bg);
    background-size: auto, auto, 44px 44px, 44px 44px, auto;
  }
  .e6sd-shell { max-width: 1560px; margin: 0 auto; padding: 26px 24px 48px; }
  .e6sd-header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between;
    padding-bottom: 18px; border-bottom: 1px solid rgba(86, 150, 224, 0.22); margin-bottom: 22px;
  }
  .e6sd-header h1 {
    margin: 0 0 6px; font-size: clamp(24px, 2vw, 32px); letter-spacing: 0.02em;
    background: linear-gradient(100deg, #e8f6ff 20%, #7cc7ff 75%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .e6sd-header p { margin: 0; color: var(--sd-muted); font-size: 13px; }
  .e6sd-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .e6sd-chip {
    font-size: 12px; color: var(--sd-muted); padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--sd-border); background: rgba(16, 42, 78, 0.6);
  }
  .e6sd-chip strong { color: #bfe0ff; font-weight: 600; }
  .e6sd-chip.is-pass strong { color: #6ef0c2; }
  .e6sd-chip.is-fail { border-color: rgba(255, 122, 122, 0.55); }
  .e6sd-chip.is-fail strong { color: #ff9d9d; }
  .e6sd-button {
    font: inherit; font-size: 13px; color: #d7ecff; padding: 9px 16px; border-radius: 10px;
    border: 1px solid rgba(102, 178, 255, 0.45); background: rgba(33, 76, 133, 0.55); cursor: pointer;
    transition: background 0.2s ease;
  }
  .e6sd-button:hover, .e6sd-button:focus-visible { background: rgba(52, 106, 174, 0.7); }
  .e6sd-button:focus-visible { outline: 2px solid #7cc7ff; outline-offset: 2px; }
  .e6sd-minibtn {
    font: inherit; font-size: 11px; color: #9fd8ff; padding: 4px 10px; border-radius: 999px;
    border: 1px solid rgba(111, 185, 232, 0.4); background: rgba(26, 60, 104, 0.55); cursor: pointer;
    white-space: nowrap;
  }
  .e6sd-minibtn:hover, .e6sd-minibtn:focus-visible { background: rgba(40, 86, 142, 0.7); }
  .e6sd-minibtn:focus-visible { outline: 2px solid #7cc7ff; outline-offset: 2px; }
  .e6sd-minibtn[aria-pressed=&quot;true&quot;] { border-color: rgba(76, 226, 180, 0.6); color: #6ef0c2; }
  .e6sd-error {
    display: none; margin: 0 0 18px; padding: 14px 18px; border-radius: 12px;
    border: 1px solid rgba(255, 122, 122, 0.5); background: rgba(96, 26, 38, 0.5); color: #ffd9d9; font-size: 13px;
  }
  .e6sd-error.is-visible { display: block; }
  .e6sd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(470px, 1fr)); gap: 18px; }
  @media (max-width: 520px) { .e6sd-grid { grid-template-columns: 1fr; } }
  .e6sd-panel {
    position: relative; border-radius: 14px; border: 1px solid var(--sd-border);
    background: var(--sd-panel); padding: 16px 18px 12px; overflow: hidden;
  }
  .e6sd-panel::before {
    content: &quot;&quot;; position: absolute; left: 0; top: 0; width: 42px; height: 3px;
    background: linear-gradient(90deg, var(--sd-cyan), transparent);
  }
  .e6sd-panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .e6sd-panel-heading { min-width: 0; }
  .e6sd-panel-index { font-size: 11px; letter-spacing: 0.14em; color: #6fb9e8; }
  .e6sd-panel-heading h2 { margin: 4px 0 0; font-size: 17px; font-weight: 600; color: #f0f7ff; }
  .e6sd-panel-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; max-width: 55%; }
  .e6sd-level {
    flex: none; font-size: 11px; color: #9fd8ff; padding: 5px 10px; border-radius: 999px;
    border: 1px solid rgba(111, 185, 232, 0.4); background: rgba(26, 60, 104, 0.55); white-space: nowrap;
  }
  .e6sd-level.is-key { color: #ffd79a; border-color: rgba(255, 200, 87, 0.45); background: rgba(84, 62, 22, 0.4); }
  .e6sd-chart { position: relative; width: 100%; height: 300px; margin-top: 8px; }
  .e6sd-chart.is-tall { height: 360px; }
  .e6sd-panel-footer {
    display: flex; flex-direction: column; gap: 4px; padding: 10px 2px 4px;
    border-top: 1px dashed rgba(86, 150, 224, 0.25); margin-top: 6px;
    font-size: 12px; color: var(--sd-muted);
  }
  .e6sd-panel-footer strong { color: #bfe0ff; font-weight: 600; }
  .e6sd-note { color: #ffb4a8; }
  .e6sd-note:empty { display: none; }

&lt;body&gt;
  &lt;div class=&quot;e6sd-shell&quot;&gt;
    &lt;header class=&quot;e6sd-header&quot;&gt;
      &lt;div&gt;
        &lt;h1&gt;ECharts 6 统计分布视觉效果库&lt;/h1&gt;
        &lt;p&gt;典型水平、离散度、偏态、异常点与群体差异的十六种统计表达 · 统计口径显式声明 · 全部统计量由内联确定性函数构建期计算&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;e6sd-meta&quot; aria-label=&quot;演示控制&quot;&gt;
        &lt;span class=&quot;e6sd-chip&quot;&gt;背景 &lt;strong&gt;RGB 10 · 30 · 60&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;e6sd-chip&quot;&gt;引擎 &lt;strong&gt;ECharts 6.1&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;e6sd-chip&quot;&gt;口径 &lt;strong&gt;1.5×IQR · FD 分箱 · 高斯核&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;e6sd-chip&quot; id=&quot;e6sd-selfcheck&quot;&gt;自检 &lt;strong&gt;运行中…&lt;/strong&gt;&lt;/span&gt;
        &lt;button class=&quot;e6sd-button&quot; id=&quot;e6sd-refresh&quot; type=&quot;button&quot;&gt;刷新数据&lt;/button&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;div class=&quot;e6sd-error&quot; id=&quot;e6sd-error&quot; role=&quot;alert&quot;&gt;ECharts 资源加载失败，请联网后重新打开此文件。&lt;/div&gt;

    &lt;main class=&quot;e6sd-grid&quot; aria-label=&quot;统计分布视觉效果对照&quot;&gt;
      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;01 · BOXPLOT&lt;/span&gt;&lt;h2&gt;标准箱线图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level is-key&quot;&gt;群体对比&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d01&quot; role=&quot;img&quot; aria-label=&quot;五个网点业务处理时长的箱线图，含异常点与样本量&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;处理时长（分钟）· 须线 = 1.5×IQR 内最远样本 · Tooltip 分列四分位、须线端点与样本极值 · 异常点可定位工单号 · 各组 n 见轴标签&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;02 · GROUPED BOX&lt;/span&gt;&lt;h2&gt;分组箱线图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level&quot;&gt;二级对比&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d02&quot; role=&quot;img&quot; aria-label=&quot;三个机构下线上线下两渠道的分组箱线图&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;机构 × 渠道两级分组 · 同一渠道颜色一致 · 图例筛选后布局稳定 · 样本量不足的组在轴标签提示&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;03 · RANKED BOX&lt;/span&gt;&lt;h2&gt;水平箱线排名&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;
            &lt;button class=&quot;e6sd-minibtn&quot; id=&quot;e6sd-d03-sort&quot; type=&quot;button&quot;&gt;排序：中位数&lt;/button&gt;
            &lt;span class=&quot;e6sd-level&quot;&gt;长名场景&lt;/span&gt;
          &lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d03&quot; role=&quot;img&quot; aria-label=&quot;按中位数或离散度排序的水平箱线图，支持长名称&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;水平布局 · 可切换按中位数 / IQR 排序（排序不改变统计值）· 长名称截断显示、悬停查看全文&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;04 · VIOLIN&lt;/span&gt;&lt;h2&gt;小提琴图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level is-key&quot;&gt;密度形状&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d04&quot; role=&quot;img&quot; aria-label=&quot;四个群体的对称小提琴图，叠加中位数与四分位刻度&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;自包含 custom 系列（KDE 轮廓构建期预计算进数据项，未引入官方扩展包）· 各组密度按同一规则归一 · 中位线与四分位刻度内嵌 · 带宽 = Silverman 经验规则&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;05 · SPLIT VIOLIN&lt;/span&gt;&lt;h2&gt;分裂小提琴图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level&quot;&gt;双群体对照&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d05&quot; role=&quot;img&quot; aria-label=&quot;每个分类左右两群体的分裂小提琴图，样本不足的分类退化为原始点&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;左=对照组 / 右=试点组（方向与图例固定）· 两侧同带宽同尺度 · 样本 n&amp;lt;5 的分类退化为原始点并提示&lt;/span&gt;
          &lt;span class=&quot;e6sd-note&quot; id=&quot;e6sd-note-d05&quot;&gt;&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;06 · HISTOGRAM&lt;/span&gt;&lt;h2&gt;标准直方图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;
            &lt;button class=&quot;e6sd-minibtn&quot; id=&quot;e6sd-d06-mode&quot; type=&quot;button&quot;&gt;显示：频数&lt;/button&gt;
            &lt;span class=&quot;e6sd-level&quot;&gt;单变量分布&lt;/span&gt;
          &lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d06&quot; role=&quot;img&quot; aria-label=&quot;连续指标的直方图，可切换频数与频率显示&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;Freedman–Diaconis 分箱（IQR=0 或小样本回退 Sturges）· 相邻箱无分类间隙 · 分箱边界与宽度悬停可查 · 频数/频率切换时轴标题同步&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;07 · HIST + KDE&lt;/span&gt;&lt;h2&gt;直方图与密度线&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level&quot;&gt;形态判断&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d07&quot; role=&quot;img&quot; aria-label=&quot;直方图频数柱与核密度估计曲线的双轴组合&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;左轴=实际频数（柱）· 右轴=估计密度（线，单位 1/毫秒）双轴分离标注 · 平滑线为估计值，不代表实际计数&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;08 · KDE COMPARE&lt;/span&gt;&lt;h2&gt;核密度对比&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level&quot;&gt;多群体形态&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d08&quot; role=&quot;img&quot; aria-label=&quot;三个群体核密度曲线在同一坐标下的对比&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;同一 X 范围 · 同一带宽规则（Silverman）· 各曲线面积归一为 1 · 图例含各组带宽与样本量 · 群体数上限 3&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;09 · JITTER&lt;/span&gt;&lt;h2&gt;抖动散点&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level&quot;&gt;原始样本&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d09&quot; role=&quot;img&quot; aria-label=&quot;三个组的原始样本抖动散点，偏移由实体标识稳定哈希生成&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;横向偏移 = entityId 的 FNV-1a 稳定哈希（构建期预计算，刷新后同一实体位置不变，未用运行时随机抖动）· 偏移不改变数值，Tooltip 显示原值&lt;/span&gt;
        &lt;/footer&gt;
      &lt;/section&gt;

      &lt;section class=&quot;e6sd-panel&quot;&gt;
        &lt;header class=&quot;e6sd-panel-header&quot;&gt;
          &lt;div class=&quot;e6sd-panel-heading&quot;&gt;&lt;span class=&quot;e6sd-panel-index&quot;&gt;10 · BEESWARM&lt;/span&gt;&lt;h2&gt;蜂群图&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;e6sd-panel-tools&quot;&gt;&lt;span class=&quot;e6sd-level is-key&quot;&gt;无遮挡分布&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;e6sd-chart&quot; id=&quot;e6sd-d10&quot; role=&quot;img&quot; aria-label=&quot;确定性贪心圆堆积布局的蜂群图，显示当前展示比例&quot;&gt;&lt;/div&gt;
        &lt;footer class=&quot;e6sd-panel-footer&quot;&gt;
          &lt;span&gt;&lt;strong&gt;口径：&lt;/strong&gt;构建期确定性贪心圆堆积布局（按值排序逐点寻找最小可行偏移）→ 原生 scatter 渲染 · 大样本先确定性采样再布局，展示比例见图内标注 · 布局基于标称画幅，极端窄屏下以避让为准&lt;/span&gt;
        &lt;/footer&gt;

&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {
  &quot;use strict&quot;;
  if (!window.echarts || window.LabAddons) return;
  function probe(tag, data) {
    try { if (parent !== window) parent.postMessage(&quot;LABADDONS:&quot; + tag + &quot;:&quot; + JSON.stringify(data || {}), &quot;*&quot;); } catch (_) { /* noop */ }
  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,

      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l &gt; 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g &lt; b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l, a: a };
  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;
    return c.a &gt;= 1 ? &quot;hsl(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%)&quot; : &quot;hsla(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%, &quot; + Math.round(c.a * 1000) / 1000 + &quot;)&quot;;
  }
  function isChromatic(c) {
    return c &amp;&amp; c.s &gt;= 0.14 &amp;&amp; c.a &gt; 0.04 &amp;&amp; c.l &gt; 0.02 &amp;&amp; c.l &lt; 0.98;
  }

  /* ---------- 主题颜色映射（色相族 → 主题色板槽位；保留原明度/透明度层次） ---------- */
  function buildMapper(option, theme) {
    var families = []; // {hue}
    collect(option);
    function collect(node) {
      if (node == null) return;
      if (typeof node === &quot;string&quot;) {
        var c = parseColor(node);
        if (isChromatic(c) &amp;&amp; familyOf(c.h) === -1) families.push({ hue: c.h });
        return;
      }
      if (Array.isArray(node)) { node.forEach(collect); return; }
      if (typeof node === &quot;object&quot;) {
        for (var k in node) {
          if (k === &quot;formatter&quot; || k === &quot;text&quot; || k === &quot;subtext&quot;) continue;
          collect(node[k]);
        }
      }
    }
    function familyOf(h) {
      for (var i = 0; i &lt; families.length; i++) if (hueDist(families[i].hue, h) &lt;= 26) return i;
      return -1;
    }
    var targets = theme.colors.map(parseColor);
    return function mapColorStr(str) {
      var c = parseColor(str);
      if (!isChromatic(c)) return str;
      var fi = familyOf(c.h);
      var t = targets[fi === -1 ? 0 : fi % targets.length];
      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });
    };
  }

  function mapOption(option, theme) {
    var mapColor = buildMapper(option, theme);
    function walk(node, key) {
      if (node == null || typeof node === &quot;function&quot;) return node;
      if (typeof node === &quot;object&quot; &amp;&amp; (node.nodeType || node.getContext)) return node; // DOM/canvas 纹理等原样保留
      if (typeof node === &quot;string&quot;) {
        if (key === &quot;formatter&quot; || key === &quot;text&quot; || key === &quot;subtext&quot;) return node;
        return parseColor(node) ? mapColor(node) : node;
      }
      if (Array.isArray(node)) return node.map(function (v) { return walk(v, key); });
      if (typeof node === &quot;object&quot;) {
        var out = {};
        for (var k in node) out[k] = walk(node[k], k);
        return out;
      }
      return node;

    return walk(option, null);

  /* ---------- echarts.init / setOption 拦截 ---------- */
  var realInit = echarts.init.bind(echarts);
  echarts.init = function (dom, theme, opts) {
    var chart = realInit(dom, theme, opts);
    if (!dom || !chart) return chart;
    chart.__vizDom = dom;
    registry.add(chart);
    var realSet = chart.setOption.bind(chart);
    chart.__vizRealSetOption = realSet;
    chart.setOption = function (opt) {
      var rest = Array.prototype.slice.call(arguments, 1);
      if (opt &amp;&amp; opt.series) dom.__vizRaw = opt;
      var shown = activeTheme &amp;&amp; opt ? mapOption(opt, activeTheme) : opt;
      if (opt &amp;&amp; opt.series) dom.__vizShown = shown;
      return realSet.apply(null, [shown].concat(rest));
    };
    return chart;
  };

  /* ---------- 主题应用 ---------- */
  var stageEls = null;
  function findStageEls() {
    // 全屏级不透明底色容器（各实验室的&quot;舞台&quot;div），换主题时一并换底
    var out = [];
    var vw = window.innerWidth, vh = window.innerHeight;
    var candidates = document.body.querySelectorAll(&quot;:scope &gt; *, :scope &gt; * &gt; *&quot;);
    candidates.forEach(function (el) {
      if (el.id === &quot;lab-theme-widget&quot; || el.id === &quot;lab-copy-modal&quot;) return;
      if (el.offsetWidth &lt; vw * 0.9 || el.offsetHeight &lt; vh * 0.6) return;
      var c = parseColor(getComputedStyle(el).backgroundColor);
      if (c &amp;&amp; c.a &gt; 0.5) out.push({ el: el, orig: el.style.getPropertyValue(&quot;background-color&quot;) });
    });
    return out;
  }

  function applyTheme(theme) {
    activeTheme = theme;
    var root = document.documentElement;
    if (!stageEls) stageEls = findStageEls();
    stageEls.forEach(function (s) {
      if (theme &amp;&amp; theme.bg) s.el.style.setProperty(&quot;background-color&quot;, theme.bg, &quot;important&quot;);
      else if (s.orig) s.el.style.setProperty(&quot;background-color&quot;, s.orig);
      else s.el.style.removeProperty(&quot;background-color&quot;);
    });
    for (var i = 1; i &lt;= 6; i++) {
      if (theme &amp;&amp; theme.colors[i - 1]) root.style.setProperty(&quot;--viz-series-&quot; + i, theme.colors[i - 1]);
      else root.style.removeProperty(&quot;--viz-series-&quot; + i);
    }
    if (theme &amp;&amp; theme.colors[0]) root.style.setProperty(&quot;--primary&quot;, theme.colors[0]);
    else root.style.removeProperty(&quot;--primary&quot;);
    if (theme &amp;&amp; theme.bg) {
      root.style.setProperty(&quot;--background&quot;, theme.bg);
      root.style.setProperty(&quot;--lab-bg&quot;, theme.bg);
      root.classList.add(&quot;lab-themed&quot;);
    } else {
      root.style.removeProperty(&quot;--background&quot;);
      root.style.removeProperty(&quot;--lab-bg&quot;);
      root.classList.remove(&quot;lab-themed&quot;);
    }
    registry.forEach(function (chart) {
      if (chart.isDisposed &amp;&amp; chart.isDisposed()) { registry.delete(chart); return; }
      var raw = chart.__vizDom &amp;&amp; chart.__vizDom.__vizRaw;
      if (raw) chart.setOption(raw, { notMerge: true });
    });
  }

  /* ---------- 复制配置 ---------- */
  function serializeJS(value, indent) {
    var pad = &quot;  &quot;.repeat(indent), padIn = &quot;  &quot;.repeat(indent + 1);
    if (value === null) return &quot;null&quot;;
    if (value === undefined) return &quot;undefined&quot;;
    var t = typeof value;
    if (t === &quot;number&quot; || t === &quot;boolean&quot;) return String(value);
    if (t === &quot;string&quot;) return JSON.stringify(value);
    if (t === &quot;function&quot;) {
      return String(value).split(&quot;\n&quot;).map(function (line, i) { return i === 0 ? line : padIn + line.trim(); }).join(&quot;\n&quot;);
    }
    if (Array.isArray(value)) {
      if (!value.length) return &quot;[]&quot;;
      var flat = value.every(function (v) { return v === null || [&quot;number&quot;, &quot;string&quot;, &quot;boolean&quot;].indexOf(typeof v) !== -1; });
      var items = value.map(function (v) { return serializeJS(v, indent + 1); });
      if (flat &amp;&amp; items.join(&quot;, &quot;).length &lt; 100) return &quot;[&quot; + items.join(&quot;, &quot;) + &quot;]&quot;;
      return &quot;[\n&quot; + items.map(function (s) { return padIn + s; }).join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;]&quot;;
    }
    if (t === &quot;object&quot;) {
      var keys = Object.keys(value).filter(function (k) { return value[k] !== undefined; });
      if (!keys.length) return &quot;{}&quot;;
      var body = keys.map(function (k) {
        var key = /^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k);
        return padIn + key + &quot;: &quot; + serializeJS(value[k], indent + 1);
      });
      return &quot;{\n&quot; + body.join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;}&quot;;
    }
    return &quot;null&quot;;
  }

  function copyText(text, done) {
    if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { legacyCopy(text, done); });
    } else legacyCopy(text, done);
  }
  function legacyCopy(text, done) {
    try {
      var ta = document.createElement(&quot;textarea&quot;);
      ta.value = text;
      ta.style.cssText = &quot;position:fixed;left:-9999px;top:0&quot;;
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand(&quot;copy&quot;);
      ta.remove();
      if (ok) return done(true);
    } catch (e) { /* fall through */ }
    showModal(text);
    done(false);
  }
  function showModal(text) {
    var old = document.getElementById(&quot;lab-copy-modal&quot;);
    if (old) old.remove();
    var wrap = document.createElement(&quot;div&quot;);
    wrap.id = &quot;lab-copy-modal&quot;;
    wrap.innerHTML =
      &#x27;&lt;div class=&quot;lab-copy-mask&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lab-copy-box&quot;&gt;&lt;p&gt;自动复制受限，请手动全选复制：&lt;/p&gt;&#x27; +
      &#x27;&lt;textarea readonly&gt;&lt;/textarea&gt;&lt;button type=&quot;button&quot;&gt;关闭&lt;/button&gt;&lt;/div&gt;&#x27;;
    wrap.querySelector(&quot;textarea&quot;).value = text;
    wrap.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    wrap.querySelector(&quot;.lab-copy-mask&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    document.body.appendChild(wrap);
    wrap.querySelector(&quot;textarea&quot;).select();
  }

  function schemeTitle(head) {
    var el = head.querySelector(&quot;h1,h2,h3,h4&quot;);
    return el ? el.textContent.trim() : &quot;方案&quot;;
  }

  function onCopyClick(btn, head) {
    var card = head.parentElement;
    var chartNode = card ? card.querySelector(config.chartSelector) : null;
    var opt = chartNode &amp;&amp; (chartNode.__vizShown || chartNode.__vizRaw);
    if (!opt) { flash(btn, &quot;图表未渲染&quot;); return; }
    var text = &quot;/* 方案：&quot; + schemeTitle(head) + &quot; · ECharts 6.1.0&quot; +
      (activeTheme ? &quot; · 主题：&quot; + activeTheme.name : &quot;&quot;) +
      &quot; · 用法：echarts.init(dom).setOption(option) */\n&quot; +
      &quot;const option = &quot; + serializeJS(opt, 0) + &quot;;\n&quot;;
    copyText(text, function (ok) { flash(btn, ok ? &quot;已复制&quot; : &quot;见弹窗&quot;); });
  }
  function flash(btn, msg) {
    var origin = btn.dataset.label;
    btn.textContent = msg;
    btn.disabled = true;
    setTimeout(function () { btn.textContent = origin; btn.disabled = false; }, 1200);
  }

  var injectQueued = false;
  function injectButtons() {
    if (!config.headSelector) return;
    document.querySelectorAll(config.headSelector).forEach(function (head) {
      if (head.querySelector(&quot;.lab-copy-btn&quot;)) return;
      var card = head.parentElement;
      if (!card || !card.querySelector(config.chartSelector)) return;
      var btn = document.createElement(&quot;button&quot;);
      btn.type = &quot;button&quot;;
      btn.className = &quot;lab-copy-btn&quot;;
      btn.textContent = &quot;复制配置&quot;;
      btn.dataset.label = &quot;复制配置&quot;;
      btn.addEventListener(&quot;click&quot;, function () { onCopyClick(btn, head); });
      head.appendChild(btn);
    });
  }
  function queueInject() {
    if (injectQueued) return;
    injectQueued = true;
    setTimeout(function () { injectQueued = false; injectButtons(); }, 120);

        for (let i = 0; i &lt; 200; i++) pts.push([(i % 17) * 0.37, (i % 13) * 0.53, &quot;p&quot; + i]);
        const bins = hexbin(pts, 1.2);
        return bins.reduce((a, b) =&gt; a + b.count, 0) === 200;
      });
      const passCount = results.filter((r) =&gt; r.pass).length;
      const chip = document.getElementById(&quot;e6sd-selfcheck&quot;);
      chip.innerHTML = &quot;&quot;;
      chip.append(&quot;自检 &quot;);
      const strong = document.createElement(&quot;strong&quot;);
      strong.textContent = passCount + &quot;/&quot; + results.length + (passCount === results.length ? &quot; 通过&quot; : &quot; 未通过&quot;);
      chip.appendChild(strong);
      chip.classList.add(passCount === results.length ? &quot;is-pass&quot; : &quot;is-fail&quot;);
      if (passCount !== results.length) {
        errorNode.textContent = &quot;页面自检未通过：&quot; + results.filter((r) =&gt; !r.pass).map((r) =&gt; r.name).join(&quot;、&quot;);
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }

    /* ================= 公共构件 ================= */

    function baseOption(trigger) {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 600 : 0,
        animationDurationUpdate: motionEnabled ? 400 : 0,
        tooltip: {
          trigger: trigger || &quot;item&quot;,
          confine: true,
          backgroundColor: &quot;rgba(9, 24, 48, 0.92)&quot;,
          borderColor: &quot;rgba(102, 178, 255, 0.4)&quot;,
          textStyle: { color: &quot;#dcedff&quot;, fontSize: 12 }
        }
      };
    }
    function catAxis(data, extra) {
      return Object.assign({
        type: &quot;category&quot;, data,
        axisLine: { lineStyle: { color: AXIS_LINE } },
        axisTick: { show: false },
        axisLabel: { color: C.muted, fontSize: 11 }
      }, extra || {});
    }
    function valAxis(name, extra) {
      return Object.assign({
        type: &quot;value&quot;, name,
        nameTextStyle: { color: C.muted, fontSize: 11 },
        axisLine: { show: false },
        axisLabel: { color: C.muted, fontSize: 11 },
        splitLine: { lineStyle: { color: SPLIT_LINE } }
      }, extra || {});
    }
    function boxItem(b, extraMeta) {
      return {
        value: [b.whiskerLow, b.q1, b.med, b.q3, b.whiskerHigh],
        sdMeta: Object.assign({ n: b.n, sampleMin: b.sampleMin, sampleMax: b.sampleMax, iqr: Math.round(b.iqr * 100) / 100 }, extraMeta || {})
      };
    }
    function boxTooltipFormatter(p) {
      var v = p.data.value || p.data;
      var m = p.data.sdMeta || {};
      function f(x) { return Math.round(x * 100) / 100; }
      return p.name + (m.n != null ? &quot;（n=&quot; + m.n + &quot;）&quot; : &quot;&quot;) +
        &quot;&lt;br/&gt;须线上端：&quot; + f(v[4]) + &quot; · 须线下端：&quot; + f(v[0]) +
        &quot;&lt;br/&gt;Q3：&quot; + f(v[3]) + &quot; · 中位数：&quot; + f(v[2]) + &quot; · Q1：&quot; + f(v[1]) +
        &quot;&lt;br/&gt;样本极值：[&quot; + f(m.sampleMin) + &quot;, &quot; + f(m.sampleMax) + &quot;]（与须线端点区分）&quot; +
        &quot;&lt;br/&gt;口径：须线 = 1.5×IQR 内最远样本&quot;;
    }

    /* ================= 方案构建器 ================= */

    /* ---------- D01 标准箱线图 ---------- */
    function buildD01() {
      const sites = [&quot;城东网点&quot;, &quot;城西网点&quot;, &quot;城南网点&quot;, &quot;城北网点&quot;, &quot;高新网点&quot;];
      const groups = sites.map((name, gi) =&gt; {
        const raw = Array.from({ length: 60 + gi * 12 }, (_, k) =&gt; Math.max(2, gauss(24 + gi * 3, 5 + gi)));
        // 注入个别极端值形成异常点
        raw.push(70 + gi * 6, 3);
        return { name, values: cleanSample(raw).values.map((v) =&gt; Math.round(v * 10) / 10) };
      });
      const boxes = groups.map((g) =&gt; boxStats(g.values));
      const outlierPts = [];
      groups.forEach((g, i) =&gt; {
        boxes[i].outliers.forEach((v, k) =&gt; {
          outlierPts.push({ value: [i, v], sdEntity: &quot;工单-&quot; + g.name.slice(0, 2) + &quot;-&quot; + (1000 + k) });
        });
      });
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 28, bottom: 8, containLabel: true },
        legend: { top: 0, data: [&quot;处理时长&quot;, &quot;异常点&quot;], icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, textStyle: { color: C.muted, fontSize: 10 } },
        xAxis: catAxis(groups.map((g, i) =&gt; g.name + &quot;\nn=&quot; + boxes[i].n)),
        yAxis: valAxis(&quot;分钟&quot;),
        series: [
          {
            name: &quot;处理时长&quot;, type: &quot;boxplot&quot;,
            data: boxes.map((b) =&gt; boxItem(b)),
            itemStyle: { color: &quot;rgba(63, 225, 255, 0.18)&quot;, borderColor: &quot;#3fe1ff&quot;, borderWidth: 1.4 },
            tooltip: { formatter: boxTooltipFormatter }
          },
          {
            name: &quot;异常点&quot;, type: &quot;scatter&quot;, data: outlierPts, symbolSize: 7,
            itemStyle: { color: &quot;#ff6680&quot;, opacity: 0.85 },
            tooltip: { formatter: function (p) { return &quot;异常点 · &quot; + p.data.sdEntity + &quot;&lt;br/&gt;时长：&quot; + p.value[1] + &quot; 分钟&quot;; } }
          }
        ]
      });
    }

    /* ---------- D02 分组箱线图 ---------- */
    function buildD02() {
      const orgs = [&quot;一支行&quot;, &quot;二支行&quot;, &quot;三支行&quot;];
      const channels = [{ name: &quot;线上渠道&quot;, color: &quot;#3fe1ff&quot; }, { name: &quot;线下渠道&quot;, color: &quot;#ffc857&quot; }];
      const series = channels.map((ch, ci) =&gt; ({
        name: ch.name, type: &quot;boxplot&quot;,
        itemStyle: { color: ci === 0 ? &quot;rgba(63, 225, 255, 0.16)&quot; : &quot;rgba(255, 200, 87, 0.14)&quot;, borderColor: ch.color, borderWidth: 1.4 },
        data: orgs.map((org, oi) =&gt; {
          const nSample = ci === 1 &amp;&amp; oi === 2 ? 4 : 50 + oi * 10;   // 一组小样本演示
          const vals = Array.from({ length: nSample }, () =&gt; Math.max(1, gauss(18 + oi * 4 + ci * 6, 4)));
          const b = boxStats(vals.map((v) =&gt; Math.round(v * 10) / 10));
          return Object.assign(boxItem(b, { small: b.n &lt; 5 }), b.n &lt; 5 ? { itemStyle: { borderColor: &quot;#ff9db8&quot;, borderType: &quot;dashed&quot; } } : {});
        }),
        tooltip: {
          formatter: function (p) {
            var base = boxTooltipFormatter(p);
            if (p.data.sdMeta &amp;&amp; p.data.sdMeta.small) base += &quot;&lt;br/&gt;提示：样本量不足（n&lt;5），解释需谨慎&quot;;
            return base;
          }
        }
      }));
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 28, bottom: 8, containLabel: true },
        legend: { top: 0, data: channels.map((c) =&gt; c.name), icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, textStyle: { color: C.muted, fontSize: 10 } },
        xAxis: catAxis(orgs, { boundaryGap: true }),
        yAxis: valAxis(&quot;万元&quot;),
        series
      });
    }

    /* ---------- D03 水平箱线排名 ---------- */
    let d03SortBy = &quot;median&quot;; // median | iqr
    let d03Groups = null;
    function makeD03() {
      const names = [
        &quot;省属国有企业资产运营集团&quot;, &quot;城市基础设施建设投资集团&quot;, &quot;现代农业产业发展有限公司&quot;,
        &quot;文化旅游融合发展集团&quot;, &quot;绿色能源与环保科技公司&quot;, &quot;数字经济产业投资运营平台&quot;, &quot;交通枢纽综合开发集团&quot;
      ];
      d03Groups = names.map((name, i) =&gt; ({
        name,
        values: Array.from({ length: 40 + i * 8 }, () =&gt; Math.max(1, gauss(50 + i * 8, 6 + (i % 3) * 6))).map((v) =&gt; Math.round(v * 10) / 10)
      }));
    }
    function buildD03() {
      if (!d03Groups) makeD03();
      const rows = d03Groups.map((g) =&gt; ({ g, b: boxStats(g.values) }));
      rows.sort((a, b) =&gt; d03SortBy === &quot;median&quot; ? b.b.med - a.b.med : b.b.iqr - a.b.iqr);
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 20, top: 8, bottom: 8, containLabel: true },
        xAxis: valAxis(&quot;综合得分&quot;),

          inverse: true,
          axisLabel: { color: C.muted, fontSize: 10, width: 130, overflow: &quot;truncate&quot; },
          triggerEvent: false,
          tooltip: { show: true }
        }),
        series: [{
          name: &quot;得分分布&quot;, type: &quot;boxplot&quot;,
          data: rows.map((r) =&gt; Object.assign(boxItem(r.b, { full: r.g.name }), {})),
          itemStyle: { color: &quot;rgba(75, 125, 255, 0.16)&quot;, borderColor: &quot;#4b7dff&quot;, borderWidth: 1.4 },
          tooltip: {
            formatter: function (p) {
              var m = p.data.sdMeta || {};
              return (m.full || p.name) + &quot;（n=&quot; + m.n + &quot;）&lt;br/&gt;&quot; + boxTooltipFormatter(p).split(&quot;&lt;br/&gt;&quot;).slice(1).join(&quot;&lt;br/&gt;&quot;);
            }
          }
        }]
      });
    }

    /* ---------- D04 小提琴图（自包含 custom） ---------- */
    // 数据项 value = [组索引, q1, 中位, q3, n, K, y0, w0, y1, w1, ...]，w 已按全局峰值归一 [0,1]
    function violinItem(groupIdx, values, bw, globalPeak) {
      const s = sortAsc(values);
      const lo = s[0], hi = s[s.length - 1];
      const pad = (hi - lo) * 0.15 || 1;
      const K = 36;
      const xs = [];
      for (let k = 0; k &lt; K; k++) xs.push(lo - pad + (hi - lo + 2 * pad) * k / (K - 1));
      const dens = kde(values, xs, bw);
      const arr = [groupIdx,
        Math.round(quantileSorted(s, 0.25) * 100) / 100,
        Math.round(quantileSorted(s, 0.5) * 100) / 100,
        Math.round(quantileSorted(s, 0.75) * 100) / 100,
        values.length, K];
      for (let k = 0; k &lt; K; k++) {
        arr.push(Math.round(xs[k] * 100) / 100);
        arr.push(Math.round(dens[k] / globalPeak * 1000) / 1000);
      }
      return arr;
    }
    function violinRenderItem(params, api) {
      var gi = api.value(0);
      var K = api.value(5);
      var half = api.size([1, 0])[0] * 0.42;
      var right = [], left = [];
      for (var k = 0; k &lt; K; k++) {
        var y = api.value(6 + k * 2);
        var w = api.value(7 + k * 2);
        var c = api.coord([gi, y]);
        right.push([c[0] + w * half, c[1]]);
        left.unshift([c[0] - w * half, c[1]]);
      }
      var q1 = api.coord([gi, api.value(1)]);
      var med = api.coord([gi, api.value(2)]);
      var q3 = api.coord([gi, api.value(3)]);
      var tick = half * 0.5;
      return {
        type: &quot;group&quot;,
        children: [
          { type: &quot;polygon&quot;, shape: { points: right.concat(left) }, style: { fill: api.visual(&quot;color&quot;), opacity: 0.4, stroke: api.visual(&quot;color&quot;), lineWidth: 1.2 } },
          { type: &quot;line&quot;, shape: { x1: q1[0] - tick, y1: q1[1], x2: q1[0] + tick, y2: q1[1] }, style: { stroke: &quot;#e6f1ff&quot;, lineWidth: 1, opacity: 0.7 } },
          { type: &quot;line&quot;, shape: { x1: med[0] - tick, y1: med[1], x2: med[0] + tick, y2: med[1] }, style: { stroke: &quot;#e6f1ff&quot;, lineWidth: 2, opacity: 0.95 } },
          { type: &quot;line&quot;, shape: { x1: q3[0] - tick, y1: q3[1], x2: q3[0] + tick, y2: q3[1] }, style: { stroke: &quot;#e6f1ff&quot;, lineWidth: 1, opacity: 0.7 } }
        ]
      };
    }
    function buildD04() {
      const groupsDef = [&quot;华东集群&quot;, &quot;华南集群&quot;, &quot;华北集群&quot;, &quot;西部集群&quot;];
      const samples = groupsDef.map((name, i) =&gt; ({
        name,
        values: Array.from({ length: 90 }, () =&gt; Math.max(5, gauss(60 + i * 10, 8 + i * 2) + (i === 2 &amp;&amp; Math.random() &lt; 0.3 ? 30 : 0))).map((v) =&gt; Math.round(v * 10) / 10)
      }));
      // 同一带宽规则；按全局峰值归一保证各组可比
      const bws = samples.map((g) =&gt; silvermanBw(g.values));
      let globalPeak = 0;
      const densPeaks = samples.map((g, i) =&gt; {
        const s = sortAsc(g.values);
        const xs = [];
        for (let k = 0; k &lt; 36; k++) xs.push(s[0] + (s[s.length - 1] - s[0]) * k / 35);
        const d = kde(g.values, xs, bws[i]);
        const pk = Math.max.apply(null, d);
        globalPeak = Math.max(globalPeak, pk);
        return pk;
      });
      const data = samples.map((g, i) =&gt; violinItem(i, g.values, bws[i], globalPeak));
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 16, bottom: 8, containLabel: true },
        xAxis: catAxis(samples.map((g, i) =&gt; g.name + &quot;\nn=&quot; + g.values.length + &quot; bw=&quot; + Math.round(bws[i] * 100) / 100)),
        yAxis: valAxis(&quot;响应时延 ms&quot;, { scale: true }),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            var v = p.data;
            return p.name.split(&quot;\n&quot;)[0] + &quot;（n=&quot; + v[4] + &quot;）&lt;br/&gt;Q3：&quot; + v[3] + &quot; · 中位：&quot; + v[2] + &quot; · Q1：&quot; + v[1] + &quot;&lt;br/&gt;密度按全组统一峰值归一&quot;;
          }
        }),
        series: [{
          name: &quot;时延分布&quot;, type: &quot;custom&quot;, color: &quot;#3fe1ff&quot;,
          data, encode: { x: 0, y: [1, 2, 3] },
          renderItem: violinRenderItem,
          itemStyle: { color: &quot;#3fe1ff&quot; }
        }]
      });
    }

    /* ---------- D05 分裂小提琴图 ---------- */
    function buildD05() {
      const cats = [&quot;新客获取&quot;, &quot;存量激活&quot;, &quot;流失挽回&quot;];
      const sides = [{ name: &quot;对照组&quot;, dir: -1, color: &quot;#6f8fb5&quot; }, { name: &quot;试点组&quot;, dir: 1, color: &quot;#3fe1ff&quot; }];
      const notes = [];
      const allValues = [];
      const cells = [];
      cats.forEach((cat, ci) =&gt; {
        sides.forEach((sd, si) =&gt; {
          const n = (ci === 2 &amp;&amp; si === 1) ? 4 : 70;   // 一格小样本退化演示
          const vals = Array.from({ length: n }, () =&gt; Math.max(0.5, gauss(10 + ci * 5 + si * 3, 2.5))).map((v) =&gt; Math.round(v * 100) / 100);
          allValues.push.apply(allValues, vals);
          cells.push({ ci, si, cat, side: sd, values: vals });
        });
      });
      const bw = silvermanBw(allValues);   // 两侧共用同一带宽
      let globalPeak = 0;
      cells.forEach((cell) =&gt; {
        if (cell.values.length &lt; 5) return;
        const s = sortAsc(cell.values);
        const xs = [];
        for (let k = 0; k &lt; 36; k++) xs.push(s[0] + (s[s.length - 1] - s[0]) * k / 35);
        cell.dens = kde(cell.values, xs, bw);
        globalPeak = Math.max(globalPeak, Math.max.apply(null, cell.dens));
      });
      const seriesBySide = sides.map((sd) =&gt; ({
        name: sd.name, type: &quot;custom&quot;, color: sd.color,
        data: [], encode: { x: 0, y: [2, 3, 4] },
        // value = [catIdx, dir, q1, med, q3, n, K, y0,w0,...]（dir=±1 决定半边方向）
        renderItem: function (params, api) {
          var gi = api.value(0);
          var dir = api.value(1);
          var K = api.value(6);
          var half = api.size([1, 0])[0] * 0.4;
          var pts = [];
          var base = [];
          for (var k = 0; k &lt; K; k++) {
            var y = api.value(7 + k * 2);
            var w = api.value(8 + k * 2);
            var c = api.coord([gi, y]);
            pts.push([c[0] + dir * w * half, c[1]]);
            base.unshift([c[0], c[1]]);
          }
          var med = api.coord([gi, api.value(3)]);
          return {
            type: &quot;group&quot;,
            children: [
              { type: &quot;polygon&quot;, shape: { points: pts.concat(base) }, style: { fill: api.visual(&quot;color&quot;), opacity: 0.45, stroke: api.visual(&quot;color&quot;), lineWidth: 1 } },
              { type: &quot;line&quot;, shape: { x1: med[0], y1: med[1], x2: med[0] + dir * half * 0.55, y2: med[1] }, style: { stroke: &quot;#e6f1ff&quot;, lineWidth: 2, opacity: 0.9 } }
            ]
          };
        },
        itemStyle: { color: sd.color },
        tooltip: {
          formatter: function (p) {
            var v = p.data;
            return p.seriesName + &quot; · n=&quot; + v[5] + &quot;&lt;br/&gt;Q3：&quot; + v[4] + &quot; · 中位：&quot; + v[3] + &quot; · Q1：&quot; + v[2] + &quot;&lt;br/&gt;两侧共用带宽 &quot; + Math.round(bw * 100) / 100;
          }
        }
      }));
      const fallbackPts = [];
      cells.forEach((cell) =&gt; {
        if (cell.values.length &gt;= 5) {
          const s = sortAsc(cell.values);
          const arr = [cell.ci, cell.side.dir,
            Math.round(quantileSorted(s, 0.25) * 100) / 100,
            Math.round(quantileSorted(s, 0.5) * 100) / 100,
            Math.round(quantileSorted(s, 0.75) * 100) / 100,
            cell.values.length, 36];
          const lo = s[0], hi = s[s.length - 1];
          for (let k = 0; k &lt; 36; k++) {
            arr.push(Math.round((lo + (hi - lo) * k / 35) * 100) / 100);
            arr.push(Math.round(cell.dens[k] / globalPeak * 1000) / 1000);
          }
          seriesBySide[cell.si].data.push(arr);
        } else {
          notes.push(&quot;「&quot; + cell.cat + &quot; · &quot; + cell.side.name + &quot;」n=&quot; + cell.values.length + &quot; &lt; 5，退化为原始点&quot;);
          cell.values.forEach((v, k) =&gt; {
            fallbackPts.push({ value: [cell.ci + cell.side.dir * (0.12 + 0.1 * Math.abs(stableJitter(cell.cat + &quot;-&quot; + k))), v], sdSide: cell.side.name });
          });
        }
      });
      setNote(&quot;e6sd-note-d05&quot;, notes.join(&quot;；&quot;));
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 28, bottom: 8, containLabel: true },
        legend: { top: 0, data: sides.map((s) =&gt; s.name), icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, textStyle: { color: C.muted, fontSize: 10 } },
        xAxis: Object.assign(catAxis(cats), { type: &quot;value&quot;, min: -0.6, max: cats.length - 0.4, interval: 1, axisLabel: { color: C.muted, fontSize: 11, formatter: function (v) { return cats[Math.round(v)] || &quot;&quot;; } }, splitLine: { show: false } }),
        yAxis: valAxis(&quot;人均产出 万元&quot;, { scale: true }),
        series: seriesBySide.concat([{
          name: &quot;小样本原始点&quot;, type: &quot;scatter&quot;, data: fallbackPts, symbolSize: 6,
          itemStyle: { color: &quot;#ff9db8&quot;, opacity: 0.9 },
          tooltip: { formatter: function (p) { return p.data.sdSide + &quot;（小样本原始点）&lt;br/&gt;值：&quot; + p.value[1]; } }
        }])
      });
    }

    /* ---------- D06 标准直方图 ---------- */
    let d06Mode = &quot;count&quot;; // count | freq
    let d06Sample = null;
    function makeD06() {
      d06Sample = cleanSample(Array.from({ length: 420 }, () =&gt; Math.exp(gauss(3.2, 0.45)))).values.map((v) =&gt; Math.round(v * 10) / 10);
    }
    function buildD06() {
      if (!d06Sample) makeD06();
      const h = histogram(d06Sample);
      const n = d06Sample.length;
      const labels = h.bins.map((b) =&gt; Math.round(b.x0) + &quot;–&quot; + Math.round(b.x1));
      const data = h.bins.map((b) =&gt; ({
        value: d06Mode === &quot;count&quot; ? b.count : Math.round(b.count / n * 10000) / 10000,
        sdBin: [Math.round(b.x0 * 10) / 10, Math.round(b.x1 * 10) / 10, b.count, Math.round(b.count / n * 1000) / 10]
      }));
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 30, bottom: 8, containLabel: true },
        xAxis: catAxis(labels, { axisLabel: { color: C.muted, fontSize: 8, interval: Math.ceil(labels.length / 10) } }),
        yAxis: valAxis(d06Mode === &quot;count&quot; ? &quot;频数（笔）&quot; : &quot;频率（占比）&quot;),
        graphic: [{ type: &quot;text&quot;, right: 10, top: 2, style: { text: &quot;分箱规则：&quot; + h.rule + &quot; · 共 &quot; + h.bins.length + &quot; 箱 · n=&quot; + n, fill: &quot;#8fa7c8&quot;, fontSize: 11 } }],
        series: [{
          name: &quot;金额分布&quot;, type: &quot;bar&quot;, data, barCategoryGap: 0,

    /* ---------- D10 蜂群图（确定性贪心圆堆积） ---------- */
    function beeswarmLayout(values, opts) {
      // 标称画幅内布局：H 纵向像素、r 点半径；返回每点横向偏移（像素）
      const H = opts.H, r = opts.r;
      const s = values.slice().map((v, i) =&gt; ({ v, i })).sort((a, b) =&gt; a.v - b.v || a.i - b.i);
      const min = s[0].v, max = s[s.length - 1].v;
      const span = max - min || 1;
      const placed = [];
      const offsets = new Array(values.length);
      s.forEach((item) =&gt; {
        const py = (item.v - min) / span * H;
        // 与最近已放点比较，找最小 |offset|
        const near = placed.filter((p) =&gt; Math.abs(p.py - py) &lt; 2 * r);
        let off = 0;
        if (near.length) {
          const candidates = [0];
          near.forEach((p) =&gt; {
            const dy = p.py - py;
            const dx = Math.sqrt(Math.max(4 * r * r - dy * dy, 0)) + 0.35;
            candidates.push(p.off + dx, p.off - dx);
          });
          candidates.sort((a, b) =&gt; Math.abs(a) - Math.abs(b) || a - b);
          for (let ci = 0; ci &lt; candidates.length; ci++) {
            const cand = candidates[ci];
            let okFlag = true;
            for (let ni = 0; ni &lt; near.length; ni++) {
              const dy = near[ni].py - py, dx = near[ni].off - cand;
              if (dx * dx + dy * dy &lt; 4 * r * r - 0.01) { okFlag = false; break; }
            }
            if (okFlag) { off = cand; break; }
          }
        }
        placed.push({ py, off });
        offsets[item.i] = off;
      });
      return offsets;
    }
    function buildD10() {
      const rawN = 320, cap = 180;
      const raw = Array.from({ length: rawN }, (_, k) =&gt; ({
        id: &quot;客户-&quot; + String(k + 1).padStart(4, &quot;0&quot;),
        v: Math.round(Math.max(1, gauss(48, 12) + (k % 9 === 0 ? 30 : 0)) * 10) / 10
      }));
      const sampled = sampleDeterministic(raw, cap);
      const values = sampled.data.map((d) =&gt; d.v);
      const offs = beeswarmLayout(values, { H: 240, r: 4.2 });
      const pts = sampled.data.map((d, i) =&gt; ({ value: [offs[i], d.v], sdId: d.id, sdVal: d.v }));
      const maxOff = Math.max.apply(null, offs.map(Math.abs)) + 12;

        grid: { left: 8, right: 16, top: 26, bottom: 8, containLabel: true },
        graphic: [{ type: &quot;text&quot;, right: 10, top: 2, style: { text: &quot;展示 &quot; + sampled.data.length + &quot;/&quot; + rawN + &quot;（确定性等距采样 &quot; + Math.round(sampled.ratio * 100) + &quot;%）&quot;, fill: &quot;#8fa7c8&quot;, fontSize: 11 } }],
        xAxis: { type: &quot;value&quot;, min: -maxOff, max: maxOff, axisLabel: { show: false }, axisLine: { show: false }, splitLine: { show: false } },
        yAxis: valAxis(&quot;授信额度 万元&quot;),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) { return p.data.sdId + &quot;&lt;br/&gt;额度：&quot; + p.data.sdVal + &quot; 万元（横向位置仅为避让布局）&quot;; }
        }),
        series: [{
          name: &quot;样本&quot;, type: &quot;scatter&quot;, data: pts, symbolSize: 7.4,
          itemStyle: { color: &quot;#38e6b0&quot;, opacity: 0.8 },

    /* ---------- D11 条带＋摘要统计 ---------- */
    function buildD11() {

      const pts = [];

      groups.forEach((g, gi) =&gt; {
        const vals = Array.from({ length: 46 }, (_, k) =&gt; Math.round(Math.max(1, gauss(70 + gi * 6, 9)) * 10) / 10);
        vals.forEach((v, k) =&gt; {
          pts.push({ value: [gi + stableJitter(g + &quot;-&quot; + k) * 0.26, v], sdGroup: g, sdVal: v });
        });
        const m = mean(vals);
        const se = stdev(vals) / Math.sqrt(vals.length);
        summary.push({
          gi, name: g, n: vals.length,
          mean: Math.round(m * 100) / 100,
          lo: Math.round((m - 1.96 * se) * 100) / 100,
          hi: Math.round((m + 1.96 * se) * 100) / 100,
          med: Math.round(quantileSorted(sortAsc(vals), 0.5) * 100) / 100
        });
      });
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 30, bottom: 8, containLabel: true },

        xAxis: { type: &quot;value&quot;, min: -0.6, max: groups.length - 0.4, interval: 1, axisLine: { lineStyle: { color: AXIS_LINE } }, splitLine: { show: false }, axisLabel: { color: C.muted, fontSize: 10, formatter: function (v) { var s = summary[Math.round(v)]; return s ? s.name + &quot;\nn=&quot; + s.n : &quot;&quot;; } } },

          {
            name: &quot;95% CI&quot;, type: &quot;custom&quot;, color: &quot;#ffc857&quot;, z: 4,

          },

            tooltip: { formatter: function (p) { var s = p.data.sdSum; return s.name + &quot;（n=&quot; + s.n + &quot;）&lt;br/&gt;均值：&quot; + s.mean + &quot; · 中位：&quot; + s.med; } }

    /* ---------- D12 山脊分布图 ---------- */
    function buildD12() {
      const periods = [&quot;一月&quot;, &quot;二月&quot;, &quot;三月&quot;, &quot;四月&quot;, &quot;五月&quot;];
      const STEP = 1;
      const AMP = 1.55;  // 密度峰值缩放至 1.55×行距，形成轻度重叠
      const groups = periods.map((name, i) =&gt; ({
        name,
        values: cleanSample(Array.from({ length: 150 }, () =&gt; gauss(50 + i * 6, 9 + (i === 3 ? 6 : 0)))).values
      }));
      let lo = Infinity, hi = -Infinity;
      groups.forEach((g) =&gt; {
        const s = sortAsc(g.values);
        lo = Math.min(lo, s[0]); hi = Math.max(hi, s[s.length - 1]);
      });
      const pad = (hi - lo) * 0.08;
      const xs = [];
      for (let k = 0; k &lt; 70; k++) xs.push(lo - pad + (hi - lo + 2 * pad) * k / 69);
      const series = [];
      // 自上而下绘制：先画最上（最晚期），保证下方山脊基线在上层之上
      for (let i = groups.length - 1; i &gt;= 0; i--) {
        const g = groups[i];
        const bw = silvermanBw(g.values);
        const d = kde(g.values, xs, bw);
        const peak = Math.max.apply(null, d);
        const base = (groups.length - 1 - i) * STEP;
        const band = xs.map((x, k) =&gt; [Math.round(x * 10) / 10, base, Math.round((base + d[k] / peak * AMP) * 1000) / 1000]);
        series.push({
          name: g.name, type: &quot;custom&quot;,
          color: [&quot;#3fe1ff&quot;, &quot;#4b7dff&quot;, &quot;#9870ff&quot;, &quot;#ffc857&quot;, &quot;#38e6b0&quot;][i],
          data: band, encode: { x: 0, y: [1, 2] }, z: 2 + (groups.length - i),
          renderItem: function (params, api) {
            if (params.dataIndex !== 0) return null;
            var n = params.dataInsideLength;
            var up = [], down = [];
            for (var k = 0; k &lt; n; k++) {
              up.push(api.coord([api.value(0, k), api.value(2, k)]));
              down.unshift(api.coord([api.value(0, k), api.value(1, k)]));
            }
            var baseL = api.coord([api.value(0, 0), api.value(1, 0)]);
            var baseR = api.coord([api.value(0, n - 1), api.value(1, n - 1)]);
            return {
              type: &quot;group&quot;,
              children: [
                { type: &quot;polygon&quot;, shape: { points: up.concat(down) }, style: { fill: api.visual(&quot;color&quot;), opacity: 0.5, stroke: &quot;rgba(10, 30, 60, 0.9)&quot;, lineWidth: 1 } },
                { type: &quot;line&quot;, shape: { x1: baseL[0], y1: baseL[1], x2: baseR[0], y2: baseR[1] }, style: { stroke: api.visual(&quot;color&quot;), lineWidth: 1.6, opacity: 0.95 } }
              ]
            };
          },
          itemStyle: { color: [&quot;#3fe1ff&quot;, &quot;#4b7dff&quot;, &quot;#9870ff&quot;, &quot;#ffc857&quot;, &quot;#38e6b0&quot;][i] },
          silent: true
        });
      }
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 12, bottom: 8, containLabel: true },
        xAxis: valAxis(&quot;响应时长 秒&quot;, { min: Math.floor(lo - pad), max: Math.ceil(hi + pad) }),
        yAxis: {
          type: &quot;value&quot;, min: -0.2, max: groups.length * STEP + 1,
          interval: STEP,
          axisLabel: {
            color: C.muted, fontSize: 11,
            formatter: function (v) {
              var idx = groups.length - 1 - Math.round(v / STEP);
              return groups[idx] ? groups[idx].name : &quot;&quot;;
            }
          },
          axisLine: { show: false }, splitLine: { show: false }
        },
        series
      });
    }

    /* ---------- D14 QQ 图 ---------- */
    function buildD14() {
      const raw = cleanSample(Array.from({ length: 120 }, () =&gt; Math.exp(gauss(0, 0.55)) * 40)).values;
      const s = sortAsc(raw);
      const n = s.length;
      const m = mean(s), sd = stdev(s);
      const pts = s.map((v, i) =&gt; {
        const theo = invNorm((i + 0.5) / n);
        const sampleZ = (v - m) / sd;
        return { value: [Math.round(theo * 1000) / 1000, Math.round(sampleZ * 1000) / 1000], sdTail: Math.abs(theo) &gt; 1.5 };
      });
      const lim = Math.max.apply(null, pts.map((p) =&gt; Math.max(Math.abs(p.value[0]), Math.abs(p.value[1])))) * 1.1;
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 26, bottom: 8, containLabel: true },
        legend: { top: 0, data: [&quot;主体样本&quot;, &quot;尾部样本&quot;], icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, textStyle: { color: C.muted, fontSize: 10 } },
        graphic: [{ type: &quot;text&quot;, right: 10, top: 2, style: { text: &quot;n=&quot; + n + &quot; · 尾部整体偏上 → 右偏形态提示&quot;, fill: &quot;#8fa7c8&quot;, fontSize: 11 } }],
        xAxis: valAxis(&quot;理论分位（标准正态）&quot;, { min: -Math.ceil(lim), max: Math.ceil(lim) }),
        yAxis: valAxis(&quot;样本分位（标准化）&quot;, { min: -Math.ceil(lim), max: Math.ceil(lim) }),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) { return &quot;理论分位：&quot; + p.value[0] + &quot;&lt;br/&gt;样本分位：&quot; + p.value[1] + (p.data.sdTail ? &quot;&lt;br/&gt;尾部区（|z|&gt;1.5）&quot; : &quot;&quot;); }
        }),
        series: [
          { name: &quot;主体样本&quot;, type: &quot;scatter&quot;, data: pts.filter((p) =&gt; !p.sdTail), symbolSize: 6, itemStyle: { color: &quot;#3fe1ff&quot;, opacity: 0.75 } },
          { name: &quot;尾部样本&quot;, type: &quot;scatter&quot;, data: pts.filter((p) =&gt; p.sdTail), symbolSize: 7, itemStyle: { color: &quot;#ffc857&quot;, opacity: 0.95 } },
          {
            name: &quot;参考线&quot;, type: &quot;line&quot;, data: [[-lim, -lim], [lim, lim]], symbol: &quot;none&quot;,
            lineStyle: { color: &quot;rgba(230, 241, 255, 0.5)&quot;, type: &quot;dashed&quot;, width: 1.4 },
            tooltip: { show: false }, silent: true
          }
        ]
      });
    }

    /* ---------- D15 二维等高密度 ---------- */
    let d15ShowPoints = true;
    let d15Cache = null;
    function makeD15() {
      const pts = [];
      for (let k = 0; k &lt; 420; k++) {
        if (k % 3 === 0) pts.push([gauss(30, 6), gauss(70, 9)]);
        else pts.push([gauss(58, 9), gauss(42, 8)]);
      }
      // 网格化 2D KDE
      const NX = 44, NY = 36;
      let xlo = Infinity, xhi = -Infinity, ylo = Infinity, yhi = -Infinity;
      pts.forEach((p) =&gt; { xlo = Math.min(xlo, p[0]); xhi = Math.max(xhi, p[0]); ylo = Math.min(ylo, p[1]); yhi = Math.max(yhi, p[1]); });
      const padX = (xhi - xlo) * 0.12, padY = (yhi - ylo) * 0.12;
      xlo -= padX; xhi += padX; ylo -= padY; yhi += padY;
      const xs = [], ys = [];
      for (let i = 0; i &lt; NX; i++) xs.push(xlo + (xhi - xlo) * i / (NX - 1));
      for (let j = 0; j &lt; NY; j++) ys.push(ylo + (yhi - ylo) * j / (NY - 1));
      const bwx = silvermanBw(pts.map((p) =&gt; p[0]));
      const bwy = silvermanBw(pts.map((p) =&gt; p[1]));
      const grid = [];
      let peak = 0;
      for (let j = 0; j &lt; NY; j++) {
        const row = [];
        for (let i = 0; i &lt; NX; i++) {
          let sum = 0;
          for (let k = 0; k &lt; pts.length; k++) {
            const ux = (xs[i] - pts[k][0]) / bwx;
            const uy = (ys[j] - pts[k][1]) / bwy;
            sum += Math.exp(-0.5 * (ux * ux + uy * uy));
          }
          const v = sum / (pts.length * 2 * Math.PI * bwx * bwy);
          row.push(v);
          peak = Math.max(peak, v);
        }
        grid.push(row);
      }
      const LEVELS = 5;
      const cellData = [];
      const dx = xs[1] - xs[0], dy = ys[1] - ys[0];
      for (let j = 0; j &lt; NY; j++) {
        for (let i = 0; i &lt; NX; i++) {
          const lv = Math.min(LEVELS - 1, Math.floor(grid[j][i] / peak * LEVELS));
          if (lv &gt; 0) cellData.push([xs[i] - dx / 2, xs[i] + dx / 2, ys[j] - dy / 2, ys[j] + dy / 2, lv]);
        }
      }
      const contourData = [];
      for (let L = 1; L &lt; LEVELS; L++) {
        const level = peak * L / LEVELS;
        marchingSquares(grid, xs, ys, level).forEach((sg) =&gt; {
          contourData.push([sg[0], sg[1], sg[2], sg[3], L, Math.round(level * 100000) / 100000]);
        });
      }
      d15Cache = { pts, cellData, contourData, xlo, xhi, ylo, yhi, LEVELS, peak };
    }
    function buildD15() {
      if (!d15Cache) makeD15();
      const c = d15Cache;
      const LEVEL_FILL = [&quot;&quot;, &quot;rgba(63, 225, 255, 0.10)&quot;, &quot;rgba(63, 225, 255, 0.20)&quot;, &quot;rgba(75, 125, 255, 0.32)&quot;, &quot;rgba(152, 112, 255, 0.45)&quot;];
      const LEVEL_LINE = [&quot;&quot;, &quot;rgba(63, 225, 255, 0.5)&quot;, &quot;rgba(63, 225, 255, 0.7)&quot;, &quot;rgba(122, 162, 255, 0.85)&quot;, &quot;rgba(190, 160, 255, 0.95)&quot;];
      const series = [
        {
          name: &quot;密度分层&quot;, type: &quot;custom&quot;,
          data: c.cellData, encode: { x: [0, 1], y: [2, 3] }, silent: true, z: 1,
          renderItem: function (params, api) {
            var p1 = api.coord([api.value(0), api.value(2)]);
            var p2 = api.coord([api.value(1), api.value(3)]);
            var palette = [&quot;&quot;, &quot;rgba(63,225,255,0.10)&quot;, &quot;rgba(63,225,255,0.20)&quot;, &quot;rgba(75,125,255,0.32)&quot;, &quot;rgba(152,112,255,0.45)&quot;];
            return {
              type: &quot;rect&quot;,
              shape: { x: Math.min(p1[0], p2[0]), y: Math.min(p1[1], p2[1]), width: Math.abs(p2[0] - p1[0]) + 0.5, height: Math.abs(p2[1] - p1[1]) + 0.5 },
              style: { fill: palette[api.value(4)] || &quot;transparent&quot; }
            };
          }
        },
        {
          name: &quot;等高线&quot;, type: &quot;custom&quot;,
          data: c.contourData, encode: { x: [0, 2], y: [1, 3] }, z: 2,
          renderItem: function (params, api) {
            var a = api.coord([api.value(0), api.value(1)]);
            var b = api.coord([api.value(2), api.value(3)]);
            var palette = [&quot;&quot;, &quot;rgba(63,225,255,0.5)&quot;, &quot;rgba(63,225,255,0.7)&quot;, &quot;rgba(122,162,255,0.85)&quot;, &quot;rgba(190,160,255,0.95)&quot;];
            return { type: &quot;line&quot;, shape: { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, style: { stroke: palette[api.value(4)], lineWidth: 1.3 } };
          },
          tooltip: { formatter: function (p) { return &quot;等高线级别 &quot; + p.data[4] + &quot;/4&lt;br/&gt;密度值：&quot; + p.data[5]; } }
        }
      ];
      if (d15ShowPoints) {
        series.push({
          name: &quot;原始点&quot;, type: &quot;scatter&quot;,
          data: c.pts.map((p) =&gt; [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]),
          symbolSize: 3.4, itemStyle: { color: &quot;#e6f1ff&quot;, opacity: 0.35 }, z: 3,
          tooltip: { formatter: function (p) { return &quot;样本 (&quot; + p.value[0] + &quot;, &quot; + p.value[1] + &quot;)&quot;; } }
        });
      }
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 26, bottom: 8, containLabel: true },
        graphic: [{ type: &quot;text&quot;, right: 10, top: 2, style: { text: &quot;n=&quot; + c.pts.length + &quot; · 密度五级分档（0 级透明）· 等高线 4 条&quot;, fill: &quot;#8fa7c8&quot;, fontSize: 11 } }],
        xAxis: valAxis(&quot;风险评分&quot;, { min: Math.floor(c.xlo), max: Math.ceil(c.xhi) }),
        yAxis: valAxis(&quot;收益评分&quot;, { min: Math.floor(c.ylo), max: Math.ceil(c.yhi) }),
        series
      });
    }

    /* ---------- D16 六边形分箱 ---------- */
    let d16Cache = null;
    function makeD16() {
      const pts = [];
      for (let k = 0; k &lt; 2000; k++) {
        const id = &quot;交易-&quot; + String(k + 1).padStart(4, &quot;0&quot;);
        if (k % 4 === 0) pts.push([gauss(25, 7), gauss(30, 6), id]);
        else if (k % 4 === 1) pts.push([gauss(55, 8), gauss(60, 9), id]);
        else pts.push([gauss(42, 13), gauss(45, 13), id]);
      }
      const bins = hexbin(pts, 4);
      const maxCount = Math.max.apply(null, bins.map((b) =&gt; b.count));
      d16Cache = { pts, bins, maxCount };
    }
    const d16BinIds = {};
    function buildD16() {
      if (!d16Cache) makeD16();
      const c = d16Cache;
      const total = c.pts.length;
      Object.keys(d16BinIds).forEach((k) =&gt; delete d16BinIds[k]);
      const data = c.bins.map((b, i) =&gt; {
        d16BinIds[i] = b.ids;
        const lv = Math.min(4, Math.floor(b.count / c.maxCount * 5));
        return [Math.round(b.cx * 100) / 100, Math.round(b.cy * 100) / 100, b.count, lv, i, Math.round(b.count / total * 10000) / 100];
      });
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 26, bottom: 8, containLabel: true },
        graphic: [{ type: &quot;text&quot;, right: 10, top: 2, style: { text: &quot;n=&quot; + total + &quot; · &quot; + c.bins.length + &quot; 箱 · 色标 0 起五级 · 单击箱体回查实体&quot;, fill: &quot;#8fa7c8&quot;, fontSize: 11 } }],
        xAxis: valAxis(&quot;交易金额 万元&quot;, { scale: true }),
        yAxis: valAxis(&quot;交易频次 次/月&quot;, { scale: true }),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            var d = p.data;
            return &quot;箱中心 (&quot; + d[0] + &quot;, &quot; + d[1] + &quot;)&lt;br/&gt;计数：&quot; + d[2] + &quot; 笔 · 占比 &quot; + d[5] + &quot;%&lt;br/&gt;密度级别 &quot; + d[3] + &quot;/4（单击回查实体）&quot;;
          }
        }),
        series: [{
          name: &quot;六边形分箱&quot;, type: &quot;custom&quot;,
          data, encode: { x: 0, y: 1 },
          renderItem: function (params, api) {
            var cpt = api.coord([api.value(0), api.value(1)]);
            var rx = Math.abs(api.coord([api.value(0) + 4, api.value(1)])[0] - cpt[0]);
            var ry = Math.abs(api.coord([api.value(0), api.value(1) + 4])[1] - cpt[1]);
            var pts = [];
            for (var a = 0; a &lt; 6; a++) {
              var ang = Math.PI / 180 * (60 * a + 30);
              pts.push([cpt[0] + Math.cos(ang) * rx, cpt[1] + Math.sin(ang) * ry]);
            }
            var palette = [&quot;rgba(63,225,255,0.10)&quot;, &quot;rgba(63,225,255,0.25)&quot;, &quot;rgba(75,125,255,0.42)&quot;, &quot;rgba(152,112,255,0.6)&quot;, &quot;rgba(255,200,87,0.8)&quot;];
            return {
              type: &quot;polygon&quot;,
              shape: { points: pts },
              style: { fill: palette[api.value(3)], stroke: &quot;rgba(10, 30, 60, 0.85)&quot;, lineWidth: 1 }
            };
          }
        }]
      });
    }

    /* ================= 渲染调度 ================= */

    const builders = [
      { id: &quot;e6sd-d01&quot;, build: buildD01 },
      { id: &quot;e6sd-d02&quot;, build: buildD02 },
      { id: &quot;e6sd-d03&quot;, build: buildD03 },
      { id: &quot;e6sd-d04&quot;, build: buildD04 },
      { id: &quot;e6sd-d05&quot;, build: buildD05 },
      { id: &quot;e6sd-d06&quot;, build: buildD06 },
      { id: &quot;e6sd-d07&quot;, build: buildD07 },
      { id: &quot;e6sd-d08&quot;, build: buildD08 },
      { id: &quot;e6sd-d09&quot;, build: buildD09 },
      { id: &quot;e6sd-d10&quot;, build: buildD10 },
      { id: &quot;e6sd-d11&quot;, build: buildD11 },
      { id: &quot;e6sd-d12&quot;, build: buildD12 },
      { id: &quot;e6sd-d13&quot;, build: buildD13 },
      { id: &quot;e6sd-d14&quot;, build: buildD14 },
      { id: &quot;e6sd-d15&quot;, build: buildD15 },
      { id: &quot;e6sd-d16&quot;, build: buildD16 }
    ];
    const builderById = {};
    builders.forEach((b) =&gt; { builderById[b.id] = b; });

    const charts = {};
    function renderOne(id) {
      const item = builderById[id];
      const node = document.getElementById(id);
      if (!item || !node) return;
      if (!charts[id]) {
        charts[id] = echarts.init(node, null, { renderer: &quot;canvas&quot; });
        if (id === &quot;e6sd-d16&quot;) {
          charts[id].on(&quot;click&quot;, (p) =&gt; {
            if (p.seriesName !== &quot;六边形分箱&quot; || !p.data) return;
            const ids = d16BinIds[p.data[4]] || [];
            setNote(&quot;e6sd-note-d16&quot;, &quot;箱内实体（计数 &quot; + p.data[2] + &quot;）：&quot; + ids.slice(0, 12).join(&quot;、&quot;) + (ids.length &gt; 12 ? &quot; 等 &quot; + ids.length + &quot; 笔&quot; : &quot;&quot;));
          });
        }
      }
      try {
        charts[id].setOption(item.build(), { notMerge: true });
      } catch (err) {
        errorNode.textContent = &quot;方案「&quot; + id + &quot;」渲染异常：&quot; + err.message;
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }
    function renderInitialized() {
      Object.keys(charts).forEach(renderOne);
    }

    let io = null;
    if (&quot;IntersectionObserver&quot; in window) {
      io = new IntersectionObserver((entries) =&gt; {
        entries.forEach((entry) =&gt; {
          if (!entry.isIntersecting) return;
          renderOne(entry.target.id);
          io.unobserve(entry.target);
        });
      }, { rootMargin: &quot;320px 0px&quot; });
      builders.forEach((b) =&gt; {
        const node = document.getElementById(b.id);
        if (node) io.observe(node);
      });
    } else {
      builders.forEach((b) =&gt; renderOne(b.id));
    }

    let ro = null;
    function resizeCharts() {
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) charts[id].resize(); });
    }
    if (&quot;ResizeObserver&quot; in window) {
      ro = new ResizeObserver(resizeCharts);
      ro.observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    document.getElementById(&quot;e6sd-refresh&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      d03Groups = null; d06Sample = null; d15Cache = null; d16Cache = null;
      setNote(&quot;e6sd-note-d16&quot;, &quot;&quot;);
      renderInitialized();
    });

    const d03Btn = document.getElementById(&quot;e6sd-d03-sort&quot;);
    d03Btn.addEventListener(&quot;click&quot;, () =&gt; {
      d03SortBy = d03SortBy === &quot;median&quot; ? &quot;iqr&quot; : &quot;median&quot;;
      d03Btn.textContent = &quot;排序：&quot; + (d03SortBy === &quot;median&quot; ? &quot;中位数&quot; : &quot;IQR 离散度&quot;);
      if (charts[&quot;e6sd-d03&quot;]) renderOne(&quot;e6sd-d03&quot;);
    });

    const d06Btn = document.getElementById(&quot;e6sd-d06-mode&quot;);
    d06Btn.addEventListener(&quot;click&quot;, () =&gt; {
      d06Mode = d06Mode === &quot;count&quot; ? &quot;freq&quot; : &quot;count&quot;;
      d06Btn.textContent = &quot;显示：&quot; + (d06Mode === &quot;count&quot; ? &quot;频数&quot; : &quot;频率&quot;);
      if (charts[&quot;e6sd-d06&quot;]) renderOne(&quot;e6sd-d06&quot;);
    });

    const d15Btn = document.getElementById(&quot;e6sd-d15-points&quot;);
    d15Btn.addEventListener(&quot;click&quot;, () =&gt; {
      d15ShowPoints = !d15ShowPoints;
      d15Btn.setAttribute(&quot;aria-pressed&quot;, String(d15ShowPoints));
      d15Btn.textContent = &quot;原始点：&quot; + (d15ShowPoints ? &quot;显示&quot; : &quot;隐藏&quot;);
      if (charts[&quot;e6sd-d15&quot;]) renderOne(&quot;e6sd-d15&quot;);
    });

    window.addEventListener(&quot;pagehide&quot;, () =&gt; {
      if (io) io.disconnect();
      if (ro) ro.disconnect();
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) { charts[id].dispose(); charts[id] = null; } });
    });

    runSelfCheck();
  })();
  &lt;/script&gt;
