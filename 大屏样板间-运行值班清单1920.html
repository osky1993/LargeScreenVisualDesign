<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大屏样板间 · 运行值班清单</title>
<style>
  :root {
    --dt-bg: #0a1e3c;
    --dt-panel: rgba(13, 34, 64, 0.72);
    --dt-border: rgba(86, 150, 224, 0.28);
    --dt-text: #e6f1ff;
    --dt-muted: #8fa7c8;
    --dt-cyan: #3fe1ff;
    --dt-blue: #4b7dff;
    --dt-green: #38e6b0;
    --dt-gold: #ffc857;
    --dt-red: #ff6680;
    --dt-mono: "Bahnschrift", "DIN Alternate", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04101f; }
  body {
    color: var(--dt-text);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }

  /* ===== 1920x1080 固定设计舞台 + 整体 scale 适配 ===== */
  .dt-stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background:
      radial-gradient(circle at 10% 0%, rgba(63, 225, 255, 0.10), transparent 42%),
      radial-gradient(circle at 90% 8%, rgba(75, 125, 255, 0.10), transparent 46%),
      radial-gradient(ellipse at 50% 118%, rgba(35, 96, 172, 0.28), transparent 55%),
      linear-gradient(rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      var(--dt-bg);
    background-size: auto, auto, auto, 44px 44px, 44px 44px, auto;
    display: grid;
    grid-template-columns: 1fr 404px;
    grid-template-rows: 84px 1fr 54px;
    gap: 14px;
    padding: 14px 18px 16px;
  }

  .dt-error {
    display: none; position: absolute; z-index: 30; left: 50%; top: 96px; transform: translateX(-50%);
    padding: 14px 22px; border-radius: 12px;
    border: 1px solid rgba(255, 122, 122, 0.5); background: rgba(96, 26, 38, 0.85);
    color: #ffd9d9; font-size: 15px;
  }
  .dt-error.is-visible { display: block; }

  /* ===== 内容页头：面包屑 + 标题 + 当班徽章 | 时钟 ===== */
  .dt-header {
    grid-column: 1 / -1;
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 0 10px;
  }
  .dt-header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(75, 125, 255, 0.5) 16%, rgba(63, 225, 255, 0.85) 50%, rgba(75, 125, 255, 0.5) 84%, transparent);
    box-shadow: 0 0 14px rgba(63, 225, 255, 0.45);
  }
  .dt-head-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .dt-crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0.1em; color: var(--dt-muted); }
  .dt-crumb b { font-weight: 400; color: #6fb9e8; }
  .dt-crumb i { font-style: normal; color: rgba(143, 167, 200, 0.55); }
  .dt-crumb em { font-style: normal; color: #d7e8ff; }
  .dt-head-title-row { display: flex; align-items: center; gap: 18px; white-space: nowrap; }
  .dt-head-title {
    font-size: 30px; font-weight: 700; letter-spacing: 0.08em;
    background: linear-gradient(180deg, #ffffff 28%, #8fe8ff 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(63, 225, 255, 0.3));
  }
  .dt-duty-badge {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: #ffe3a6; padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgba(255, 200, 87, 0.38); background: rgba(60, 46, 16, 0.4);
    letter-spacing: 0.05em;
  }
  .dt-duty-badge i {
    width: 9px; height: 9px; border-radius: 50%; background: var(--dt-green);
    box-shadow: 0 0 0 3px rgba(56, 230, 176, 0.15), 0 0 10px var(--dt-green);
    animation: dtBreath 2s ease-in-out infinite;
  }
  .dt-duty-badge b { font-weight: 700; color: #ffd98a; }
  @keyframes dtBreath { 50% { opacity: 0.35; transform: scale(0.82); } }
  .dt-clock { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-variant-numeric: tabular-nums; flex: none; }
  .dt-clock-time { font: 700 28px/1 var(--dt-mono); color: #f2f9ff; letter-spacing: 0.04em; text-shadow: 0 0 12px rgba(63, 225, 255, 0.4); }
  .dt-clock-date { font-size: 12px; color: var(--dt-muted); letter-spacing: 0.08em; }

  /* ===== 面板通用 ===== */
  .dt-panel {
    position: relative; min-height: 0; overflow: hidden;
    border: 1px solid var(--dt-border); border-radius: 12px; background: var(--dt-panel);
    display: flex; flex-direction: column;
  }
  .dt-panel-head {
    position: relative; flex: none;
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 30px 0 14px;
    background: linear-gradient(90deg, rgba(63, 225, 255, 0.22), rgba(63, 225, 255, 0.04) 62%, transparent);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%);
  }
  .dt-panel-head i { flex: none; width: 5px; height: 16px; background: var(--dt-cyan); box-shadow: 0 0 8px var(--dt-cyan); transform: skewX(-12deg); }
  .dt-panel-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; color: #f0f8ff; white-space: nowrap; }
  .dt-panel-head .dt-panel-en { font-size: 10px; letter-spacing: 0.22em; color: #5f88b8; align-self: flex-end; padding-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dt-panel-head .dt-panel-scope { margin-left: auto; font-size: 12px; color: var(--dt-gold); white-space: nowrap; padding-right: 2px; font-variant-numeric: tabular-nums; }
  .dt-chart { flex: 1; min-height: 0; }

  /* ===== 主区：筛选条 ===== */
  .dt-main { grid-row: 2; grid-column: 1; }
  .dt-filter {
    flex: none; display: flex; align-items: center; gap: 12px;
    height: 54px; padding: 0 16px;
    border-bottom: 1px solid rgba(86, 150, 224, 0.22);
    background: rgba(16, 40, 76, 0.35);
  }
  .dt-chips { display: flex; align-items: center; gap: 8px; }
  .dt-chip {
    display: flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 14px; border-radius: 999px; cursor: pointer; user-select: none;
    border: 1px solid rgba(86, 150, 224, 0.4); background: rgba(20, 48, 88, 0.55);
    color: #cfe6ff; font-size: 13px; letter-spacing: 0.05em; font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s, color 0.2s, background 0.2s;
  }
  .dt-chip b { font-weight: 700; font-size: 12px; color: #6fb9e8; font-variant-numeric: tabular-nums; }
  .dt-chip:hover { color: #fff; border-color: rgba(63, 225, 255, 0.65); }
  .dt-chip.is-active {
    color: #06182f; background: linear-gradient(180deg, #7deaff, #29b6de);
    border-color: rgba(63, 225, 255, 0.9); box-shadow: 0 0 14px rgba(63, 225, 255, 0.35);
    font-weight: 700;
  }
  .dt-chip.is-active b { color: #06325a; }
  .dt-filter-sep { width: 1px; height: 24px; background: rgba(86, 150, 224, 0.3); flex: none; }
  .dt-select {
    display: flex; align-items: center; gap: 10px;
    height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid rgba(86, 150, 224, 0.4); background: rgba(20, 48, 88, 0.55);
    color: #cfe6ff; font-size: 13px; white-space: nowrap;
  }
  .dt-select b { font-weight: 400; color: #6fb9e8; }
  .dt-select i { font-style: normal; font-size: 10px; color: var(--dt-cyan); }
  .dt-search {
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 14px; border-radius: 8px; min-width: 240px;
    border: 1px solid rgba(86, 150, 224, 0.35); background: rgba(10, 28, 54, 0.6);
    color: rgba(143, 167, 200, 0.7); font-size: 13px;
  }
  .dt-search i {
    font-style: normal; flex: none; width: 12px; height: 12px; position: relative;
  }
  .dt-search i::before { content: ""; position: absolute; left: 0; top: 0; width: 8px; height: 8px; border: 1.6px solid #5f88b8; border-radius: 50%; }
  .dt-search i::after { content: ""; position: absolute; right: 0; bottom: 0; width: 4.6px; height: 1.6px; background: #5f88b8; transform: rotate(45deg); border-radius: 1px; }
  .dt-search .dt-caret { width: 1px; height: 14px; background: rgba(63, 225, 255, 0.7); animation: dtCaret 1.1s step-end infinite; }
  @keyframes dtCaret { 50% { opacity: 0; } }
  .dt-filter-count { margin-left: auto; font-size: 13px; color: var(--dt-muted); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .dt-filter-count b { color: var(--dt-cyan); font: 700 18px/1 var(--dt-mono); margin: 0 3px; }

  /* ===== 主区：工单大表 ===== */
  .dt-thead {
    flex: none; display: grid;
    grid-template-columns: 128px minmax(0, 1fr) 128px 86px 88px 86px 100px 172px;
    gap: 10px; align-items: center;
    height: 38px; padding: 0 16px;
    font-size: 12.5px; letter-spacing: 0.1em; color: #6fb9e8;
    border-bottom: 1px solid rgba(86, 150, 224, 0.3);
    background: rgba(24, 56, 100, 0.35);
  }
  .dt-thead span:nth-child(4), .dt-thead span:nth-child(5) { text-align: center; }
  .dt-thead span:nth-child(7) { text-align: right; }
  .dt-tbody { flex: 1; min-height: 0; overflow: hidden; }
  .dt-rows { margin: 0; padding: 0; list-style: none; }
  .dt-row {
    position: relative; display: grid;
    grid-template-columns: 128px minmax(0, 1fr) 128px 86px 88px 86px 100px 172px;
    gap: 10px; align-items: center;
    height: 47px; padding: 0 16px;
    font-size: 13.5px; color: #cfe3fa;
    border-bottom: 1px solid rgba(86, 150, 224, 0.1);
    font-variant-numeric: tabular-nums;
    transition: background 0.18s;
  }
  .dt-row:nth-child(odd) { background: rgba(24, 56, 100, 0.22); }
  .dt-row:hover { background: rgba(63, 225, 255, 0.1); }
  .dt-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
  .dt-row.is-overdue-row::before { background: var(--dt-red); box-shadow: 0 0 8px rgba(255, 102, 128, 0.7); }
  .dt-row.is-new { animation: dtRowIn 0.9s ease-out; }
  @keyframes dtRowIn {
    0% { transform: translateY(-46px); opacity: 0; background: rgba(63, 225, 255, 0.35); }
    45% { transform: translateY(0); opacity: 1; background: rgba(63, 225, 255, 0.3); }
    100% { background: rgba(24, 56, 100, 0.22); }
  }
  .dt-cell-id { color: #9fd7ef; font-family: var(--dt-mono); letter-spacing: 0.03em; }
  .dt-cell-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e6f1ff; }
  .dt-cell-sys { color: var(--dt-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dt-cell-user { color: #cfe3fa; white-space: nowrap; }
  .dt-cell-user.is-unassigned { color: rgba(143, 167, 200, 0.55); }
  .dt-cell-wait { text-align: right; font-family: var(--dt-mono); font-size: 14px; color: #dceaff; }
  .dt-cell-wait.is-done-wait { color: rgba(143, 167, 200, 0.65); }

  .dt-badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 24px; padding: 0 9px; border-radius: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
    justify-self: center;
  }
  .dt-badge.is-flash { animation: dtFlash 0.9s ease-out; }
  @keyframes dtFlash { 0% { box-shadow: 0 0 0 3px rgba(63, 225, 255, 0.55); filter: brightness(1.6); } 100% { box-shadow: 0 0 0 0 rgba(63, 225, 255, 0); } }
  .dt-prio.is-p1 { color: #ffd4dc; background: rgba(255, 102, 128, 0.16); border: 1px solid rgba(255, 102, 128, 0.55); }
  .dt-prio.is-p2 { color: #ffe8bd; background: rgba(255, 200, 87, 0.14); border: 1px solid rgba(255, 200, 87, 0.5); }
  .dt-prio.is-p3 { color: #c8f4ff; background: rgba(63, 225, 255, 0.12); border: 1px solid rgba(63, 225, 255, 0.45); }
  .dt-prio.is-p4 { color: #b9cbe4; background: rgba(143, 167, 200, 0.12); border: 1px solid rgba(143, 167, 200, 0.4); }
  .dt-status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .dt-status.is-pending { color: var(--dt-gold); background: rgba(255, 200, 87, 0.12); border: 1px solid rgba(255, 200, 87, 0.45); }
  .dt-status.is-doing { color: var(--dt-cyan); background: rgba(63, 225, 255, 0.12); border: 1px solid rgba(63, 225, 255, 0.45); }
  .dt-status.is-doing i { animation: dtBreath 1.4s ease-in-out infinite; }
  .dt-status.is-done { color: var(--dt-green); background: rgba(56, 230, 176, 0.1); border: 1px solid rgba(56, 230, 176, 0.4); }
  .dt-status.is-overdue { color: var(--dt-red); background: rgba(255, 102, 128, 0.14); border: 1px solid rgba(255, 102, 128, 0.55); }
  .dt-status.is-overdue i { animation: dtBreath 0.9s ease-in-out infinite; }

  /* SLA 剩余：进度条 + 读数 */
  .dt-sla { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dt-sla-bar {
    flex: 1; min-width: 0; height: 8px; border-radius: 4px; overflow: hidden;
    background: rgba(10, 28, 54, 0.9); border: 1px solid rgba(86, 150, 224, 0.28);
  }
  .dt-sla-bar b { display: block; height: 100%; border-radius: 4px; transition: width 0.6s ease, background 0.6s ease; }
  .dt-sla-txt { flex: none; width: 62px; text-align: right; font: 700 12.5px/1 var(--dt-mono); letter-spacing: 0.02em; }
  .dt-sla.is-safe b { background: linear-gradient(90deg, #1d8f74, var(--dt-green)); }
  .dt-sla.is-safe .dt-sla-txt { color: var(--dt-green); }
  .dt-sla.is-warn b { background: linear-gradient(90deg, #8a5f18, var(--dt-gold)); }
  .dt-sla.is-warn .dt-sla-txt { color: var(--dt-gold); }
  .dt-sla.is-danger b { background: linear-gradient(90deg, #a32744, var(--dt-red)); box-shadow: 0 0 8px rgba(255, 102, 128, 0.55); }
  .dt-sla.is-danger .dt-sla-txt { color: var(--dt-red); }
  .dt-sla.is-breach .dt-sla-bar { border-color: rgba(255, 102, 128, 0.5); }
  .dt-sla.is-breach b { background: repeating-linear-gradient(-45deg, rgba(255, 102, 128, 0.85) 0 5px, rgba(163, 39, 68, 0.85) 5px 10px); }
  .dt-sla.is-breach .dt-sla-txt { color: var(--dt-red); }
  .dt-sla.is-met .dt-sla-txt { color: rgba(56, 230, 176, 0.8); }
  .dt-sla.is-met b { background: rgba(56, 230, 176, 0.35); }

  /* ===== 右列 ===== */
  .dt-side { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .dt-side .dt-panel { flex: 1; }
  .dt-side .dt-panel.is-shift { flex: 1.08; }

  /* 值班表 */
  .dt-shifts { margin: 0; padding: 10px 14px 12px; list-style: none; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; }
  .dt-shift {
    flex: 1; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(94, 168, 255, 0.2); background: rgba(10, 28, 54, 0.5);
  }
  .dt-shift-time { flex: none; width: 96px; font: 700 14px/1.35 var(--dt-mono); color: #9fd7ef; letter-spacing: 0.02em; }
  .dt-shift-time small { display: block; font: 400 11px/1 inherit; color: var(--dt-muted); letter-spacing: 0.14em; margin-top: 3px; }
  .dt-shift-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .dt-shift-team { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #e6f1ff; white-space: nowrap; }
  .dt-shift-members { font-size: 12px; color: var(--dt-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dt-shift-tag { flex: none; font-size: 11px; color: rgba(143, 167, 200, 0.7); letter-spacing: 0.1em; }
  .dt-shift.is-now {
    border-color: rgba(63, 225, 255, 0.6); background: rgba(21, 62, 110, 0.65);
    box-shadow: inset 0 0 18px rgba(63, 225, 255, 0.1), 0 0 12px rgba(63, 225, 255, 0.15);
  }
  .dt-shift.is-now .dt-shift-team { color: #8fe8ff; }
  .dt-shift.is-now .dt-shift-tag { color: var(--dt-cyan); }
  .dt-shift-count { display: none; flex: none; text-align: right; }
  .dt-shift.is-now .dt-shift-count { display: block; }
  .dt-shift.is-now .dt-shift-tag { display: none; }
  .dt-shift-count b { display: block; font: 700 17px/1 var(--dt-mono); color: var(--dt-gold); text-shadow: 0 0 10px rgba(255, 200, 87, 0.4); }
  .dt-shift-count small { display: block; margin-top: 3px; font-size: 10px; letter-spacing: 0.2em; color: var(--dt-muted); }

  /* ===== 底部跑马灯 ===== */
  .dt-marquee {
    grid-column: 1 / -1; display: flex; align-items: stretch; overflow: hidden;
    border: 1px solid var(--dt-border); border-radius: 12px; background: var(--dt-panel);
  }
  .dt-marquee-tag {
    flex: none; display: flex; align-items: center; gap: 9px; padding: 0 22px 0 18px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.2em; color: #06182f;
    background: linear-gradient(120deg, var(--dt-cyan), #2a9fd4 85%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
  }
  .dt-marquee-tag i { width: 8px; height: 8px; border-radius: 50%; background: #06182f; animation: dtDot 1.6s ease-in-out infinite; }
  @keyframes dtDot { 50% { opacity: 0.3; } }
  .dt-marquee-view { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
  .dt-marquee-track {
    display: inline-flex; align-items: center; white-space: nowrap; will-change: transform;
    animation: dtMarquee 48s linear infinite;
    font-size: 15px; letter-spacing: 0.06em; color: #dceaff;
  }
  .dt-marquee-track b { color: var(--dt-gold); font-weight: 700; }
  .dt-marquee-track em { font-style: normal; margin: 0 26px; color: rgba(63, 225, 255, 0.55); }
  @keyframes dtMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* mockflag:begin —— 由 tools/inject_mock_flag.py 注入，勿手改 */
  .dt-mockflag {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 9000;
    padding: 3px 20px 4px; border-radius: 0 0 10px 10px; pointer-events: none;
    background: linear-gradient(180deg, #f2ab42, #de8524); color: #24130a;
    font-size: 13px; line-height: 1.15; font-weight: 700;
    letter-spacing: 0.3em; text-indent: 0.3em; white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }
  /* mockflag:end */
</style>
</head>
<body>
  <div class="dt-stage" id="dt-stage">
    <!-- mockflag:begin --><div class="dt-mockflag" role="note" aria-label="本页为模拟数据">模拟数据</div><!-- mockflag:end -->
    <div class="dt-error" id="dt-error" role="alert">ECharts 资源加载失败，请联网后重新打开此文件。</div>

    <!-- 内容页头 -->
    <header class="dt-header">
      <div class="dt-head-left">
        <div class="dt-crumb"><b>运行指挥调度</b><i>›</i><em>值班清单</em></div>
        <div class="dt-head-title-row">
          <div class="dt-head-title">运行值班与工单清单</div>
          <div class="dt-duty-badge"><i></i>当班&nbsp;<b>运行三班</b>&nbsp;·&nbsp;值班长&nbsp;<b>赵敏</b></div>
        </div>
      </div>
      <div class="dt-clock" aria-label="实时时钟">
        <span class="dt-clock-time" id="dt-clock-time">--:--:--</span>
        <span class="dt-clock-date" id="dt-clock-date">----年--月--日 星期-</span>
      </div>
    </header>

    <!-- 主区：筛选条 + 工单大表 -->
    <section class="dt-panel dt-main">
      <header class="dt-panel-head"><i></i><h2>今日工单清单</h2><span class="dt-panel-en">DUTY TICKET LIST</span><span class="dt-panel-scope" id="dt-list-scope">--</span></header>
      <div class="dt-filter" aria-label="工单筛选条">
        <div class="dt-chips" id="dt-chips"></div>
        <span class="dt-filter-sep"></span>
        <div class="dt-select" title="演示样式">优先级<b>全部</b><i>▾</i></div>
        <div class="dt-search" title="演示样式"><i></i>搜索工单号 / 标题 / 受理人<span class="dt-caret"></span></div>
        <div class="dt-filter-count">共<b id="dt-count">0</b>条</div>
      </div>
      <div class="dt-thead">
        <span>工单号</span><span>标题</span><span>所属系统</span><span>优先级</span><span>状态</span><span>受理人</span><span>等待时长</span><span>SLA 剩余</span>
      </div>
      <div class="dt-tbody"><ul class="dt-rows" id="dt-rows"></ul></div>
    </section>

    <!-- 右列：3 个辅助小面板 -->
    <div class="dt-side">
      <section class="dt-panel">
        <header class="dt-panel-head"><i></i><h2>今日工单统计</h2><span class="dt-panel-en">TICKET STATS</span><span class="dt-panel-scope">实时</span></header>
        <div class="dt-chart" id="dt-chart-donut" role="img" aria-label="今日工单状态占比环形图"></div>
      </section>
      <section class="dt-panel">
        <header class="dt-panel-head"><i></i><h2>各班组在办负载</h2><span class="dt-panel-en">TEAM WORKLOAD</span><span class="dt-panel-scope">阈值 8 单</span></header>
        <div class="dt-chart" id="dt-chart-load" role="img" aria-label="各班组在办工单数横条图"></div>
      </section>
      <section class="dt-panel is-shift">
        <header class="dt-panel-head"><i></i><h2>今日值班表</h2><span class="dt-panel-en">SHIFT ROSTER</span><span class="dt-panel-scope">三班倒</span></header>
        <ul class="dt-shifts" id="dt-shifts"></ul>
      </section>
    </div>

    <!-- 底部：值班公告跑马灯 -->
    <section class="dt-marquee" aria-label="值班公告">
      <div class="dt-marquee-tag"><i></i>值班公告</div>
      <div class="dt-marquee-view"><div class="dt-marquee-track" id="dt-marquee-track"></div></div>
    </section>
  </div>

<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script>
(() => {
  "use strict";

  /* ===== 1. 舞台等比缩放（1920x1080 设计稿 → 任意窗口，居中留黑边） ===== */
  const stage = document.getElementById("dt-stage");
  function fitStage() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fitStage);
  fitStage();

  /* ===== 2. 资源守卫 ===== */
  const errorNode = document.getElementById("dt-error");
  if (!window.echarts) {
    errorNode.classList.add("is-visible");
    return;
  }

  const C = {
    text: "#e6f1ff", muted: "#8fa7c8",
    cyan: "#3fe1ff", blue: "#4b7dff", green: "#38e6b0",
    gold: "#ffc857", red: "#ff6680"
  };
  const rnd = (min, max) => Math.round(min + Math.random() * (max - min));
  const pick = (arr) => arr[rnd(0, arr.length - 1)];
  const pad = (n) => (n < 10 ? "0" + n : String(n));

  /* ===== 3. 值班业务字典（演示口径） ===== */
  const STATUS = {
    pending: { label: "待派", cls: "is-pending" },
    doing:   { label: "处理中", cls: "is-doing" },
    done:    { label: "已完成", cls: "is-done" },
    overdue: { label: "已超时", cls: "is-overdue" }
  };
  const PRIOS = [
    { label: "P1 紧急", cls: "is-p1", slaMin: [30, 60] },
    { label: "P2 高", cls: "is-p2", slaMin: [60, 150] },
    { label: "P3 中", cls: "is-p3", slaMin: [150, 300] },
    { label: "P4 低", cls: "is-p4", slaMin: [300, 480] }
  ];
  const SYSTEMS = ["核心交易系统", "支付网关", "网银渠道", "信贷审批系统", "数据仓库", "消息中台", "监控告警平台", "批量调度平台", "ESB 服务总线", "客服工单平台"];
  const TEAMS = [
    { name: "应用运维组", members: ["陈晓东", "李文博", "王雪", "孙浩"] },
    { name: "系统网络组", members: ["刘志强", "何军", "罗霞"] },
    { name: "数据库组", members: ["周婷", "郑凯", "吴倩"] },
    { name: "安全运营组", members: ["赵敏", "高翔", "林芳"] }
  ];
  const LOAD_LIMIT = 8; /* 班组在办阈值（单） */
  const TITLES = [
    "交易响应时间抖动核查", "批量作业超时重跑处置", "节点 CPU 持续高位告警",
    "数据库慢 SQL 专项优化", "对账文件延迟到达跟踪", "接口成功率下探分析",
    "证书到期更换巡检", "磁盘容量预警扩容", "消息队列积压疏导",
    "渠道登录异常排查", "网络链路丢包定位", "备份作业失败重做",
    "防火墙策略变更实施", "中间件连接池告警处置", "日终跑批卡点疏通",
    "安全漏洞补丁加固", "灾备演练环境核验", "监控误报规则调优"
  ];
  const NOTICES = [
    "今晚 <b>23:30–01:30</b> 核心交易系统实施季度补丁变更，请当班同事关注交易曲线回落情况",
    "支付网关 SLA 本周达成率 <b>99.2%</b>，P1 工单平均响应 <b>6 分 42 秒</b>",
    "明日 <b>09:00</b> 灾备切换演练（桌面推演），各班组值班长准时参加调度例会",
    "监控平台新增「慢 SQL 自动派单」规则，命中后将直接派至数据库组",
    "本月工单按时办结率 <b>96.8%</b>，超时工单复盘会定于每周五 <b>16:00</b>",
    "值班交接须完成三项核对：在办工单、未闭环告警、变更窗口，缺一不可",
    "新版值班手册 V4.2 已发布至知识库，P1 事件升级链路有调整，请及时研读"
  ];

  /* ===== 4. 工单数据（内嵌演示数据，页面打开时按“今天”铺底） ===== */
  const now0 = Date.now();
  let seq = 1041;
  function newTicket(opt) {
    const o = opt || {};
    const prio = o.prio !== undefined ? o.prio : rnd(0, 3);
    const slaTotal = rnd(PRIOS[prio].slaMin[0], PRIOS[prio].slaMin[1]) * 60; /* 秒 */
    const ageSec = o.ageSec !== undefined ? o.ageSec : rnd(300, 21600);
    const status = o.status || "pending";
    const team = pick(TEAMS);
    seq += 1;
    return {
      id: "GD-0725-" + seq,
      title: pick(TITLES),
      sys: pick(SYSTEMS),
      prio: prio,
      status: status,
      team: team.name,
      user: status === "pending" ? "" : pick(team.members),
      bornAt: now0 - ageSec * 1000,
      slaTotal: slaTotal,
      slaRemain: o.slaRemain !== undefined ? o.slaRemain : Math.max(120, slaTotal - ageSec + rnd(-600, 2400)),
      waitFrozen: 0,
      el: null, waitNode: null, slaNode: null, slaBarNode: null, slaTxtNode: null, statusNode: null, userNode: null
    };
  }
  const tickets = [];
  /* 铺底：6 待派 / 8 处理中 / 4 已超时 / 8 已完成（新单在前） */
  for (let i = 0; i < 8; i++) {
    const t = newTicket({ status: "done", ageSec: rnd(7200, 30000) });
    t.waitFrozen = rnd(600, 9000);
    tickets.push(t);
  }
  for (let i = 0; i < 4; i++) {
    const t = newTicket({ status: "overdue", ageSec: rnd(5400, 20000), prio: rnd(0, 2) });
    t.slaRemain = -rnd(300, 5400);
    tickets.push(t);
  }
  for (let i = 0; i < 8; i++) tickets.push(newTicket({ status: "doing", ageSec: rnd(1200, 10800) }));
  for (let i = 0; i < 6; i++) tickets.push(newTicket({ status: "pending", ageSec: rnd(120, 3600), prio: rnd(0, 3) }));
  tickets.sort((a, b) => b.bornAt - a.bornAt);

  /* ===== 5. 工单行渲染 ===== */
  const rowsNode = document.getElementById("dt-rows");
  function fmtWait(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }
  function fmtSla(sec) {
    const a = Math.abs(Math.round(sec));
    const h = Math.floor(a / 3600), m = Math.ceil(a % 3600 / 60);
    return h > 0 ? h + "h" + pad(Math.floor(a % 3600 / 60)) + "m" : m + "m";
  }
  function slaCls(t) {
    if (t.status === "done") return "is-met";
    if (t.slaRemain <= 0) return "is-breach";
    const p = t.slaRemain / t.slaTotal;
    return p > 0.4 ? "is-safe" : (p > 0.15 ? "is-warn" : "is-danger");
  }
  function paintSla(t) {
    t.slaNode.className = "dt-sla " + slaCls(t);
    if (t.status === "done") {
      t.slaBarNode.style.width = "100%";
      t.slaTxtNode.textContent = "已达成";
    } else if (t.slaRemain <= 0) {
      t.slaBarNode.style.width = "100%";
      t.slaTxtNode.textContent = "超时" + fmtSla(t.slaRemain);
    } else {
      t.slaBarNode.style.width = Math.max(2, Math.min(100, t.slaRemain / t.slaTotal * 100)).toFixed(1) + "%";
      t.slaTxtNode.textContent = fmtSla(t.slaRemain);
    }
  }
  function paintStatus(t, flash) {
    const st = STATUS[t.status];
    t.statusNode.className = "dt-badge dt-status " + st.cls + (flash ? " is-flash" : "");
    t.statusNode.innerHTML = "<i></i>" + st.label;
    t.el.classList.toggle("is-overdue-row", t.status === "overdue");
    t.userNode.textContent = t.user || "— 待派 —";
    t.userNode.classList.toggle("is-unassigned", !t.user);
    if (flash) setTimeout(() => t.statusNode.classList.remove("is-flash"), 950);
  }
  function paintWait(t) {
    const sec = t.status === "done" ? t.waitFrozen : (Date.now() - t.bornAt) / 1000;
    t.waitNode.textContent = fmtWait(sec);
    t.waitNode.classList.toggle("is-done-wait", t.status === "done");
  }
  function buildRow(t) {
    const li = document.createElement("li");
    li.className = "dt-row";
    li.innerHTML =
      '<span class="dt-cell-id">' + t.id + '</span>' +
      '<span class="dt-cell-title">' + t.sys.replace(" 服务总线", "") + " · " + t.title + '</span>' +
      '<span class="dt-cell-sys">' + t.sys + '</span>' +
      '<span class="dt-badge dt-prio ' + PRIOS[t.prio].cls + '">' + PRIOS[t.prio].label + '</span>' +
      '<span class="dt-badge dt-status"></span>' +
      '<span class="dt-cell-user"></span>' +
      '<span class="dt-cell-wait">--:--:--</span>' +
      '<span class="dt-sla"><i class="dt-sla-bar"><b></b></i><em class="dt-sla-txt"></em></span>';
    t.el = li;
    t.statusNode = li.children[4];
    t.userNode = li.children[5];
    t.waitNode = li.children[6];
    t.slaNode = li.children[7];
    t.slaBarNode = t.slaNode.querySelector("b");
    t.slaTxtNode = t.slaNode.querySelector(".dt-sla-txt");
    paintStatus(t, false);
    paintWait(t);
    paintSla(t);
    return li;
  }
  tickets.forEach((t) => rowsNode.appendChild(buildRow(t)));

  /* ===== 6. 筛选条：状态 chip 真实过滤 ===== */
  const FILTERS = [
    { key: "all", label: "全部" },
    { key: "pending", label: "待派" },
    { key: "doing", label: "处理中" },
    { key: "done", label: "已完成" },
    { key: "overdue", label: "已超时" }
  ];
  let curFilter = "all";
  const chipsNode = document.getElementById("dt-chips");
  const countNode = document.getElementById("dt-count");
  const scopeNode = document.getElementById("dt-list-scope");
  FILTERS.forEach((f) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dt-chip" + (f.key === "all" ? " is-active" : "");
    btn.innerHTML = f.label + "<b>0</b>";
    btn.addEventListener("click", () => {
      curFilter = f.key;
      chipsNode.querySelectorAll(".dt-chip").forEach((c) => c.classList.remove("is-active"));
      btn.classList.add("is-active");
      applyFilter();
    });
    f.node = btn;
    chipsNode.appendChild(btn);
  });
  function applyFilter() {
    let shown = 0;
    tickets.forEach((t) => {
      const hit = curFilter === "all" || t.status === curFilter;
      t.el.style.display = hit ? "" : "none";
      if (hit) shown += 1;
    });
    countNode.textContent = shown;
  }
  function statusCounts() {
    const c = { pending: 0, doing: 0, done: 0, overdue: 0 };
    tickets.forEach((t) => { c[t.status] += 1; });
    return c;
  }
  function refreshChipCounts() {
    const c = statusCounts();
    FILTERS.forEach((f) => {
      f.node.querySelector("b").textContent = f.key === "all" ? tickets.length : c[f.key];
    });
    scopeNode.textContent = "今日累计 " + tickets.length + " 单 · 在办 " + (c.pending + c.doing + c.overdue) + " 单";
  }

  /* ===== 7. ECharts：状态环形 + 班组负载横条 ===== */
  const tip = (extra) => Object.assign({
    trigger: "item", confine: true,
    backgroundColor: "rgba(9, 24, 48, 0.92)",
    borderColor: "rgba(102, 178, 255, 0.4)",
    textStyle: { color: "#dcedff", fontSize: 12 }
  }, extra || {});
  const hGrad = (from, to) => new echarts.graphic.LinearGradient(0, 0, 1, 0, [
    { offset: 0, color: from }, { offset: 1, color: to }
  ]);
  const donutChart = echarts.init(document.getElementById("dt-chart-donut"));
  const loadChart = echarts.init(document.getElementById("dt-chart-load"));

  function donutOption() {
    const c = statusCounts();
    return {
      tooltip: tip({ valueFormatter: (v) => v + " 单" }),
      legend: {
        orient: "vertical", right: 12, top: "middle", itemWidth: 10, itemHeight: 10, itemGap: 12,
        textStyle: { color: "#cfe6ff", fontSize: 12 },
        formatter: (name) => {
          const map = { "待派": c.pending, "处理中": c.doing, "已完成": c.done, "已超时": c.overdue };
          return name + "  " + map[name];
        }
      },
      color: [C.gold, C.cyan, C.green, C.red],
      title: {
        text: String(tickets.length), subtext: "今日总数",
        left: "31.5%", top: "40%", textAlign: "center",
        textStyle: { color: "#f4faff", fontSize: 30, fontWeight: 700, fontFamily: "Bahnschrift, DIN Alternate, sans-serif" },
        subtextStyle: { color: C.muted, fontSize: 11 }
      },
      series: [{
        type: "pie", radius: ["56%", "76%"], center: ["33%", "52%"],
        itemStyle: { borderColor: "#0a1e3c", borderWidth: 2 },
        label: { show: false },
        emphasis: { label: { show: true, color: "#eaf6ff", fontSize: 12, fontWeight: 700, formatter: "{b}\n{d}%" } },
        data: [
          { name: "待派", value: c.pending },
          { name: "处理中", value: c.doing },
          { name: "已完成", value: c.done },
          { name: "已超时", value: c.overdue }
        ]
      }],
      animationDurationUpdate: 500
    };
  }
  function teamLoads() {
    const m = {};
    TEAMS.forEach((g) => { m[g.name] = 0; });
    tickets.forEach((t) => { if (t.status !== "done") m[t.team] += 1; });
    return TEAMS.map((g) => m[g.name]);
  }
  function loadOption() {
    const vals = teamLoads();
    return {
      tooltip: tip({ valueFormatter: (v) => v + " 单在办" }),
      grid: { left: 12, right: 40, top: 14, bottom: 8, containLabel: true },
      xAxis: { type: "value", show: false, max: (v) => Math.max(12, v.max + 2) },
      yAxis: {
        type: "category", inverse: true,
        data: TEAMS.map((g) => g.name),
        axisLine: { show: false }, axisTick: { show: false },
        axisLabel: { color: "#cfe6ff", fontSize: 12 }
      },
      series: [{
        type: "bar", barWidth: 13,
        data: vals.map((v) => ({
          value: v,
          itemStyle: {
            borderRadius: 7,
            color: v > LOAD_LIMIT ? hGrad("#8a5f18", "#ff9d3f") : hGrad("#1d5d9e", C.cyan)
          }
        })),
        label: {
          show: true, position: "right", fontSize: 12, fontWeight: 700,
          formatter: (p) => p.value + (p.value > LOAD_LIMIT ? " 超载" : ""),
          color: "#cfe6ff"
        },
        showBackground: true,
        backgroundStyle: { color: "rgba(63, 120, 200, 0.12)", borderRadius: 7 },
        markLine: {
          silent: true, symbol: "none",
          lineStyle: { color: "rgba(255, 157, 63, 0.65)", type: "dashed", width: 1.5 },
          label: { show: true, position: "end", formatter: "阈值", color: "#ffb45f", fontSize: 10 },
          data: [{ xAxis: LOAD_LIMIT }]
        }
      }],
      animationDurationUpdate: 500
    };
  }
  function refreshStats() {
    refreshChipCounts();
    applyFilter();
    donutChart.setOption(donutOption());
    loadChart.setOption(loadOption());
  }
  refreshStats();

  /* ===== 8. 值班表（当前班次高亮 + 交接倒计时） ===== */
  const SHIFTS = [
    { name: "早班 · 运行一班", time: "08:00 - 16:00", tag: "DAY", from: 8, to: 16, lead: "陈晓东", members: "李文博 / 王雪 / 何军" },
    { name: "中班 · 运行三班", time: "16:00 - 24:00", tag: "SWING", from: 16, to: 24, lead: "赵敏", members: "孙浩 / 吴倩 / 高翔" },
    { name: "夜班 · 运行二班", time: "00:00 - 08:00", tag: "NIGHT", from: 0, to: 8, lead: "刘志强", members: "周婷 / 郑凯 / 罗霞" }
  ];
  const shiftsNode = document.getElementById("dt-shifts");
  SHIFTS.forEach((s) => {
    const li = document.createElement("li");
    li.className = "dt-shift";
    li.innerHTML =
      '<span class="dt-shift-time">' + s.time + '<small>' + s.tag + '</small></span>' +
      '<span class="dt-shift-body">' +
        '<span class="dt-shift-team">' + s.name + ' · 值班长 ' + s.lead + '</span>' +
        '<span class="dt-shift-members">值班员 ' + s.members + '</span>' +
      '</span>' +
      '<span class="dt-shift-tag">待接班</span>' +
      '<span class="dt-shift-count"><b>--:--:--</b><small>距交接</small></span>';
    s.node = li;
    s.cdNode = li.querySelector(".dt-shift-count b");
    shiftsNode.appendChild(li);
  });
  function tickShifts() {
    const d = new Date();
    const h = d.getHours();
    SHIFTS.forEach((s) => {
      const isNow = h >= s.from && h < s.to;
      s.node.classList.toggle("is-now", isNow);
      if (isNow) {
        const end = new Date(d);
        end.setHours(s.to, 0, 0, 0);
        const left = Math.max(0, Math.floor((end - d) / 1000));
        s.cdNode.textContent = fmtWait(left);
      }
    });
  }

  /* ===== 9. 顶部时钟 ===== */
  const WEEKS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  function tickClock() {
    const d = new Date();
    document.getElementById("dt-clock-time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    document.getElementById("dt-clock-date").textContent =
      d.getFullYear() + "年" + pad(d.getMonth() + 1) + "月" + pad(d.getDate()) + "日 " + WEEKS[d.getDay()];
  }
  tickClock();
  tickShifts();

  /* ===== 10. 秒级心跳：时钟 / 交接倒计时 / 等待时长累加 / SLA 递减与自然超时 ===== */
  setInterval(() => {
    tickClock();
    tickShifts();
    let breached = false;
    tickets.forEach((t) => {
      if (t.status === "done") return;
      paintWait(t);
      t.slaRemain -= 1;
      if (t.slaRemain <= 0 && t.status !== "overdue") {
        t.status = "overdue"; /* SLA 击穿 → 自然转为已超时 */
        paintStatus(t, true);
        breached = true;
      }
      paintSla(t);
    });
    if (breached) refreshStats();
  }, 1000);

  /* ===== 11. 每 8 秒：随机推进 1-2 个工单状态流转（徽章原位变化） ===== */
  function advanceOne() {
    const cand = tickets.filter((t) => t.status === "pending" || t.status === "doing" || t.status === "overdue");
    if (!cand.length) return false;
    const t = pick(cand);
    if (t.status === "pending") {
      t.status = "doing";
      const team = TEAMS.find((g) => g.name === t.team);
      t.user = pick(team.members);
    } else {
      if (t.status === "doing" && Math.random() < 0.25) return false; /* 处理中不必每次都办结 */
      t.waitFrozen = (Date.now() - t.bornAt) / 1000;
      t.status = "done";
    }
    paintStatus(t, true);
    paintWait(t);
    paintSla(t);
    return true;
  }
  setInterval(() => {
    const n = rnd(1, 2);
    let moved = false;
    for (let i = 0; i < n; i++) moved = advanceOne() || moved;
    if (moved) refreshStats();
  }, 8000);

  /* ===== 12. 新工单顶部插入（带滑入动画），超量时从底部淘汰最旧完单 ===== */
  setInterval(() => {
    const t = newTicket({ status: "pending", ageSec: 0 });
    t.slaRemain = t.slaTotal;
    tickets.unshift(t);
    const li = buildRow(t);
    li.classList.add("is-new");
    rowsNode.insertBefore(li, rowsNode.firstChild);
    setTimeout(() => li.classList.remove("is-new"), 1000);
    if (tickets.length > 34) {
      for (let i = tickets.length - 1; i >= 0; i--) {
        if (tickets[i].status === "done") {
          rowsNode.removeChild(tickets[i].el);
          tickets.splice(i, 1);
          break;
        }
      }
    }
    refreshStats();
  }, 15000);

  /* ===== 13. 底部值班公告跑马灯（内容 x2 无缝循环） ===== */
  const marqueeTrack = document.getElementById("dt-marquee-track");
  const marqueeHtml = NOTICES.map((n) => "<span>" + n + "</span><em>◆</em>").join("");
  marqueeTrack.innerHTML = marqueeHtml + marqueeHtml;
})();
</script>
</body>
</html>
