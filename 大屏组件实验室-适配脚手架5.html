  .sc-skel.is-map .f { grid-column: 1 / -1; }

&quot;use strict&quot;;

  &quot;&lt;!doctype html&gt;&quot;,
  &quot;&lt;html lang=\&quot;zh-CN\&quot;&gt;&quot;,

const COMPONENTS = {

  /* ---------- 01 等比缩放 ---------- */
  fit: {
    code: &quot;01 · SCALE-FIT&quot;, title: &quot;等比缩放（居中留黑边）&quot;, tag: &quot;库内标准方案&quot;, key: true,
    fit: &quot;绝大多数大屏 · 比例必须严格 16:9&quot;,
    note: &quot;样板间同款 · 最稳&quot;,
    desc: &quot;按 &lt;code&gt;min(宽比, 高比)&lt;/code&gt; 整体缩放 1920×1080 舞台，&lt;b&gt;内部永远按设计稿坐标开发&lt;/b&gt;（px 直接照设计稿写），比例不符的屏幕上下或左右留黑边。ECharts 无需 resize——缩放由外层 transform 承担。库内全部样板间即此方案。&quot;,
    demo: &#x27;&lt;div class=&quot;sc-win is-fit&quot; data-cap=&quot;窗口变窄 → 舞台整体变小 · 上下留边&quot;&gt;&lt;div class=&quot;sc-mini&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;sc-demo-note&quot;&gt;&lt;b&gt;行为：&lt;/b&gt;舞台永远完整、比例永远正确&lt;br&gt;&lt;b&gt;代价：&lt;/b&gt;比例不符时有黑边&lt;br&gt;&lt;em&gt;推荐指数 ★★★★★&lt;/em&gt;&lt;/div&gt;&#x27;,
    snippet: TPL_STAGE_HEAD + &quot;\n&lt;title&gt;大屏 · 等比缩放模板&lt;/title&gt;\n&lt;style&gt;\n  /* ===== 等比缩放适配：1920x1080 设计稿 -&gt; 任意窗口，居中留黑边 =====\n     内部一律按 1920x1080 设计稿的 px 值开发，无需任何换算 */\n  * { box-sizing: border-box; }\n  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04101f; }\n  #stage {\n    position: absolute; left: 50%; top: 50%;\n    width: 1920px; height: 1080px;\n    transform: translate(-50%, -50%) scale(1);\n    transform-origin: center center;\n    background: #0a1e3c;\n    color: #e6f1ff; font-family: \&quot;PingFang SC\&quot;, \&quot;Microsoft YaHei\&quot;, sans-serif;\n    /* 换成你的布局（推荐 grid，见骨架模板） */\n    display: flex; align-items: center; justify-content: center; font-size: 40px;\n  }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;div id=\&quot;stage\&quot;&gt;1920 × 1080 设计舞台（等比缩放）&lt;/div&gt;\n&lt;script&gt;\n  (function () {\n    var stage = document.getElementById(\&quot;stage\&quot;);\n    function fitStage() {\n      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);\n      stage.style.transform = \&quot;translate(-50%, -50%) scale(\&quot; + s + \&quot;)\&quot;;\n    }\n    window.addEventListener(\&quot;resize\&quot;, fitStage);\n    fitStage();\n  })();\n&lt;\/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;
  },

  /* ---------- 02 拉伸铺满 ---------- */
  fill: {
    code: &quot;02 · SCALE-FILL&quot;, title: &quot;双向拉伸（铺满无黑边）&quot;, tag: &quot;投影拼接屏&quot;, key: false,
    fit: &quot;甲方坚决不接受黑边 · 屏幕比例接近 16:9&quot;,
    note: &quot;scaleX/Y 独立&quot;,
    desc: &quot;横纵各自缩放（&lt;code&gt;scaleX ≠ scaleY&lt;/code&gt;），舞台永远铺满，代价是比例失真：圆会变椭圆、字会微胖/微瘦。&lt;b&gt;仅当屏幕比例与 16:9 相差不大（±15% 内）时可接受&lt;/b&gt;；饼图/仪表盘多的屏慎用。&quot;,
    demo: &#x27;&lt;div class=&quot;sc-win is-fill&quot; data-cap=&quot;窗口变窄 → 横向压缩纵向拉高 · 铺满&quot;&gt;&lt;div class=&quot;sc-mini&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;sc-demo-note&quot;&gt;&lt;b&gt;行为：&lt;/b&gt;永远铺满、无黑边&lt;br&gt;&lt;b&gt;代价：&lt;/b&gt;比例失真（圆变椭圆）&lt;br&gt;&lt;em&gt;推荐指数 ★★★&lt;/em&gt;&lt;/div&gt;&#x27;,
    snippet: TPL_STAGE_HEAD + &quot;\n&lt;title&gt;大屏 · 拉伸铺满模板&lt;/title&gt;\n&lt;style&gt;\n  /* ===== 双向拉伸适配：横纵独立 scale，铺满无黑边，接受轻微变形 ===== */\n  * { box-sizing: border-box; }\n  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04101f; }\n  #stage {\n    position: absolute; left: 50%; top: 50%;\n    width: 1920px; height: 1080px;\n    transform: translate(-50%, -50%) scale(1, 1);\n    transform-origin: center center;\n    background: #0a1e3c;\n    color: #e6f1ff; font-family: \&quot;PingFang SC\&quot;, \&quot;Microsoft YaHei\&quot;, sans-serif;\n    display: flex; align-items: center; justify-content: center; font-size: 40px;\n  }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;div id=\&quot;stage\&quot;&gt;1920 × 1080 设计舞台（拉伸铺满）&lt;/div&gt;\n&lt;script&gt;\n  (function () {\n    var stage = document.getElementById(\&quot;stage\&quot;);\n    function fitStage() {\n      var sx = window.innerWidth / 1920;\n      var sy = window.innerHeight / 1080;\n      stage.style.transform = \&quot;translate(-50%, -50%) scale(\&quot; + sx + \&quot;, \&quot; + sy + \&quot;)\&quot;;\n    }\n    window.addEventListener(\&quot;resize\&quot;, fitStage);\n    fitStage();\n  })();\n&lt;\/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;
  },

    code: &quot;03 · REM-VW&quot;, title: &quot;rem 流式适配（动态根字号）&quot;, tag: &quot;非固定比例屏&quot;, key: false,
    fit: &quot;超宽带鱼屏 / 竖屏 / 需要响应式重排&quot;,
    note: &quot;1rem = 屏宽/19.2&quot;,
    desc: &quot;根字号 = &lt;code&gt;屏宽 / 19.2&lt;/code&gt;（即设计稿 100px = 1rem），全部尺寸用 rem 写，布局跟随屏宽&lt;b&gt;流式伸缩甚至重排&lt;/b&gt;。不留黑边、不变形，但每个尺寸都要换算、ECharts 需监听 resize 重绘，开发成本最高。适合比例千奇百怪的异形屏。&quot;,
    demo: &#x27;&lt;div class=&quot;sc-win is-rem&quot; data-cap=&quot;窗口变窄 → 字号间距缩小 · 次要栏可隐藏&quot;&gt;&lt;div class=&quot;sc-mini&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +

    snippet: TPL_STAGE_HEAD + &quot;\n&lt;title&gt;大屏 · rem 流式适配模板&lt;/title&gt;\n&lt;style&gt;\n  /* ===== rem 适配：根字号 = 屏宽/19.2，设计稿 100px 写作 1rem =====\n     换算口诀：设计稿 px 值 / 100 = rem 值（如 424px -&gt; 4.24rem） */\n  * { box-sizing: border-box; }\n  html { font-size: 100px; /* JS 会按屏宽覆盖 */ }\n  body {\n    margin: 0; height: 100vh; overflow: hidden; background: #0a1e3c;\n    color: #e6f1ff; font-family: \&quot;PingFang SC\&quot;, \&quot;Microsoft YaHei\&quot;, sans-serif;\n  }\n  .board {\n    height: 100%; padding: 0.14rem 0.18rem;\n    display: grid; gap: 0.14rem;\n    grid-template-columns: 4.24rem 1fr 4.24rem;\n    grid-template-rows: 0.78rem 1fr;\n    font-size: 0.14rem; /* 设计稿 14px */\n  }\n  .board &gt; div { border: 0.01rem solid rgba(86,150,224,0.28); border-radius: 0.12rem; background: rgba(13,34,64,0.72); }\n  .board .hd { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; font-size: 0.34rem; }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;div class=\&quot;board\&quot;&gt;\n    &lt;div class=\&quot;hd\&quot;&gt;rem 流式大屏（根字号随屏宽）&lt;/div&gt;\n    &lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;\n  &lt;/div&gt;\n&lt;script&gt;\n  (function () {\n    function setRem() {\n      /* 以宽为基准：屏宽 1920 时根字号恰为 100px */\n      var size = document.documentElement.clientWidth / 19.2;\n      document.documentElement.style.fontSize = size + \&quot;px\&quot;;\n      /* 若同时要限制过高/过矮的极端比例，可对 size 加 min/max 约束 */\n    }\n    window.addEventListener(\&quot;resize\&quot;, function () {\n      setRem();\n      /* ECharts 实例需在此处逐个调用 chart.resize() */\n    });\n    setRem();\n  })();\n&lt;\/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;

  /* ---------- 04 三栏骨架 ---------- */

      &#x27;&lt;div class=&quot;sc-demo-note&quot;&gt;&lt;b&gt;网格：&lt;/b&gt;&lt;em&gt;424px | 1fr | 424px&lt;/em&gt;&lt;br&gt;&lt;b&gt;行：&lt;/b&gt;78 / 104 / 1fr / 52&lt;br&gt;与库内样板间完全同构，方案卡可直接粘入面板。&lt;/div&gt;&#x27;,
    snippet: TPL_STAGE_HEAD + &quot;\n&lt;title&gt;大屏 · 三栏布局骨架&lt;/title&gt;\n&lt;style&gt;\n  /* ===== 经典三栏大屏骨架（内置等比缩放）=====\n     结构：顶栏 / KPI 行 / 左中右三栏 / 底部通栏 */\n  * { box-sizing: border-box; }\n  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04101f; }\n  #stage {\n    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;\n    transform: translate(-50%, -50%) scale(1); transform-origin: center center;\n    color: #e6f1ff; font-family: \&quot;PingFang SC\&quot;, \&quot;Microsoft YaHei\&quot;, sans-serif;\n    background:\n      radial-gradient(circle at 12% 0%, rgba(63,225,255,0.10), transparent 42%),\n      radial-gradient(circle at 88% 12%, rgba(75,125,255,0.12), transparent 46%),\n      linear-gradient(rgba(86,150,224,0.055) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(86,150,224,0.055) 1px, transparent 1px),\n      #0a1e3c;\n    background-size: auto, auto, 44px 44px, 44px 44px, auto;\n    display: grid; gap: 14px; padding: 14px 18px 16px;\n    grid-template-columns: 424px 1fr 424px;\n    grid-template-rows: 78px 104px 1fr 52px;\n  }\n  .hd { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center;\n        font-size: 34px; font-weight: 700; letter-spacing: 0.22em;\n        border-bottom: 2px solid rgba(63,225,255,0.4); }\n  .kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }\n  .panel { border: 1px solid rgba(86,150,224,0.28); border-radius: 12px;\n           background: rgba(13,34,64,0.72); position: relative; overflow: hidden;\n           display: flex; flex-direction: column; padding: 14px 16px 10px; }\n  .panel::before { content: \&quot;\&quot;; position: absolute; left: 0; top: 0; width: 42px; height: 3px;\n                   background: linear-gradient(90deg, #3fe1ff, transparent); }\n  .panel b { font-size: 16px; letter-spacing: 0.08em; color: #f0f7ff; margin-bottom: 6px; }\n  .chart { flex: 1; min-height: 0; }\n  .col { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; min-height: 0; }\n  .ft { grid-column: 1 / -1; border: 1px solid rgba(86,150,224,0.28); border-radius: 12px;\n        background: rgba(13,34,64,0.72); display: flex; align-items: center; padding: 0 16px;\n        font-size: 13px; color: #8fa7c8; }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;div id=\&quot;stage\&quot;&gt;\n    &lt;header class=\&quot;hd\&quot;&gt;大屏标题&lt;/header&gt;\n    &lt;section class=\&quot;kpis\&quot;&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;/div&gt;&lt;div class=\&quot;panel\&quot;&gt;&lt;/div&gt;&lt;div class=\&quot;panel\&quot;&gt;&lt;/div&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;/div&gt;&lt;div class=\&quot;panel\&quot;&gt;&lt;/div&gt;&lt;div class=\&quot;panel\&quot;&gt;&lt;/div&gt;\n    &lt;/section&gt;\n    &lt;aside class=\&quot;col\&quot;&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;左上面板&lt;/b&gt;&lt;div class=\&quot;chart\&quot; id=\&quot;chart-a\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;左下面板&lt;/b&gt;&lt;div class=\&quot;chart\&quot; id=\&quot;chart-b\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;/aside&gt;\n    &lt;section class=\&quot;panel\&quot;&gt;&lt;b&gt;中央主视觉&lt;/b&gt;&lt;div class=\&quot;chart\&quot; id=\&quot;chart-main\&quot;&gt;&lt;/div&gt;&lt;/section&gt;\n    &lt;aside class=\&quot;col\&quot;&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;右上面板&lt;/b&gt;&lt;div class=\&quot;chart\&quot; id=\&quot;chart-c\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;右下面板&lt;/b&gt;&lt;div class=\&quot;chart\&quot; id=\&quot;chart-d\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;/aside&gt;\n    &lt;footer class=\&quot;ft\&quot;&gt;底部通栏（跑马灯 / 数据更新时间）&lt;/footer&gt;\n  &lt;/div&gt;\n&lt;script src=\&quot;https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js\&quot;&gt;&lt;\/script&gt;\n&lt;script&gt;\n  (function () {\n    var stage = document.getElementById(\&quot;stage\&quot;);\n    function fitStage() {\n      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);\n      stage.style.transform = \&quot;translate(-50%, -50%) scale(\&quot; + s + \&quot;)\&quot;;\n    }\n    window.addEventListener(\&quot;resize\&quot;, fitStage);\n    fitStage();\n    if (!window.echarts) return; /* CDN 失败守卫：可在此显示提示 */\n    /* 在各 chart 容器上 echarts.init 并 setOption（把库内方案卡复制的 option 粘进来） */\n    [\&quot;chart-a\&quot;, \&quot;chart-b\&quot;, \&quot;chart-main\&quot;, \&quot;chart-c\&quot;, \&quot;chart-d\&quot;].forEach(function (id) {\n      var el = document.getElementById(id);\n      if (el) echarts.init(el); /* 例：echarts.init(el).setOption(option) */\n    });\n  })();\n&lt;\/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;

  map: {
    code: &quot;05 · GRID-MAP&quot;, title: &quot;地图中心布局骨架 · 安全区&quot;, tag: &quot;指挥调度版式&quot;, key: false,
    fit: &quot;地图 / 态势主视觉的调度屏&quot;,
    note: &quot;含安全区要点&quot;,

      &#x27;&lt;i data-t=&quot;左栏 380px&quot;&gt;&lt;/i&gt;&lt;i class=&quot;m&quot; data-t=&quot;中央大地图（无卡底）&quot;&gt;&lt;/i&gt;&lt;i data-t=&quot;右栏 380px&quot;&gt;&lt;/i&gt;&#x27; +
      &#x27;&lt;i class=&quot;f&quot; data-t=&quot;底部 · 区域健康度条&quot;&gt;&lt;/i&gt;&lt;/div&gt;&#x27; +

    snippet: TPL_STAGE_HEAD + &quot;\n&lt;title&gt;大屏 · 地图中心布局骨架&lt;/title&gt;\n&lt;style&gt;\n  /* ===== 地图中心调度屏骨架（内置等比缩放 + 24px 安全区）=====\n     中央面板透明无卡底，大地图直接坐在舞台底色上 */\n  * { box-sizing: border-box; }\n  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04101f; }\n  #stage {\n    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;\n    transform: translate(-50%, -50%) scale(1); transform-origin: center center;\n    color: #e6f1ff; font-family: \&quot;PingFang SC\&quot;, \&quot;Microsoft YaHei\&quot;, sans-serif;\n    background: radial-gradient(ellipse at 50% 60%, #10305c 0%, #0a1e3c 55%, #071527 100%);\n    display: grid; gap: 14px;\n    /* 外圈 24px 安全区：拼接屏边缘常被包边遮挡，别放关键信息 */\n    padding: 24px;\n    grid-template-columns: 380px 1fr 380px;\n    grid-template-rows: 72px 1fr 64px;\n  }\n  .hd { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;\n        font-size: 30px; font-weight: 700; letter-spacing: 0.2em; padding: 0 8px;\n        border-bottom: 2px solid rgba(63,225,255,0.35); }\n  .hd small { font-size: 13px; letter-spacing: 0.05em; color: #8fa7c8; font-weight: 400; }\n  .col { display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 14px; min-height: 0; }\n  .panel { border: 1px solid rgba(86,150,224,0.28); border-radius: 12px;\n           background: rgba(13,34,64,0.72); padding: 12px 14px; display: flex; flex-direction: column; }\n  .panel b { font-size: 15px; color: #f0f7ff; margin-bottom: 6px; }\n  .chart { flex: 1; min-height: 0; }\n  /* 中央：透明容器 + 悬浮 KPI 条 */\n  .center { position: relative; min-height: 0; }\n  .center .kpibar { position: absolute; left: 50%; top: 0; transform: translateX(-50%);\n    display: flex; gap: 28px; padding: 8px 26px; border-radius: 999px; z-index: 2;\n    border: 1px solid rgba(86,150,224,0.35); background: rgba(9,24,48,0.75);\n    font-size: 13px; color: #8fa7c8; white-space: nowrap; }\n  .center .kpibar b { color: #3fe1ff; font-size: 17px; margin-left: 6px; }\n  .center .map { position: absolute; inset: 0; }\n  .ft { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-around;\n        border: 1px solid rgba(86,150,224,0.28); border-radius: 12px;\n        background: rgba(13,34,64,0.6); font-size: 13px; color: #8fa7c8; }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;div id=\&quot;stage\&quot;&gt;\n    &lt;header class=\&quot;hd\&quot;&gt;&lt;span&gt;指挥调度大屏&lt;/span&gt;&lt;small&gt;SAFE AREA 24PX · 中央地图无卡底&lt;/small&gt;&lt;/header&gt;\n    &lt;aside class=\&quot;col\&quot;&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;左一&lt;/b&gt;&lt;div class=\&quot;chart\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;左二&lt;/b&gt;&lt;div class=\&quot;chart\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;左三&lt;/b&gt;&lt;div class=\&quot;chart\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;/aside&gt;\n    &lt;section class=\&quot;center\&quot;&gt;\n      &lt;div class=\&quot;kpibar\&quot;&gt;在线&lt;b&gt;2,318&lt;/b&gt;告警&lt;b&gt;17&lt;/b&gt;指令&lt;b&gt;42&lt;/b&gt;响应&lt;b&gt;3.2分&lt;/b&gt;&lt;/div&gt;\n      &lt;div class=\&quot;map\&quot; id=\&quot;chart-map\&quot;&gt;&lt;/div&gt;\n    &lt;/section&gt;\n    &lt;aside class=\&quot;col\&quot;&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;右一&lt;/b&gt;&lt;div class=\&quot;chart\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;右二&lt;/b&gt;&lt;div class=\&quot;chart\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n      &lt;div class=\&quot;panel\&quot;&gt;&lt;b&gt;右三&lt;/b&gt;&lt;div class=\&quot;chart\&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n    &lt;/aside&gt;\n    &lt;footer class=\&quot;ft\&quot;&gt;&lt;span&gt;华东 98.6%&lt;/span&gt;&lt;span&gt;华南 99.1%&lt;/span&gt;&lt;span&gt;华北 97.8%&lt;/span&gt;&lt;span&gt;西部 98.9%&lt;/span&gt;&lt;span&gt;东北 99.4%&lt;/span&gt;&lt;/footer&gt;\n  &lt;/div&gt;\n&lt;script src=\&quot;https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js\&quot;&gt;&lt;\/script&gt;\n&lt;script&gt;\n  (function () {\n    var stage = document.getElementById(\&quot;stage\&quot;);\n    function fitStage() {\n      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);\n      stage.style.transform = \&quot;translate(-50%, -50%) scale(\&quot; + s + \&quot;)\&quot;;\n    }\n    window.addEventListener(\&quot;resize\&quot;, fitStage);\n    fitStage();\n    if (!window.echarts) return;\n    /* 地图用法：echarts.registerMap(\&quot;china\&quot;, geoJson) 后 geo: { map: \&quot;china\&quot; }\n       geo 数据内嵌方式参照库内《地图实验室》或《指挥调度》样板间 */\n    echarts.init(document.getElementById(\&quot;chart-map\&quot;));\n  })();\n&lt;\/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;&quot;

const ORDER = [&quot;fit&quot;, &quot;fill&quot;, &quot;rem&quot;, &quot;three&quot;, &quot;map&quot;];

/* ============ 复制模板 ============ */
function buildSnippet(item) {
  return &quot;&lt;!-- &quot; + item.title + &quot;（大屏适配脚手架 &quot; + item.code + &quot; · 完整可运行 HTML，存为 .html 双击即用） --&gt;\n&quot; + item.snippet;
}

function legacyCopy(text) {
  var ta = document.createElement(&quot;textarea&quot;);
  ta.value = text;
  ta.setAttribute(&quot;readonly&quot;, &quot;&quot;);
  ta.style.position = &quot;fixed&quot;;
  ta.style.left = &quot;-9999px&quot;;
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try { ok = document.execCommand(&quot;copy&quot;); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function copyText(text, done, fail) {
  function viaLegacy() {
    if (legacyCopy(text)) { done(); }
    else {
      window.prompt(&quot;自动复制失败，请手动全选后复制（Ctrl/Cmd+C）：&quot;, text);
      fail();
    }
  }
  if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, viaLegacy);
  } else {
    viaLegacy();
  }
}

/* ============ 卡片渲染 ============ */
(function renderAll() {
  var grid = document.getElementById(&quot;sc-grid&quot;);
  ORDER.forEach(function (id) {
    var c = COMPONENTS[id];
    var panel = document.createElement(&quot;section&quot;);
    panel.className = &quot;sc-panel&quot;;

    var header = document.createElement(&quot;header&quot;);
    header.className = &quot;sc-panel-header&quot;;
    header.innerHTML =
      &#x27;&lt;div&gt;&lt;span class=&quot;sc-panel-index&quot;&gt;&#x27; + c.code + &#x27;&lt;/span&gt;&lt;h2&gt;&#x27; + c.title + &#x27;&lt;/h2&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;span class=&quot;sc-level&#x27; + (c.key ? &quot; is-key&quot; : &quot;&quot;) + &#x27;&quot;&gt;&#x27; + c.tag + &#x27;&lt;/span&gt;&#x27;;

    var desc = document.createElement(&quot;p&quot;);
    desc.className = &quot;sc-desc&quot;;
    desc.innerHTML = c.desc;

    var demo = document.createElement(&quot;div&quot;);
    demo.className = &quot;sc-demo&quot;;
    demo.innerHTML = c.demo;

    var footer = document.createElement(&quot;footer&quot;);
    footer.className = &quot;sc-panel-footer&quot;;
    footer.innerHTML = &#x27;&lt;span&gt;&lt;strong&gt;适合：&lt;/strong&gt;&#x27; + c.fit + &#x27;&lt;/span&gt;&lt;span style=&quot;display:flex;align-items:center;gap:10px&quot;&gt;&lt;span&gt;&#x27; + c.note + &quot;&lt;/span&gt;&lt;/span&gt;&quot;;

    var btn = document.createElement(&quot;button&quot;);
    btn.type = &quot;button&quot;;
    btn.className = &quot;sc-copy&quot;;
    btn.textContent = &quot;复制模板&quot;;
    btn.addEventListener(&quot;click&quot;, function () {
      copyText(buildSnippet(c), function () {
        btn.textContent = &quot;已复制&quot;;
        btn.classList.add(&quot;is-done&quot;);
        setTimeout(function () {
          btn.textContent = &quot;复制模板&quot;;
          btn.classList.remove(&quot;is-done&quot;);
        }, 1800);
      }, function () {});
    });
    footer.lastElementChild.appendChild(btn);

    panel.appendChild(header);
    panel.appendChild(desc);
    panel.appendChild(demo);
    panel.appendChild(footer);
    grid.appendChild(panel);
  });
})();
&lt;/script&gt;
