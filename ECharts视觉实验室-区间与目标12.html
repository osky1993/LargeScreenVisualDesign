&lt;style&gt;
  :root {
    --rt-bg: #0a1e3c;

  .e6rt-chip strong { color: #bfe0ff; font-weight: 600; }

  .e6rt-chip.is-fail { border-color: rgba(255, 122, 122, 0.55); }
  .e6rt-chip.is-fail strong { color: #ff9d9d; }
  .e6rt-button {
    font: inherit; font-size: 13px; color: #d7ecff; padding: 9px 16px; border-radius: 10px;
    border: 1px solid rgba(102, 178, 255, 0.45); background: rgba(33, 76, 133, 0.55); cursor: pointer;

  .e6rt-button[aria-pressed=&quot;true&quot;] { border-color: rgba(76, 226, 180, 0.6); background: rgba(24, 90, 82, 0.5); }
  .e6rt-minibtn {
    font: inherit; font-size: 11px; color: #9fd8ff; padding: 4px 10px; border-radius: 999px;
    border: 1px solid rgba(111, 185, 232, 0.4); background: rgba(26, 60, 104, 0.55); cursor: pointer;
    white-space: nowrap;
  }
  .e6rt-minibtn:hover, .e6rt-minibtn:focus-visible { background: rgba(40, 86, 142, 0.7); }
  .e6rt-minibtn:focus-visible { outline: 2px solid #7cc7ff; outline-offset: 2px; }
  .e6rt-error {
    display: none; margin: 0 0 18px; padding: 14px 18px; border-radius: 12px;
    border: 1px solid rgba(255, 122, 122, 0.5); background: rgba(96, 26, 38, 0.5); color: #ffd9d9; font-size: 13px;
  }
  .e6rt-error.is-visible { display: block; }
  .e6rt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(470px, 1fr)); gap: 18px; }
  @media (max-width: 520px) { .e6rt-grid { grid-template-columns: 1fr; } }
  .e6rt-panel {
    position: relative; border-radius: 14px; border: 1px solid var(--rt-border);
    background: var(--rt-panel); padding: 16px 18px 12px; overflow: hidden;
  }
  .e6rt-panel::before {
    content: &quot;&quot;; position: absolute; left: 0; top: 0; width: 42px; height: 3px;
    background: linear-gradient(90deg, var(--rt-cyan), transparent);

  .e6rt-panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

  .e6rt-panel-index { font-size: 11px; letter-spacing: 0.14em; color: #6fb9e8; }

  .e6rt-panel-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .e6rt-level {

    border: 1px solid rgba(111, 185, 232, 0.4); background: rgba(26, 60, 104, 0.55); white-space: nowrap;

  .e6rt-panel-footer {

    border-top: 1px dashed rgba(86, 150, 224, 0.25); margin-top: 6px;
    font-size: 12px; color: var(--rt-muted);
  }
  .e6rt-panel-footer strong { color: #bfe0ff; font-weight: 600; }

&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l &gt; 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g &lt; b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l, a: a };
  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;
    return c.a &gt;= 1 ? &quot;hsl(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%)&quot; : &quot;hsla(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%, &quot; + Math.round(c.a * 1000) / 1000 + &quot;)&quot;;
  }
  function isChromatic(c) {
    return c &amp;&amp; c.s &gt;= 0.14 &amp;&amp; c.a &gt; 0.04 &amp;&amp; c.l &gt; 0.02 &amp;&amp; c.l &lt; 0.98;
  }

  /* ---------- 主题颜色映射（色相族 → 主题色板槽位；保留原明度/透明度层次） ---------- */
  function buildMapper(option, theme) {
    var families = []; // {hue}
    collect(option);
    function collect(node) {
      if (node == null) return;
      if (typeof node === &quot;string&quot;) {
        var c = parseColor(node);
        if (isChromatic(c) &amp;&amp; familyOf(c.h) === -1) families.push({ hue: c.h });
        return;
      }
      if (Array.isArray(node)) { node.forEach(collect); return; }
      if (typeof node === &quot;object&quot;) {
        for (var k in node) {
          if (k === &quot;formatter&quot; || k === &quot;text&quot; || k === &quot;subtext&quot;) continue;
          collect(node[k]);
        }
      }

    function familyOf(h) {
      for (var i = 0; i &lt; families.length; i++) if (hueDist(families[i].hue, h) &lt;= 26) return i;
      return -1;
    }
    var targets = theme.colors.map(parseColor);
    return function mapColorStr(str) {
      var c = parseColor(str);
      if (!isChromatic(c)) return str;
      var fi = familyOf(c.h);
      var t = targets[fi === -1 ? 0 : fi % targets.length];
      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });
    };
  }

  function mapOption(option, theme) {
    var mapColor = buildMapper(option, theme);
    function walk(node, key) {

      if (typeof node === &quot;object&quot; &amp;&amp; (node.nodeType || node.getContext)) return node; // DOM/canvas 纹理等原样保留
      if (typeof node === &quot;string&quot;) {

      if (opt &amp;&amp; opt.series) dom.__vizShown = shown;
      return realSet.apply(null, [shown].concat(rest));

    return chart;
  };

  /* ---------- 主题应用 ---------- */
  var stageEls = null;
  function findStageEls() {
    // 全屏级不透明底色容器（各实验室的&quot;舞台&quot;div），换主题时一并换底
    var out = [];
    var vw = window.innerWidth, vh = window.innerHeight;
    var candidates = document.body.querySelectorAll(&quot;:scope &gt; *, :scope &gt; * &gt; *&quot;);
    candidates.forEach(function (el) {
      if (el.id === &quot;lab-theme-widget&quot; || el.id === &quot;lab-copy-modal&quot;) return;
      if (el.offsetWidth &lt; vw * 0.9 || el.offsetHeight &lt; vh * 0.6) return;
      var c = parseColor(getComputedStyle(el).backgroundColor);
      if (c &amp;&amp; c.a &gt; 0.5) out.push({ el: el, orig: el.style.getPropertyValue(&quot;background-color&quot;) });
    });
    return out;
  }

  function applyTheme(theme) {
    activeTheme = theme;
    var root = document.documentElement;
    if (!stageEls) stageEls = findStageEls();

      if (theme &amp;&amp; theme.bg) s.el.style.setProperty(&quot;background-color&quot;, theme.bg, &quot;important&quot;);
      else if (s.orig) s.el.style.setProperty(&quot;background-color&quot;, s.orig);
      else s.el.style.removeProperty(&quot;background-color&quot;);

      root.style.setProperty(&quot;--lab-bg&quot;, theme.bg);

    } else {
      root.style.removeProperty(&quot;--background&quot;);
      root.style.removeProperty(&quot;--lab-bg&quot;);
      root.classList.remove(&quot;lab-themed&quot;);
    }

      if (chart.isDisposed &amp;&amp; chart.isDisposed()) { registry.delete(chart); return; }

  /* ---------- 复制配置 ---------- */
  function serializeJS(value, indent) {
    var pad = &quot;  &quot;.repeat(indent), padIn = &quot;  &quot;.repeat(indent + 1);
    if (value === null) return &quot;null&quot;;
    if (value === undefined) return &quot;undefined&quot;;
    var t = typeof value;
    if (t === &quot;number&quot; || t === &quot;boolean&quot;) return String(value);
    if (t === &quot;string&quot;) return JSON.stringify(value);
    if (t === &quot;function&quot;) {
      return String(value).split(&quot;\n&quot;).map(function (line, i) { return i === 0 ? line : padIn + line.trim(); }).join(&quot;\n&quot;);
    }
    if (Array.isArray(value)) {
      if (!value.length) return &quot;[]&quot;;
      var flat = value.every(function (v) { return v === null || [&quot;number&quot;, &quot;string&quot;, &quot;boolean&quot;].indexOf(typeof v) !== -1; });
      var items = value.map(function (v) { return serializeJS(v, indent + 1); });
      if (flat &amp;&amp; items.join(&quot;, &quot;).length &lt; 100) return &quot;[&quot; + items.join(&quot;, &quot;) + &quot;]&quot;;
      return &quot;[\n&quot; + items.map(function (s) { return padIn + s; }).join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;]&quot;;
    }
    if (t === &quot;object&quot;) {

      if (!keys.length) return &quot;{}&quot;;
      var body = keys.map(function (k) {
        var key = /^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k);
        return padIn + key + &quot;: &quot; + serializeJS(value[k], indent + 1);

      return &quot;{\n&quot; + body.join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;}&quot;;
    }
    return &quot;null&quot;;
  }

  function legacyCopy(text, done) {

    done(false);
  }
  function showModal(text) {
    var old = document.getElementById(&quot;lab-copy-modal&quot;);

    var wrap = document.createElement(&quot;div&quot;);
    wrap.id = &quot;lab-copy-modal&quot;;
    wrap.innerHTML =
      &#x27;&lt;div class=&quot;lab-copy-mask&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lab-copy-box&quot;&gt;&lt;p&gt;自动复制受限，请手动全选复制：&lt;/p&gt;&#x27; +
      &#x27;&lt;textarea readonly&gt;&lt;/textarea&gt;&lt;button type=&quot;button&quot;&gt;关闭&lt;/button&gt;&lt;/div&gt;&#x27;;
    wrap.querySelector(&quot;textarea&quot;).value = text;
    wrap.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    wrap.querySelector(&quot;.lab-copy-mask&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    document.body.appendChild(wrap);
    wrap.querySelector(&quot;textarea&quot;).select();
  }

  function schemeTitle(head) {
    var el = head.querySelector(&quot;h1,h2,h3,h4&quot;);
    return el ? el.textContent.trim() : &quot;方案&quot;;
  }

  function onCopyClick(btn, head) {
    var card = head.parentElement;
    var chartNode = card ? card.querySelector(config.chartSelector) : null;
    var opt = chartNode &amp;&amp; (chartNode.__vizShown || chartNode.__vizRaw);
    if (!opt) { flash(btn, &quot;图表未渲染&quot;); return; }
    var text = &quot;/* 方案：&quot; + schemeTitle(head) + &quot; · ECharts 6.1.0&quot; +
      (activeTheme ? &quot; · 主题：&quot; + activeTheme.name : &quot;&quot;) +
      &quot; · 用法：echarts.init(dom).setOption(option) */\n&quot; +
      &quot;const option = &quot; + serializeJS(opt, 0) + &quot;;\n&quot;;

  function injectButtons() {
    if (!config.headSelector) return;

      if (!card || !card.querySelector(config.chartSelector)) return;

      btn.className = &quot;lab-copy-btn&quot;;
      btn.textContent = &quot;复制配置&quot;;
      btn.dataset.label = &quot;复制配置&quot;;

    setTimeout(function () { injectQueued = false; injectButtons(); }, 120);
  }

  /* ---------- 主题切换悬浮组件 ---------- */
  function buildWidget() {
    var wrap = document.createElement(&quot;div&quot;);
    wrap.id = &quot;lab-theme-widget&quot;;
    var groups = { &quot;行业&quot;: [], &quot;风格&quot;: [] };
    allThemes().forEach(function (t) { (groups[t.group] = groups[t.group] || []).push(t); });
    var optionsHtml = Object.keys(groups).map(function (g) {
      return &#x27;&lt;optgroup label=&quot;&#x27; + (g === &quot;行业&quot; ? &quot;行业主题&quot; : &quot;风格皮肤&quot;) + &#x27;&quot;&gt;&#x27; +
        groups[g].map(function (t) { return &#x27;&lt;option value=&quot;&#x27; + t.id + &#x27;&quot;&gt;&#x27; + t.name + &quot; · &quot; + t.use + &quot;&lt;/option&gt;&quot;; }).join(&quot;&quot;) +
        &quot;&lt;/optgroup&gt;&quot;;
    }).join(&quot;&quot;);
    wrap.innerHTML =
      &#x27;&lt;span class=&quot;lab-theme-label&quot;&gt;配色主题&lt;/span&gt;&#x27; +
      &#x27;&lt;select aria-label=&quot;切换配色主题&quot;&gt;&lt;option value=&quot;&quot;&gt;默认（原始配色）&lt;/option&gt;&#x27; + optionsHtml + &quot;&lt;/select&gt;&quot; +
      &#x27;&lt;button type=&quot;button&quot;&gt;还原&lt;/button&gt;&#x27;;
    var select = wrap.querySelector(&quot;select&quot;);
    select.addEventListener(&quot;change&quot;, function () {
      var theme = allThemes().find(function (t) { return t.id === select.value; }) || null;
      applyTheme(theme);
    });
    wrap.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, function () {
      select.value = &quot;&quot;;

    });

    // 统一采用顶部独立横条（文档流内、全宽，绘制稳定）。
    document.body.insertBefore(wrap, document.body.firstChild);
  }

  function injectStyles() {

      &quot;border-bottom:1px solid rgba(140,190,255,.18);background:rgba(8,22,45,.6);font-size:12px;color:#cfe6ff;white-space:nowrap}&quot; +
      &quot;#lab-theme-widget select{max-width:170px;font:inherit;padding:4px 6px;border-radius:8px;border:1px solid rgba(140,190,255,.4);&quot; +
      &quot;background:rgba(15,35,70,.9);color:#e6f2ff}&quot; +
      &quot;#lab-theme-widget button{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid rgba(140,190,255,.4);&quot; +
      &quot;background:rgba(40,90,160,.3);color:#cfe6ff;cursor:pointer}&quot; +
      &quot;#lab-copy-modal{position:fixed;inset:0;z-index:2147483100}&quot; +

      config = cfg || {};
      function whenViewportReady(fn) {
        // srcdoc iframe 在脚本执行时视口可能还是 0×0，bottom/right 锚定的 fixed
        // 元素此时创建会错过重绘；等视口就绪后再建。
        if (window.innerWidth &gt; 0 &amp;&amp; window.innerHeight &gt; 0) { fn(); return; }
        var done = false;
        function tryRun() {
          if (done || window.innerWidth === 0 || window.innerHeight === 0) return;
          done = true;
          clearInterval(timer);
          window.removeEventListener(&quot;resize&quot;, tryRun);
          fn();
        }
        var timer = setInterval(tryRun, 250);
        window.addEventListener(&quot;resize&quot;, tryRun);
      }
      function boot() {
        injectStyles();
        whenViewportReady(buildWidget);
        injectButtons();
        new MutationObserver(queueInject).observe(document.body, { childList: true, subtree: true });
        var w = document.getElementById(&quot;lab-theme-widget&quot;);
        probe(&quot;boot&quot;, {
          widget: !!w,
          rect: w ? w.getBoundingClientRect().toJSON() : null,
          btns: document.querySelectorAll(&quot;.lab-copy-btn&quot;).length,
          vw: window.innerWidth, vh: window.innerHeight
        });
      }
      if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, boot);
      else boot();
    },
    applyTheme: applyTheme,
    mapOption: mapOption,
    _registry: registry
  };
})();

  &lt;script&gt;
  (() =&gt; {
    &quot;use strict&quot;;
    const errorNode = document.getElementById(&quot;e6rt-error&quot;);
    if (!window.echarts) {
      errorNode.classList.add(&quot;is-visible&quot;);
      return;
    }

    const C = {
      text: &quot;#e6f1ff&quot;, muted: &quot;#8fa7c8&quot;,
      cyan: &quot;#3fe1ff&quot;, blue: &quot;#4b7dff&quot;, violet: &quot;#9870ff&quot;, green: &quot;#38e6b0&quot;,
      amber: &quot;#ffc857&quot;, red: &quot;#ff6680&quot;, orange: &quot;#ff9360&quot;, steel: &quot;#6f8fb5&quot;
    };
    const AXIS_LINE = &quot;rgba(86, 150, 224, 0.35)&quot;;
    const SPLIT_LINE = &quot;rgba(86, 150, 224, 0.16)&quot;;

    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
    let motionEnabled = !reducedMotion.matches;

    function rnd(min, max) { return Math.round(min + Math.random() * (max - min)); }
    function rndf(min, max, digits) {
      const p = Math.pow(10, digits == null ? 1 : digits);
      return Math.round((min + Math.random() * (max - min)) * p) / p;
    }
    function fmt(v, digits) {
      if (v == null || !isFinite(v)) return &quot;—&quot;;
      return Number(v).toLocaleString(&quot;zh-CN&quot;, { maximumFractionDigits: digits == null ? 1 : digits });
    }

    /* ================= 区间校验（T0 延后，本页内联实现） ================= */

    // 校验一批 [lower, upper] 记录：lower/upper 必须为有限数且 lower &lt;= upper（等值合法）。
    // 返回 { valid: 通过的行, issues: 文案数组 }，非法记录不参与绘制。
    function validateRanges(rows, getName, getLower, getUpper) {
      const valid = [];
      const issues = [];
      rows.forEach((row, i) =&gt; {
        const lo = getLower(row), hi = getUpper(row);
        const name = getName(row, i);
        const loOk = typeof lo === &quot;number&quot; &amp;&amp; isFinite(lo);
        const hiOk = typeof hi === &quot;number&quot; &amp;&amp; isFinite(hi);
        if (!loOk &amp;&amp; !hiOk) { issues.push(name + &quot; 上下界均缺失&quot;); return; }
        if (!loOk) { issues.push(name + &quot; 缺失下界&quot;); return; }
        if (!hiOk) { issues.push(name + &quot; 缺失上界&quot;); return; }
        if (lo &gt; hi) { issues.push(name + &quot; 上下界颠倒（&quot; + lo + &quot; &gt; &quot; + hi + &quot;）&quot;); return; }
        valid.push(row);
      });
      return { valid, issues };
    }

    // 校验分位映射的单调性：给定分位名顺序，值必须非降。
    function quantilesMonotonic(q, keys) {
      for (let i = 1; i &lt; keys.length; i++) {
        const a = q[keys[i - 1]], b = q[keys[i]];
        if (!(typeof a === &quot;number&quot; &amp;&amp; typeof b === &quot;number&quot; &amp;&amp; isFinite(a) &amp;&amp; isFinite(b))) return false;
        if (a &gt; b) return false;
      }
      return true;
    }

    // 相对差：分母为 0 或缺失时返回 null（展示层显示「不可计算」）。
    function relativeDiff(actual, base) {
      if (typeof base !== &quot;number&quot; || !isFinite(base) || base === 0) return null;
      return (actual - base) / Math.abs(base);
    }

    // 把 [idx, lower, upper] 序列按缺失端点切成连续段（缺失处断开，不补值）。
    function splitBandSegments(points) {
      const segs = [];
      let cur = [];
      points.forEach((p) =&gt; {
        const ok = typeof p[1] === &quot;number&quot; &amp;&amp; isFinite(p[1]) &amp;&amp; typeof p[2] === &quot;number&quot; &amp;&amp; isFinite(p[2]);
        if (ok) { cur.push(p); } else if (cur.length) { segs.push(cur); cur = []; }
      });
      if (cur.length) segs.push(cur);
      return segs;
    }

    // SLA 越界持续时长：value &gt; threshold 的连续采样段合计（分钟），采样间隔由调用方给定。
    function breachMinutes(values, threshold, stepMinutes) {
      let total = 0;
      values.forEach((v) =&gt; { if (typeof v === &quot;number&quot; &amp;&amp; isFinite(v) &amp;&amp; v &gt; threshold) total += stepMinutes; });
      return total;
    }

    function setIssues(code, issues) {
      const node = document.getElementById(&quot;e6rt-issues-&quot; + code);
      if (!node) return;
      node.textContent = issues.length ? (&quot;已剔除 &quot; + issues.length + &quot; 条非法记录：&quot; + issues.join(&quot;；&quot;)) : &quot;&quot;;
    }

    /* ================= 页面自检（固定样本，不依赖演示数据） ================= */

    function runSelfCheck() {
      const results = [];
      function check(name, fn) {
        try { results.push({ name, pass: fn() === true }); }
        catch (err) { results.push({ name, pass: false }); }
      }
      check(&quot;上下界颠倒被剔除&quot;, () =&gt; {
        const r = validateRanges([[1, 5, 3]], (row) =&gt; &quot;#1&quot;, (row) =&gt; row[1], (row) =&gt; row[2]);
        return r.valid.length === 0 &amp;&amp; r.issues.length === 1;
      });
      check(&quot;等值区间视为合法&quot;, () =&gt; {
        const r = validateRanges([[1, 4, 4]], (row) =&gt; &quot;#1&quot;, (row) =&gt; row[1], (row) =&gt; row[2]);
        return r.valid.length === 1 &amp;&amp; r.issues.length === 0;
      });
      check(&quot;缺失端点被剔除并提示&quot;, () =&gt; {
        const r = validateRanges([[1, null, 8], [2, 2, 6]], (row, i) =&gt; &quot;#&quot; + (i + 1), (row) =&gt; row[1], (row) =&gt; row[2]);
        return r.valid.length === 1 &amp;&amp; r.issues[0].indexOf(&quot;缺失下界&quot;) &gt;= 0;
      });
      check(&quot;分位单调性校验&quot;, () =&gt; {
        const good = quantilesMonotonic({ p05: 1, p25: 2, p50: 3, p75: 4, p95: 5 }, [&quot;p05&quot;, &quot;p25&quot;, &quot;p50&quot;, &quot;p75&quot;, &quot;p95&quot;]);
        const bad = quantilesMonotonic({ p05: 1, p25: 5, p50: 3, p75: 4, p95: 5 }, [&quot;p05&quot;, &quot;p25&quot;, &quot;p50&quot;, &quot;p75&quot;, &quot;p95&quot;]);
        return good === true &amp;&amp; bad === false;
      });
      check(&quot;相对差分母为零返回不可计算&quot;, () =&gt; relativeDiff(10, 0) === null &amp;&amp; Math.abs(relativeDiff(12, 10) - 0.2) &lt; 1e-9);
      check(&quot;缺失端点断带切段&quot;, () =&gt; {
        const segs = splitBandSegments([[0, 1, 2], [1, 1, 3], [2, null, 3], [3, 2, 4], [4, 2, 5]]);
        return segs.length === 2 &amp;&amp; segs[0].length === 2 &amp;&amp; segs[1].length === 2;
      });
      check(&quot;越界时长统计&quot;, () =&gt; breachMinutes([100, 400, 420, 200, 510], 300, 30) === 90);

      const passCount = results.filter((r) =&gt; r.pass).length;
      const chip = document.getElementById(&quot;e6rt-selfcheck&quot;);
      chip.innerHTML = &quot;&quot;;
      chip.append(&quot;自检 &quot;);
      const strong = document.createElement(&quot;strong&quot;);
      strong.textContent = passCount + &quot;/&quot; + results.length + (passCount === results.length ? &quot; 通过&quot; : &quot; 未通过&quot;);
      chip.appendChild(strong);
      chip.classList.add(passCount === results.length ? &quot;is-pass&quot; : &quot;is-fail&quot;);
      if (passCount !== results.length) {
        errorNode.textContent = &quot;页面自检未通过：&quot; + results.filter((r) =&gt; !r.pass).map((r) =&gt; r.name).join(&quot;、&quot;);
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }

    /* ================= 公共构件 ================= */

    function baseOption(trigger) {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 700 : 0,
        animationDurationUpdate: motionEnabled ? 500 : 0,
        animationEasing: &quot;cubicOut&quot;,
        tooltip: {
          trigger: trigger || &quot;item&quot;,
          confine: true,
          backgroundColor: &quot;rgba(9, 24, 48, 0.92)&quot;,
          borderColor: &quot;rgba(102, 178, 255, 0.4)&quot;,
          textStyle: { color: &quot;#dcedff&quot;, fontSize: 12 },
          axisPointer: trigger === &quot;axis&quot; ? { type: &quot;cross&quot;, crossStyle: { color: &quot;rgba(102, 178, 255, 0.35)&quot; }, label: { backgroundColor: &quot;rgba(33, 76, 133, 0.9)&quot; } } : undefined
        }
      };
    }
    function catAxis(data, extra) {
      return Object.assign({
        type: &quot;category&quot;,
        data,
        axisLine: { lineStyle: { color: AXIS_LINE } },
        axisTick: { show: false },
        axisLabel: { color: C.muted, fontSize: 11 }
      }, extra || {});
    }
    function valAxis(name, extra) {
      return Object.assign({
        type: &quot;value&quot;,
        name,
        nameTextStyle: { color: C.muted, fontSize: 11 },
        axisLine: { show: false },
        axisLabel: { color: C.muted, fontSize: 11 },
        splitLine: { lineStyle: { color: SPLIT_LINE } }
      }, extra || {});
    }
    function legendTop(names) {
      return { top: 0, data: names, icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, itemGap: 14, textStyle: { color: C.muted, fontSize: 11 } };
    }

    // 带状 custom 系列（分位带 / 置信带 / 极差带共用）。
    // data 项为 [类目索引, lower, upper]，renderItem 仅在 dataIndex 0 聚合绘制整条带，
    // 函数体不引用任何外部变量，复制 option 后可独立运行。
    function bandSeries(name, data, color, opacity, extra) {
      return Object.assign({
        name,
        type: &quot;custom&quot;,
        data,
        encode: { x: 0, y: [1, 2] },
        z: 2,
        silent: true,
        color,
        renderItem: function (params, api) {
          if (params.dataIndex !== 0) return null;
          var n = params.dataInsideLength;
          var segs = [];
          var cur = null;
          for (var i = 0; i &lt; n; i++) {
            var lo = api.value(1, i);
            var hi = api.value(2, i);
            if (isFinite(lo) &amp;&amp; isFinite(hi)) {
              if (!cur) { cur = { up: [], down: [] }; segs.push(cur); }
              cur.up.push(api.coord([api.value(0, i), hi]));
              cur.down.unshift(api.coord([api.value(0, i), lo]));
            } else {
              cur = null;
            }
          }
          var children = [];
          for (var s = 0; s &lt; segs.length; s++) {
            if (segs[s].up.length &lt; 2) continue;
            children.push({
              type: &quot;polygon&quot;,
              shape: { points: segs[s].up.concat(segs[s].down) },
              style: { fill: api.visual(&quot;color&quot;), opacity: params.itemStyle &amp;&amp; params.itemStyle.opacity != null ? params.itemStyle.opacity : 0.26 },
              silent: true
            });
          }
          return { type: &quot;group&quot;, children: children };
        },
        itemStyle: { opacity: opacity == null ? 0.26 : opacity }
      }, extra || {});
    }

    /* ================= 方案数据与构建器 ================= */

    /* ---------- R01 横向范围条 ---------- */
    // 记录：[名称, lower, upper]；含等值、颠倒、缺失三类边界样例
    let r01rows;
    function makeR01() {
      r01rows = [
        [&quot;城际枢纽综合体项目&quot;, 42, 68],
        [&quot;老旧管网改造一期&quot;, 12.5, 21],
        [&quot;智慧园区数字底座&quot;, 8, 15.5],
        [&quot;滨江生态廊道工程&quot;, 25, 25],            // 等值区间：合法，画为窄条
        [&quot;产业新城基础设施&quot;, 55, 96],
        [&quot;数据中心扩容工程&quot;, 18, 11],            // 上下界颠倒：剔除并提示
        [&quot;区域医疗中心项目&quot;, 30, null],          // 缺失上界：剔除并提示
        [&quot;轨道延伸线前期&quot;, 6.5, 14]
      ];
      return r01rows;
    }
    function buildR01() {
      const { valid, issues } = validateRanges(makeR01(), (r) =&gt; &quot;「&quot; + r[0] + &quot;」&quot;, (r) =&gt; r[1], (r) =&gt; r[2]);
      setIssues(&quot;r01&quot;, issues);
      const names = valid.map((r) =&gt; r[0]);
      const data = valid.map((r, i) =&gt; [i, r[1], r[2], r[2] - r[1], r[0]]);
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 30, top: 16, bottom: 8, containLabel: true },
        xAxis: valAxis(&quot;亿元&quot;, { scale: true }),
        yAxis: catAxis(names, { inverse: true, axisLabel: { color: C.muted, fontSize: 11, width: 110, overflow: &quot;truncate&quot; } }),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            var d = p.data;
            return d[4] + &quot;&lt;br/&gt;下界：&quot; + d[1] + &quot; 亿元&lt;br/&gt;上界：&quot; + d[2] + &quot; 亿元&lt;br/&gt;跨度：&quot; + Math.round((d[3]) * 10) / 10 + &quot; 亿元&quot;;
          }
        }),
        series: [{
          name: &quot;投资区间&quot;,
          type: &quot;custom&quot;,
          color: C.cyan,
          data,
          encode: { x: [1, 2], y: 0 },
          renderItem: function (params, api) {
            var start = api.coord([api.value(1), api.value(0)]);
            var end = api.coord([api.value(2), api.value(0)]);
            var h = Math.min(api.size([0, 1])[1] * 0.46, 16);
            var w = Math.max(Math.abs(end[0] - start[0]), 3);
            return {
              type: &quot;rect&quot;,
              shape: { x: Math.min(start[0], end[0]), y: start[1] - h / 2, width: w, height: h, r: h / 2 },
              style: api.style()
            };
          },
          itemStyle: { color: C.cyan, opacity: 0.85 }
        }]
      });
    }

    /* ---------- R02 浮动区间柱 ---------- */
    function buildR02() {
      const months = [&quot;1月&quot;, &quot;2月&quot;, &quot;3月&quot;, &quot;4月&quot;, &quot;5月&quot;, &quot;6月&quot;, &quot;7月&quot;, &quot;8月&quot;, &quot;9月&quot;, &quot;10月&quot;, &quot;11月&quot;, &quot;12月&quot;];
      const rows = months.map((m, i) =&gt; {
        const mid = Math.sin(i / 11 * Math.PI * 2) * 220 + rnd(-60, 60);
        const half = rnd(60, 150);
        return [i, Math.round(mid - half), Math.round(mid + half), m];
      });
      const { valid, issues } = validateRanges(rows, (r) =&gt; r[3], (r) =&gt; r[1], (r) =&gt; r[2]);
      setIssues(&quot;r02&quot;, issues);
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 26, bottom: 8, containLabel: true },
        xAxis: catAxis(months),
        yAxis: valAxis(&quot;万元&quot;),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            var d = p.data;
            return d[3] + &quot;&lt;br/&gt;区间下限：&quot; + d[1] + &quot; 万元&lt;br/&gt;区间上限：&quot; + d[2] + &quot; 万元&quot; + (d[1] &lt;= 0 &amp;&amp; d[2] &gt;= 0 ? &quot;&lt;br/&gt;该区间跨越零轴&quot; : &quot;&quot;);
          }
        }),
        series: [{
          name: &quot;偏差区间&quot;,
          type: &quot;custom&quot;,
          color: C.blue,
          data: valid,
          encode: { x: 0, y: [1, 2] },
          renderItem: function (params, api) {
            var lo = api.coord([api.value(0), api.value(1)]);
            var hi = api.coord([api.value(0), api.value(2)]);
            var w = Math.min(api.size([1, 0])[0] * 0.5, 26);
            var h = Math.max(Math.abs(lo[1] - hi[1]), 3);
            return {
              type: &quot;rect&quot;,
              shape: { x: hi[0] - w / 2, y: Math.min(hi[1], lo[1]), width: w, height: h, r: 3 },
              style: api.style()
            };
          },
          itemStyle: { color: C.blue, opacity: 0.8 },
          markLine: {
            silent: true, symbol: &quot;none&quot;,
            lineStyle: { color: &quot;rgba(230, 241, 255, 0.5)&quot;, type: &quot;solid&quot;, width: 1 },
            data: [{ yAxis: 0 }],
            label: { show: true, formatter: &quot;0 基线&quot;, color: C.muted, fontSize: 10, position: &quot;insideEndTop&quot; }
          }
        }]
      });
    }

    /* ---------- R03 极差带趋势 ---------- */
    function buildR03() {
      const days = [];
      const band = [];
      const mid = [];
      let level = 5200;
      for (let i = 0; i &lt; 24; i++) {
        days.push(&quot;D&quot; + (i + 1));
        level += rnd(-140, 140);
        if (i === 9 || i === 10) {
          band.push([i, null, null]);       // 缺失端点：断开
          mid.push(null);
        } else {
          const half = rnd(180, 380);
          band.push([i, level - half, level + half]);
          mid.push(level);
        }
      }
      const segs = splitBandSegments(band);
      setIssues(&quot;r03&quot;, segs.length &gt; 1 ? [&quot;D10–D11 采集缺失，极差带与中值线断开 &quot; + (segs.length - 1) + &quot; 处&quot;] : []);
      return Object.assign(baseOption(&quot;axis&quot;), {
        grid: { left: 8, right: 16, top: 34, bottom: 8, containLabel: true },
        legend: legendTop([&quot;极差带&quot;, &quot;中值&quot;]),
        xAxis: catAxis(days),
        yAxis: valAxis(&quot;吨&quot;, { scale: true }),
        tooltip: Object.assign(baseOption(&quot;axis&quot;).tooltip, {
          formatter: function (list) {
            var arr = Array.isArray(list) ? list : [list];
            var bandItem = null, midItem = null;
            for (var i = 0; i &lt; arr.length; i++) {
              if (arr[i].seriesName === &quot;极差带&quot;) bandItem = arr[i];
              if (arr[i].seriesName === &quot;中值&quot;) midItem = arr[i];
            }
            var head = arr.length ? arr[0].name : &quot;&quot;;
            var lines = [head];
            if (bandItem &amp;&amp; bandItem.data &amp;&amp; isFinite(bandItem.data[1])) {
              lines.push(&quot;下界：&quot; + bandItem.data[1] + &quot; 吨&quot;);
              lines.push(&quot;上界：&quot; + bandItem.data[2] + &quot; 吨&quot;);
            } else {
              lines.push(&quot;该时段极差数据缺失&quot;);
            }
            if (midItem &amp;&amp; midItem.data != null &amp;&amp; isFinite(midItem.data)) lines.push(&quot;中值：&quot; + midItem.data + &quot; 吨&quot;);
            return lines.join(&quot;&lt;br/&gt;&quot;);
          }
        }),
        series: [
          bandSeries(&quot;极差带&quot;, band, C.cyan, 0.24),
          { name: &quot;中值&quot;, type: &quot;line&quot;, data: mid, connectNulls: false, symbol: &quot;circle&quot;, symbolSize: 5, lineStyle: { width: 2, color: C.cyan }, itemStyle: { color: C.cyan }, z: 3 }
        ]
      });
    }

    /* ---------- R04 误差棒 ---------- */
    function buildR04() {
      const batches = [&quot;批次A&quot;, &quot;批次B&quot;, &quot;批次C&quot;, &quot;批次D&quot;, &quot;批次E&quot;, &quot;批次F&quot;];
      const means = batches.map(() =&gt; rndf(49.2, 50.8, 2));
      const ses = batches.map(() =&gt; rndf(0.12, 0.42, 2));
      const err = means.map((m, i) =&gt; [i, Math.round((m - 1.96 * ses[i]) * 100) / 100, Math.round((m + 1.96 * ses[i]) * 100) / 100, m, ses[i]]);
      setIssues(&quot;r04&quot;, []);
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 16, top: 30, bottom: 8, containLabel: true },
        legend: legendTop([&quot;批次均值&quot;, &quot;95% 置信区间&quot;]),
        xAxis: catAxis(batches),
        yAxis: valAxis(&quot;毫米&quot;, { scale: true }),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            if (p.seriesName === &quot;95% 置信区间&quot;) {
              var d = p.data;
              return p.name + &quot;&lt;br/&gt;均值：&quot; + d[3] + &quot; 毫米&lt;br/&gt;标准误：&quot; + d[4] + &quot;&lt;br/&gt;95% CI：[&quot; + d[1] + &quot;, &quot; + d[2] + &quot;]&quot;;
            }
            return p.name + &quot;&lt;br/&gt;均值：&quot; + p.data + &quot; 毫米&quot;;
          }
        }),
        series: [
          { name: &quot;批次均值&quot;, type: &quot;bar&quot;, data: means, barWidth: 22, itemStyle: { color: &quot;rgba(75, 125, 255, 0.55)&quot;, borderRadius: [4, 4, 0, 0] } },
          {
            name: &quot;95% 置信区间&quot;,
            type: &quot;custom&quot;,
            color: C.amber,
            data: err,
            encode: { x: 0, y: [1, 2] },
            z: 10,
            renderItem: function (params, api) {
              var x = api.coord([api.value(0), 0])[0];
              var lo = api.coord([api.value(0), api.value(1)])[1];
              var hi = api.coord([api.value(0), api.value(2)])[1];
              var half = Math.min(api.size([1, 0])[0] * 0.16, 9);
              var st = { stroke: api.visual(&quot;color&quot;), lineWidth: 1.6, fill: null };
              return {
                type: &quot;group&quot;,
                children: [
                  { type: &quot;line&quot;, shape: { x1: x, y1: lo, x2: x, y2: hi }, style: st },
                  { type: &quot;line&quot;, shape: { x1: x - half, y1: lo, x2: x + half, y2: lo }, style: st },
                  { type: &quot;line&quot;, shape: { x1: x - half, y1: hi, x2: x + half, y2: hi }, style: st }
                ]
              };
            },
            itemStyle: { color: C.amber }
          }
        ]
      });
    }

    /* ---------- R05 置信带 ---------- */
    function buildR05() {
      const labels = [];
      const actual = [];
      const forecast = [];
      const band = [];
      let v = 320;
      for (let i = 0; i &lt; 24; i++) {
        labels.push(i &lt; 18 ? &quot;第&quot; + (i + 1) + &quot;周&quot; : &quot;预第&quot; + (i - 17) + &quot;周&quot;);
        if (i &lt; 18) {
          v += rnd(-18, 26);
          actual.push(v);
          forecast.push(i === 17 ? v : null);
          band.push([i, null, null]);
        } else {
          const step = i - 17;
          const center = v + step * rnd(4, 10);
          const half = 14 + step * 9;
          actual.push(null);
          forecast.push(center);
          band.push([i, center - half, center + half]);
        }
      }
      const issues = [];
      band.forEach((b, i) =&gt; {
        if (b[1] != null &amp;&amp; b[2] != null &amp;&amp; b[1] &gt; b[2]) issues.push(labels[i] + &quot; 区间颠倒&quot;);
      });
      setIssues(&quot;r05&quot;, issues);
      return Object.assign(baseOption(&quot;axis&quot;), {
        grid: { left: 8, right: 16, top: 34, bottom: 8, containLabel: true },
        legend: legendTop([&quot;历史实绩&quot;, &quot;预测中值&quot;, &quot;90% 置信带&quot;]),
        xAxis: catAxis(labels, { axisLabel: { color: C.muted, fontSize: 10, interval: 3 } }),
        yAxis: valAxis(&quot;万单&quot;, { scale: true }),
        series: [
          bandSeries(&quot;90% 置信带&quot;, band, C.violet, 0.24),
          { name: &quot;历史实绩&quot;, type: &quot;line&quot;, data: actual, connectNulls: false, symbol: &quot;none&quot;, lineStyle: { width: 2.2, color: C.cyan }, itemStyle: { color: C.cyan }, z: 3 },
          { name: &quot;预测中值&quot;, type: &quot;line&quot;, data: forecast, connectNulls: false, symbol: &quot;none&quot;, lineStyle: { width: 2, color: C.violet, type: &quot;dashed&quot; }, itemStyle: { color: C.violet }, z: 3 },
          {
            name: &quot;预测起点&quot;, type: &quot;scatter&quot;, data: [[17, v]], symbolSize: 8,
            itemStyle: { color: &quot;#0a1e3c&quot;, borderColor: C.violet, borderWidth: 2 },
            tooltip: { show: false }, label: { show: true, formatter: &quot;预测起点&quot;, position: &quot;top&quot;, color: C.muted, fontSize: 10 }, z: 4
          }
        ]
      });
    }

    /* ---------- R06 预测扇形带 ---------- */
    function buildR06() {
      const labels = [];
      const history = [];
      const p50 = [];
      const outer = [];
      const inner = [];
      const issues = [];
      let v = 96;
      const QKEYS = [&quot;p05&quot;, &quot;p25&quot;, &quot;p50&quot;, &quot;p75&quot;, &quot;p95&quot;];
      for (let i = 0; i &lt; 20; i++) {
        labels.push(i &lt; 12 ? (i + 1) + &quot;月&quot; : &quot;预+&quot; + (i - 11));
        if (i &lt; 12) {
          v += rndf(-3, 4, 1);
          history.push(Math.round(v * 10) / 10);
          p50.push(i === 11 ? Math.round(v * 10) / 10 : null);
          outer.push([i, null, null]);
          inner.push([i, null, null]);
        } else {
          const step = i - 11;
          const center = v + step * 1.6;
          const q = {
            p05: Math.round((center - 2.2 - step * 2.4) * 10) / 10,
            p25: Math.round((center - 0.9 - step * 1.0) * 10) / 10,
            p50: Math.round(center * 10) / 10,
            p75: Math.round((center + 0.9 + step * 1.0) * 10) / 10,
            p95: Math.round((center + 2.2 + step * 2.4) * 10) / 10
          };
          if (!quantilesMonotonic(q, QKEYS)) {
            issues.push(labels[i] + &quot; 分位值非单调，剔除该期&quot;);
            history.push(null); p50.push(null); outer.push([i, null, null]); inner.push([i, null, null]);
            continue;
          }
          history.push(null);
          p50.push(q.p50);
          outer.push([i, q.p05, q.p95]);
          inner.push([i, q.p25, q.p75]);
        }
      }
      setIssues(&quot;r06&quot;, issues);
      return Object.assign(baseOption(&quot;axis&quot;), {
        grid: { left: 8, right: 16, top: 34, bottom: 8, containLabel: true },
        legend: legendTop([&quot;历史&quot;, &quot;P50 中位&quot;, &quot;P05–P95&quot;, &quot;P25–P75&quot;]),
        xAxis: catAxis(labels, { axisLabel: { color: C.muted, fontSize: 10, interval: 1 } }),
        yAxis: valAxis(&quot;GWh&quot;, { scale: true }),
        series: [
          bandSeries(&quot;P05–P95&quot;, outer, C.blue, 0.18),
          bandSeries(&quot;P25–P75&quot;, inner, C.cyan, 0.3),
          { name: &quot;历史&quot;, type: &quot;line&quot;, data: history, connectNulls: false, symbol: &quot;none&quot;, lineStyle: { width: 2.2, color: C.text }, itemStyle: { color: C.text }, z: 3 },
          { name: &quot;P50 中位&quot;, type: &quot;line&quot;, data: p50, connectNulls: false, symbol: &quot;none&quot;, lineStyle: { width: 2, color: C.cyan, type: &quot;dashed&quot; }, itemStyle: { color: C.cyan }, z: 3 }
        ]
      });
    }

    /* ---------- R07 目标安全带 ---------- */
    function buildR07() {
      // 阈值由输入数据给出，图形层只做映射
      const zones = [
        { name: &quot;正常&quot;, from: 0, to: 70, color: &quot;rgba(56, 230, 176, 0.10)&quot;, labelColor: &quot;#6ef0c2&quot; },
        { name: &quot;预警&quot;, from: 70, to: 85, color: &quot;rgba(255, 200, 87, 0.12)&quot;, labelColor: &quot;#ffd79a&quot; },
        { name: &quot;危险&quot;, from: 85, to: 100, color: &quot;rgba(255, 102, 128, 0.14)&quot;, labelColor: &quot;#ff9db8&quot; }
      ];
      const issues = [];
      for (let i = 1; i &lt; zones.length; i++) {
        if (zones[i].from !== zones[i - 1].to) issues.push(&quot;阈值分区「&quot; + zones[i - 1].name + &quot;→&quot; + zones[i].name + &quot;」存在重叠或空档&quot;);
      }
      const hours = [];
      const load = [];
      for (let i = 0; i &lt; 24; i++) {
        hours.push(i + &quot;:00&quot;);
        load.push(Math.round(46 + 26 * Math.exp(-Math.pow(i - 14, 2) / 18) + rnd(-4, 8)));
      }
      const last = load[load.length - 1];
      const zone = zones.find((z) =&gt; last &gt;= z.from &amp;&amp; last &lt; z.to) || zones[zones.length - 1];
      setIssues(&quot;r07&quot;, issues);
      return Object.assign(baseOption(&quot;axis&quot;), {
        grid: { left: 8, right: 30, top: 30, bottom: 8, containLabel: true },
        xAxis: catAxis(hours, { axisLabel: { color: C.muted, fontSize: 10, interval: 3 } }),
        yAxis: valAxis(&quot;负载率 %&quot;, { min: 0, max: 100 }),
        tooltip: Object.assign(baseOption(&quot;axis&quot;).tooltip, {
          formatter: function (list) {
            var p = Array.isArray(list) ? list[0] : list;
            var v = p.data;
            var status = v &lt; 70 ? &quot;正常&quot; : (v &lt; 85 ? &quot;预警&quot; : &quot;危险&quot;);
            return p.name + &quot;&lt;br/&gt;负载率：&quot; + v + &quot;%&lt;br/&gt;状态：&quot; + status + &quot;（阈值 70 / 85）&quot;;
          }
        }),
        series: [{
          name: &quot;集群负载率&quot;,
          type: &quot;line&quot;,
          data: load,
          symbol: &quot;none&quot;,
          smooth: 0.3,
          lineStyle: { width: 2.4, color: C.cyan },
          itemStyle: { color: C.cyan },
          z: 5,
          markArea: {
            silent: true,
            data: zones.map((z) =&gt; [
              { yAxis: z.from, itemStyle: { color: z.color }, label: { show: true, position: &quot;insideRight&quot;, color: z.labelColor, fontSize: 11, formatter: z.name + &quot; &quot; + z.from + &quot;–&quot; + z.to } },
              { yAxis: z.to }
            ])
          },
          markPoint: {
            symbol: &quot;pin&quot;, symbolSize: 44,
            itemStyle: { color: zone.name === &quot;正常&quot; ? &quot;#38e6b0&quot; : (zone.name === &quot;预警&quot; ? &quot;#ffc857&quot; : &quot;#ff6680&quot;) },
            label: { color: &quot;#08192e&quot;, fontSize: 11, fontWeight: 600 },
            data: [{ name: &quot;当前&quot;, coord: [23, last], value: last }]
          }
        }]
      });
    }

    /* ---------- R08/R09 子弹图 builder（原子实现，供矩阵小多图复用） ---------- */
    // rows: [{ name, actual, target, zones: [z1, z2, z3] }]，单位一致，从零基线绘制。
    // 返回完整 option；tooltip 数据（差额、完成率、状态）全部预计算进 series 数据项。
    function buildBulletOption(rows, unit, opts) {
      opts = opts || {};
      const names = rows.map((r) =&gt; r.name);
      const zone1 = rows.map((r) =&gt; r.zones[0]);
      const zone2 = rows.map((r) =&gt; r.zones[1] - r.zones[0]);
      const zone3 = rows.map((r) =&gt; r.zones[2] - r.zones[1]);
      const actualData = rows.map((r, i) =&gt; {
        const diff = r.actual - r.target;
        const rate = relativeDiff(r.actual, r.target);
        return {
          value: r.actual,
          rtMeta: [r.name, r.actual, r.target, diff, rate == null ? null : Math.round((r.actual / r.target) * 1000) / 10, diff &gt;= 0 ? &quot;已达标&quot; : &quot;未达标&quot;]
        };
      });
      const targetData = rows.map((r, i) =&gt; [r.target, i]);
      const maxVal = Math.max.apply(null, rows.map((r) =&gt; Math.max(r.zones[2], r.actual, r.target))) * 1.06;
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 34, top: opts.compact ? 8 : 26, bottom: 8, containLabel: true },
        legend: opts.compact ? undefined : legendTop([&quot;实际值&quot;, &quot;目标值&quot;]),
        xAxis: valAxis(unit, { min: 0, max: Math.round(maxVal) }),
        yAxis: catAxis(names, { inverse: true }),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            var m = p.data &amp;&amp; p.data.rtMeta;
            if (!m) return p.seriesName + &quot;：&quot; + (p.value &amp;&amp; p.value.length ? p.value[0] : p.value);
            return m[0] + &quot;&lt;br/&gt;实际：&quot; + m[1] + &quot;&lt;br/&gt;目标：&quot; + m[2] + &quot;&lt;br/&gt;差额：&quot; + (m[3] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + Math.round(m[3] * 10) / 10 +
              &quot;&lt;br/&gt;完成率：&quot; + (m[4] == null ? &quot;不可计算（目标为 0）&quot; : m[4] + &quot;%&quot;) + &quot;&lt;br/&gt;状态：&quot; + m[5];
          }
        }),
        series: [
          { name: &quot;区间·基础&quot;, type: &quot;bar&quot;, stack: &quot;rt-zones&quot;, data: zone1, barWidth: 18, silent: true, itemStyle: { color: &quot;rgba(111, 143, 181, 0.34)&quot; } },
          { name: &quot;区间·良好&quot;, type: &quot;bar&quot;, stack: &quot;rt-zones&quot;, data: zone2, barWidth: 18, silent: true, itemStyle: { color: &quot;rgba(111, 143, 181, 0.22)&quot; } },
          { name: &quot;区间·卓越&quot;, type: &quot;bar&quot;, stack: &quot;rt-zones&quot;, data: zone3, barWidth: 18, silent: true, itemStyle: { color: &quot;rgba(111, 143, 181, 0.12)&quot; } },
          { name: &quot;实际值&quot;, type: &quot;bar&quot;, data: actualData, barWidth: 8, barGap: &quot;-72%&quot;, z: 5, itemStyle: { color: C.cyan, borderRadius: [0, 3, 3, 0] } },
          {
            name: &quot;目标值&quot;, type: &quot;scatter&quot;, data: targetData, symbol: &quot;rect&quot;, symbolSize: [3, 24], z: 6,
            itemStyle: { color: C.amber },
            tooltip: { formatter: function (p) { return &quot;目标：&quot; + p.value[0]; } }
          }
        ]
      });
    }

    function buildR08() {
      setIssues(&quot;r08&quot;, []);
      const actual = rnd(7800, 10800);
      return buildBulletOption(
        [{ name: &quot;华东大区&quot;, actual, target: 10000, zones: [6000, 8500, 10500] }],

    function buildR09() {
      setIssues(&quot;r09&quot;, []);
      const orgs = [&quot;华东大区&quot;, &quot;华南大区&quot;, &quot;华北大区&quot;, &quot;西南大区&quot;, &quot;华中大区&quot;, &quot;东北大区&quot;];
      const rows = orgs.map((name) =&gt; {
        const target = rnd(5200, 9800);
        return { name, actual: Math.round(target * rndf(0.62, 1.18, 2)), target, zones: [Math.round(target * 0.6), Math.round(target * 0.85), Math.round(target * 1.05)] };
      });
      rows.sort((a, b) =&gt; (a.actual - a.target) - (b.actual - b.target)); // 差距最大（最落后）在前
      return buildBulletOption(rows, &quot;万元&quot;, { compact: false });
    }

    /* ---------- R10 实际—目标哑铃 ---------- */
    let r10SortBy = &quot;abs&quot;; // abs | rel
    function buildR10() {
      const regions = [
        { name: &quot;江北新区&quot;, target: 860, actual: 942 },
        { name: &quot;河西板块&quot;, target: 1210, actual: 1105 },
        { name: &quot;城东片区&quot;, target: 640, actual: 618 },
        { name: &quot;高新园区&quot;, target: 980, actual: 1188 },
        { name: &quot;临港组团&quot;, target: 0, actual: 96 },     // 目标为 0：相对差不可计算
        { name: &quot;老城片区&quot;, target: 540, actual: 431 },
        { name: &quot;空港新城&quot;, target: 720, actual: 764 },
        { name: &quot;科教走廊&quot;, target: 460, actual: 512 }
      ];
      const rows = regions.map((r) =&gt; {
        const diff = r.actual - r.target;
        const rel = relativeDiff(r.actual, r.target);
        return { name: r.name, target: r.target, actual: r.actual, diff, rel };
      });
      rows.sort((a, b) =&gt; {
        if (r10SortBy === &quot;abs&quot;) return Math.abs(b.diff) - Math.abs(a.diff);
        const ra = a.rel == null ? -Infinity : Math.abs(a.rel);
        const rb = b.rel == null ? -Infinity : Math.abs(b.rel);
        return rb - ra;
      });
      setIssues(&quot;r10&quot;, rows.some((r) =&gt; r.rel == null) ? [&quot;「临港组团」目标为 0，相对差不可计算，按绝对差排序时参与、按相对差排序时置底&quot;] : []);
      const names = rows.map((r) =&gt; r.name);
      const data = rows.map((r, i) =&gt; [i, r.target, r.actual, r.diff, r.rel == null ? null : Math.round(r.rel * 1000) / 10, r.name]);
      return Object.assign(baseOption(&quot;item&quot;), {
        grid: { left: 8, right: 40, top: 30, bottom: 8, containLabel: true },
        legend: legendTop([&quot;目标值&quot;, &quot;实际值&quot;]),
        xAxis: valAxis(&quot;万元&quot;, { scale: true }),
        yAxis: catAxis(names, { inverse: true }),
        tooltip: Object.assign(baseOption(&quot;item&quot;).tooltip, {
          formatter: function (p) {
            var d = p.data;
            if (!d || d.length &lt; 6) return &quot;&quot;;
            return d[5] + &quot;&lt;br/&gt;目标：&quot; + d[1] + &quot; 万元&lt;br/&gt;实际：&quot; + d[2] + &quot; 万元&lt;br/&gt;绝对差：&quot; + (d[3] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + d[3] +
              &quot; 万元&lt;br/&gt;相对差：&quot; + (d[4] == null ? &quot;不可计算（目标为 0）&quot; : (d[4] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + d[4] + &quot;%&quot;);
          }
        }),
        series: [
          {
            name: &quot;差距连线&quot;,
            type: &quot;custom&quot;,
            data,
            encode: { x: [1, 2], y: 0 },
            z: 2,
            renderItem: function (params, api) {
              var p1 = api.coord([api.value(1), api.value(0)]);
              var p2 = api.coord([api.value(2), api.value(0)]);
              var up = api.value(2) &gt;= api.value(1);
              return {
                type: &quot;line&quot;,
                shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] },
                style: { stroke: up ? &quot;#38e6b0&quot; : &quot;#ff6680&quot;, lineWidth: 2.4, opacity: 0.85 }
              };
            },
            tooltip: { show: false },
            silent: true
          },
          { name: &quot;目标值&quot;, type: &quot;scatter&quot;, data: data.map((d) =&gt; ({ value: [d[1], d[0]], rtRow: d })), symbolSize: 9, itemStyle: { color: &quot;#0a1e3c&quot;, borderColor: C.muted, borderWidth: 2 }, tooltip: { formatter: function (p) { var d = p.data.rtRow; return d[5] + &quot;&lt;br/&gt;目标：&quot; + d[1] + &quot; 万元&quot;; } }, z: 3 },
          { name: &quot;实际值&quot;, type: &quot;scatter&quot;, data: data.map((d) =&gt; ({ value: [d[2], d[0]], rtRow: d })), symbolSize: 10, itemStyle: { color: C.cyan }, tooltip: { formatter: function (p) { var d = p.data.rtRow; return d[5] + &quot;&lt;br/&gt;目标：&quot; + d[1] + &quot; 万元&lt;br/&gt;实际：&quot; + d[2] + &quot; 万元&lt;br/&gt;绝对差：&quot; + (d[3] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + d[3] + &quot; 万元&lt;br/&gt;相对差：&quot; + (d[4] == null ? &quot;不可计算（目标为 0）&quot; : (d[4] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + d[4] + &quot;%&quot;); } }, z: 4 }
        ]
      });
    }

    /* ---------- R11 目标缺口棒棒糖 ---------- */
    function buildR11() {
      const units = [&quot;高新支行&quot;, &quot;城南支行&quot;, &quot;开发区支行&quot;, &quot;临江支行&quot;, &quot;科技支行&quot;, &quot;中心支行&quot;, &quot;北城支行&quot;, &quot;东湖支行&quot;, &quot;港区支行&quot;, &quot;西岭支行&quot;];

        }),
        series: [
          {
            name: &quot;缺口&quot;, type: &quot;bar&quot;, data, barWidth: 3,

            markLine: { silent: true, symbol: &quot;none&quot;, lineStyle: { color: &quot;rgba(230, 241, 255, 0.5)&quot;, width: 1 }, data: [{ xAxis: 0 }], label: { show: false } }
          },
          {
            name: &quot;缺口头&quot;, type: &quot;scatter&quot;, data: data.map((d, i) =&gt; ({ value: [d.value, i], rtMeta: d.rtMeta })), symbolSize: 11,
            itemStyle: { color: function (p) { return p.value[0] &gt;= 0 ? &quot;#38e6b0&quot; : &quot;#ff6680&quot;; } },
            label: { show: true, position: &quot;right&quot;, color: C.muted, fontSize: 10, formatter: function (p) { return (p.value[0] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + p.value[0]; } },
            tooltip: {
              formatter: function (p) {
                var m = p.data.rtMeta;
                return m[0] + &quot;&lt;br/&gt;目标：&quot; + m[1] + &quot; 万元&lt;br/&gt;实际：&quot; + m[2] + &quot; 万元&lt;br/&gt;缺口：&quot; + (m[3] &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + m[3] + &quot; 万元&quot;;
              }
            },
            z: 4
          }
        ]
      });
    }

    /* ---------- R12 SLA 容忍带 ---------- */
    function buildR12() {
      // 阈值来自输入：预警 300ms，临界 500ms；方向为「越低越好」
      const WARN = 300, CRIT = 500, STEP_MIN = 30;
      const labels = [];
      const lat = [];
      for (let i = 0; i &lt; 48; i++) {
        const h = Math.floor(i / 2), m = i % 2 ? &quot;30&quot; : &quot;00&quot;;
        labels.push(h + &quot;:&quot; + m);
        let v = 120 + rnd(-30, 60);
        if (i &gt;= 18 &amp;&amp; i &lt;= 23) v = 320 + rnd(-40, 160);   // 制造一段越界
        if (i &gt;= 36 &amp;&amp; i &lt;= 38) v = 520 + rnd(-30, 90);
        lat.push(v);
      }
      const warnMin = breachMinutes(lat, WARN, STEP_MIN);
      const critMin = breachMinutes(lat, CRIT, STEP_MIN);
      setIssues(&quot;r12&quot;, []);
      return Object.assign(baseOption(&quot;axis&quot;), {
        grid: { left: 8, right: 16, top: 40, bottom: 8, containLabel: true },
        title: undefined,
        visualMap: {
          show: false, dimension: 1, seriesIndex: 0,
          pieces: [
            { lte: WARN, color: &quot;#38e6b0&quot; },
            { gt: WARN, lte: CRIT, color: &quot;#ffc857&quot; },
            { gt: CRIT, color: &quot;#ff6680&quot; }
          ]
        },
        xAxis: catAxis(labels, { axisLabel: { color: C.muted, fontSize: 10, interval: 7 } }),
        yAxis: valAxis(&quot;毫秒&quot;, { min: 0 }),
        tooltip: Object.assign(baseOption(&quot;axis&quot;).tooltip, {
          formatter: function (list) {
            var p = Array.isArray(list) ? list[0] : list;
            var v = p.value[1] != null ? p.value[1] : p.value;
            var status = v &gt; 500 ? &quot;越过临界阈值&quot; : (v &gt; 300 ? &quot;越过预警阈值&quot; : &quot;正常&quot;);
            return p.name + &quot;&lt;br/&gt;P95 延迟：&quot; + v + &quot; ms（越低越好）&lt;br/&gt;状态：&quot; + status;
          }
        }),
        graphic: [{
          type: &quot;text&quot;, right: 12, top: 2,
          style: {
            text: &quot;预警越界累计 &quot; + warnMin + &quot; 分钟 · 临界越界累计 &quot; + critMin + &quot; 分钟&quot;,
            fill: warnMin &gt; 0 ? &quot;#ffd79a&quot; : &quot;#6ef0c2&quot;, fontSize: 11
          }
        }],
        series: [{
          name: &quot;P95 延迟&quot;,
          type: &quot;line&quot;,
          data: lat.map((v, i) =&gt; [i, v]),
          symbol: &quot;none&quot;,
          lineStyle: { width: 2 },
          z: 5,
          markArea: {
            silent: true,
            data: [
              [{ yAxis: WARN, itemStyle: { color: &quot;rgba(255, 200, 87, 0.08)&quot; }, label: { show: true, position: &quot;insideRight&quot;, color: &quot;#ffd79a&quot;, fontSize: 10, formatter: &quot;预警带 300–500ms&quot; } }, { yAxis: CRIT }],
              [{ yAxis: CRIT, itemStyle: { color: &quot;rgba(255, 102, 128, 0.10)&quot; }, label: { show: true, position: &quot;insideRight&quot;, color: &quot;#ff9db8&quot;, fontSize: 10, formatter: &quot;临界带 ≥500ms&quot; } }, { yAxis: 10000 }]
            ]
          },
          markLine: {
            silent: true, symbol: &quot;none&quot;,
            lineStyle: { color: &quot;rgba(255, 200, 87, 0.6)&quot;, type: &quot;dashed&quot;, width: 1 },
            data: [
              { yAxis: WARN, label: { formatter: &quot;预警 300&quot;, color: &quot;#ffd79a&quot;, fontSize: 10, position: &quot;insideEndTop&quot; } },
              { yAxis: CRIT, lineStyle: { color: &quot;rgba(255, 102, 128, 0.7)&quot;, type: &quot;dashed&quot;, width: 1 }, label: { formatter: &quot;临界 500&quot;, color: &quot;#ff9db8&quot;, fontSize: 10, position: &quot;insideEndTop&quot; } }
            ]
          }
        }]
      });
    }

    /* ================= 渲染调度（懒加载 + 生命周期） ================= */

    const builders = [
      { id: &quot;e6rt-r01&quot;, build: buildR01 },
      { id: &quot;e6rt-r02&quot;, build: buildR02 },
      { id: &quot;e6rt-r03&quot;, build: buildR03 },
      { id: &quot;e6rt-r04&quot;, build: buildR04 },
      { id: &quot;e6rt-r05&quot;, build: buildR05 },
      { id: &quot;e6rt-r06&quot;, build: buildR06 },
      { id: &quot;e6rt-r07&quot;, build: buildR07 },
      { id: &quot;e6rt-r08&quot;, build: buildR08 },
      { id: &quot;e6rt-r09&quot;, build: buildR09 },
      { id: &quot;e6rt-r10&quot;, build: buildR10 },
      { id: &quot;e6rt-r11&quot;, build: buildR11 },
      { id: &quot;e6rt-r12&quot;, build: buildR12 }
    ];
    const builderById = {};
    builders.forEach((b) =&gt; { builderById[b.id] = b; });

    const charts = {};
    function renderOne(id) {
      const item = builderById[id];
      const node = document.getElementById(id);
      if (!item || !node) return;
      if (!charts[id]) charts[id] = echarts.init(node, null, { renderer: &quot;canvas&quot; });
      try {
        charts[id].setOption(item.build(), { notMerge: true });
      } catch (err) {
        errorNode.textContent = &quot;方案「&quot; + id + &quot;」渲染异常：&quot; + err.message;
        errorNode.classList.add(&quot;is-visible&quot;);
      }
    }
    function renderInitialized() {
      Object.keys(charts).forEach(renderOne);
    }

    let io = null;
    if (&quot;IntersectionObserver&quot; in window) {
      io = new IntersectionObserver((entries) =&gt; {
        entries.forEach((entry) =&gt; {
          if (!entry.isIntersecting) return;
          renderOne(entry.target.id);
          io.unobserve(entry.target);
        });
      }, { rootMargin: &quot;320px 0px&quot; });
      builders.forEach((b) =&gt; {
        const node = document.getElementById(b.id);
        if (node) io.observe(node);
      });
    } else {
      builders.forEach((b) =&gt; renderOne(b.id));
    }

    let ro = null;
    function resizeCharts() {
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) charts[id].resize(); });
    }
    if (&quot;ResizeObserver&quot; in window) {
      ro = new ResizeObserver(resizeCharts);
      ro.observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    document.getElementById(&quot;e6rt-refresh&quot;).addEventListener(&quot;click&quot;, renderInitialized);
    const motionBtn = document.getElementById(&quot;e6rt-motion&quot;);
    motionBtn.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      motionBtn.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionBtn.textContent = &quot;更新动效：&quot; + (motionEnabled ? &quot;开&quot; : &quot;关&quot;);
      renderInitialized();
    });
    reducedMotion.addEventListener &amp;&amp; reducedMotion.addEventListener(&quot;change&quot;, (e) =&gt; {
      if (e.matches) {
        motionEnabled = false;
        motionBtn.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        motionBtn.textContent = &quot;更新动效：关&quot;;
        renderInitialized();
      }
    });

    const r10SortBtn = document.getElementById(&quot;e6rt-r10-sort&quot;);
    r10SortBtn.addEventListener(&quot;click&quot;, () =&gt; {
      r10SortBy = r10SortBy === &quot;abs&quot; ? &quot;rel&quot; : &quot;abs&quot;;
      r10SortBtn.textContent = &quot;排序：&quot; + (r10SortBy === &quot;abs&quot; ? &quot;绝对差&quot; : &quot;相对差&quot;);
      if (charts[&quot;e6rt-r10&quot;]) renderOne(&quot;e6rt-r10&quot;);
    });

    window.addEventListener(&quot;pagehide&quot;, () =&gt; {
      if (io) io.disconnect();
      if (ro) ro.disconnect();
      Object.keys(charts).forEach((id) =&gt; { if (charts[id]) { charts[id].dispose(); charts[id] = null; } });
    });

    runSelfCheck();
  })();
  &lt;/script&gt;
&lt;/body&gt;

"></iframe>
