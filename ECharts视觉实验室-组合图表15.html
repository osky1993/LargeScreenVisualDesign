      &quot;#3fbaee&quot;,
      &quot;#3cabec&quot;,
      &quot;#399dea&quot;,
      &quot;#2f8ce9&quot;,
      &quot;#2c7de8&quot;,
      &quot;#2b6fe3&quot;,
      &quot;#2d63e1&quot;,
      &quot;#2c56dd&quot;,
      &quot;#2b4bda&quot;,
      &quot;#2d41d7&quot;,
      &quot;#2b37d4&quot;
    ],
    &quot;seq&quot;: null,
    &quot;div&quot;: null,

    &quot;text&quot;: &quot;#dfe8fb&quot;,

&lt;/script&gt;
&lt;script&gt;
/* lab-addons：为各 ECharts 视觉实验室提供「复制配置」与「主题切换」能力。
 * 依赖：先于本脚本注入的 LAB_THEMES（shared/themes.js），以及页面已加载的 echarts。
 * 机制：包装 echarts.init 拦截 setOption —— 原始 option 挂到图容器 DOM（__vizRaw），
 * 激活主题时在 set 时做颜色映射（__vizShown 为实际展示的 option）。 */
(function () {
  &quot;use strict&quot;;
  if (!window.echarts || window.LabAddons) return;
  function probe(tag, data) {
    try { if (parent !== window) parent.postMessage(&quot;LABADDONS:&quot; + tag + &quot;:&quot; + JSON.stringify(data || {}), &quot;*&quot;); } catch (_) { /* noop */ }
  }
  window.addEventListener(&quot;error&quot;, function (e) {
    probe(&quot;err&quot;, { m: String(e.message).slice(0, 120), l: e.lineno });
  });
  window.addEventListener(&quot;message&quot;, function (e) {
    if (e.data !== &quot;LABADDONS_PING&quot;) return;
    var w = document.getElementById(&quot;lab-theme-widget&quot;);
    probe(&quot;state&quot;, {
      widget: !!w,
      rect: w ? w.getBoundingClientRect().toJSON() : null,
      display: w ? getComputedStyle(w).display : null,
      vw: window.innerWidth, vh: window.innerHeight
    });
  });

  function allThemes() {
    try { return LAB_THEMES || []; } catch (e) { return window.LAB_THEMES || []; }
  }

  var registry = new Set();
  var activeTheme = null;
  var config = { headSelector: null, chartSelector: null };

  /* ---------- 颜色解析 ---------- */
  function hueDist(a, b) {
    var d = Math.abs(a - b) % 360;
    return d &gt; 180 ? 360 - d : d;
  }
  function parseColor(str) {
    if (typeof str !== &quot;string&quot;) return null;
    var s = str.trim(), m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(s))) {
      return rgbToHsla(parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16), 1);
    }
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s))) {
      var v = parseInt(m[1], 16);
      return rgbToHsla(v &gt;&gt; 16, (v &gt;&gt; 8) &amp; 255, v &amp; 255, m[2] ? parseInt(m[2], 16) / 255 : 1);
    }
    if ((m = /^rgba?\(\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*[, ]\s*([\d.]+)\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var a = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return rgbToHsla(+m[1], +m[2], +m[3], a);
    }
    if ((m = /^hsla?\(\s*([\d.]+)(?:deg)?\s*[, ]\s*([\d.]+)%\s*[, ]\s*([\d.]+)%\s*(?:[,/ ]\s*([\d.]+%?)\s*)?\)$/i.exec(s))) {
      var al = m[4] == null ? 1 : (m[4].endsWith(&quot;%&quot;) ? parseFloat(m[4]) / 100 : parseFloat(m[4]));
      return { h: +m[1] % 360, s: +m[2] / 100, l: +m[3] / 100, a: al };
    }
    return null;
  }
  function rgbToHsla(r, g, b, a) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l &gt; 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g &lt; b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l, a: a };
  }
  function fmtHsla(c) {
    var h = Math.round(c.h * 10) / 10, s = Math.round(c.s * 1000) / 10, l = Math.round(c.l * 1000) / 10;
    return c.a &gt;= 1 ? &quot;hsl(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%)&quot; : &quot;hsla(&quot; + h + &quot;, &quot; + s + &quot;%, &quot; + l + &quot;%, &quot; + Math.round(c.a * 1000) / 1000 + &quot;)&quot;;
  }
  function isChromatic(c) {
    return c &amp;&amp; c.s &gt;= 0.14 &amp;&amp; c.a &gt; 0.04 &amp;&amp; c.l &gt; 0.02 &amp;&amp; c.l &lt; 0.98;
  }

  /* ---------- 主题颜色映射（色相族 → 主题色板槽位；保留原明度/透明度层次） ---------- */
  function buildMapper(option, theme) {
    var families = []; // {hue}
    collect(option);
    function collect(node) {
      if (node == null) return;
      if (typeof node === &quot;string&quot;) {
        var c = parseColor(node);
        if (isChromatic(c) &amp;&amp; familyOf(c.h) === -1) families.push({ hue: c.h });
        return;
      }
      if (Array.isArray(node)) { node.forEach(collect); return; }
      if (typeof node === &quot;object&quot;) {
        for (var k in node) {
          if (k === &quot;formatter&quot; || k === &quot;text&quot; || k === &quot;subtext&quot;) continue;
          collect(node[k]);
        }
      }
    }
    function familyOf(h) {
      for (var i = 0; i &lt; families.length; i++) if (hueDist(families[i].hue, h) &lt;= 26) return i;
      return -1;
    }
    var targets = theme.colors.map(parseColor);
    return function mapColorStr(str) {
      var c = parseColor(str);
      if (!isChromatic(c)) return str;
      var fi = familyOf(c.h);
      var t = targets[fi === -1 ? 0 : fi % targets.length];
      return fmtHsla({ h: t.h, s: t.s, l: c.l, a: c.a });
    };
  }

  function mapOption(option, theme) {
    var mapColor = buildMapper(option, theme);
    function walk(node, key) {
      if (node == null || typeof node === &quot;function&quot;) return node;
      if (typeof node === &quot;object&quot; &amp;&amp; (node.nodeType || node.getContext)) return node; // DOM/canvas 纹理等原样保留
      if (typeof node === &quot;string&quot;) {
        if (key === &quot;formatter&quot; || key === &quot;text&quot; || key === &quot;subtext&quot;) return node;
        return parseColor(node) ? mapColor(node) : node;
      }
      if (Array.isArray(node)) return node.map(function (v) { return walk(v, key); });
      if (typeof node === &quot;object&quot;) {
        var out = {};
        for (var k in node) out[k] = walk(node[k], k);

      }

  /* ---------- echarts.init / setOption 拦截 ---------- */

  echarts.init = function (dom, theme, opts) {
    var chart = realInit(dom, theme, opts);
    if (!dom || !chart) return chart;
    chart.__vizDom = dom;
    registry.add(chart);
    var realSet = chart.setOption.bind(chart);
    chart.__vizRealSetOption = realSet;
    chart.setOption = function (opt) {
      var rest = Array.prototype.slice.call(arguments, 1);
      if (opt &amp;&amp; opt.series) dom.__vizRaw = opt;
      var shown = activeTheme &amp;&amp; opt ? mapOption(opt, activeTheme) : opt;
      if (opt &amp;&amp; opt.series) dom.__vizShown = shown;
      return realSet.apply(null, [shown].concat(rest));
    };
    return chart;
  };

  /* ---------- 主题应用 ---------- */
  var stageEls = null;
  function findStageEls() {
    // 全屏级不透明底色容器（各实验室的&quot;舞台&quot;div），换主题时一并换底
    var out = [];
    var vw = window.innerWidth, vh = window.innerHeight;
    var candidates = document.body.querySelectorAll(&quot;:scope &gt; *, :scope &gt; * &gt; *&quot;);
    candidates.forEach(function (el) {
      if (el.id === &quot;lab-theme-widget&quot; || el.id === &quot;lab-copy-modal&quot;) return;
      if (el.offsetWidth &lt; vw * 0.9 || el.offsetHeight &lt; vh * 0.6) return;
      var c = parseColor(getComputedStyle(el).backgroundColor);
      if (c &amp;&amp; c.a &gt; 0.5) out.push({ el: el, orig: el.style.getPropertyValue(&quot;background-color&quot;) });
    });
    return out;
  }

  function applyTheme(theme) {
    activeTheme = theme;
    var root = document.documentElement;
    if (!stageEls) stageEls = findStageEls();
    stageEls.forEach(function (s) {
      if (theme &amp;&amp; theme.bg) s.el.style.setProperty(&quot;background-color&quot;, theme.bg, &quot;important&quot;);
      else if (s.orig) s.el.style.setProperty(&quot;background-color&quot;, s.orig);
      else s.el.style.removeProperty(&quot;background-color&quot;);
    });
    for (var i = 1; i &lt;= 6; i++) {
      if (theme &amp;&amp; theme.colors[i - 1]) root.style.setProperty(&quot;--viz-series-&quot; + i, theme.colors[i - 1]);
      else root.style.removeProperty(&quot;--viz-series-&quot; + i);
    }
    if (theme &amp;&amp; theme.colors[0]) root.style.setProperty(&quot;--primary&quot;, theme.colors[0]);
    else root.style.removeProperty(&quot;--primary&quot;);
    if (theme &amp;&amp; theme.bg) {
      root.style.setProperty(&quot;--background&quot;, theme.bg);
      root.style.setProperty(&quot;--lab-bg&quot;, theme.bg);
      root.classList.add(&quot;lab-themed&quot;);
    } else {
      root.style.removeProperty(&quot;--background&quot;);
      root.style.removeProperty(&quot;--lab-bg&quot;);
      root.classList.remove(&quot;lab-themed&quot;);
    }
    registry.forEach(function (chart) {
      if (chart.isDisposed &amp;&amp; chart.isDisposed()) { registry.delete(chart); return; }
      var raw = chart.__vizDom &amp;&amp; chart.__vizDom.__vizRaw;
      if (raw) chart.setOption(raw, { notMerge: true });
    });
  }

  /* ---------- 复制配置 ---------- */
  function serializeJS(value, indent) {
    var pad = &quot;  &quot;.repeat(indent), padIn = &quot;  &quot;.repeat(indent + 1);
    if (value === null) return &quot;null&quot;;
    if (value === undefined) return &quot;undefined&quot;;
    var t = typeof value;
    if (t === &quot;number&quot; || t === &quot;boolean&quot;) return String(value);
    if (t === &quot;string&quot;) return JSON.stringify(value);
    if (t === &quot;function&quot;) {
      return String(value).split(&quot;\n&quot;).map(function (line, i) { return i === 0 ? line : padIn + line.trim(); }).join(&quot;\n&quot;);
    }
    if (Array.isArray(value)) {
      if (!value.length) return &quot;[]&quot;;
      var flat = value.every(function (v) { return v === null || [&quot;number&quot;, &quot;string&quot;, &quot;boolean&quot;].indexOf(typeof v) !== -1; });
      var items = value.map(function (v) { return serializeJS(v, indent + 1); });
      if (flat &amp;&amp; items.join(&quot;, &quot;).length &lt; 100) return &quot;[&quot; + items.join(&quot;, &quot;) + &quot;]&quot;;
      return &quot;[\n&quot; + items.map(function (s) { return padIn + s; }).join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;]&quot;;
    }
    if (t === &quot;object&quot;) {
      var keys = Object.keys(value).filter(function (k) { return value[k] !== undefined; });
      if (!keys.length) return &quot;{}&quot;;
      var body = keys.map(function (k) {
        var key = /^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k);
        return padIn + key + &quot;: &quot; + serializeJS(value[k], indent + 1);
      });
      return &quot;{\n&quot; + body.join(&quot;,\n&quot;) + &quot;\n&quot; + pad + &quot;}&quot;;
    }
    return &quot;null&quot;;
  }

  function copyText(text, done) {

  }
  function legacyCopy(text, done) {
    try {
      var ta = document.createElement(&quot;textarea&quot;);
      ta.value = text;
      ta.style.cssText = &quot;position:fixed;left:-9999px;top:0&quot;;

    done(false);
  }
  function showModal(text) {
    var old = document.getElementById(&quot;lab-copy-modal&quot;);
    if (old) old.remove();
    var wrap = document.createElement(&quot;div&quot;);
    wrap.id = &quot;lab-copy-modal&quot;;
    wrap.innerHTML =
      &#x27;&lt;div class=&quot;lab-copy-mask&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lab-copy-box&quot;&gt;&lt;p&gt;自动复制受限，请手动全选复制：&lt;/p&gt;&#x27; +
      &#x27;&lt;textarea readonly&gt;&lt;/textarea&gt;&lt;button type=&quot;button&quot;&gt;关闭&lt;/button&gt;&lt;/div&gt;&#x27;;
    wrap.querySelector(&quot;textarea&quot;).value = text;
    wrap.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    wrap.querySelector(&quot;.lab-copy-mask&quot;).addEventListener(&quot;click&quot;, function () { wrap.remove(); });
    document.body.appendChild(wrap);
    wrap.querySelector(&quot;textarea&quot;).select();
  }

  function schemeTitle(head) {
    var el = head.querySelector(&quot;h1,h2,h3,h4&quot;);
    return el ? el.textContent.trim() : &quot;方案&quot;;
  }

  function onCopyClick(btn, head) {
    var card = head.parentElement;
    var chartNode = card ? card.querySelector(config.chartSelector) : null;
    var opt = chartNode &amp;&amp; (chartNode.__vizShown || chartNode.__vizRaw);
    if (!opt) { flash(btn, &quot;图表未渲染&quot;); return; }
    var text = &quot;/* 方案：&quot; + schemeTitle(head) + &quot; · ECharts 6.1.0&quot; +
      (activeTheme ? &quot; · 主题：&quot; + activeTheme.name : &quot;&quot;) +
      &quot; · 用法：echarts.init(dom).setOption(option) */\n&quot; +
      &quot;const option = &quot; + serializeJS(opt, 0) + &quot;;\n&quot;;

  }
  function flash(btn, msg) {

    btn.textContent = msg;
    btn.disabled = true;
    setTimeout(function () { btn.textContent = origin; btn.disabled = false; }, 1200);
  }

  var injectQueued = false;
  function injectButtons() {
    if (!config.headSelector) return;
    document.querySelectorAll(config.headSelector).forEach(function (head) {
      if (head.querySelector(&quot;.lab-copy-btn&quot;)) return;
      var card = head.parentElement;
      if (!card || !card.querySelector(config.chartSelector)) return;
      var btn = document.createElement(&quot;button&quot;);
      btn.type = &quot;button&quot;;
      btn.className = &quot;lab-copy-btn&quot;;
      btn.textContent = &quot;复制配置&quot;;
      btn.dataset.label = &quot;复制配置&quot;;
      btn.addEventListener(&quot;click&quot;, function () { onCopyClick(btn, head); });
      head.appendChild(btn);
    });
  }
  function queueInject() {
    if (injectQueued) return;
    injectQueued = true;
    setTimeout(function () { injectQueued = false; injectButtons(); }, 120);
  }

  /* ---------- 主题切换悬浮组件 ---------- */
  function buildWidget() {
    var wrap = document.createElement(&quot;div&quot;);
    wrap.id = &quot;lab-theme-widget&quot;;
    var groups = { &quot;行业&quot;: [], &quot;风格&quot;: [] };
    allThemes().forEach(function (t) { (groups[t.group] = groups[t.group] || []).push(t); });
    var optionsHtml = Object.keys(groups).map(function (g) {
      return &#x27;&lt;optgroup label=&quot;&#x27; + (g === &quot;行业&quot; ? &quot;行业主题&quot; : &quot;风格皮肤&quot;) + &#x27;&quot;&gt;&#x27; +
        groups[g].map(function (t) { return &#x27;&lt;option value=&quot;&#x27; + t.id + &#x27;&quot;&gt;&#x27; + t.name + &quot; · &quot; + t.use + &quot;&lt;/option&gt;&quot;; }).join(&quot;&quot;) +
        &quot;&lt;/optgroup&gt;&quot;;
    }).join(&quot;&quot;);
    wrap.innerHTML =
      &#x27;&lt;span class=&quot;lab-theme-label&quot;&gt;配色主题&lt;/span&gt;&#x27; +
      &#x27;&lt;select aria-label=&quot;切换配色主题&quot;&gt;&lt;option value=&quot;&quot;&gt;默认（原始配色）&lt;/option&gt;&#x27; + optionsHtml + &quot;&lt;/select&gt;&quot; +
      &#x27;&lt;button type=&quot;button&quot;&gt;还原&lt;/button&gt;&#x27;;
    var select = wrap.querySelector(&quot;select&quot;);
    select.addEventListener(&quot;change&quot;, function () {
      var theme = allThemes().find(function (t) { return t.id === select.value; }) || null;
      applyTheme(theme);

    wrap.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, function () {

    document.body.insertBefore(wrap, document.body.firstChild);
  }

  function injectStyles() {
    var css =
      &quot;html.lab-themed{background:var(--lab-bg) !important;background-color:var(--lab-bg) !important}&quot; +
      &quot;html.lab-themed body{background:var(--lab-bg) !important}&quot; +
      &quot;html.lab-themed body::before,html.lab-themed body::after{opacity:.22}&quot; +
      &quot;.lab-copy-btn{margin-left:8px;flex:none;font:inherit;font-size:11px;line-height:1;padding:5px 9px;border-radius:999px;&quot; +
      &quot;border:1px solid rgba(140,190,255,.4);background:rgba(40,90,160,.28);color:#cfe6ff;cursor:pointer;white-space:nowrap}&quot; +
      &quot;.lab-copy-btn:hover{background:rgba(70,130,210,.45)}.lab-copy-btn:disabled{opacity:.85;cursor:default}&quot; +
      &quot;#lab-theme-widget{display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:8px 24px;&quot; +
      &quot;border-bottom:1px solid rgba(140,190,255,.18);background:rgba(8,22,45,.6);font-size:12px;color:#cfe6ff;white-space:nowrap}&quot; +
      &quot;#lab-theme-widget select{max-width:170px;font:inherit;padding:4px 6px;border-radius:8px;border:1px solid rgba(140,190,255,.4);&quot; +
      &quot;background:rgba(15,35,70,.9);color:#e6f2ff}&quot; +
      &quot;#lab-theme-widget button{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid rgba(140,190,255,.4);&quot; +
      &quot;background:rgba(40,90,160,.3);color:#cfe6ff;cursor:pointer}&quot; +
      &quot;#lab-copy-modal{position:fixed;inset:0;z-index:2147483100}&quot; +
      &quot;#lab-copy-modal .lab-copy-mask{position:absolute;inset:0;background:rgba(0,0,0,.55)}&quot; +
      &quot;#lab-copy-modal .lab-copy-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,90vw);&quot; +
      &quot;background:#0d1f3d;border:1px solid rgba(140,190,255,.4);border-radius:12px;padding:16px;color:#cfe6ff;font-size:13px}&quot; +
      &quot;#lab-copy-modal textarea{width:100%;height:300px;margin:10px 0;background:#081422;color:#d7e8ff;border:1px solid rgba(140,190,255,.3);&quot; +
      &quot;border-radius:8px;font-family:monospace;font-size:12px;padding:8px;box-sizing:border-box}&quot; +
      &quot;#lab-copy-modal button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid rgba(140,190,255,.4);&quot; +
      &quot;background:rgba(40,90,160,.3);color:#cfe6ff;cursor:pointer}&quot;;
    var style = document.createElement(&quot;style&quot;);
    style.textContent = css;

  }

  window.LabAddons = {
    setup: function (cfg) {

})();

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/echarts-liquidfill@3.1.0/dist/echarts-liquidfill.min.js&quot; onerror=&quot;window.__e6cbLiquidError = true&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
  (() =&gt; {
    &quot;use strict&quot;;
    const errorNode = document.getElementById(&quot;e6cb-error&quot;);
    if (!window.echarts) {
      errorNode.classList.add(&quot;is-visible&quot;);
      return;
    }

    const C = {
      text: &quot;#e6f1ff&quot;, muted: &quot;#8fa7c8&quot;,
      cyan: &quot;#3fe1ff&quot;, blue: &quot;#4b7dff&quot;, violet: &quot;#9870ff&quot;, green: &quot;#38e6b0&quot;,
      amber: &quot;#ffc857&quot;, red: &quot;#ff6680&quot;, orange: &quot;#ff9360&quot;, pink: &quot;#e96bb5&quot;, steel: &quot;#6f8fb5&quot;
    };
    const AXIS_LINE = &quot;rgba(86, 150, 224, 0.35)&quot;;
    const SPLIT_LINE = &quot;rgba(86, 150, 224, 0.16)&quot;;

    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
    let motionEnabled = !reducedMotion.matches;

    function rnd(min, max) {
      return Math.round(min + Math.random() * (max - min));
    }
    function rndf(min, max, digits) {
      const p = Math.pow(10, digits == null ? 1 : digits);
      return Math.round((min + Math.random() * (max - min)) * p) / p;
    }
    function vGrad(color, alphaTop, alphaBottom) {
      return {
        type: &quot;linear&quot;, x: 0, y: 0, x2: 0, y2: 1,
        colorStops: [
          { offset: 0, color: echarts.color.modifyAlpha(color, alphaTop == null ? 0.95 : alphaTop) },
          { offset: 1, color: echarts.color.modifyAlpha(color, alphaBottom == null ? 0.25 : alphaBottom) }
        ]
      };
    }

    /* ---------- 插件可用性检测（echarts-liquidfill） ---------- */
    function liquidReady() {
      if (window.__e6cbLiquidError) return false;
      const holder = document.createElement(&quot;div&quot;);
      holder.style.cssText = &quot;position:fixed;left:-9999px;top:-9999px;width:120px;height:90px;&quot;;
      document.body.appendChild(holder);
      let probe = null;
      let ok = false;
      try {
        probe = echarts.init(holder, null, { renderer: &quot;canvas&quot; });
        probe.setOption({ series: [{ type: &quot;liquidFill&quot;, data: [0.5] }] });
        ok = true;
      } catch (err) {
        ok = false;
      }
      if (probe) probe.dispose();
      holder.remove();
      return ok;
    }
    const liquidOk = liquidReady();
    if (!liquidOk) {
      const node = document.getElementById(&quot;e6cb-liquid&quot;);
      const tip = document.createElement(&quot;div&quot;);
      tip.className = &quot;e6cb-plugin-missing&quot;;
      tip.setAttribute(&quot;role&quot;, &quot;alert&quot;);
      tip.textContent = &quot;水球插件 echarts-liquidfill 加载失败，本卡暂以占位提示呈现，请联网后重新打开此文件。&quot;;
      node.appendChild(tip);
    }

    /* ---------- 公共构件 ---------- */
    function baseOption(trigger) {
      return {
        animation: motionEnabled,
        animationDuration: motionEnabled ? 700 : 0,
        animationDurationUpdate: motionEnabled ? 500 : 0,
        animationEasing: &quot;cubicOut&quot;,
        tooltip: {
          trigger: trigger || &quot;item&quot;,
          confine: true,
          backgroundColor: &quot;rgba(9, 24, 48, 0.92)&quot;,
          borderColor: &quot;rgba(102, 178, 255, 0.4)&quot;,
          textStyle: { color: &quot;#dcedff&quot;, fontSize: 12 },
          axisPointer: trigger === &quot;axis&quot; ? { type: &quot;shadow&quot;, shadowStyle: { color: &quot;rgba(102, 178, 255, 0.08)&quot; } } : undefined
        }
      };
    }
    function catAxis(data, extra) {
      return Object.assign({
        type: &quot;category&quot;,
        data,
        axisLine: { lineStyle: { color: AXIS_LINE } },
        axisTick: { show: false },
        axisLabel: { color: C.muted, fontSize: 11 }
      }, extra || {});
    }
    function valAxis(name, extra) {
      return Object.assign({
        type: &quot;value&quot;,
        name,
        nameTextStyle: { color: C.muted, fontSize: 11 },
        axisLine: { show: false },
        axisLabel: { color: C.muted, fontSize: 11 },
        splitLine: { lineStyle: { color: SPLIT_LINE } }
      }, extra || {});
    }
    function pctAxis(max, extra) {
      return Object.assign(valAxis(&quot;&quot;), {
        max,
        min: extra &amp;&amp; extra.min != null ? extra.min : undefined,
        axisLabel: { color: C.muted, fontSize: 11, formatter: &quot;{value}%&quot; },
        splitLine: { show: false }
      });
    }
    function legendTop(names) {
      return {
        top: 0,
        data: names,
        icon: &quot;roundRect&quot;,
        itemWidth: 10,
        itemHeight: 10,
        itemGap: 14,
        textStyle: { color: C.muted, fontSize: 11 }
      };
    }

    /* ---------- 01 帕累托图 ---------- */
    function buildPareto() {
      const cats = [&quot;交付延误&quot;, &quot;质量缺陷&quot;, &quot;成本超支&quot;, &quot;需求变更&quot;, &quot;沟通不畅&quot;, &quot;资源冲突&quot;, &quot;其他&quot;];
      const rows = cats.map((name) =&gt; ({ name, value: rnd(14, 96) })).sort((a, b) =&gt; b.value - a.value);
      const total = rows.reduce((s, r) =&gt; s + r.value, 0);
      let acc = 0;
      const cum = rows.map((r) =&gt; { acc += r.value; return +(acc / total * 100).toFixed(1); });
      const opt = baseOption(&quot;axis&quot;);
      opt.legend = legendTop([&quot;问题数&quot;, &quot;累计占比&quot;]);
      opt.grid = { left: 44, right: 46, top: 40, bottom: 44 };
      opt.xAxis = catAxis(rows.map((r) =&gt; r.name), { axisLabel: { color: C.muted, fontSize: 10.5, interval: 0, rotate: 26 } });
      opt.yAxis = [valAxis(&quot;件&quot;), pctAxis(100)];
      opt.series = [
        {
          name: &quot;问题数&quot;, type: &quot;bar&quot;, barWidth: &quot;48%&quot;,
          data: rows.map((r) =&gt; r.value),
          itemStyle: { color: vGrad(C.cyan, 0.95, 0.3), borderRadius: [4, 4, 0, 0] }
        },
        {
          name: &quot;累计占比&quot;, type: &quot;line&quot;, yAxisIndex: 1, smooth: false,
          data: cum,
          symbol: &quot;circle&quot;, symbolSize: 7,
          lineStyle: { color: C.amber, width: 2.5 },
          itemStyle: { color: C.amber, borderColor: &quot;#0a1e3c&quot;, borderWidth: 1.5 },
          tooltip: { valueFormatter: (v) =&gt; v + &quot;%&quot; },
          markLine: {
            silent: true, symbol: &quot;none&quot;,
            lineStyle: { color: C.red, type: &quot;dashed&quot;, width: 1.4 },
            label: { formatter: &quot;80% 关键线&quot;, color: &quot;#ffb3c1&quot;, fontSize: 10, position: &quot;insideEndTop&quot; },
            data: [{ yAxis: 80 }]
          }
        }
      ];
      return opt;
    }

    /* ---------- 02 三元目标对照 ---------- */
    function buildTarget() {
      const cats = [&quot;华东&quot;, &quot;华南&quot;, &quot;华北&quot;, &quot;西南&quot;, &quot;华中&quot;, &quot;西北&quot;, &quot;东北&quot;, &quot;海外&quot;];
      const target = cats.map(() =&gt; rnd(70, 95));
      const actual = target.map((t) =&gt; rnd(t - 22, t + 18));
      const opt = baseOption(&quot;axis&quot;);
      opt.legend = legendTop([&quot;实绩&quot;, &quot;目标&quot;]);
      opt.grid = { left: 44, right: 18, top: 40, bottom: 28 };
      opt.xAxis = catAxis(cats);
      opt.yAxis = [valAxis(&quot;亿元&quot;)];
      opt.series = [
        {
          name: &quot;实绩&quot;, type: &quot;bar&quot;, barWidth: &quot;44%&quot;,
          data: actual,
          itemStyle: { color: vGrad(C.blue, 0.92, 0.28), borderRadius: [4, 4, 0, 0] }
        },
        {
          name: &quot;目标&quot;, type: &quot;line&quot;,
          data: target,
          symbol: &quot;none&quot;,
          lineStyle: { color: C.amber, width: 2, type: &quot;dashed&quot; },
          itemStyle: { color: C.amber }
        },
        {
          name: &quot;达标判定&quot;, type: &quot;scatter&quot;, z: 6,
          data: actual.map((v, i) =&gt; ({
            value: v,
            itemStyle: {
              color: v &gt;= target[i] ? C.green : C.red,
              borderColor: &quot;#0a1e3c&quot;, borderWidth: 1.5,
              shadowBlur: 8,
              shadowColor: v &gt;= target[i] ? &quot;rgba(56,230,176,0.6)&quot; : &quot;rgba(255,102,128,0.6)&quot;
            }
          })),
          symbolSize: 10,
          tooltip: {
            formatter: (p) =&gt; cats[p.dataIndex] + &quot;：实绩 &lt;b&gt;&quot; + actual[p.dataIndex] + &quot;&lt;/b&gt; / 目标 &quot; +
              target[p.dataIndex] + &quot;（&quot; + (actual[p.dataIndex] &gt;= target[p.dataIndex] ? &quot;达标&quot; : &quot;未达标&quot;) + &quot;）&quot;
          }
        }
      ];
      return opt;
    }

    /* ---------- 03 三指标混合 ---------- */
    function buildTriple() {
      const months = Array.from({ length: 12 }, (_, i) =&gt; (i + 1) + &quot;月&quot;);
      let base = rnd(900, 1100);
      const revenue = months.map(() =&gt; { base = Math.max(760, base + rnd(-70, 110)); return base; });
      const profit = revenue.map((v) =&gt; Math.round(v * rndf(0.12, 0.2, 3)));
      const growth = revenue.map((v, i) =&gt; i === 0 ? null : +((v - revenue[i - 1]) / revenue[i - 1] * 100).toFixed(1));
      const opt = baseOption(&quot;axis&quot;);
      opt.legend = legendTop([&quot;营收&quot;, &quot;净利&quot;, &quot;环比增速&quot;]);
      opt.grid = { left: 48, right: 46, top: 40, bottom: 28 };
      opt.xAxis = catAxis(months, { boundaryGap: true });
      opt.yAxis = [valAxis(&quot;万元&quot;), pctAxis(undefined, { min: undefined })];
      opt.series = [
        {
          name: &quot;营收&quot;, type: &quot;line&quot;, smooth: true, z: 2,
          data: revenue,
          symbol: &quot;none&quot;,
          lineStyle: { color: C.cyan, width: 2.2 },
          areaStyle: { color: vGrad(C.cyan, 0.32, 0.02) }
        },
        {
          name: &quot;净利&quot;, type: &quot;bar&quot;, barWidth: &quot;36%&quot;, z: 3,
          data: profit,
          itemStyle: { color: vGrad(C.violet, 0.9, 0.3), borderRadius: [3, 3, 0, 0] }
        },
        {
          name: &quot;环比增速&quot;, type: &quot;line&quot;, yAxisIndex: 1, smooth: true, z: 4,
          data: growth,
          symbol: &quot;circle&quot;, symbolSize: 5,
          lineStyle: { color: C.amber, width: 2 },
          itemStyle: { color: C.amber },
          tooltip: { valueFormatter: (v) =&gt; v == null ? &quot;—&quot; : v + &quot;%&quot; }
        }
      ];
      return opt;
    }

    /* ---------- 04 散点回归带 ---------- */
    function buildRegress() {
      const slopeTrue = rndf(0.55, 0.95, 2);
      const interceptTrue = rnd(8, 26);
      const pts = Array.from({ length: 42 }, () =&gt; {
        const x = rndf(10, 100, 1);
        const y = +(interceptTrue + slopeTrue * x + (Math.random() - 0.5) * 26).toFixed(1);
        return [x, y];
      });
      const n = pts.length;
      const mx = pts.reduce((s, p) =&gt; s + p[0], 0) / n;
      const my = pts.reduce((s, p) =&gt; s + p[1], 0) / n;
      let sxy = 0, sxx = 0;
      pts.forEach((p) =&gt; { sxy += (p[0] - mx) * (p[1] - my); sxx += (p[0] - mx) * (p[0] - mx); });
      const b = sxy / sxx;
      const a = my - b * mx;
      const sd = Math.sqrt(pts.reduce((s, p) =&gt; s + Math.pow(p[1] - (a + b * p[0]), 2), 0) / (n - 2));
      const xMin = Math.min(...pts.map((p) =&gt; p[0]));
      const xMax = Math.max(...pts.map((p) =&gt; p[0]));
      const band = 1.28 * sd; // 约 10%~90% 分位带
      const steps = 24;
      const upper = [], lower = [];
      for (let i = 0; i &lt;= steps; i++) {
        const x = xMin + (xMax - xMin) * i / steps;
        const yh = a + b * x;
        upper.push([x, yh + band]);
        lower.push([x, yh - band]);
      }
      const opt = baseOption(&quot;item&quot;);
      opt.grid = { left: 46, right: 20, top: 30, bottom: 34 };
      opt.xAxis = valAxis(&quot;投入强度&quot;, { splitLine: { lineStyle: { color: SPLIT_LINE } }, min: &quot;dataMin&quot; });
      opt.yAxis = [valAxis(&quot;产出指数&quot;)];
      opt.series = [
        {
          name: &quot;分位带&quot;, type: &quot;custom&quot;, z: 1, silent: true,
          renderItem: (params, api) =&gt; {
            const points = upper.map((p) =&gt; api.coord(p)).concat(lower.slice().reverse().map((p) =&gt; api.coord(p)));
            return {
              type: &quot;polygon&quot;,
              shape: { points },
              style: { fill: &quot;rgba(63, 225, 255, 0.10)&quot;, stroke: &quot;rgba(63, 225, 255, 0.18)&quot;, lineWidth: 1 }
            };
          },
          data: [0],
          tooltip: { show: false }
        },
        {
          name: &quot;样本点&quot;, type: &quot;scatter&quot;, z: 3,
          data: pts,
          symbolSize: 9,
          itemStyle: {
            color: echarts.color.modifyAlpha(C.blue, 0.85),
            borderColor: &quot;rgba(63, 225, 255, 0.65)&quot;, borderWidth: 1
          },
          tooltip: { formatter: (p) =&gt; &quot;投入 &quot; + p.value[0] + &quot; · 产出 &lt;b&gt;&quot; + p.value[1] + &quot;&lt;/b&gt;&quot; }
        },
        {
          name: &quot;回归线&quot;, type: &quot;line&quot;, z: 4, silent: true,
          data: [[xMin, +(a + b * xMin).toFixed(1)], [xMax, +(a + b * xMax).toFixed(1)]],
          symbol: &quot;none&quot;,
          lineStyle: { color: C.amber, width: 2.4 },
          endLabel: {
            show: true, color: &quot;#ffd79a&quot;, fontSize: 10,
            formatter: () =&gt; &quot;y=&quot; + a.toFixed(1) + &quot;+&quot; + b.toFixed(2) + &quot;x&quot;
          }
        }
      ];
      return opt;
    }

    /* ---------- 05 双柱差值线 ---------- */
    function buildDelta() {
      const cats = [&quot;智慧交通&quot;, &quot;城市安防&quot;, &quot;政务云&quot;, &quot;产业园区&quot;, &quot;能源双碳&quot;, &quot;数字文旅&quot;];
      const prev = cats.map(() =&gt; rnd(60, 160));
      const cur = prev.map((v) =&gt; Math.max(24, v + rnd(-40, 55)));
      const diff = cur.map((v, i) =&gt; v - prev[i]);
      const opt = baseOption(&quot;axis&quot;);
      opt.legend = legendTop([&quot;本期&quot;, &quot;上期&quot;, &quot;差额&quot;]);
      opt.grid = { left: 44, right: 46, top: 40, bottom: 40 };
      opt.xAxis = catAxis(cats, { axisLabel: { color: C.muted, fontSize: 10.5, interval: 0, rotate: 18 } });
      opt.yAxis = [valAxis(&quot;百万元&quot;), Object.assign(valAxis(&quot;&quot;), {
        splitLine: { show: false },
        axisLabel: { color: C.muted, fontSize: 11, formatter: (v) =&gt; (v &gt; 0 ? &quot;+&quot; + v : String(v)) }
      })];
      opt.series = [
        {
          name: &quot;本期&quot;, type: &quot;bar&quot;, barWidth: &quot;26%&quot;, barGap: &quot;18%&quot;,
          data: cur,
          itemStyle: { color: vGrad(C.cyan, 0.92, 0.3), borderRadius: [3, 3, 0, 0] }
        },
        {
          name: &quot;上期&quot;, type: &quot;bar&quot;, barWidth: &quot;26%&quot;,
          data: prev,
          itemStyle: { color: echarts.color.modifyAlpha(C.steel, 0.55), borderRadius: [3, 3, 0, 0] }
        },
        {
          name: &quot;差额&quot;, type: &quot;line&quot;, yAxisIndex: 1, z: 5,
          data: diff.map((v) =&gt; ({
            value: v,
            itemStyle: {
              color: v &gt;= 0 ? C.green : C.red,
              borderColor: &quot;#0a1e3c&quot;, borderWidth: 1.5
            }
          })),
          symbol: &quot;circle&quot;, symbolSize: 9,
          lineStyle: { color: echarts.color.modifyAlpha(C.amber, 0.8), width: 1.6, type: &quot;dashed&quot; },
          label: {
            show: true, position: &quot;top&quot;, fontSize: 10,
            color: &quot;#dcedff&quot;,
            formatter: (p) =&gt; (p.value &gt; 0 ? &quot;+&quot; + p.value : p.value)
          },
          tooltip: { valueFormatter: (v) =&gt; (v &gt; 0 ? &quot;+&quot; + v : String(v)) }
        }
      ];
      return opt;
    }

    /* ---------- 06 K线三件套 ---------- */
    function buildCandle() {
      const count = 40;
      const days = [];
      const kline = [];
      const closes = [];
      const volumes = [];
      let close = rndf(3100, 3600, 1);
      const start = new Date(2026, 4, 4).getTime();
      for (let i = 0; i &lt; count; i++) {
        const d = new Date(start + i * 86400000);
        days.push((d.getMonth() + 1) + &quot;/&quot; + d.getDate());
        const open = close;
        const chg = (Math.random() - 0.48) * 0.045;
        close = +(open * (1 + chg)).toFixed(1);
        const high = +(Math.max(open, close) * (1 + Math.random() * 0.012)).toFixed(1);
        const low = +(Math.min(open, close) * (1 - Math.random() * 0.012)).toFixed(1);
        kline.push([+open.toFixed(1), close, low, high]);
        closes.push(close);
        volumes.push({
          value: rnd(420, 1500) + Math.round(Math.abs(chg) * 26000),
          itemStyle: { color: close &gt;= open ? &quot;rgba(56, 230, 176, 0.72)&quot; : &quot;rgba(255, 102, 128, 0.72)&quot; }
        });
      }
      const ma = (nn) =&gt; closes.map((_, i) =&gt;
        i &lt; nn - 1 ? null : +(closes.slice(i - nn + 1, i + 1).reduce((s, v) =&gt; s + v, 0) / nn).toFixed(1));
      const opt = baseOption(&quot;axis&quot;);
      opt.tooltip.axisPointer = { type: &quot;cross&quot;, label: { backgroundColor: &quot;rgba(33, 76, 133, 0.9)&quot;, color: &quot;#dcedff&quot;, fontSize: 10 } };
      opt.axisPointer = { link: [{ xAxisIndex: &quot;all&quot; }] };
      opt.legend = legendTop([&quot;日K&quot;, &quot;MA5&quot;, &quot;MA10&quot;]);
      opt.grid = [
        { left: 52, right: 14, top: 32, height: &quot;50%&quot; },
        { left: 52, right: 14, top: &quot;72%&quot;, height: &quot;18%&quot; }
      ];
      opt.xAxis = [
        catAxis(days, { gridIndex: 0, axisLabel: { show: false }, boundaryGap: true }),
        catAxis(days, { gridIndex: 1, boundaryGap: true, axisLabel: { color: C.muted, fontSize: 10, interval: 7 } })
      ];
      opt.yAxis = [
        Object.assign(valAxis(&quot;点位&quot;), { gridIndex: 0, scale: true }),
        Object.assign(valAxis(&quot;&quot;), { gridIndex: 1, axisLabel: { show: false }, splitLine: { show: false } })
      ];
      opt.series = [
        {
          name: &quot;日K&quot;, type: &quot;candlestick&quot;,
          data: kline,
          itemStyle: { color: C.green, color0: C.red, borderColor: C.green, borderColor0: C.red },
          barWidth: &quot;62%&quot;
        },
        {
          name: &quot;MA5&quot;, type: &quot;line&quot;, data: ma(5),
          symbol: &quot;none&quot;, smooth: true,
          lineStyle: { color: C.cyan, width: 1.4, opacity: 0.9 }, itemStyle: { color: C.cyan }
        },
        {
          name: &quot;MA10&quot;, type: &quot;line&quot;, data: ma(10),
          symbol: &quot;none&quot;, smooth: true,
          lineStyle: { color: C.amber, width: 1.4, opacity: 0.9 }, itemStyle: { color: C.amber }
        },
        {
          name: &quot;成交量&quot;, type: &quot;bar&quot;, xAxisIndex: 1, yAxisIndex: 1,
          data: volumes, barWidth: &quot;56%&quot;
        }
      ];
      return opt;
    }

    /* ---------- 07 KPI 复合环 ---------- */
    function buildKpiRing() {
      const v = rnd(58, 97);
      const yoy = rndf(-6, 12, 1);
      const opt = baseOption(&quot;item&quot;);
      opt.series = [
        {
          name: &quot;刻度环&quot;, type: &quot;gauge&quot;,
          center: [&quot;50%&quot;, &quot;52%&quot;], radius: &quot;92%&quot;,
          startAngle: 90, endAngle: -270, min: 0, max: 100,
          splitNumber: 12,
          axisLine: { show: false },
          splitLine: { show: true, length: 8, distance: -8, lineStyle: { color: &quot;rgba(143, 167, 200, 0.55)&quot;, width: 1.4 } },
          axisTick: { show: true, splitNumber: 4, length: 4, distance: -4, lineStyle: { color: &quot;rgba(143, 167, 200, 0.3)&quot;, width: 1 } },
          axisLabel: { show: false },
          pointer: { show: false },
          detail: { show: false },
          silent: true,
          data: []
        },
        {
          name: &quot;年度目标完成率&quot;, type: &quot;pie&quot;,
          center: [&quot;50%&quot;, &quot;52%&quot;], radius: [&quot;58%&quot;, &quot;74%&quot;],
          startAngle: 90, clockwise: true,
          silent: false,
          label: {
            show: true, position: &quot;center&quot;,
            formatter: () =&gt; &quot;{v|&quot; + v + &quot;}{u|%}\n{t|年度目标完成率}\n{y|同比 &quot; + (yoy &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + yoy + &quot;pct}&quot;,
            rich: {
              v: { fontSize: 40, fontWeight: 700, color: &quot;#f0f7ff&quot;, fontFamily: &quot;DIN Alternate, Bahnschrift, sans-serif&quot; },
              u: { fontSize: 16, color: C.cyan, padding: [0, 0, 14, 2] },

    /* ---------- 10 饼环 + 数值图例表 ---------- */
    function buildDonutLegend() {
      const names = [&quot;智慧城市&quot;, &quot;产业数字化&quot;, &quot;云与算力&quot;, &quot;生态合作&quot;, &quot;运维服务&quot;];

      const data = names.map((name, i) =&gt; ({ name, value: rnd(60, 320), itemStyle: { color: colors[i] } }));
      const total = data.reduce((s, d) =&gt; s + d.value, 0);
      const byName = {};
      data.forEach((d) =&gt; { byName[d.name] = d.value; });
      const opt = baseOption(&quot;item&quot;);
      opt.legend = {
        orient: &quot;vertical&quot;, right: 4, top: &quot;middle&quot;,
        icon: &quot;roundRect&quot;, itemWidth: 10, itemHeight: 10, itemGap: 14,
        textStyle: {
          color: C.text, fontSize: 12,
          rich: {
            n: { width: 78, color: &quot;#d7e8ff&quot;, fontSize: 12 },
            v: { width: 52, align: &quot;right&quot;, color: &quot;#9fd8ff&quot;, fontSize: 12, fontWeight: 600 },
            p: { width: 52, align: &quot;right&quot;, color: C.muted, fontSize: 11 }
          }
        },
        formatter: (name) =&gt; {
          const val = byName[name];
          return &quot;{n|&quot; + name + &quot;}{v|&quot; + val + &quot;}{p|&quot; + (val / total * 100).toFixed(1) + &quot;%}&quot;;
        }
      };
      opt.series = [
        {
          name: &quot;营收结构&quot;, type: &quot;pie&quot;,

            rich: {

              t: { fontSize: 11, color: C.muted, padding: [6, 0, 0, 0] }

          data

      return opt;
    }

    /* ---------- 11 柱 + 温度计目标线 ---------- */
    function buildBullet() {

      opt.grid = { left: 44, right: 18, top: 46, bottom: 28 };
      opt.xAxis = catAxis(cats);

        {

          label: {

        {

    /* ---------- 12 堆叠柱 + 占比线 ---------- */
    function buildStackShare() {
      const cats = [&quot;24Q1&quot;, &quot;24Q2&quot;, &quot;24Q3&quot;, &quot;24Q4&quot;, &quot;25Q1&quot;, &quot;25Q2&quot;, &quot;25Q3&quot;, &quot;25Q4&quot;];
      const basic = cats.map(() =&gt; rnd(120, 220));
      const innov = cats.map((_, i) =&gt; rnd(30 + i * 8, 70 + i * 10));
      const extra = cats.map(() =&gt; rnd(20, 60));
      const share = cats.map((_, i) =&gt; +(innov[i] / (basic[i] + innov[i] + extra[i]) * 100).toFixed(1));
      const opt = baseOption(&quot;axis&quot;);
      opt.legend = legendTop([&quot;基础业务&quot;, &quot;创新业务&quot;, &quot;增值服务&quot;, &quot;创新占比&quot;]);
      opt.grid = { left: 44, right: 46, top: 40, bottom: 28 };
      opt.xAxis = catAxis(cats);
      opt.yAxis = [valAxis(&quot;百万元&quot;), pctAxis(60)];
      const stackBar = (name, data, color) =&gt; ({
        name, type: &quot;bar&quot;, stack: &quot;revenue&quot;, barWidth: &quot;46%&quot;,
        data,
        itemStyle: { color: echarts.color.modifyAlpha(color, 0.85) }
      });
      opt.series = [
        stackBar(&quot;基础业务&quot;, basic, C.blue),
        stackBar(&quot;创新业务&quot;, innov, C.cyan),
        Object.assign(stackBar(&quot;增值服务&quot;, extra, C.violet), { itemStyle: { color: echarts.color.modifyAlpha(C.violet, 0.8), borderRadius: [4, 4, 0, 0] } }),
        {
          name: &quot;创新占比&quot;, type: &quot;line&quot;, yAxisIndex: 1, smooth: true, z: 5,
          data: share,
          symbol: &quot;circle&quot;, symbolSize: 6,
          lineStyle: { color: C.amber, width: 2.2 },
          itemStyle: { color: C.amber, borderColor: &quot;#0a1e3c&quot;, borderWidth: 1.5 },
          tooltip: { valueFormatter: (v) =&gt; v + &quot;%&quot; }
        }
      ];
      return opt;
    }

    /* ---------- 13 雷达 + 中心 KPI ---------- */
    function buildRadarKpi() {
      const dims = [&quot;营收&quot;, &quot;利润&quot;, &quot;回款&quot;, &quot;交付&quot;, &quot;质量&quot;, &quot;创新&quot;];

      const opt = baseOption(&quot;item&quot;);
      opt.legend = legendTop([&quot;本单位&quot;, &quot;集团基准&quot;]);
      opt.radar = {
        center: [&quot;50%&quot;, &quot;54%&quot;], radius: &quot;66%&quot;,

      opt.graphic = [
        {
          type: &quot;text&quot;, left: &quot;center&quot;, top: &quot;44.5%&quot;, silent: true, z: 10,

            {
              name: &quot;集团基准&quot;, value: bench,
              lineStyle: { color: C.amber, width: 1.6, type: &quot;dashed&quot; },

    /* ---------- 14 热力 + 超阈标记 ---------- */
    function buildHeatMark() {
      const months = Array.from({ length: 12 }, (_, i) =&gt; (i + 1) + &quot;月&quot;);
      const regions = [&quot;华东&quot;, &quot;华南&quot;, &quot;华北&quot;, &quot;西南&quot;, &quot;西北&quot;, &quot;东北&quot;, &quot;华中&quot;];
      const threshold = 88;
      const cells = [];
      const marks = [];
      regions.forEach((_, y) =&gt; months.forEach((_, x) =&gt; {
        const v = rnd(24, 100);
        cells.push([x, y, v]);
        if (v &gt;= threshold) marks.push({ value: [x, y, v] });
      }));
      const opt = baseOption(&quot;item&quot;);
      opt.grid = { left: 44, right: 14, top: 26, bottom: 30 };
      opt.xAxis = catAxis(months, { splitArea: { show: false }, axisLabel: { color: C.muted, fontSize: 10 } });
      opt.yAxis = [catAxis(regions, { axisLabel: { color: C.muted, fontSize: 10.5 } })];
      opt.visualMap = {
        show: false, min: 20, max: 100, calculable: false,
        inRange: { color: [&quot;rgba(22, 52, 96, 0.9)&quot;, &quot;#2b6cb8&quot;, &quot;#3fc4f0&quot;, &quot;#aef1ff&quot;] }
      };
      opt.series = [
        {
          name: &quot;负荷指数&quot;, type: &quot;heatmap&quot;,
          data: cells,
          itemStyle: { borderColor: &quot;#0a1e3c&quot;, borderWidth: 2, borderRadius: 3 },
          emphasis: { itemStyle: { shadowBlur: 8, shadowColor: &quot;rgba(63, 225, 255, 0.5)&quot; } },
          tooltip: { formatter: (p) =&gt; regions[p.value[1]] + &quot; · &quot; + months[p.value[0]] + &quot;：负荷 &lt;b&gt;&quot; + p.value[2] + &quot;&lt;/b&gt;&quot; }
        },
        {
          name: &quot;超阈标记&quot;, type: &quot;scatter&quot;, z: 6,
          data: marks,
          symbol: &quot;diamond&quot;, symbolSize: 10,
          itemStyle: {
            color: C.amber, borderColor: &quot;#fff7e0&quot;, borderWidth: 1,
            shadowBlur: 8, shadowColor: &quot;rgba(255, 200, 87, 0.7)&quot;
          },
          tooltip: {
            formatter: (p) =&gt; regions[p.value[1]] + &quot; · &quot; + months[p.value[0]] +
              &quot;：&lt;b&gt;&quot; + p.value[2] + &quot;&lt;/b&gt;（超阈值 &quot; + threshold + &quot;，需关注）&quot;
          }
        }
      ];
      return opt;
    }

    /* ---------- 15 横向柱 + 完成点 ---------- */
    function buildHbarDot() {
      const depts = [&quot;市政公司&quot;, &quot;建工集团&quot;, &quot;水务集团&quot;, &quot;交投集团&quot;, &quot;文旅集团&quot;, &quot;能源集团&quot;, &quot;数科公司&quot;, &quot;环保公司&quot;];
      const rows = depts.map((name) =&gt; ({ name, value: rnd(58, 128) })).sort((a, b) =&gt; a.value - b.value);
      const dotColor = (v) =&gt; (v &gt;= 100 ? C.green : v &gt;= 85 ? C.amber : C.red);
      const opt = baseOption(&quot;axis&quot;);
      opt.grid = { left: 74, right: 40, top: 22, bottom: 28 };
      opt.xAxis = Object.assign(valAxis(&quot;&quot;), {

        axisLabel: { color: C.muted, fontSize: 10, formatter: &quot;{value}%&quot; },
        splitLine: { lineStyle: { color: SPLIT_LINE } }
      });
      opt.yAxis = [catAxis(rows.map((r) =&gt; r.name), { axisLabel: { color: C.muted, fontSize: 11 } })];
      opt.series = [
        {
          name: &quot;年度完成率&quot;, type: &quot;bar&quot;, barWidth: 9,
          data: rows.map((r) =&gt; r.value),
          itemStyle: {
            color: {
              type: &quot;linear&quot;, x: 0, y: 0, x2: 1, y2: 0,
              colorStops: [
                { offset: 0, color: &quot;rgba(75, 125, 255, 0.35)&quot; },

          markLine: {
            silent: true, symbol: &quot;none&quot;,
            lineStyle: { color: &quot;rgba(255, 200, 87, 0.65)&quot;, type: &quot;dashed&quot;, width: 1.2 },
            label: { formatter: &quot;100% 达标线&quot;, color: &quot;#ffd79a&quot;, fontSize: 10, position: &quot;insideEndTop&quot; },
            data: [{ xAxis: 100 }]
          },
          tooltip: { valueFormatter: (v) =&gt; v + &quot;%&quot; }
        },
        {
          name: &quot;完成点&quot;, type: &quot;scatter&quot;, z: 6,
          data: rows.map((r, i) =&gt; ({
            value: [r.value, i],
            itemStyle: {
              color: dotColor(r.value),
              borderColor: &quot;#0a1e3c&quot;, borderWidth: 1.5,

          tooltip: {
            formatter: (p) =&gt; rows[p.value[1]].name + &quot;：完成 &lt;b&gt;&quot; + p.value[0] + &quot;%&lt;/b&gt;（&quot; +
              (p.value[0] &gt;= 100 ? &quot;已达标&quot; : p.value[0] &gt;= 85 ? &quot;接近达标&quot; : &quot;明显滞后&quot;) + &quot;）&quot;
          }
        }
      ];
      return opt;
    }

    /* ---------- 装配与交互 ---------- */
    const builders = [
      { id: &quot;e6cb-pareto&quot;, build: buildPareto },
      { id: &quot;e6cb-target&quot;, build: buildTarget },
      { id: &quot;e6cb-triple&quot;, build: buildTriple },

      { id: &quot;e6cb-kpiring&quot;, build: buildKpiRing },
      { id: &quot;e6cb-liquid&quot;, build: buildLiquid, requiresLiquid: true },
      { id: &quot;e6cb-gaugetrend&quot;, build: buildGaugeTrend },
      { id: &quot;e6cb-donutlegend&quot;, build: buildDonutLegend },
      { id: &quot;e6cb-bullet&quot;, build: buildBullet },
      { id: &quot;e6cb-stackshare&quot;, build: buildStackShare },
      { id: &quot;e6cb-radarkpi&quot;, build: buildRadarKpi },
      { id: &quot;e6cb-heatmark&quot;, build: buildHeatMark },
      { id: &quot;e6cb-hbardot&quot;, build: buildHbarDot }
    ];

    const charts = {};
    function renderAll() {
      builders.forEach((item) =&gt; {
        if (item.requiresLiquid &amp;&amp; !liquidOk) return;
        const node = document.getElementById(item.id);
        if (!node) return;
        if (!charts[item.id]) charts[item.id] = echarts.init(node, null, { renderer: &quot;canvas&quot; });
        try {
          charts[item.id].setOption(item.build(), { notMerge: true });
        } catch (err) {
          errorNode.textContent = &quot;方案「&quot; + item.id + &quot;」渲染异常：&quot; + err.message;
          errorNode.classList.add(&quot;is-visible&quot;);
        }
      });
    }

    const refreshButton = document.getElementById(&quot;e6cb-refresh&quot;);
    const motionButton = document.getElementById(&quot;e6cb-motion&quot;);

    refreshButton.addEventListener(&quot;click&quot;, () =&gt; {
      renderAll();
    });

    function syncMotionButton() {
      motionButton.setAttribute(&quot;aria-pressed&quot;, String(motionEnabled));
      motionButton.textContent = motionEnabled ? &quot;更新动效：开&quot; : &quot;更新动效：关&quot;;
    }

    motionButton.addEventListener(&quot;click&quot;, () =&gt; {
      motionEnabled = !motionEnabled;
      syncMotionButton();
      renderAll();
    });

    if (typeof reducedMotion.addEventListener === &quot;function&quot;) {
      reducedMotion.addEventListener(&quot;change&quot;, (event) =&gt; {
        if (event.matches) {
          motionEnabled = false;
          syncMotionButton();
          renderAll();
        }
      });
    }

    let resizeFrame = 0;
    const resizeCharts = () =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() =&gt; {
        Object.keys(charts).forEach((key) =&gt; charts[key].resize());
      });
    };
    if (&quot;ResizeObserver&quot; in window) {
      new ResizeObserver(resizeCharts).observe(document.documentElement);
    } else {
      window.addEventListener(&quot;resize&quot;, resizeCharts);
    }

    syncMotionButton();
    renderAll();
  })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
