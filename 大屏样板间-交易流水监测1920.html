<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大屏样板间 · 交易流水监测</title>
<style>
  :root {
    --tf-bg: #0a1e3c;
    --tf-panel: rgba(13, 34, 64, 0.72);
    --tf-border: rgba(86, 150, 224, 0.28);
    --tf-text: #e6f1ff;
    --tf-muted: #8fa7c8;
    --tf-teal: #2fe0c8;
    --tf-teal-soft: #a8f2e6;
    --tf-teal-deep: #128d7e;
    --tf-cyan: #3fe1ff;
    --tf-blue: #4b7dff;
    --tf-gold: #ffc857;
    --tf-red: #ff5f7a;
    --tf-mono: "Bahnschrift", "DIN Alternate", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04101f; }
  body {
    color: var(--tf-text);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }

  /* ===== 1920x1080 固定设计舞台 + 整体 scale 适配 ===== */
  .tf-stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background:
      radial-gradient(circle at 12% 0%, rgba(47, 224, 200, 0.12), transparent 44%),
      radial-gradient(circle at 88% 8%, rgba(63, 225, 255, 0.08), transparent 46%),
      radial-gradient(ellipse at 50% 118%, rgba(18, 141, 126, 0.26), transparent 56%),
      linear-gradient(rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86, 150, 224, 0.055) 1px, transparent 1px),
      var(--tf-bg);
    background-size: auto, auto, auto, 44px 44px, 44px 44px, auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 84px 120px 1fr 54px;
    gap: 14px 18px;
    padding: 12px 18px 16px;
  }

  /* ===== 顶栏：面包屑 + 渐变大标题 + 徽章 + 时钟 ===== */
  .tf-header {
    grid-column: 1 / -1;
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 0 10px;
  }
  .tf-header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(47, 224, 200, 0.6) 16%, rgba(63, 225, 255, 0.85) 50%, rgba(47, 224, 200, 0.6) 84%, transparent);
    box-shadow: 0 0 14px rgba(47, 224, 200, 0.45);
  }
  .tf-head-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tf-crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0.1em; color: var(--tf-muted); }
  .tf-crumb b { font-weight: 400; color: #6fb9e8; }
  .tf-crumb i { font-style: normal; color: rgba(143, 167, 200, 0.55); }
  .tf-crumb em { font-style: normal; color: #d7e8ff; }
  .tf-head-title-row { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .tf-head-title {
    font-size: 30px; font-weight: 700; letter-spacing: 0.08em;
    background: linear-gradient(180deg, #ffffff 26%, var(--tf-teal-soft) 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(47, 224, 200, 0.35));
  }
  .tf-head-badges { display: flex; align-items: center; gap: 8px; }
  .tf-head-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 12px; border-radius: 999px;
    font-size: 12px; letter-spacing: 0.12em; color: var(--tf-teal-soft);
    border: 1px solid rgba(47, 224, 200, 0.5); background: rgba(18, 141, 126, 0.2);
    box-shadow: inset 0 0 10px rgba(47, 224, 200, 0.12);
  }
  .tf-head-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--tf-teal); box-shadow: 0 0 8px var(--tf-teal); animation: tfDot 1.6s ease-in-out infinite; }
  .tf-head-badge.is-plain { color: #cfe6ff; border-color: rgba(86, 150, 224, 0.45); background: rgba(20, 48, 88, 0.5); box-shadow: none; }
  .tf-clock { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; font-variant-numeric: tabular-nums; padding-left: 24px; border-left: 1px solid rgba(86, 150, 224, 0.25); }
  .tf-clock-time { font: 700 26px/1 var(--tf-mono); color: #f2f9ff; letter-spacing: 0.04em; text-shadow: 0 0 12px rgba(47, 224, 200, 0.4); }
  .tf-clock-date { font-size: 12px; color: var(--tf-muted); letter-spacing: 0.08em; }

  /* ===== KPI 芯片带：6 枚 ===== */
  .tf-kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; min-height: 0; }
  .tf-kpi {
    position: relative; overflow: hidden;
    border: 1px solid var(--tf-border); border-radius: 12px; background: var(--tf-panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  }
  .tf-kpi::before {
    content: ""; position: absolute; left: 0; top: 0; width: 42px; height: 3px;
    background: linear-gradient(90deg, var(--tf-teal), transparent);
  }
  .tf-kpi-label { font-size: 13px; letter-spacing: 0.12em; color: var(--tf-muted); }
  .tf-kpi-num { display: flex; align-items: baseline; gap: 5px; font-variant-numeric: tabular-nums; }
  .tf-kpi-val { font: 700 28px/1 var(--tf-mono); color: #f4faff; letter-spacing: 0.02em; text-shadow: 0 0 12px rgba(47, 224, 200, 0.45); }
  .tf-kpi-unit { font-size: 12px; color: #6fd8c8; }
  .tf-kpi-sub { font-size: 11.5px; letter-spacing: 0.04em; color: #5f88b8; font-variant-numeric: tabular-nums; }
  .tf-kpi.is-alert::before { background: linear-gradient(90deg, var(--tf-red), transparent); }
  .tf-kpi.is-alert .tf-kpi-val { text-shadow: 0 0 12px rgba(255, 95, 122, 0.5); }
  .tf-kpi.is-pulse .tf-kpi-val { animation: tfKpiPulse 0.6s ease; }
  @keyframes tfKpiPulse { 30% { transform: scale(1.12); color: var(--tf-teal-soft); } }

  /* ===== 面板通用 ===== */
  .tf-panel {
    position: relative; min-height: 0; overflow: hidden;
    border: 1px solid var(--tf-border); border-radius: 12px; background: var(--tf-panel);
    display: flex; flex-direction: column;
  }
  .tf-panel-head {
    position: relative; flex: none;
    display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 30px 0 14px;
    background: linear-gradient(90deg, rgba(47, 224, 200, 0.22), rgba(63, 225, 255, 0.05) 62%, transparent);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%);
  }
  .tf-panel-head i { flex: none; width: 5px; height: 16px; background: var(--tf-teal); box-shadow: 0 0 8px var(--tf-teal); transform: skewX(-12deg); }
  .tf-panel-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; color: #f0f8ff; white-space: nowrap; }
  .tf-panel-head .tf-panel-en { font-size: 10px; letter-spacing: 0.2em; color: #5f88b8; align-self: flex-end; padding-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tf-panel-head .tf-panel-scope { margin-left: auto; font-size: 12px; color: var(--tf-teal-soft); white-space: nowrap; padding-right: 2px; font-variant-numeric: tabular-nums; }

  /* ===== CSS grid 模拟表格 ===== */
  .tf-thead, .tf-row { display: grid; align-items: center; column-gap: 10px; padding: 0 14px; }
  .tf-grid-corp { grid-template-columns: 66px 1.22fr 1.22fr 100px 92px 62px; }
  .tf-grid-retail { grid-template-columns: 66px 132px 1fr 104px 88px 62px; }
  .tf-thead {
    flex: none; height: 30px;
    font-size: 12px; letter-spacing: 0.1em; color: #6fb9e8;
    border-bottom: 1px solid rgba(86, 150, 224, 0.25);
    background: rgba(20, 48, 88, 0.35);
  }
  .tf-tbody { flex: 1; min-height: 0; margin: 0; padding: 0; list-style: none; overflow: hidden; }
  .tf-row { height: 35px; font-size: 13px; color: #d5e6fa; animation: tfRowIn 0.45s ease; }
  .tf-tbody li:nth-child(even) { background: rgba(24, 56, 100, 0.28); }
  @keyframes tfRowIn { from { opacity: 0; transform: translateY(-14px); } }
  .tf-td-time { font-family: var(--tf-mono); font-variant-numeric: tabular-nums; color: var(--tf-muted); font-size: 12.5px; }
  .tf-td-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tf-td-amt { text-align: right; font: 700 13.5px/1 var(--tf-mono); font-variant-numeric: tabular-nums; color: var(--tf-teal-soft); }
  .tf-td-amt.is-big { color: var(--tf-gold); text-shadow: 0 0 8px rgba(255, 200, 87, 0.35); }

  .tf-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 52px; padding: 2px 8px; border-radius: 999px;
    font-style: normal; font-size: 11.5px; letter-spacing: 0.06em; white-space: nowrap;
  }
  .tf-badge.is-ch { color: #b9d2f2; border: 1px solid rgba(94, 168, 255, 0.35); background: rgba(24, 56, 100, 0.45); }
  .tf-badge.is-ok { color: #7df0dc; border: 1px solid rgba(47, 224, 200, 0.5); background: rgba(18, 141, 126, 0.22); }
  .tf-badge.is-warn { color: #ffd98a; border: 1px solid rgba(255, 200, 87, 0.5); background: rgba(122, 90, 20, 0.28); }
  .tf-badge.is-bad { color: #ff9fb0; border: 1px solid rgba(255, 95, 122, 0.55); background: rgba(96, 26, 38, 0.4); }

  /* 拦截行整行红光 flash */
  .tf-row.is-blockrow {
    background: rgba(255, 95, 122, 0.1) !important;
    animation: tfRowIn 0.45s ease, tfBlockFlash 1.1s ease 3;
  }
  @keyframes tfBlockFlash {
    50% { background: rgba(255, 95, 122, 0.32); box-shadow: inset 0 0 18px rgba(255, 95, 122, 0.45); }
  }

  /* ===== 底部跑马灯 ===== */
  .tf-marquee {
    grid-column: 1 / -1; display: flex; align-items: stretch; overflow: hidden;
    border: 1px solid var(--tf-border); border-radius: 12px; background: var(--tf-panel);
  }
  .tf-marquee-tag {
    flex: none; display: flex; align-items: center; gap: 9px; padding: 0 22px 0 18px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.2em; color: #04241f;
    background: linear-gradient(120deg, var(--tf-teal), #1ba393 85%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
  }
  .tf-marquee-tag i { width: 8px; height: 8px; border-radius: 50%; background: #04241f; animation: tfDot 1.6s ease-in-out infinite; }
  @keyframes tfDot { 50% { opacity: 0.3; } }
  .tf-marquee-view { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
  .tf-marquee-track {
    display: inline-flex; align-items: center; white-space: nowrap; will-change: transform;
    animation: tfMarquee 46s linear infinite;
    font-size: 15px; letter-spacing: 0.06em; color: #dceaff;
    font-variant-numeric: tabular-nums;
  }
  .tf-marquee-track b { color: var(--tf-teal-soft); font-weight: 700; }
  .tf-marquee-track em { font-style: normal; margin: 0 26px; color: rgba(47, 224, 200, 0.55); }
  @keyframes tfMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* mockflag:begin —— 由 tools/inject_mock_flag.py 注入，勿手改 */
  .tf-mockflag {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 9000;
    padding: 3px 20px 4px; border-radius: 0 0 10px 10px; pointer-events: none;
    background: linear-gradient(180deg, #f2ab42, #de8524); color: #24130a;
    font-size: 13px; line-height: 1.15; font-weight: 700;
    letter-spacing: 0.3em; text-indent: 0.3em; white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }
  /* mockflag:end */
</style>
</head>
<body>
  <div class="tf-stage" id="tf-stage">
    <!-- mockflag:begin --><div class="tf-mockflag" role="note" aria-label="本页为模拟数据">模拟数据</div><!-- mockflag:end -->
    <!-- 顶栏 -->
    <header class="tf-header">
      <div class="tf-head-left">
        <div class="tf-crumb"><b>运营监控</b><i>›</i><em>交易流水</em></div>
        <div class="tf-head-title-row">
          <div class="tf-head-title">交易流水监测</div>
          <div class="tf-head-badges">
            <span class="tf-head-badge"><i></i>T+0 实时</span>
            <span class="tf-head-badge is-plain">反欺诈引擎 在线</span>
            <span class="tf-head-badge is-plain">口径 全渠道</span>
          </div>
        </div>
      </div>
      <div class="tf-clock" aria-label="实时时钟">
        <span class="tf-clock-time" id="tf-clock-time">--:--:--</span>
        <span class="tf-clock-date" id="tf-clock-date">----年--月--日 星期-</span>
      </div>
    </header>

    <!-- KPI 芯片带（数值全部由流水插入驱动，见脚本 syncKpis） -->
    <section class="tf-kpis" id="tf-kpis" aria-label="今日交易核心指标"></section>

    <!-- 左：对公大额交易 -->
    <section class="tf-panel" aria-label="对公大额交易流水表">
      <header class="tf-panel-head"><i></i><h2>对公大额交易</h2><span class="tf-panel-en">CORPORATE LARGE TRANSFERS</span><span class="tf-panel-scope">口径 单笔 ≥ 50 万元</span></header>
      <div class="tf-thead tf-grid-corp">
        <span>时间</span><span>付款单位</span><span>收款单位</span><span style="text-align:right">金额(万)</span><span>渠道</span><span>状态</span>
      </div>
      <ul class="tf-tbody" id="tf-corp-body"></ul>
    </section>

    <!-- 右：对私实时流水 -->
    <section class="tf-panel" aria-label="对私实时流水表">
      <header class="tf-panel-head"><i></i><h2>对私实时流水</h2><span class="tf-panel-en">RETAIL REAL-TIME FLOW</span><span class="tf-panel-scope">口径 全渠道抽样</span></header>
      <div class="tf-thead tf-grid-retail">
        <span>时间</span><span>卡号</span><span>商户 / 用途</span><span style="text-align:right">金额(元)</span><span>渠道</span><span>风控</span>
      </div>
      <ul class="tf-tbody" id="tf-retail-body"></ul>
    </section>

    <!-- 底部跑马灯 -->
    <section class="tf-marquee" aria-label="清算与风控播报">
      <div class="tf-marquee-tag"><i></i>清算播报</div>
      <div class="tf-marquee-view"><div class="tf-marquee-track" id="tf-marquee-track"></div></div>
    </section>
  </div>

<script>
(() => {
  "use strict";

  /* ===== 1. 舞台等比缩放（1920x1080 设计稿 → 任意窗口，居中留黑边） ===== */
  const stage = document.getElementById("tf-stage");
  function fitStage() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fitStage);
  fitStage();

  /* ===== 2. 工具与色板（JS 镜像 CSS 变量） ===== */
  const $ = (id) => document.getElementById(id);
  const C = {
    text: "#e6f1ff", muted: "#8fa7c8",
    teal: "#2fe0c8", tealSoft: "#a8f2e6", tealDeep: "#128d7e",
    cyan: "#3fe1ff", blue: "#4b7dff", gold: "#ffc857", red: "#ff5f7a"
  };
  const rnd = (min, max) => Math.round(min + Math.random() * (max - min));
  const rndf = (min, max) => min + Math.random() * (max - min);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const pickW = (items) => { /* items: [{v, w}] 权重抽取 */
    let sum = 0;
    items.forEach((x) => { sum += x.w; });
    let r = Math.random() * sum;
    for (const x of items) { r -= x.w; if (r < 0) return x.v; }
    return items[items.length - 1].v;
  };
  const logRnd = (min, max) => Math.exp(rndf(Math.log(min), Math.log(max))); /* 对数均匀，小额多大额少 */
  const pad = (n) => (n < 10 ? "0" + n : String(n));
  const fmtDec = (n, dec) => {
    const parts = n.toFixed(dec).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.join(".");
  };
  const fmtTime = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());

  /* ===== 3. 顶部走秒时钟 ===== */
  const WEEKS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  function tickClock() {
    const d = new Date();
    $("tf-clock-time").textContent = fmtTime(d);
    $("tf-clock-date").textContent =
      d.getFullYear() + "年" + pad(d.getMonth() + 1) + "月" + pad(d.getDate()) + "日 " + WEEKS[d.getDay()];
  }
  tickClock();
  setInterval(tickClock, 500);

  /* ===== 4. 勾稽状态（单一事实来源：仅插入函数与 TPS 采样可写） =====
     今日笔数 / 今日金额 / 对公占比 / 成功率 / 拦截笔数 全部由 S 现算，
     内联初值 = 开屏前已发生的存量，此后每插一行流水在插入函数内累加。 */
  const S = {
    count: 4182647,            /* 今日总笔数 */
    success: 4167023,          /* 成功笔数（成功率 = success / count） */
    intercept: 1207,           /* 拦截笔数（仅右表插出「拦截」行时 +1） */
    amountYuan: 1.0724e11,     /* 今日金额（元），拦截/退回不计入 */
    corpAmountYuan: 7.3248e10, /* 其中对公金额（元），对公占比按金额计 */
    curTps: 3860,
    peakTps: 4862
  };

  /* ===== 5. KPI 芯片：DOM 滚动翻牌（cur 向 target 缓动） ===== */
  const KPI_DEFS = [
    { key: "count",   label: "今日笔数",    unit: "笔",  dec: 0, sub: "全渠道 · 实时累计" },
    { key: "amount",  label: "今日金额",    unit: "亿",  dec: 2, sub: "含对公 / 对私" },
    { key: "corpPct", label: "对公占比",    unit: "%",   dec: 1, sub: "按金额计" },
    { key: "sucPct",  label: "成功率",      unit: "%",   dec: 2, sub: "成功笔数 / 总笔数" },
    { key: "block",   label: "拦截笔数",    unit: "笔",  dec: 0, sub: "反欺诈实时拦截", alert: true },
    { key: "tps",     label: "峰值 TPS",    unit: "",    dec: 0, sub: "当前 -- TPS" }
  ];
  const kpisWrap = $("tf-kpis");
  KPI_DEFS.forEach((k) => {
    const card = document.createElement("article");
    card.className = "tf-kpi" + (k.alert ? " is-alert" : "");
    card.innerHTML =
      '<div class="tf-kpi-label">' + k.label + '</div>' +
      '<div class="tf-kpi-num"><span class="tf-kpi-val">0</span><span class="tf-kpi-unit">' + k.unit + '</span></div>' +
      '<div class="tf-kpi-sub">' + k.sub + '</div>';
    kpisWrap.appendChild(card);
    k.card = card;
    k.node = card.querySelector(".tf-kpi-val");
    k.subNode = card.querySelector(".tf-kpi-sub");
    k.cur = 0;
    k.target = 0;
  });
  function kpiTargets() {
    return {
      count: S.count,
      amount: S.amountYuan / 1e8,
      corpPct: (S.corpAmountYuan / S.amountYuan) * 100,
      sucPct: (S.success / S.count) * 100,
      block: S.intercept,
      tps: S.peakTps
    };
  }
  function syncKpis(pulseKeys) {
    const t = kpiTargets();
    KPI_DEFS.forEach((k) => {
      k.target = t[k.key];
      if (pulseKeys && pulseKeys.indexOf(k.key) >= 0) {
        k.card.classList.remove("is-pulse");
        void k.card.offsetWidth;
        k.card.classList.add("is-pulse");
      }
    });
  }
  setInterval(() => {
    KPI_DEFS.forEach((k) => {
      const diff = k.target - k.cur;
      if (Math.abs(diff) < Math.pow(10, -k.dec) / 2) { k.cur = k.target; } else { k.cur += diff * 0.16; }
      k.node.textContent = fmtDec(k.cur, k.dec);
    });
  }, 80);

  /* ===== 6. 内联字典：单位名池 / 商户池 / 渠道权重 / 金额区间 ===== */
  const CITIES = ["苏州", "无锡", "南京", "杭州", "上海", "常州", "宁波", "合肥", "南通", "嘉兴"];
  const INDUSTRIES = ["科技", "精密制造", "新能源", "生物医药", "供应链", "建设工程", "电子商务", "智能装备", "新材料", "物流"];
  const CORP_SUFFIX = [{ v: "有限**", w: 7 }, { v: "股份**", w: 2 }, { v: "集团**", w: 1 }];
  const CORP_CHANNELS = [{ v: "网银", w: 5 }, { v: "银企直连", w: 3.5 }, { v: "柜面", w: 1.5 }];
  const CORP_STATUS = [{ v: "成功", w: 86 }, { v: "在途", w: 10 }, { v: "退回", w: 4 }];
  const CORP_AMT = { min: 5e5, max: 2e8 };          /* 元：50 万 – 2 亿 */

  const CARD_BINS = ["6222", "6217", "6228", "6214"];
  const MERCHANTS = [
    "京东商城 · 网购", "美团 · 外卖餐饮", "滴滴出行 · 打车", "某某超市 · 日常消费",
    "话费充值 · 缴费", "国网电费 · 缴费", "转账 · 亲友往来", "某某加油站 · 加油",
    "铁路12306 · 出行", "某某药房 · 医药", "物业费 · 缴费", "某某影院 · 娱乐",
    "房租 · 转账", "某某健身 · 会员", "航旅纵横 · 机票", "某某教育 · 学费"
  ];
  const RETAIL_CHANNELS = [{ v: "手机银行", w: 4 }, { v: "快捷支付", w: 3 }, { v: "POS", w: 2 }, { v: "ATM", w: 1 }];
  const RETAIL_RISK = [{ v: "正常", w: 84 }, { v: "关注", w: 10 }, { v: "拦截", w: 6 }];
  const RETAIL_AMT = { min: 10, max: 5e4 };          /* 元：10 – 5 万 */

  /* ===== 7. 流水工厂 ===== */
  function corpName() {
    return pick(CITIES) + "某某" + pick(INDUSTRIES) + pickW(CORP_SUFFIX);
  }
  function makeCorp() {
    let payee = corpName();
    const payer = corpName();
    while (payee === payer) { payee = corpName(); }
    return {
      payer, payee,
      amt: logRnd(CORP_AMT.min, CORP_AMT.max),      /* 元 */
      channel: pickW(CORP_CHANNELS),
      status: pickW(CORP_STATUS)
    };
  }
  function makeRetail() {
    return {
      card: pick(CARD_BINS) + "****" + String(rnd(1000, 9999)),
      merchant: pick(MERCHANTS),
      amt: logRnd(RETAIL_AMT.min, RETAIL_AMT.max),  /* 元 */
      channel: pickW(RETAIL_CHANNELS),
      risk: pickW(RETAIL_RISK)
    };
  }

  /* ===== 8. 表格插入（新行顶插滑入，超 18 行底部淘汰；KPI 累加只在这里发生） ===== */
  const MAX_ROWS = 18;
  const corpBody = $("tf-corp-body");
  const retailBody = $("tf-retail-body");
  function prependRow(body, li) {
    body.insertBefore(li, body.firstChild);
    while (body.children.length > MAX_ROWS) { body.removeChild(body.lastChild); }
  }
  const badge = (cls, text) => '<i class="tf-badge ' + cls + '">' + text + '</i>';

  function insertCorp(when) {
    const r = makeCorp();
    /* —— 勾稽累加（对公） —— */
    S.count += 1;
    if (r.status === "成功") { S.success += 1; }
    if (r.status !== "退回") { S.amountYuan += r.amt; S.corpAmountYuan += r.amt; }
    syncKpis(["count", "amount", "corpPct", "sucPct"]);
    /* —— 渲染 —— */
    const wan = r.amt / 1e4;
    const stCls = r.status === "成功" ? "is-ok" : (r.status === "在途" ? "is-warn" : "is-bad");
    const li = document.createElement("li");
    li.className = "tf-row tf-grid-corp";
    li.innerHTML =
      '<span class="tf-td-time">' + fmtTime(when) + '</span>' +
      '<span class="tf-td-name">' + r.payer + '</span>' +
      '<span class="tf-td-name">' + r.payee + '</span>' +
      '<span class="tf-td-amt' + (r.amt >= 5e7 ? " is-big" : "") + '">' + fmtDec(wan, 1) + '</span>' +
      '<span>' + badge("is-ch", r.channel) + '</span>' +
      '<span>' + badge(stCls, r.status) + '</span>';
    prependRow(corpBody, li);
  }

  function insertRetail(when) {
    const r = makeRetail();
    const blocked = r.risk === "拦截";
    /* —— 勾稽累加（对私）：拦截行驱动拦截笔数，金额不入账 —— */
    S.count += 1;
    if (blocked) { S.intercept += 1; } else { S.success += 1; S.amountYuan += r.amt; }
    syncKpis(blocked ? ["count", "sucPct", "block"] : ["count", "amount", "corpPct", "sucPct"]);
    /* —— 渲染 —— */
    const rkCls = r.risk === "正常" ? "is-ok" : (r.risk === "关注" ? "is-warn" : "is-bad");
    const li = document.createElement("li");
    li.className = "tf-row tf-grid-retail" + (blocked ? " is-blockrow" : "");
    li.innerHTML =
      '<span class="tf-td-time">' + fmtTime(when) + '</span>' +
      '<span class="tf-td-name" style="font-family:var(--tf-mono)">' + r.card + '</span>' +
      '<span class="tf-td-name">' + r.merchant + '</span>' +
      '<span class="tf-td-amt">' + fmtDec(r.amt, 2) + '</span>' +
      '<span>' + badge("is-ch", r.channel) + '</span>' +
      '<span>' + badge(rkCls, r.risk) + '</span>';
    prependRow(retailBody, li);
  }

  /* ===== 9. 开屏预填（走同一插入函数，时间回拨造出历史行） ===== */
  const now = Date.now();
  for (let i = 11; i >= 1; i--) { insertCorp(new Date(now - i * 4000)); }
  for (let i = 15; i >= 1; i--) { insertRetail(new Date(now - i * 2200)); }

  /* ===== 10. 实时驱动：对公 4s / 对私 2.2s（高频体现零售），kiosk 不 teardown ===== */
  setInterval(() => insertCorp(new Date()), 4000);
  setInterval(() => insertRetail(new Date()), 2200);

  /* ===== 11. TPS 采样：当前值抖动，峰值只升不降 ===== */
  function sampleTps() {
    S.curTps = Math.min(5200, Math.max(2800, S.curTps + rnd(-240, 300)));
    const tpsKpi = KPI_DEFS[5];
    if (S.curTps > S.peakTps) {
      S.peakTps = S.curTps;
      syncKpis(["tps"]);
    }
    tpsKpi.subNode.textContent = "当前 " + fmtDec(S.curTps, 0) + " TPS";
  }
  sampleTps();
  setInterval(sampleTps, 3000);

  /* ===== 12. 跑马灯：清算 / 风控播报 ===== */
  const NEWS = [
    "二代支付系统运行正常，大额实时支付通道平均延迟 <b>0.8s</b>",
    "网联通道负载率 <b>42%</b>，超级网银通道负载率 <b>37%</b>，均处安全水位",
    "反欺诈模型 v5.2 今日命中可疑交易 <b>1,342 笔</b>，拦截涉险资金 <b>2,360 万元</b>",
    "CIPS 跨境清算通道正常，今日发送 <b>386 笔</b>、接收 <b>412 笔</b>",
    "16:00 批量代发工资 <b>28.6 万笔</b> 将于 30 分钟后进入清算队列",
    "同城票交清算完成率 <b>99.98%</b>，退回率环比下降 <b>0.02pct</b>",
    "夜间大额转账验证策略已启用，21:00 后单笔 5 万元以上需二次核验"
  ];
  const track = $("tf-marquee-track");
  const newsHtml = NEWS.map((n) => "<span>" + n + "</span><em>◆</em>").join("");
  track.innerHTML = newsHtml + newsHtml;

  /* ===== 13. 开屏：KPI 从 0 滚动到内联初值 ===== */
  syncKpis();
})();
</script>
</body>
</html>
