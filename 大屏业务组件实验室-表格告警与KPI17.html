    const esc = (s) =&gt; String(s == null ? &quot;&quot; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (ch) =&gt; ({ &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot;, &quot;&#x27;&quot;: &quot;&amp;#39;&quot; }[ch]));
    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);

    /* 全页唯一的受控调度器：所有滚动 / 推送订阅它；隐藏、减少动效时暂停 */
    const Scheduler = (() =&gt; {
      const subs = new Set();
      const timer = setInterval(() =&gt; {
        if (document.hidden || reducedMotion.matches) return;
        subs.forEach((fn) =&gt; { try { fn(); } catch (e) { /* 单个订阅异常不影响其它 */ } });
      }, 1000);
      return {
        subscribe(fn) { subs.add(fn); return () =&gt; subs.delete(fn); },
        dispose() { clearInterval(timer); subs.clear(); }
      };
    })();

    /* ================= 主题适配器（读取 LAB_THEMES → CSS 变量） ================= */

    const VC_DEFAULTS = { bg: &quot;#0a1e3c&quot;, primary: &quot;#3fe1ff&quot;, accent: &quot;#4b7dff&quot;, text: &quot;#e6f1ff&quot;, muted: &quot;#8fa7c8&quot; };
    const THEMES = (typeof LAB_THEMES !== &quot;undefined&quot; &amp;&amp; LAB_THEMES) || [];
    let activeThemeId = &quot;&quot;;
    function themeVars(theme) {
      if (!theme) return Object.assign({}, VC_DEFAULTS);
      return {
        bg: theme.bg || VC_DEFAULTS.bg,
        primary: (theme.colors &amp;&amp; theme.colors[0]) || VC_DEFAULTS.primary,
        accent: theme.accent || (theme.colors &amp;&amp; theme.colors[1]) || VC_DEFAULTS.accent,
        text: theme.text || VC_DEFAULTS.text,
        muted: theme.muted || VC_DEFAULTS.muted
      };
    }
    function applyTheme(id) {
      activeThemeId = id;
      const theme = THEMES.find((t) =&gt; t.id === id) || null;
      const v = themeVars(theme);
      const root = document.documentElement;
      root.style.setProperty(&quot;--vc-bg&quot;, v.bg);
      root.style.setProperty(&quot;--vc-primary&quot;, v.primary);
      root.style.setProperty(&quot;--vc-accent&quot;, v.accent);
      root.style.setProperty(&quot;--vc-text&quot;, v.text);
      root.style.setProperty(&quot;--vc-muted&quot;, v.muted);
    }
    function currentVarsBlock() {
      const theme = THEMES.find((t) =&gt; t.id === activeThemeId) || null;
      const v = themeVars(theme);
      return &quot;:root {\n  --vc-bg: &quot; + v.bg + &quot;;\n  --vc-primary: &quot; + v.primary + &quot;;\n  --vc-accent: &quot; + v.accent + &quot;;\n  --vc-text: &quot; + v.text + &quot;;\n  --vc-muted: &quot; + v.muted + &quot;;\n  --vc-ok: #38e6b0;\n  --vc-warn: #ffc857;\n  --vc-crit: #ff6680;\n}&quot;;
    }
    (function initThemeWidget() {
      const sel = document.getElementById(&quot;e6bc-theme&quot;);
      const def = document.createElement(&quot;option&quot;);
      def.value = &quot;&quot;; def.textContent = &quot;默认（原始配色）&quot;;
      sel.appendChild(def);
      const groups = {};
      THEMES.forEach((t) =&gt; {
        if (!groups[t.group]) {
          groups[t.group] = document.createElement(&quot;optgroup&quot;);
          groups[t.group].label = t.group === &quot;行业&quot; ? &quot;行业主题（12 套）&quot; : &quot;风格皮肤（21 套）&quot;;
          sel.appendChild(groups[t.group]);
        }
        const opt = document.createElement(&quot;option&quot;);
        opt.value = t.id;
        opt.textContent = t.id + &quot; · &quot; + t.name + &quot; · &quot; + t.use;
        groups[t.group].appendChild(opt);
      });
      sel.addEventListener(&quot;change&quot;, () =&gt; applyTheme(sel.value));
      document.getElementById(&quot;e6bc-theme-reset&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        sel.value = &quot;&quot;;
        applyTheme(&quot;&quot;);
      });
    })();

    /* ================= 组件库 =================
       每个组件 { title, tag, key, note, html, css, factory, sample, demo }
       - factory: 源码字符串，定义 createXxx(container, data) -&gt; { update, resize, dispose }
       - 复制片段 = 当前主题变量 + css + html + factory + 样例挂载，粘贴到空白页可独立运行
       - 组件内部只用 CSS 变量取色；文本一律 textContent / 转义写入 */

    const COMPONENTS = [];

    /* ---------- B01 总量同比卡 ---------- */
    COMPONENTS.push({

      css: [
        &quot;.vc-kpi { border: 1px solid rgba(128, 160, 200, 0.3); border-radius: 12px; padding: 14px 16px; color: var(--vc-text, #e6f1ff); background: rgba(13, 34, 64, 0.5); font-family: inherit; }&quot;,
        &quot;.vc-kpi-name { font-size: 13px; color: var(--vc-muted, #8fa7c8); }&quot;,
        &quot;.vc-kpi-value { font-size: 30px; font-weight: 700; margin: 4px 0; color: var(--vc-text, #e6f1ff); }&quot;,
        &quot;.vc-kpi-value small { font-size: 14px; font-weight: 400; color: var(--vc-muted, #8fa7c8); margin-left: 4px; }&quot;,
        &quot;.vc-kpi-deltas { display: flex; gap: 14px; font-size: 12px; }&quot;,
        &quot;.vc-kpi-up { color: var(--vc-ok, #38e6b0); }&quot;,
        &quot;.vc-kpi-down { color: var(--vc-crit, #ff6680); }&quot;,
        &quot;.vc-kpi-flat { color: var(--vc-muted, #8fa7c8); }&quot;,
        &quot;.vc-kpi-meta { margin-top: 8px; font-size: 11px; color: var(--vc-muted, #8fa7c8); }&quot;,
        &quot;.vc-kpi-state { padding: 18px 0; font-size: 13px; color: var(--vc-muted, #8fa7c8); }&quot;,
        &quot;.vc-kpi-state.is-error { color: var(--vc-crit, #ff6680); }&quot;,
        &quot;.vc-kpi-stale { color: var(--vc-warn, #ffc857); }&quot;
      ].join(&quot;\n&quot;),
      html: &#x27;&lt;div class=&quot;vc-kpi&quot; data-vc=&quot;b01&quot;&gt;&lt;/div&gt;&#x27;,
      factory: `function createB01(container, data, opts) {
  opts = opts || {};
  var upIsGood = opts.upIsGood !== false;
  function fmtDelta(label, v) {
    if (v === null || v === undefined) return &#x27;&lt;span class=&quot;vc-kpi-flat&quot;&gt;&#x27; + label + &#x27; 不可计算（基期为 0 或缺失）&lt;/span&gt;&#x27;;
    var cls = v &gt; 0 ? (upIsGood ? &quot;vc-kpi-up&quot; : &quot;vc-kpi-down&quot;) : v &lt; 0 ? (upIsGood ? &quot;vc-kpi-down&quot; : &quot;vc-kpi-up&quot;) : &quot;vc-kpi-flat&quot;;
    var arrow = v &gt; 0 ? &quot;▲&quot; : v &lt; 0 ? &quot;▼&quot; : &quot;—&quot;;
    return &#x27;&lt;span class=&quot;&#x27; + cls + &#x27;&quot;&gt;&#x27; + label + &quot; &quot; + arrow + &quot; &quot; + Math.abs(Math.round(v * 1000) / 10) + &quot;%&lt;/span&gt;&quot;;
  }
  function esc(s) { return String(s == null ? &quot;&quot; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot;, &quot;&#x27;&quot;: &quot;&amp;#39;&quot; }[c]; }); }
  function render(d) {
    if (!d || d.state === &quot;loading&quot;) { container.innerHTML = &#x27;&lt;div class=&quot;vc-kpi-state&quot;&gt;加载中…&lt;/div&gt;&#x27;; return; }
    if (d.state === &quot;empty&quot;) { container.innerHTML = &#x27;&lt;div class=&quot;vc-kpi-state&quot;&gt;暂无数据（与数值 0 不同）&lt;/div&gt;&#x27;; return; }
    if (d.state === &quot;error&quot;) { container.innerHTML = &#x27;&lt;div class=&quot;vc-kpi-state is-error&quot; role=&quot;alert&quot;&gt;数据加载失败：&#x27; + esc(d.message || &quot;未知错误&quot;) + &quot;&lt;/div&gt;&quot;; return; }
    var p = d.payload || {};
    var valueText = (p.value === null || p.value === undefined) ? &quot;—&quot; : Number(p.value).toLocaleString(&quot;zh-CN&quot;);
    container.innerHTML =
      &#x27;&lt;div class=&quot;vc-kpi-name&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;vc-kpi-value&quot;&gt;&#x27; + valueText + &quot;&lt;small&gt;&quot; + esc(p.unit || &quot;&quot;) + &quot;&lt;/small&gt;&lt;/div&gt;&quot; +
      &#x27;&lt;div class=&quot;vc-kpi-deltas&quot;&gt;&#x27; + fmtDelta(&quot;同比&quot;, p.yoy) + fmtDelta(&quot;环比&quot;, p.mom) + &quot;&lt;/div&gt;&quot; +
      &#x27;&lt;div class=&quot;vc-kpi-meta&quot;&gt;口径：&#x27; + esc(p.caliber || &quot;未提供&quot;) + &quot; · 更新 &quot; + esc(p.updatedAt || &quot;未知&quot;) +
      (d.state === &quot;stale&quot; ? &#x27; · &lt;span class=&quot;vc-kpi-stale&quot;&gt;数据过期&lt;/span&gt;&#x27; : &quot;&quot;) + &quot;&lt;/div&gt;&quot;;
    container.querySelector(&quot;.vc-kpi-name&quot;).textContent = p.name || &quot;&quot;;
  }
  render(data);
  return { update: render, resize: function () {}, dispose: function () { container.innerHTML = &quot;&quot;; } };
}`,

        &quot;var __vcApi = &quot; + factoryNameOf(c) + &#x27;(document.querySelector(\&#x27;[data-vc=&quot;&#x27; + c.code + &#x27;&quot;]\&#x27;), __vcData, {});&#x27;,
        &quot;// 契约：__vcApi.update(data) / __vcApi.resize() / __vcApi.dispose()；&quot;,
        &quot;// 事件：组件容器上以 CustomEvent 发出 select / filter-change / sort-change / drilldown / alert-action。&quot;,
        &quot;&lt;/scr&quot; + &quot;ipt&gt;&quot;
      ].join(&quot;\n&quot;);
    }

    const modal = document.getElementById(&quot;e6bc-modal&quot;);
    const modalText = document.getElementById(&quot;e6bc-modal-text&quot;);
    const modalTitle = document.getElementById(&quot;e6bc-modal-title&quot;);
    document.getElementById(&quot;e6bc-modal-close&quot;).addEventListener(&quot;click&quot;, () =&gt; modal.classList.remove(&quot;is-open&quot;));
    document.getElementById(&quot;e6bc-modal-copy&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      modalText.select();
      try { document.execCommand(&quot;copy&quot;); } catch (e) { /* 手动复制兜底 */ }
    });
    function copySnippet(c) {
      const text = buildSnippet(c);
      const fallback = () =&gt; {
        modalTitle.textContent = c.title + &quot; · 自包含片段（手动复制）&quot;;
        modalText.value = text;
        modal.classList.add(&quot;is-open&quot;);
        modalText.select();
      };
      if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(fallback);
      } else fallback();
    }

    const STATE_BUTTONS = [
      [&quot;ok&quot;, &quot;正常&quot;], [&quot;zero&quot;, &quot;真实 0&quot;], [&quot;loading&quot;, &quot;加载中&quot;], [&quot;empty&quot;, &quot;空数据&quot;], [&quot;error&quot;, &quot;失败&quot;], [&quot;stale&quot;, &quot;过期&quot;]
    ];
    function stateData(c, key) {
      if (key === &quot;ok&quot;) return c.sample;
      if (c.states &amp;&amp; c.states[key]) return c.states[key];
      if (key === &quot;loading&quot;) return { state: &quot;loading&quot; };
      if (key === &quot;empty&quot;) return { state: &quot;empty&quot;, payload: c.code === &quot;b10&quot; ? { matrix: {} } : null };
      if (key === &quot;error&quot;) return { state: &quot;error&quot;, message: &quot;上游接口 504（演示）&quot; };
      if (key === &quot;stale&quot;) return Object.assign({}, c.sample, { state: &quot;stale&quot; });
      if (key === &quot;zero&quot;) return c.sample;
      return c.sample;
    }

    COMPONENTS.forEach((c, idx) =&gt; {
      const panel = document.createElement(&quot;section&quot;);
      panel.className = &quot;e6bc-panel&quot;;
      const header = document.createElement(&quot;header&quot;);
      header.className = &quot;e6bc-panel-header&quot;;
      const heading = document.createElement(&quot;div&quot;);
      heading.className = &quot;e6bc-panel-heading&quot;;
      heading.innerHTML = &#x27;&lt;span class=&quot;e6bc-panel-index&quot;&gt;&lt;/span&gt;&lt;h2&gt;&lt;/h2&gt;&#x27;;
      heading.querySelector(&quot;.e6bc-panel-index&quot;).textContent = String(idx + 1).padStart(2, &quot;0&quot;) + &quot; · &quot; + c.code.toUpperCase();
      heading.querySelector(&quot;h2&quot;).textContent = c.title;
      const tools = document.createElement(&quot;div&quot;);
      tools.className = &quot;e6bc-tools&quot;;
      const level = document.createElement(&quot;span&quot;);
      level.className = &quot;e6bc-level&quot; + (c.key ? &quot; is-key&quot; : &quot;&quot;);
      level.textContent = c.tag;
      const copyBtn = document.createElement(&quot;button&quot;);
      copyBtn.type = &quot;button&quot;;
      copyBtn.className = &quot;e6bc-copybtn&quot;;
      copyBtn.textContent = &quot;复制组件&quot;;
      copyBtn.addEventListener(&quot;click&quot;, () =&gt; copySnippet(c));
      tools.appendChild(level);
      tools.appendChild(copyBtn);
      header.appendChild(heading);
      header.appendChild(tools);
      panel.appendChild(header);

      const stateBar = document.createElement(&quot;div&quot;);
      stateBar.className = &quot;e6bc-statebar&quot;;
      stateBar.setAttribute(&quot;role&quot;, &quot;group&quot;);
      stateBar.setAttribute(&quot;aria-label&quot;, &quot;数据状态切换&quot;);
      panel.appendChild(stateBar);

      const style = document.createElement(&quot;style&quot;);
      style.textContent = c.css;
      panel.appendChild(style);

      const demo = document.createElement(&quot;div&quot;);
      demo.className = &quot;e6bc-demo&quot;;
      demo.innerHTML = c.html;
      panel.appendChild(demo);

      const log = document.createElement(&quot;div&quot;);
      log.className = &quot;e6bc-eventlog&quot;;
      log.innerHTML = &quot;&lt;strong&gt;事件流：&lt;/strong&gt;（组件只发事件，处置结果待外部系统确认）&quot;;
      panel.appendChild(log);

      const footer = document.createElement(&quot;footer&quot;);
      footer.className = &quot;e6bc-panel-footer&quot;;
      const note = document.createElement(&quot;span&quot;);
      note.innerHTML = &quot;&lt;strong&gt;契约：&lt;/strong&gt;&quot;;
      note.append(c.note);
      footer.appendChild(note);
      panel.appendChild(footer);
      grid.appendChild(panel);

      const root = demo.querySelector(&quot;[data-vc]&quot;);
      [&quot;select&quot;, &quot;filter-change&quot;, &quot;sort-change&quot;, &quot;drilldown&quot;, &quot;alert-action&quot;].forEach((evt) =&gt; {
        root.addEventListener(evt, (e) =&gt; {
          const line = document.createElement(&quot;div&quot;);
          line.textContent = new Date().toTimeString().slice(0, 8) + &quot; &quot; + evt + &quot; &quot; + JSON.stringify(e.detail) + &quot; · 待外部系统确认&quot;;
          log.appendChild(line);
          while (log.children.length &gt; 4) log.removeChild(log.children[1] || log.firstChild);
        });
      });

      const factory = getFactory(c);
      const api = factory(root, c.sample, {});
      mounted[c.code] = { api, unsubDemo: c.demo ? c.demo(api) : null };

      STATE_BUTTONS.forEach(([key, label], bi) =&gt; {
        const btn = document.createElement(&quot;button&quot;);
        btn.type = &quot;button&quot;;
        btn.className = &quot;e6bc-statebtn&quot;;
        btn.textContent = label;
        btn.setAttribute(&quot;aria-pressed&quot;, String(bi === 0));
        btn.addEventListener(&quot;click&quot;, () =&gt; {
          stateBar.querySelectorAll(&quot;.e6bc-statebtn&quot;).forEach((b) =&gt; b.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;));
          btn.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
          mounted[c.code].api.update(stateData(c, key));
        });
        stateBar.appendChild(btn);
      });
    });

    /* ================= 资源压测（重复 create/dispose 20 次） ================= */

    document.getElementById(&quot;e6bc-stress&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      const resultChip = document.getElementById(&quot;e6bc-stress-result&quot;);
      const realSetInterval = window.setInterval, realClearInterval = window.clearInterval;
      const realSetTimeout = window.setTimeout, realClearTimeout = window.clearTimeout;
      const live = new Set();
      window.setInterval = function () { const id = realSetInterval.apply(window, arguments); live.add(&quot;i&quot; + id); return id; };
      window.clearInterval = function (id) { live.delete(&quot;i&quot; + id); return realClearInterval.call(window, id); };
      window.setTimeout = function () { const id = realSetTimeout.apply(window, arguments); live.add(&quot;t&quot; + id); return id; };
      window.clearTimeout = function (id) { live.delete(&quot;t&quot; + id); return realClearTimeout.call(window, id); };
      const host = document.createElement(&quot;div&quot;);
      host.style.cssText = &quot;position:fixed;left:-9999px;top:0;width:480px;&quot;;
      document.body.appendChild(host);
      let created = 0;
      try {
        for (let round = 0; round &lt; 20; round++) {
          COMPONENTS.forEach((c) =&gt; {
            host.innerHTML = c.html;
            const api = getFactory(c)(host.querySelector(&quot;[data-vc]&quot;), c.sample, {});
            created++;
            api.update(stateData(c, &quot;stale&quot;));
            api.dispose();
          });
        }
      } finally {
        window.setInterval = realSetInterval;
        window.clearInterval = realClearInterval;
        window.setTimeout = realSetTimeout;
        window.clearTimeout = realClearTimeout;
        host.remove();
      }
      resultChip.innerHTML = &quot;&quot;;
      resultChip.append(&quot;压测 &quot;);
      const strong = document.createElement(&quot;strong&quot;);
      strong.textContent = created + &quot; 次创建/销毁 · 定时器净增 &quot; + live.size;
      resultChip.appendChild(strong);
      resultChip.classList.toggle(&quot;is-pass&quot;, live.size === 0);
    });

    /* ================= 生命周期 ================= */

    window.addEventListener(&quot;pagehide&quot;, () =&gt; {
      Object.keys(mounted).forEach((code) =&gt; {
        if (mounted[code].unsubDemo) mounted[code].unsubDemo();
        mounted[code].api.dispose();
      });
      Scheduler.dispose();
    });
  })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
