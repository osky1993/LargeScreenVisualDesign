<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大屏样板间 · 公共资金行业税收详情</title>
<style>
  :root {
    --sh-bg: #08203f;
    --sh-panel: rgba(11, 38, 72, 0.72);
    --sh-border: rgba(92, 156, 226, 0.28);
    --sh-text: #e8f2ff;
    --sh-muted: #8ea9cc;
    --sh-gold: #f0c060;
    --sh-gold-soft: #ffdc8f;
    --sh-blue: #3d9cff;
    --sh-cyan: #39d0d8;
    --sh-green: #33e0a6;
    --sh-red: #ff5f6e;
    --sh-orange: #ff9d4d;
    --sh-mono: "Bahnschrift", "DIN Alternate", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04101f; }
  body { color: var(--sh-text); font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif; }

  /* ===== 1920x1080 固定设计舞台 ===== */
  .sh-stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background:
      radial-gradient(circle at 12% 0%, rgba(240, 192, 96, 0.10), transparent 44%),
      radial-gradient(circle at 88% 8%, rgba(57, 208, 216, 0.09), transparent 46%),
      radial-gradient(ellipse at 50% 118%, rgba(20, 60, 120, 0.34), transparent 56%),
      linear-gradient(rgba(92, 156, 226, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(92, 156, 226, 0.05) 1px, transparent 1px),
      var(--sh-bg);
    background-size: auto, auto, auto, 44px 44px, 44px 44px, auto;
    display: grid;
    grid-template-columns: 720px 1fr;
    grid-template-rows: 84px 128px 1fr 52px;
    gap: 14px;
    padding: 12px 18px 16px;
  }

  .sh-error {
    display: none; position: absolute; z-index: 30; left: 50%; top: 96px; transform: translateX(-50%);
    padding: 14px 22px; border-radius: 12px;
    border: 1px solid rgba(255, 122, 122, 0.5); background: rgba(96, 26, 38, 0.85);
    color: #ffd9d9; font-size: 15px;
  }
  .sh-error.is-visible { display: block; }

  /* ===== 顶栏：三级面包屑 + 行业切换器 + 返回 + 时钟 ===== */
  .sh-header {
    grid-column: 1 / -1; position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 10px;
  }
  .sh-header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(240, 192, 96, 0.6) 16%, rgba(57, 208, 216, 0.85) 50%, rgba(240, 192, 96, 0.6) 84%, transparent);
    box-shadow: 0 0 14px rgba(240, 192, 96, 0.4);
  }
  .sh-head-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .sh-crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0.1em; color: var(--sh-muted); }
  .sh-crumb b { font-weight: 400; color: var(--sh-gold); }
  .sh-crumb i { font-style: normal; color: rgba(142, 169, 204, 0.55); }
  .sh-crumb em { font-style: normal; color: #d7e8ff; }
  /* 第二级是回父页的链接 */
  .sh-crumb-up { color: #a8c2e0; text-decoration: none; transition: color 0.18s, text-shadow 0.18s; }
  .sh-crumb-up:hover { color: var(--sh-gold-soft); text-decoration: underline; text-shadow: 0 0 10px rgba(240, 192, 96, 0.5); }
  .sh-head-title-row { display: flex; align-items: baseline; gap: 16px; white-space: nowrap; }
  .sh-head-title {
    font-size: 30px; font-weight: 700; letter-spacing: 0.06em;
    background: linear-gradient(180deg, #ffffff 26%, var(--sh-gold-soft) 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(240, 192, 96, 0.35));
  }
  .sh-head-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--sh-muted); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .sh-head-meta b { font-weight: 400; color: var(--sh-gold-soft); }
  .sh-head-meta i { font-style: normal; color: rgba(142, 169, 204, 0.4); }

  .sh-head-right { display: flex; align-items: center; gap: 16px; flex: none; }
  /* 行业切换器 */
  .sh-switcher { display: flex; align-items: stretch; gap: 8px; }
  .sh-sw-btn {
    display: flex; align-items: center; gap: 5px; padding: 0 12px; cursor: pointer; user-select: none;
    border-radius: 9px; font-family: inherit; font-size: 13px; letter-spacing: 0.04em;
    border: 1px solid rgba(240, 192, 96, 0.34);
    background: linear-gradient(160deg, rgba(240, 192, 96, 0.15), rgba(16, 46, 86, 0.6));
    color: #ffdc8f; transition: border-color 0.18s, box-shadow 0.18s, color 0.18s;
  }
  .sh-sw-btn:hover { color: #fff6e2; border-color: rgba(240, 192, 96, 0.85); box-shadow: 0 0 14px rgba(240, 192, 96, 0.4); }
  .sh-sw-btn b { font-weight: 700; font-size: 16px; }
  .sh-sw-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    min-width: 128px; padding: 6px 16px; border-radius: 9px;
    border: 1px solid rgba(240, 192, 96, 0.5); background: rgba(72, 56, 24, 0.42);
    box-shadow: inset 0 0 14px rgba(240, 192, 96, 0.1);
  }
  .sh-sw-name { font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: var(--sh-gold-soft); white-space: nowrap; }
  .sh-sw-idx { font-size: 11px; letter-spacing: 0.24em; color: rgba(240, 192, 96, 0.7); font-variant-numeric: tabular-nums; }
  /* 返回父页 */
  .sh-back {
    display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; cursor: pointer;
    border-radius: 10px; font-family: inherit; font-size: 13px; letter-spacing: 0.08em;
    border: 1px solid rgba(92, 156, 226, 0.45); background: rgba(16, 46, 86, 0.6); color: #cfe6ff;
    transition: border-color 0.18s, box-shadow 0.18s, color 0.18s;
  }
  .sh-back:hover { color: #fff; border-color: rgba(57, 208, 216, 0.8); box-shadow: 0 0 14px rgba(57, 208, 216, 0.35); }
  .sh-back svg { width: 16px; height: 16px; }
  .sh-clock { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-variant-numeric: tabular-nums; padding-left: 16px; border-left: 1px solid rgba(92, 156, 226, 0.25); }
  .sh-clock-time { font: 700 24px/1 var(--sh-mono); color: #f2f9ff; letter-spacing: 0.04em; text-shadow: 0 0 12px rgba(57, 208, 216, 0.4); }
  .sh-clock-date { font-size: 12px; color: var(--sh-muted); letter-spacing: 0.06em; }

  /* ===== KPI 带（5 枚） ===== */
  .sh-band { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; min-height: 0; }
  .sh-kpi {
    position: relative; overflow: hidden;
    border: 1px solid var(--sh-border); border-radius: 12px; background: var(--sh-panel);
    display: flex; align-items: center; gap: 14px; padding: 0 16px 0 18px;
  }
  .sh-kpi::before { content: ""; position: absolute; left: 0; top: 0; width: 46px; height: 3px; background: linear-gradient(90deg, var(--sh-gold), transparent); }
  .sh-kpi::after {
    content: ""; position: absolute; right: -30px; bottom: -46px; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(240, 192, 96, 0.13), transparent 68%);
  }
  .sh-kpi-icon {
    flex: none; width: 44px; height: 44px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: linear-gradient(160deg, rgba(240, 192, 96, 0.28), rgba(57, 208, 216, 0.12));
    border: 1px solid rgba(240, 192, 96, 0.35); box-shadow: inset 0 0 12px rgba(240, 192, 96, 0.14);
  }
  .sh-kpi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .sh-kpi-label { font-size: 12.5px; letter-spacing: 0.08em; color: var(--sh-muted); white-space: nowrap; }
  .sh-kpi-num { display: flex; align-items: baseline; gap: 5px; font-variant-numeric: tabular-nums; }
  .sh-kpi-val { font: 700 28px/1 var(--sh-mono); color: var(--sh-gold-soft); text-shadow: 0 0 14px rgba(240, 192, 96, 0.45); }
  .sh-kpi-unit { font-size: 12px; color: #b39a5e; }
  .sh-kpi-sub { font-size: 11.5px; color: var(--sh-muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sh-kpi-sub b { font-weight: 700; }
  .sh-up { color: var(--sh-green); }
  .sh-down { color: var(--sh-red); }
  .sh-mini-track { position: relative; height: 6px; border-radius: 3px; background: rgba(63, 120, 200, 0.2); }
  .sh-mini-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #b8863a, var(--sh-gold-soft)); box-shadow: 0 0 10px rgba(240, 192, 96, 0.5); transition: width 1.1s ease; }
  .sh-mini-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; box-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }

  /* ===== 面板通用 ===== */
  .sh-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .sh-panel {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    border: 1px solid var(--sh-border); border-radius: 12px; background: var(--sh-panel);
    display: flex; flex-direction: column;
  }
  .sh-panel-head {
    position: relative; flex: none; display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 30px 0 14px;
    background: linear-gradient(90deg, rgba(240, 192, 96, 0.22), rgba(57, 208, 216, 0.05) 62%, transparent);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%);
  }
  .sh-panel-head i { flex: none; width: 5px; height: 16px; background: var(--sh-gold); box-shadow: 0 0 8px var(--sh-gold); transform: skewX(-12deg); }
  .sh-panel-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #f4f9ff; white-space: nowrap; }
  .sh-panel-en { font-size: 10px; letter-spacing: 0.18em; color: #5f88b8; align-self: flex-end; padding-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .sh-panel-scope { margin-left: auto; font-size: 12px; color: var(--sh-gold-soft); white-space: nowrap; padding-right: 2px; font-variant-numeric: tabular-nums; }
  .sh-chart { flex: 1; min-height: 0; }

  /* ===== 左列：分地市税收明细表（DOM grid） ===== */
  .sh-thead, .sh-tbody li, .sh-tfoot {
    display: grid;
    grid-template-columns: 38px 1.05fr 1fr 0.85fr 1.6fr 0.95fr;
    align-items: center; gap: 8px; padding: 0 14px;
  }
  .sh-thead {
    flex: none; height: 34px; font-size: 11.5px; letter-spacing: 0.08em; color: #6f93bd;
    border-bottom: 1px solid rgba(92, 156, 226, 0.22); background: rgba(63, 120, 200, 0.08);
  }
  .sh-thead span:nth-child(n+3) { text-align: right; }
  .sh-thead span:nth-child(5) { text-align: left; }
  .sh-tbody { flex: 1; min-height: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
  .sh-tbody li {
    flex: 1; min-height: 0; font-size: 13px; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid rgba(92, 156, 226, 0.09); transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .sh-tbody li:nth-child(odd) { background: rgba(63, 120, 200, 0.07); }
  .sh-tbody li.is-lead { background: rgba(240, 192, 96, 0.13); box-shadow: inset 3px 0 0 var(--sh-gold); }
  .sh-td-no {
    width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font: 700 11px/1 var(--sh-mono); color: #0a1c33; background: rgba(142, 169, 204, 0.7);
  }
  .sh-tbody li:nth-child(-n+3) .sh-td-no { background: linear-gradient(140deg, var(--sh-gold-soft), #d8a03c); box-shadow: 0 0 9px rgba(240, 192, 96, 0.5); }
  .sh-td-name { color: #eaf4ff; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sh-td-val { text-align: right; font: 700 14px/1 var(--sh-mono); color: var(--sh-gold-soft); }
  .sh-td-yoy { text-align: right; font-size: 12px; font-weight: 700; }
  /* 占该行业：条 + 百分比同格 */
  .sh-td-bar { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .sh-td-bar u { position: relative; flex: 1; min-width: 0; height: 8px; border-radius: 4px; background: rgba(63, 120, 200, 0.2); }
  .sh-td-bar u b {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; width: 0;
    background: linear-gradient(90deg, rgba(184, 134, 58, 0.85), var(--sh-gold-soft));
    box-shadow: 0 0 8px rgba(240, 192, 96, 0.4); transition: width 1s cubic-bezier(0.22, 0.8, 0.3, 1);
  }
  .sh-td-bar s { flex: none; width: 42px; text-align: right; text-decoration: none; font-size: 11.5px; color: #cfe2f8; }
  .sh-td-share { text-align: right; font-size: 12px; color: #b6cbe4; }
  .sh-tfoot {
    flex: none; height: 40px;
    border-top: 1px solid rgba(240, 192, 96, 0.32); background: rgba(72, 56, 24, 0.34);
    font-size: 12px; color: var(--sh-muted); font-variant-numeric: tabular-nums;
  }
  .sh-tfoot b { font: 700 15px/1 var(--sh-mono); color: var(--sh-gold-soft); }
  .sh-tfoot span:nth-child(3), .sh-tfoot span:nth-child(4), .sh-tfoot span:nth-child(6) { text-align: right; }
  .sh-tie { color: var(--sh-green); font-weight: 700; }
  .sh-tie.is-bad { color: var(--sh-red); }

  /* ===== 右列 ===== */
  .sh-r1 { flex: 1.18; }
  .sh-duo { flex: 1; min-height: 0; display: flex; gap: 14px; }
  .sh-duo > .sh-panel { flex: 1; }

  /* ===== 底部跑马灯 ===== */
  .sh-marquee {
    grid-column: 1 / -1; display: flex; align-items: stretch; overflow: hidden;
    border: 1px solid var(--sh-border); border-radius: 12px; background: var(--sh-panel);
  }
  .sh-marquee-tag {
    flex: none; display: flex; align-items: center; gap: 9px; padding: 0 22px 0 18px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.2em; color: #2a1c05;
    background: linear-gradient(120deg, var(--sh-gold-soft), #d8a03c 85%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
  }
  .sh-marquee-tag i { width: 8px; height: 8px; border-radius: 50%; background: #2a1c05; animation: shDot 1.6s ease-in-out infinite; }
  @keyframes shDot { 50% { opacity: 0.25; } }
  .sh-marquee-view { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
  .sh-marquee-track {
    display: inline-flex; align-items: center; white-space: nowrap; will-change: transform;
    animation: shMarquee 52s linear infinite; font-size: 15px; letter-spacing: 0.06em; color: #dceaff;
  }
  .sh-marquee-track b { color: var(--sh-gold-soft); font-weight: 700; }
  .sh-marquee-track em { font-style: normal; margin: 0 26px; color: rgba(240, 192, 96, 0.5); }
  @keyframes shMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* mockflag:begin —— 由 tools/inject_mock_flag.py 注入，勿手改 */
  .sh-mockflag {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 9000;
    padding: 3px 20px 4px; border-radius: 0 0 10px 10px; pointer-events: none;
    background: linear-gradient(180deg, #f2ab42, #de8524); color: #24130a;
    font-size: 13px; line-height: 1.15; font-weight: 700;
    letter-spacing: 0.3em; text-indent: 0.3em; white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }
  /* mockflag:end */
</style>
</head>
<body>
  <div class="sh-stage" id="sh-stage">
    <!-- mockflag:begin --><div class="sh-mockflag" role="note" aria-label="本页为模拟数据">模拟数据</div><!-- mockflag:end -->
    <div class="sh-error" id="sh-error" role="alert">ECharts 资源加载失败，请联网后重新打开此文件。</div>

    <header class="sh-header">
      <div class="sh-head-left">
        <div class="sh-crumb">
          <b>公共资金</b><i>›</i>
          <a class="sh-crumb-up" href="大屏样板间-公共资金税收分行业1920.html">税收分行业</a><i>›</i>
          <em id="sh-crumb-obj">--</em>
        </div>
        <div class="sh-head-title-row">
          <div class="sh-head-title" id="sh-title">-- 税收详情</div>
          <div class="sh-head-meta">
            <span>口径 <b>地方级税收收入</b></span><i>|</i>
            <span>区间 <b>2026 年 1-7 月累计</b></span><i>|</i>

          </div>

            <span class="sh-sw-name" id="sh-sw-name">--</span>

    <section class="sh-band" id="sh-band" aria-label="当前行业核心指标"></section>

    <!-- 左列：该行业分地市税收明细 -->
    <div class="sh-col">
      <section class="sh-panel">

        <div class="sh-chart" id="sh-chart-month" role="img" aria-label="该行业月度税收本年柱与上年同期参照柱及累计同比折线"></div>

          <header class="sh-panel-head"><i></i><h2>重点纳税企业 TOP8</h2><span class="sh-panel-en">TOP TAXPAYERS</span><span class="sh-panel-scope" id="sh-firm-scope">--</span></header>
          <div class="sh-chart" id="sh-chart-firm" role="img" aria-label="该行业重点纳税企业前八名横向条形图"></div>

    <section class="sh-marquee" aria-label="行业要情">
      <div class="sh-marquee-tag"><i></i>行业要情</div>
      <div class="sh-marquee-view"><div class="sh-marquee-track" id="sh-marquee-track"></div></div>
    </section>
  </div>

<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script>
(() => {
  "use strict";

  /* ===== 1. 舞台等比缩放 ===== */
  const stage = document.getElementById("sh-stage");
  function fitStage() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fitStage);
  fitStage();

  /* ===== 2. 资源守卫 ===== */
  const errorNode = document.getElementById("sh-error");

  function splitYoy(rows, Y) {

    rows.forEach((r, i) => { if (r.v > rows[bi].v) bi = i; });
    const others = sum(rows.filter((_, i) => i !== bi).map((r) => r.v / (1 + r.y / 100)));

    band.appendChild(card);
    k.node = card.querySelector(".sh-kpi-val");
    k.subNode = card.querySelector(".sh-kpi-sub");
    k.fill = card.querySelector(".sh-mini-fill");
    k.cur = 0; k.target = 0;
  });
  /* 翻牌缓动：截图里可能是中途值，收敛后才是终值 */
  setInterval(() => {
    KPI_DEFS.forEach((k) => {
      const diff = k.target - k.cur;
      if (Math.abs(diff) < Math.pow(10, -k.dec) / 2) k.cur = k.target; else k.cur += diff * 0.14;
      k.node.textContent = (k.sign && k.cur >= 0 ? "+" : "") + fmtDec(k.cur, k.dec);
    });
  }, 80);

  /* ===== 7. ECharts 公共构件 ===== */
  const tip = (extra) => Object.assign({
    trigger: "item", confine: true,
    backgroundColor: "rgba(8, 26, 50, 0.93)", borderColor: "rgba(240, 192, 96, 0.45)",
    textStyle: { color: "#e2eeff", fontSize: 12 }
  }, extra || {});
  const vGrad = (a, b) => new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: a }, { offset: 1, color: b }]);
  const hGrad = (a, b) => new echarts.graphic.LinearGradient(0, 0, 1, 0, [{ offset: 0, color: a }, { offset: 1, color: b }]);
  const AXIS_LINE = { lineStyle: { color: "rgba(102, 178, 255, 0.3)" } };
  const SPLIT_LINE = { lineStyle: { color: "rgba(92, 156, 226, 0.13)" } };
  /* ★ 图表实例只创建一次，切换行业时只 setOption，绝不重新 init */
  const monthChart = echarts.init($("sh-chart-month"));
  const mixChart = echarts.init($("sh-chart-mix"));
  const firmChart = echarts.init($("sh-chart-firm"));

  /* ===== 8. 各视图的 option 工厂（入参为当前行业） ===== */
  function monthOption(o) {
    /* 累计同比副轴范围随行业增速自适应（房地产 -9.6 与信息软件 +11.4 不可共用固定区间） */
    const lo = Math.min.apply(null, o.cum), hi = Math.max.apply(null, o.cum);
    const padv = Math.max(1.5, (hi - lo) * 0.5);
    return {
      tooltip: tip({
        trigger: "axis", axisPointer: { type: "shadow", shadowStyle: { color: "rgba(240, 192, 96, 0.08)" } },
        formatter: (ps) => {
          const i = ps[0].dataIndex;
          return '<b style="color:#ffdc8f">' + o.mid + " · " + MONTHS[i] + "</b><br/>本年 " + fmtDec(o.cur[i], 1) +
            " 亿元<br/>上年同期 " + fmtDec(o.pre[i], 1) + " 亿元<br/>当月同比 " + signed(100 * (o.cur[i] / o.pre[i] - 1)) +
            '%<br/>累计同比 <b style="color:' + (o.cum[i] >= 0 ? "#33e0a6" : "#ff5f6e") + '">' + signed(o.cum[i]) + "%</b>";
        }
      }),
      legend: { top: 8, right: 14, itemWidth: 12, itemHeight: 8, itemGap: 16, textStyle: { color: "#c6dcf5", fontSize: 12 } },
      grid: { left: 16, right: 16, top: 46, bottom: 8, containLabel: true },
      xAxis: { type: "category", data: MONTHS, axisLine: AXIS_LINE, axisTick: { show: false }, axisLabel: { color: C.muted, fontSize: 12 } },
      yAxis: [
        { type: "value", name: "亿元", nameTextStyle: { color: "#5f88b8", fontSize: 11 }, splitLine: SPLIT_LINE,
          axisLabel: { color: C.muted, fontSize: 11 } },
        { type: "value", name: "累计同比 %", nameTextStyle: { color: "#5f88b8", fontSize: 11 },
          min: +(lo - padv).toFixed(1), max: +(hi + padv).toFixed(1),
          splitLine: { show: false }, axisLabel: { color: C.muted, fontSize: 11, formatter: (v) => v.toFixed(1) + "%" } }
      ],
      series: [
        /* 上年柱比本年宽 8px 作参照底；负增长行业本年柱更矮，仍能露出上年一圈边 */
        { name: "上年同期", type: "bar", barWidth: 28, barGap: "-100%", z: 1,
          itemStyle: { borderRadius: [4, 4, 0, 0], color: "rgba(92, 156, 226, 0.28)", borderColor: "rgba(92, 156, 226, 0.45)", borderWidth: 1 },
          data: o.pre },
        { name: "本年当月", type: "bar", barWidth: 20, z: 2,
          itemStyle: { borderRadius: [4, 4, 0, 0], color: vGrad(C.goldSoft, "rgba(184, 134, 58, 0.35)"), shadowColor: "rgba(240, 192, 96, 0.4)", shadowBlur: 10 },
          label: { show: true, position: "top", fontSize: 11, color: C.goldSoft, formatter: (p) => fmtDec(p.value, o.dec) },
          data: o.cur },
        { name: "累计同比", type: "line", yAxisIndex: 1, smooth: true, symbol: "circle", symbolSize: 8, z: 3,
          lineStyle: { width: 3, color: o.yoy >= 0 ? C.green : C.red, shadowColor: "rgba(0, 0, 0, 0.4)", shadowBlur: 10 },
          itemStyle: { color: o.yoy >= 0 ? C.green : C.red, borderColor: "#06202a", borderWidth: 2 },
          areaStyle: { color: o.yoy >= 0 ? vGrad("rgba(51, 224, 166, 0.2)", "rgba(51, 224, 166, 0)") : vGrad("rgba(255, 95, 110, 0.2)", "rgba(255, 95, 110, 0)") },
          /* 折线 label 会被自身面积压住，加深色底 + 上移 */
          label: { show: true, position: "top", distance: 10, fontSize: 11, fontWeight: 700,
            color: o.yoy >= 0 ? C.green : C.red, backgroundColor: "rgba(8, 26, 50, 0.75)", padding: [2, 4], borderRadius: 3,
            formatter: (p) => signed(p.value) + "%" },
          data: o.cum }
      ],
      animationDurationUpdate: 700
    };
  }

  function mixOption(o) {
    return {
      tooltip: tip({ formatter: (p) => p.name + "<br/>" + fmtDec(p.value, 1) + " 亿元 · " + p.percent.toFixed(1) + "%" }),
      color: [C.goldSoft, C.gold, C.cyan, C.blue, C.green, C.orange, C.steel],
      graphic: [
        { type: "text", left: "center", top: "41%", style: { text: fmtDec(o.mixSum, o.dec), fill: C.goldSoft, fontSize: 24, fontWeight: 700, textAlign: "center" } },
        { type: "text", left: "center", top: "54%", style: { text: o.short + " · 亿元", fill: "#8ea9cc", fontSize: 10.5, textAlign: "center" } }
      ],
      series: [{
        type: "pie", radius: ["46%", "68%"], center: ["50%", "50%"],
        itemStyle: { borderColor: "rgba(8, 26, 50, 0.9)", borderWidth: 2 },
        label: { color: "#cfe2f8", fontSize: 10.5, formatter: (p) => p.name + " " + p.percent.toFixed(0) + "%" },
        labelLine: { length: 6, length2: 8, lineStyle: { color: "rgba(142, 169, 204, 0.5)" } },
        emphasis: { scaleSize: 6, itemStyle: { shadowBlur: 16, shadowColor: "rgba(240, 192, 96, 0.45)" } },
        data: o.mix
      }],
      animationDurationUpdate: 600
    };
  }

  function firmOption(o) {
    const rows = o.firms.slice().reverse();      /* y 轴自下而上，反转后第一名在最上 */
    return {
      tooltip: tip({
        trigger: "axis", axisPointer: { type: "shadow", shadowStyle: { color: "rgba(240, 192, 96, 0.08)" } },
        formatter: (ps) => {
          const f = rows[ps[0].dataIndex];
          return '<b style="color:#ffdc8f">' + f.name + "</b><br/>入库税收 " + fmtDec(f.value, 1) +
            " 亿元<br/>占该行业 " + (100 * f.value / o.v).toFixed(2) + "%";
        }
      }),
      grid: { left: 8, right: 52, top: 14, bottom: 6, containLabel: true },
      xAxis: { type: "value", splitLine: SPLIT_LINE, axisLabel: { color: C.muted, fontSize: 10 } },
      yAxis: {
        type: "category", data: rows.map((f) => f.name),
        axisLine: AXIS_LINE, axisTick: { show: false },
        axisLabel: { color: "#cfe6ff", fontSize: 11, width: 92, overflow: "truncate" }
      },
      series: [{
        type: "bar", barWidth: 14,
        showBackground: true, backgroundStyle: { color: "rgba(63, 120, 200, 0.14)", borderRadius: 5 },
        itemStyle: { borderRadius: 5, color: hGrad("rgba(184, 134, 58, 0.8)", C.goldSoft) },
        label: { show: true, position: "right", fontSize: 10.5, fontWeight: 700, color: "#dcebff",
          formatter: (p) => fmtDec(p.value, 1) },
        data: rows.map((f) => f.value)
      }],
      animationDurationUpdate: 600
    };
  }

  /* ===== 9. 左表与表尾（切换行业时整体重写） ===== */
  function renderTable(o) {
    const body = $("sh-tbody");
    body.innerHTML = o.sorted.map((r, i) =>
      '<li class="' + (i === 0 ? "is-lead" : "") + '">' +
        '<span class="sh-td-no">' + (i + 1) + '</span>' +
        '<span class="sh-td-name">' + r.city + '</span>' +
        '<span class="sh-td-val">' + fmtDec(r.v, 1) + '</span>' +
        '<span class="sh-td-yoy" style="color:' + (r.y >= 0 ? C.green : C.red) + '">' + signed(r.y) + '%</span>' +
        '<span class="sh-td-bar"><u><b style="width:0"></b></u><s>' + r.share.toFixed(1) + '%</s></span>' +
        '<span class="sh-td-share">' + r.cityShare.toFixed(1) + '%</span>' +
      '</li>').join("");
    const maxShare = o.sorted[0].share;
    const bars = body.querySelectorAll(".sh-td-bar u b");
    setTimeout(() => {
      o.sorted.forEach((r, i) => { if (bars[i]) bars[i].style.width = (100 * r.share / maxShare).toFixed(1) + "%"; });
    }, 60);

    $("sh-tfoot").innerHTML =
      '<span></span><span>合计（13 市）</span>' +
      '<span><b>' + fmtDec(o.citySum, o.dec) + '</b></span>' +
      '<span style="color:' + (o.yoy >= 0 ? C.green : C.red) + ';font-weight:700">' + signed(o.yoy) + '%</span>' +
      '<span class="sh-tie' + (o.tie ? "" : " is-bad") + '">' + (o.tie ? "与父页一致 ✓" : "口径不符 ✗") + '</span>' +
      '<span>' + (100 * o.v / CITY_TAX_TOTAL).toFixed(1) + '%</span>';
    $("sh-tbl-scope").textContent = "13 市 · 合计 " + fmtDec(o.citySum, o.dec) + " 亿元";
  }

  /* ===== 10. 跑马灯（数字与上方图表同源现算） ===== */
  function renderMarquee(o) {
    const t1 = o.sorted[0], t2 = o.sorted[1], t3 = o.sorted[2];
    const news = [
      o.mid + " 1-7 月全省税收 <b>" + fmtDec(o.v) + " 亿元</b>，同比 <b>" + signed(o.yoy) + "%</b>，规模居 13 个门类第 <b>" + o.rank + "</b> 位",
      "占全省税收 <b>" + o.share.toFixed(1) + "%</b>；13 个设区市之和 <b>" + fmtDec(o.citySum, o.dec) + " 亿元</b>，与「税收分行业」页门类值一致",
      "首位 <b>" + t1.city + " " + fmtDec(t1.v, 1) + " 亿元</b>（占该行业 " + t1.share.toFixed(1) + "%），" +
        "前三市 " + t1.city + "、" + t2.city + "、" + t3.city + " 合计 <b>" + fmtDec(o.top3, 1) + " 亿元</b>、占 <b>" +
        (100 * o.top3 / o.v).toFixed(1) + "%</b>",
      "行业集中度看，<b>" + o.peak.city + "</b> 的该行业税收占其全部税收 <b>" + o.peak.cityShare.toFixed(1) +
        "%</b>，高于全省 " + o.share.toFixed(1) + "% 的水平 <b>" + (o.peak.cityShare - o.share).toFixed(1) + " pct</b>",
      "较上年同期 <b>" + fmtDec(o.prevTotal, 1) + " 亿元</b> " + (o.delta >= 0 ? "增收" : "减收") + " <b>" +
        fmtDec(Math.abs(o.delta), 1) + " 亿元</b>，拉动全省税收 <b>" + signed(o.pull, 2) + " pct</b>",
      "构成看，" + o.mix[0].name + " <b>" + fmtDec(o.mix[0].value, 1) + " 亿元</b>，占该行业 <b>" +
        (100 * o.mix[0].value / o.v).toFixed(1) + "%</b>（" + o.mixNote + "合计 " + fmtDec(o.mixSum, o.dec) + " 亿元）",
      "重点纳税企业 TOP8 合计 <b>" + fmtDec(o.firmSum, 1) + " 亿元</b>，占该行业 <b>" + o.firmShare.toFixed(1) +
        "%</b>，首户 " + o.firms[0].name + " <b>" + fmtDec(o.firms[0].value, 1) + " 亿元</b>",
      "月度看，7 月入库 <b>" + fmtDec(o.cur[6], 1) + " 亿元</b>，当月同比 <b>" + signed(100 * (o.cur[6] / o.pre[6] - 1)) +
        "%</b>；1-7 月累计同比收敛于 <b>" + signed(o.cum[6]) + "%</b>",
      "口径提示：13 门类<b>分行业加权同比 " + signed(D.yoyWeighted, 2) + "%</b>，全省税收口径同比为 <b>" +
        signed(YOY_TAX_OFFICIAL) + "%</b>，两者不可混用"
    ];
    const html = news.map((n) => "<span>" + n + "</span><em>◆</em>").join("");
    const track = $("sh-marquee-track");
    track.innerHTML = html + html;
    track.style.animation = "none";
    void track.offsetWidth;
    track.style.animation = "";
  }

  /* ===== 11. 切换行业：整页重设（图表只 setOption，不重新 init） ===== */
  let idx = 0;
  function applyIndustry(i) {
    idx = (i + IND.length) % IND.length;
    const o = IND[idx];
    $("sh-crumb-obj").textContent = o.mid;
    $("sh-title").textContent = o.mid + " 税收详情";
    $("sh-sw-name").textContent = o.short;
    $("sh-sw-idx").textContent = (idx + 1) + " / " + IND.length;
    document.title = "大屏样板间 · 公共资金行业税收详情 · " + o.mid;

    const vals = { val: o.v, yoy: o.yoy, share: o.share, rank: o.rank, pull: o.pull };
    KPI_DEFS.forEach((k) => { k.target = vals[k.key]; });
    KPI_DEFS[0].subNode.innerHTML = "13 市之和 <b>" + fmtDec(o.citySum, o.dec) + "</b> 亿元 " + (o.tie ? "✓" : "✗");
    KPI_DEFS[1].subNode.innerHTML = "上年同期 <b>" + fmtDec(o.prevTotal, 1) + "</b> 亿元 · " +
      '<b class="' + (o.delta >= 0 ? "sh-up" : "sh-down") + '">' + (o.delta >= 0 ? "增收 " : "减收 ") + fmtDec(Math.abs(o.delta), 1) + "</b>";
    KPI_DEFS[2].subNode.innerHTML = "全省税收 <b>" + fmtDec(D.total) + "</b> 亿元 · 白线为 13 门类均值 <b>" + D.avgShare.toFixed(1) + "%</b>";
    KPI_DEFS[3].subNode.innerHTML = "首位 <b>" + ORDER[0].short + " " + fmtDec(ORDER[0].v) + "</b> 亿元 · 末位 <b>" +
      ORDER[ORDER.length - 1].short + " " + fmtDec(ORDER[ORDER.length - 1].v) + "</b>";
    KPI_DEFS[4].subNode.innerHTML = "口径：增减额 ÷ 上年同期税收合计 <b>" + fmtDec(D.prevTotal, 0) + "</b> 亿元";
    KPI_DEFS[2].fill.style.width = "0%";
    setTimeout(() => { KPI_DEFS[2].fill.style.width = (100 * o.share / D.maxShare).toFixed(2) + "%"; }, 120);

    renderTable(o);
    monthChart.setOption(monthOption(o), true);
    mixChart.setOption(mixOption(o), true);
    firmChart.setOption(firmOption(o), true);
    $("sh-month-scope").textContent = "7 个月合计 " + fmtDec(o.curSum, o.dec) + " 亿元 · 累计同比收敛于 " + signed(o.yoy) + "%";
    $("sh-mix-scope").textContent = o.mixNote + " · 合计 " + fmtDec(o.mixSum, o.dec) + " 亿元";
    $("sh-firm-scope").textContent = "模拟名录 · 合计 " + fmtDec(o.firmSum, 1) + " 亿元 · 占 " + o.firmShare.toFixed(1) + "%";
    renderMarquee(o);

    history.replaceState(null, "", "#" + encodeURIComponent(o.name));
  }

  /* ===== 12. 交互：切换器 / 返回父页 / 键盘 / hash 定位 / kiosk 自动轮换 ===== */
  $("sh-sw-prev").addEventListener("click", () => { applyIndustry(idx - 1); restart(); });
  $("sh-sw-next").addEventListener("click", () => { applyIndustry(idx + 1); restart(); });
  $("sh-back").addEventListener("click", () => { location.href = PARENT; });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { applyIndustry(idx - 1); restart(); }
    else if (e.key === "ArrowRight") { applyIndustry(idx + 1); restart(); }
    else if (e.key === "Escape") { location.href = PARENT; }
  });

  /* 打开时按 hash 定位（父页下钻传参用），全名 / 中名 / 短名均可命中，未命中取第 0 个 */
  const hash = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
  const hit = IND.findIndex((o) => o.name === hash || o.mid === hash || o.short === hash);
  applyIndustry(hit >= 0 ? hit : 0);

  /* kiosk 常驻：每 12 秒切下一行业；鼠标停在切换器上时暂停 */
  let timer = null;
  function restart() { clearInterval(timer); timer = setInterval(() => applyIndustry(idx + 1), 12000); }
  restart();
  const sw = $("sh-switcher");
  sw.addEventListener("mouseenter", () => clearInterval(timer));
  sw.addEventListener("mouseleave", restart);

  /* ===== 13. 勾稽自检：任一条不过就点亮告警条 ===== */
  const CHECKS = [
    ["13 个门类之和 = 税收收入 5760", Math.round(D.total) === TAX_TOTAL, D.total],
    ["分地市矩阵列合计 = 5760", Math.round(CITY_TAX_TOTAL) === TAX_TOTAL, CITY_TAX_TOTAL],
    ["制造业 7 个细分之和 = 1560", Math.round(sum(MFG_SUB.map((s) => s.v))) === 1560, sum(MFG_SUB.map((s) => s.v))]
  ];
  IND.forEach((o) => {
    CHECKS.push([o.short + " 13 市之和 = " + o.v, o.tie, o.citySum]);
    CHECKS.push([o.short + " 月度 7 项之和 = " + o.v, o.monthTie, o.curSum]);
    CHECKS.push([o.short + " 构成之和 = " + o.v, Math.round(o.mixSum * 10) === Math.round(o.v * 10), o.mixSum]);
    CHECKS.push([o.short + " 分市上年同期之和 = 门类上年同期", Math.abs(sum(o.rows.map((r) => r.prev)) - o.prevTotal) < 1e-6, o.prevTotal]);
    CHECKS.push([o.short + " TOP8 合计 ≤ 门类值 35%", o.firmShare <= 35 + 1e-9, o.firmShare]);
  });
  const failed = CHECKS.filter((c) => !c[1]);
  if (failed.length) {
    errorNode.textContent = "勾稽自检未通过：" + failed.map((c) => c[0] + "（实得 " + c[2] + "）").join("；");
    errorNode.classList.add("is-visible");
  }
  if (window.console && console.table) {
    console.table(CHECKS.map((c) => ({ 校验项: c[0], 通过: c[1] ? "✓" : "✗", 实得: c[2] })));
  }
})();
</script>
</body>
</html>
